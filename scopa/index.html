<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scopa</title>
<meta name="description" content="La scopa con le carte italiane, uno contro uno o due contro due, anche a Scopone scientifico, ognuno dal proprio telefono anche a distanza.">
<meta name="theme-color" content="#1b4f86">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scopa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="pwa-sw" content="../sw.js" data-scope="../">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* ===== Scopa — il panno blu e le carte italiane ===== */
:root {
  --bg: #12301e; --deep: #0b2014; --panel: rgba(14, 50, 30, .86); --panel-2: rgba(30, 90, 54, .72);
  --ink: #f4f8ff; --muted: #c5d4ef; --dim: #8ea6cf; --gold: #ffd75e; --gold-2: #f0a91c; --coral: #ff7a59; --good: #8ff0a4; --bad: #ff8f80;
  --line: rgba(255, 215, 94, .38); --line-2: rgba(255, 255, 255, .16);
  --f-disp: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); overflow-x: clip; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: linear-gradient(180deg, #0b2014 0%, #16502e 55%, #2f8a52 100%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 25px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 19px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 12px 30px rgba(6, 18, 48, .35); min-width: 0; }
.panel h2 { font-size: 24px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(255, 215, 94, .14); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(200, 50, 40, .3); border-color: rgba(255, 143, 128, .55); }
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 44px; padding: 10px 18px; font: 800 15.5px/1.15 var(--f-body); color: #3b2500; cursor: pointer;
  background: linear-gradient(180deg, #fff1a0, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #a86a00, 0 8px 18px rgba(8, 24, 64, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 0 #a86a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #ff8a70, #d8402c); color: #fff; box-shadow: 0 3px 0 #7c1e12; }
.btn.small { min-height: 36px; padding: 7px 13px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opp:focus-visible, .slot:focus-visible, .pile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 5px 10px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--coral); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #13284f; background: #f4f8ff; border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #13284f; }
.back-link { color: #eaf3ff; text-decoration: none; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 56px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 3px 0 rgba(8, 24, 64, .45); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(13, 36, 84, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; flex-wrap: wrap; row-gap: 6px; justify-content: flex-end; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 24px; color: var(--gold); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
@media (max-width: 640px) {
  .topbar .wrap { row-gap: 0; padding-block: 6px 8px; }
  .topbar .wrap > * { order: 2; }
  .topbar .wrap > .brand, .topbar .wrap > .info { order: 0; }
  .topbar .wrap::after { content: ""; order: 1; flex-basis: 100%; height: 6px; }
  .topbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 21px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 0 0 2px rgba(255, 255, 255, .5); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(8, 34, 20, .96); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 14px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }

/* ---------- carte (3D) ---------- */
.skc { display: block; position: relative; width: var(--cw, 60px); aspect-ratio: 100 / 140; perspective: 700px; flex: none; }
.skc-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s var(--ease); }
.skc-f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9%/6.5%; filter: drop-shadow(0 2px 2.5px rgba(6, 18, 48, .45)); }
.skc-back { transform: rotateY(180deg); }
.skc:not(.up) .skc-in, .predown .skc-in { transform: rotateY(180deg); }
.predown .skc-in { transition: none; }
.skc-svg { display: block; width: 100%; height: 100%; }
.skc.flipin .skc-in { animation: flipin .6s var(--ease); }
@keyframes flipin { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.12); } 100% { transform: rotateY(0) scale(1); } }
.skc.flat { --cw: 40px; }
.flyhide { visibility: hidden !important; }
.rrow { display: inline-flex; gap: 3px; vertical-align: middle; margin: 4px 0; }
.rrow .skc { --cw: 34px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, .35); overflow: hidden; position: relative;
  background: radial-gradient(60% 70% at 85% 15%, rgba(255, 207, 63, .35), transparent 60%), linear-gradient(180deg, #d6a800 0%, #1b5e36 55%, #0e3520 100%); box-shadow: 0 16px 40px rgba(8, 24, 64, .35); }
.hero::before { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30px; height: 90px; background: radial-gradient(closest-side, rgba(255, 255, 255, .85), transparent) 0 0 / 120px 90px repeat-x; opacity: .7; pointer-events: none; animation: drift 40s linear infinite; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero .kicker { color: #7a2c10; }
.hero h1 { font-size: clamp(56px, 15vw, 104px); line-height: .9; color: #fff; text-shadow: 0 4px 0 #1b5e36, 0 10px 26px rgba(8, 34, 20, .45); margin-top: 6px; letter-spacing: .01em; }
.hero .tag { color: #12305f; margin-top: 12px; max-width: 54ch; font-weight: 700; }
.hero-art { position: relative; height: 200px; max-width: 380px; width: 100%; justify-self: center; }
.hero-balloon { position: absolute; width: 120px; left: 50%; top: -14px; margin-left: -60px; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(8, 34, 20, .35)); }
@keyframes bob { 50% { transform: translateY(-10px) rotate(3deg); } }
.hero-art .hc { position: absolute; bottom: 0; filter: drop-shadow(0 8px 12px rgba(8, 34, 20, .4)); }
.hero-art .skc { --cw: 70px; }
.hc1 { left: 2%; transform: rotate(-18deg) translateY(-6px); } .hc2 { left: 17%; transform: rotate(-9deg) translateY(-18px); } .hc3 { left: 33%; transform: rotate(-1deg) translateY(-24px); }
.hc4 { left: 49%; transform: rotate(7deg) translateY(-18px); } .hc5 { left: 64%; transform: rotate(15deg) translateY(-6px); } .hc6 { left: 79%; transform: rotate(23deg) translateY(8px); }
@keyframes drift { to { background-position: 1200px 0; } }


/* ---------- schermata di gioco: barra in alto, cartellini, istruzioni ---------- */
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); background: rgba(8, 34, 20, .72); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 19px; font-weight: 800; color: var(--gold); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.pv { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--f-disp); color: #fff; background: var(--pc); flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
.pv.big { width: 54px; height: 54px; font-size: 30px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font: 800 10px var(--f-body); text-transform: uppercase; letter-spacing: .04em; border-radius: 6px; padding: 1px 5px; background: rgba(255, 255, 255, .14); }
.tag.end { background: var(--gold); color: #4a2a00; } .tag.away { background: #c8402c; } .tag.bot { background: #3a5a8a; } .tag.wait { background: rgba(255, 255, 255, .18); animation: pulse 1.4s ease-in-out infinite; } .tag.ok { background: #2f9a58; }
@keyframes pulse { 50% { opacity: .5; } }
/* barra delle istruzioni */
.gv-prompt { display: flex; align-items: center; gap: 8px; margin: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); padding: 7px 8px 7px 12px; border-radius: 14px; background: rgba(8, 34, 20, .78); backdrop-filter: blur(8px); border: 1px solid var(--line); flex-wrap: wrap; box-shadow: 0 6px 18px rgba(6, 18, 48, .3); }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 160px; }
.pr-txt b { color: #ffe7a0; }
.pr-b { display: flex; gap: 6px; align-items: center; margin-left: auto; flex: none; }
.gv-prompt .help { color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }

/* animazioni: carte in volo, scintille, testi */
.flyer { position: fixed; z-index: 70; pointer-events: none; transform-origin: 0 0; will-change: transform; }
.flyer .skc { --cw: 100% !important; width: 100%; }
.flyer.still.glow .skc { animation: colglow .65s ease-in-out; }
@keyframes colglow { 0%, 100% { transform: none; } 20% { transform: translateY(-4px) rotate(-3deg); filter: drop-shadow(0 0 10px #fff6c8); } 50% { transform: translateY(-6px) rotate(3deg) scale(1.08); filter: drop-shadow(0 0 16px #ffd75e); } 80% { transform: translateY(-3px) rotate(-2deg); } }
.burst { position: fixed; z-index: 72; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; animation: burst .8s var(--ease) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
.floatxt { position: fixed; z-index: 73; pointer-events: none; transform: translate(-50%, -50%); font: 800 20px var(--f-disp); color: #fff; text-shadow: 0 2px 0 #0e3520, 0 0 14px rgba(143, 227, 255, .9); animation: floatup 1.5s var(--ease) forwards; white-space: nowrap; }
.floatxt.col { font-size: 24px; color: var(--gold); text-shadow: 0 2px 0 #6b3a00, 0 0 20px rgba(255, 215, 94, .9); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
.banner { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; }
.banner span { display: grid; justify-items: center; font: 800 clamp(36px, 10vw, 74px)/1 var(--f-disp); color: #fff; text-shadow: 0 4px 0 #1b5e36, 0 0 40px rgba(255, 215, 94, .8); animation: ban 2.2s var(--ease) forwards; text-align: center; padding: 0 12px; }
.banner small { font: 800 16px var(--f-body); color: var(--gold); text-shadow: 0 2px 4px rgba(0, 0, 0, .6); margin-top: 8px; letter-spacing: .04em; }
@keyframes ban { 0% { transform: scale(.6); opacity: 0; } 18% { transform: scale(1.05); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 95; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: conf linear forwards; }
@keyframes conf { to { transform: translateY(110vh) rotate(var(--r)); } }

/* ---------- finestre ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(6, 18, 48, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet-back.still, .sheet-back.still .sheet, .sheet-back.still .rr-row, .sheet-back.still .stamp, .sheet-back.still .tbar i { animation: none; }
.sheet { width: 100%; max-width: 640px; max-height: calc(90vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: linear-gradient(180deg, #1b5e36, #0e3520); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; box-shadow: 0 -12px 40px rgba(0, 0, 0, .5); animation: up .28s var(--ease); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line-2); } }
.sheet .lead { font-size: 15.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.gc { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 3px 8px; font-size: 13.5px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); }
.phead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.pboard { display: grid; justify-items: center; padding: 10px; border-radius: 14px; background: rgba(0, 0, 0, .15); }
.pboard .board { gap: 6px; } .pboard .board .skc { --cw: min(60px, 18vw); } .pboard .board .slot.gone { --cw: min(60px, 18vw); }
.loglist { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.loglist .fl { font-size: 14px; border-left: 3px solid var(--line-2); padding: 3px 8px; }
.loglist .fl.k-col, .loglist .fl.k-end { color: var(--gold); } .loglist .fl.k-double { color: var(--bad); }
.intro-art { display: grid; justify-items: center; gap: 4px; }
.intro-nav { justify-content: flex-end; margin-top: 6px; }
.rules { display: grid; gap: 14px; }
.rsec { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 7px; scroll-margin-top: 10px; }
.rsec ul, .rsec ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.rbox { background: rgba(255, 215, 94, .12); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.rtoc { display: flex; flex-wrap: wrap; gap: 6px; }
.rgrid { display: inline-grid; grid-template-columns: repeat(4, auto); gap: 3px; padding: 6px; border-radius: 10px; background: rgba(0, 0, 0, .18); vertical-align: middle; justify-self: start; }
.rgrid .skc { --cw: 30px; }
.rgrid .rg.hi .skc { box-shadow: 0 0 0 2px var(--gold), 0 0 10px var(--gold); border-radius: 4px; }
.rgap { display: block; width: 30px; aspect-ratio: 100 / 140; border: 1px dashed rgba(255, 255, 255, .3); border-radius: 4px; }
.rarrow { display: inline-block; margin: 0 8px; font: 800 26px var(--f-disp); color: var(--gold); vertical-align: middle; }
.rbands { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.rband { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.rband .skc { --cw: 34px; }
.rband small b { display: block; color: var(--ink); text-transform: capitalize; font-size: 14px; }
/* punti della manche */
.rr { display: grid; gap: 6px; }
.rr-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 14px; background: rgba(255, 255, 255, .07); border-left: 5px solid var(--pc); animation: up .45s var(--ease) both; }
.rr-row.me { background: rgba(255, 215, 94, .14); }
.rr-n { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.rr-n b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.rr-p { display: grid; justify-items: end; position: relative; min-width: 56px; }
.rr-p b { font: 800 28px/1 var(--f-disp); color: #fff; }
.rr-p b.neg { color: var(--good); }
.rr-p small { color: var(--gold); font-weight: 800; font-size: 12px; }
.rr-p s { color: var(--dim); font-size: 13px; }
.stamp { position: absolute; right: -6px; top: -12px; font: 800 18px var(--f-disp); color: #fff; background: #d8402c; border-radius: 8px; padding: 0 6px; transform: rotate(12deg); box-shadow: 0 2px 8px rgba(0, 0, 0, .4); animation: stamp .5s var(--ease) both; }
@keyframes stamp { from { transform: scale(3) rotate(-20deg); opacity: 0; } }
.target { display: grid; gap: 4px; margin-top: 4px; }
.target small { color: var(--dim); font-size: 12px; }
.tbar { position: relative; display: block; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }

.pod.p2 { order: 1; } .pod.p2 .pod-b { height: 62px; }

.gv > *:not(.felt) { position: relative; z-index: 1; }
.felt { position: absolute; inset: 0; z-index: 0; background: radial-gradient(70% 55% at 50% 45%, #2f6fb0, #184a80 70%, #0b2546); }
.felt::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 6px); }
.table { min-height: 0; display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: '. n .' 'w c e' 'sc sc sc'; gap: 6px; padding: 8px max(8px, env(safe-area-inset-right, 0px)) 4px max(8px, env(safe-area-inset-left, 0px)); container-type: size; }

.seat-t.on .who { box-shadow: 0 0 0 3px var(--gold), 0 0 16px var(--gold); }
.oh { display: flex; justify-content: center; } .oh .skc { --cw: 30px; margin-left: -12px; } .oh .skc:first-child { margin-left: 0; }
.oh.open .skc { --cw: 40px; margin-left: -6px; }

/* ---------- Scopa: la tavola ---------- */
.center { flex-direction: column; gap: 8px; }

<script>
window.GAME_PREFIX = 'scopa/v1/';
/* ===== Carte italiane da 40 (condivise da Briscola e Scopa): disegnate da zero =====
   Una carta è un numero da 0 a 39: seme = Math.floor(c / 10) (0 coppe, 1 denari, 2 spade, 3 bastoni),
   valore = c % 10 + 1 (1 asso … 7, poi 8 fante, 9 cavallo, 10 re). */
var ITArt = (function () {
  var SUITS = ['coppe', 'denari', 'spade', 'bastoni'], SUIT1 = ['Coppe', 'Denari', 'Spade', 'Bastoni'];
  var NAMES = { 1: 'Asso', 8: 'Fante', 9: 'Cavallo', 10: 'Re' };
  var FONT = "font-family=\"'Baloo 2',Nunito,system-ui,sans-serif\" font-weight=\"800\"";
  var INK = ['#b5232e', '#b8860b', '#2a5ca8', '#2f7a3a'];
  function suit(c) { return Math.floor(c / 10); }
  function rank(c) { return c % 10 + 1; }
  function name(c) { var r = rank(c); return (NAMES[r] || String(r)) + ' di ' + SUITS[suit(c)]; }

  // i quattro semi, centrati in 0,0 e alti circa 24
  function pip(s, x, y, k) {
    var g = '<g transform="translate(' + x + ' ' + y + ') scale(' + (k || 1) + ')">';
    if (s === 0) g += '<path d="M-9 -10 H9 Q9 2 2 4 V8 Q6 9 7 12 H-7 Q-6 9 -2 8 V4 Q-9 2 -9 -10Z" fill="#d6393f" stroke="#7a1418" stroke-width="1.2"/><path d="M-7 -8 H7" stroke="#ffd75e" stroke-width="2"/><ellipse cx="0" cy="-10" rx="9" ry="2.2" fill="#f2b705" stroke="#7a1418" stroke-width="1"/>';
    else if (s === 1) g += '<circle r="11" fill="#f2b705" stroke="#8a5a00" stroke-width="1.4"/><circle r="7" fill="none" stroke="#8a5a00" stroke-width="1.2"/><path d="M0 -4 L3.5 0 L0 4 L-3.5 0Z" fill="#c2364a"/>';
    else if (s === 2) g += '<path d="M-1.6 -12 L1.6 -12 L1.6 5 L-1.6 5Z" fill="#cfe0f2" stroke="#2a4a7a" stroke-width="1"/><path d="M0 -15 L1.6 -12 H-1.6Z" fill="#cfe0f2" stroke="#2a4a7a" stroke-width="1"/><path d="M-7 5 H7 V7.5 H-7Z" fill="#f2b705" stroke="#6a4400" stroke-width="1"/><path d="M-1.4 7.5 H1.4 V12 H-1.4Z" fill="#7a3a1a"/><circle cy="13" r="2" fill="#f2b705" stroke="#6a4400" stroke-width=".8"/>';
    else g += '<path d="M-2.5 12 L-3.5 -8 Q0 -14 3.5 -8 L2.5 12Z" fill="#7a4a1a" stroke="#3a2008" stroke-width="1.2"/><circle cx="-3" cy="-2" r="1.6" fill="#2f7a3a"/><circle cx="3" cy="4" r="1.6" fill="#2f7a3a"/><path d="M-3.5 -8 Q0 -14 3.5 -8" stroke="#2f7a3a" stroke-width="2" fill="none"/>';
    return g + '</g>';
  }
  // posizione dei semi per i valori da 1 a 7 (carta 100×150)
  var LAY = { 1: [[50, 75]], 2: [[50, 45], [50, 105]], 3: [[50, 38], [50, 75], [50, 112]], 4: [[33, 45], [67, 45], [33, 105], [67, 105]], 5: [[33, 42], [67, 42], [50, 75], [33, 108], [67, 108]], 6: [[33, 40], [67, 40], [33, 75], [67, 75], [33, 110], [67, 110]], 7: [[33, 38], [67, 38], [50, 57], [33, 80], [67, 80], [33, 112], [67, 112]] };
  // le figure: una sagoma semplice (berretto del fante, testa del cavallo, corona del re)
  function figure(r, s) {
    var col = INK[s], o = '<g transform="translate(50 70)">';
    o += '<circle cy="-8" r="13" fill="#f4d9b8" stroke="#6a4a2a" stroke-width="1.4"/><path d="M-20 34 Q-20 10 0 8 Q20 10 20 34Z" fill="' + col + '" stroke="#3a2a1a" stroke-width="1.4"/>';
    if (r === 8) o += '<path d="M-14 -16 Q0 -30 14 -16 Q6 -20 -14 -16Z" fill="' + col + '" stroke="#3a2a1a" stroke-width="1.2"/><path d="M10 -22 Q22 -34 26 -22" stroke="#f2b705" stroke-width="3" fill="none" stroke-linecap="round"/>';
    else if (r === 9) o += '<path d="M-26 -2 Q-34 -24 -18 -30 L-12 -24 Q-8 -14 -14 -4Z" fill="#a0703a" stroke="#3a2008" stroke-width="1.2"/><circle cx="-24" cy="-22" r="1.6" fill="#1a0e08"/><path d="M-12 -18 Q0 -26 12 -18" stroke="' + col + '" stroke-width="5" fill="none"/>';
    else o += '<path d="M-13 -18 L-13 -30 L-7 -23 L0 -32 L7 -23 L13 -30 L13 -18Z" fill="#f2b705" stroke="#8a5a00" stroke-width="1.2"/><path d="M-10 4 Q0 14 10 4" stroke="#8a6a4a" stroke-width="2" fill="none"/>';
    o += '<path d="M-5 -10 h2 M3 -10 h2 M-2 -3 Q0 -1 2 -3" stroke="#3a2a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>';
    return o + pip(s, 22, 122, .75) + pip(s, 78, 122, .75);
  }
  var cache = {};
  function face(c) {
    if (cache[c] != null) return cache[c];
    var s = suit(c), r = rank(c), col = INK[s];
    var o = '<svg class="skc-svg" viewBox="0 0 100 150" aria-hidden="true"><rect x="1" y="1" width="98" height="148" rx="9" fill="#fffaf0" stroke="#cdbb98" stroke-width="1.5"/>' +
      '<rect x="6" y="6" width="88" height="138" rx="6" fill="none" stroke="' + col + '" stroke-opacity=".35" stroke-width="1.2"/>';
    if (r <= 7) o += LAY[r].map(function (p) { return pip(s, p[0], p[1], r === 1 ? 2 : r <= 3 ? 1.15 : 1); }).join('');
    else o += figure(r, s);
    o += '<text x="11" y="22" ' + FONT + ' font-size="17" fill="' + col + '">' + short(c) + '</text><text x="89" y="140" text-anchor="end" ' + FONT + ' font-size="17" fill="' + col + '">' + short(c) + '</text></svg>';
    return (cache[c] = o);
  }
  var backC = null;
  function back() {
    return backC || (backC = '<svg class="skc-svg" viewBox="0 0 100 150" aria-hidden="true"><rect x="1" y="1" width="98" height="148" rx="9" fill="#7a2a3a" stroke="#3a1420" stroke-width="2"/>' +
      '<rect x="7" y="7" width="86" height="136" rx="6" fill="none" stroke="#f2c96a" stroke-width="1.6"/>' +
      '<g fill="none" stroke="#f2c96a" stroke-opacity=".45" stroke-width="1">' + [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (i) { return '<path d="M12 ' + (16 + i * 15) + ' l38 -10 38 10"/>'; }).join('') + '</g>' +
      '<circle cx="50" cy="75" r="17" fill="#7a2a3a" stroke="#f2c96a" stroke-width="2"/>' + pip(1, 50, 75, 1) + '</svg>');
  }
  function card(c, up, o) {
    o = o || {};
    return '<span class="skc it' + (up ? ' up' : '') + (o.cls ? ' ' + o.cls : '') + '"' + (o.attrs || '') + '><span class="skc-in"><span class="skc-f skc-back">' + back() + '</span><span class="skc-f skc-front">' + (c != null ? face(c) : '') + '</span></span></span>';
  }
  function flat(c) { return '<span class="skc it up flat"><span class="skc-in"><span class="skc-f skc-front">' + face(c) + '</span></span></span>'; }
  function suitIcon(s) { return '<svg class="sic" viewBox="-14 -16 28 32" aria-hidden="true">' + pip(s, 0, 0, 1) + '</svg>'; }
  function defs() { return ''; }
  return { defs: defs, card: card, flat: flat, face: face, back: back, suitIcon: suitIcon, pip: pip, suit: suit, rank: rank, name: name, short: short, SUITS: SUITS, SUIT1: SUIT1 };
})();

/* ===== Scopa: motore delle regole (gira sull'host; lo stato è JSON) =====
   40 carte italiane, in 2 o in 4 (due coppie, i compagni di fronte).
   Scopa classica: 3 carte a testa e 4 scoperte in tavola (se in tavola escono 3 o 4 re si rimescola); finite
   le carte se ne danno altre 3 a testa. Scopone scientifico (solo in 4): 10 carte a testa, tavola vuota.
   Si gioca una carta: se in tavola c'è una carta dello stesso valore la si deve prendere (una sola); altrimenti
   si possono prendere più carte che sommate fanno il suo valore (fante 8, cavallo 9, re 10). Se non prende,
   la carta resta in tavola. Chi porta via tutte le carte dalla tavola fa «scopa» (non all'ultima giocata).
   A fine mano le carte rimaste in tavola vanno a chi ha preso per ultimo. Punti: carte (più di 20),
   denari (più di 5), settebello, primiera, e un punto per ogni scopa. Vince chi arriva prima a 11 (o 21).
   Una carta è un numero da 0 a 39 (vedi src/carte/art.js): seme = c / 10, valore = c % 10 + 1. */
var SCEngine = (function () {
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var PRIME = [0, 16, 12, 13, 14, 15, 18, 21, 10, 10, 10];   // valori di primiera (indice = valore della carta)
  var SN = ['coppe', 'denari', 'spade', 'bastoni'], RN = { 1: 'l’asso', 8: 'il fante', 9: 'il cavallo', 10: 'il re' };
  function suit(c) { return Math.floor(c / 10); }
  function val(c) { return c % 10 + 1; }
  function cname(c) { var r = val(c); return (RN[r] || 'il ' + r) + ' di ' + SN[suit(c)]; }
  function nick(g, p) { return g.players[p].nick; }
  function log(g, t, k, p) { g.log.push({ n: ++g.logN, t: t, k: k || '', p: p == null ? null : p }); if (g.log.length > 140) g.log.splice(0, g.log.length - 140); }
  function fx(g, e) { e.n = ++g.fxN; g.fx.push(e); if (g.fx.length > 30) g.fx.splice(0, g.fx.length - 30); }

    '.px-opt b{font-size:16px}.px-opt span{font-size:13.5px;color:#b9b3a6}.px-opt.main{background:linear-gradient(180deg,#f0d58f,#d9b45a);color:#231a06;border-color:transparent}.px-opt.main span{color:#4a3a14}' +
    '.px-opt.red{background:#7a2a1f;border-color:#b6402e}.px-opt.red span{color:#f2c5bb}.px-opt:disabled{opacity:.55}' +
    '.px-cancel{appearance:none;border:0;background:none;color:inherit;font:600 15px system-ui,sans-serif;padding:10px;cursor:pointer;opacity:.85}' +
    '.px-toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;background:#2a2118;color:#f6ead2;border:1px solid rgba(242,193,78,.5);border-radius:12px;padding:10px 14px;font:15px system-ui,sans-serif;max-width:calc(100vw - 24px);box-shadow:0 10px 26px rgba(0,0,0,.45)}';
  var busy = false;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function css() { if (!document.getElementById('px-css')) { var s = document.createElement('style'); s.id = 'px-css'; s.textContent = CSS; document.head.appendChild(s); } }
  function toast(t) { css(); var d = document.createElement('div'); d.className = 'px-toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3600); }
  function close() { var b = document.querySelector('.px-back'); if (b) b.remove(); busy = false; }
  function open(html) {

    var b = document.createElement('div'); b.className = 'px-back';
    b.innerHTML = '<div class="px-sheet" role="dialog" aria-modal="true">' + html + '<button type="button" class="px-cancel" data-px="cancel">Resta al tavolo</button></div>';
    b.addEventListener('click', function (e) { if (e.target === b) close(); });
    document.body.appendChild(b);
  }

  // Chi prende il comando se esco: un giocatore umano seduto, collegato se possibile.
  function humans(d) { return d.seats.filter(function (s) { return !s.bot && s.uid !== Net.uid; }); }
  function nextHost(d) {
    var h = humans(d), on = h.filter(function (s) { return Net.presence(s.uid) === 'on'; });
    return on[0] || h[0] || null;
  }
  function inGame(d) { return d.phase !== 'lobby'; }

  // Risponde true se ha aperto la scelta (il gioco non deve fare altro), false se basta l'uscita normale.
  function ask() {
    var d = typeof App !== 'undefined' && App.doc;
    if (!d || !d.seats) return false;
    var seated = d.seats.some(function (s) { return s.uid === Net.uid; }), host = d.host === Net.uid;
    if (!seated && !host) return false;
    var game = inGame(d), over = d.phase === 'over';
    if (host) {

      if (!nx) {
        open('<h2>Uscire dal tavolo ' + esc(d.code) + '?</h2>' +
          '<p>' + (d.seats.length > 1 ? 'Al tavolo ci sono solo giocatori automatici' : 'Sei l’unico al tavolo') + ': uscendo il tavolo si chiude' + (game && !over ? ' e la partita finisce' : '') + '.</p>' +
          '<button type="button" class="px-opt red" data-px="close"><b>Chiudi il tavolo ed esci</b><span>Sparisce dalla lista dei tavoli.</span></button>');
        return true;
      }
      open('<h2>Uscire dal tavolo ' + esc(d.code) + '?</h2>' +
        '<p>Sei l’host: scegli cosa succede quando esci.</p>' +
        '<button type="button" class="px-opt main" data-px="pass" data-u="' + esc(nx.uid) + '"><b>Esci e lascia il comando a ' + esc(nx.nick) + '</b><span>' +
          (over ? 'Il tavolo resta aperto: gli altri possono giocarne un’altra.' : game ? 'La partita continua: al tuo posto gioca l’automatico.' : 'Il tavolo resta aperto; il tuo posto si libera.') + '</span></button>' +
        '<button type="button" class="px-opt red" data-px="close"><b>Chiudi il tavolo per tutti</b><span>' + (game && !over ? 'La partita finisce e tutti' : 'Tutti') + ' tornano alla schermata iniziale.</span></button>');
      return true;

    open('<h2>Uscire dalla partita?</h2>' +
      '<button type="button" class="px-opt main" data-px="quit"><b>Lascia la partita</b><span>Al tuo posto gioca l’automatico fino alla fine; il tuo posto non è più tuo.</span></button>' +
      '<button type="button" class="px-opt" data-px="later"><b>Esci per ora</b><span>Puoi rientrare quando vuoi; mentre sei via, al tuo turno gioca l’automatico.</span></button>');
    return true;

  function done() { close(); if (typeof leaveTable === 'function') leaveTable(true); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-px]'); if (!b) return;
    var k = b.getAttribute('data-px');

      busy = true; Array.prototype.forEach.call(document.querySelectorAll('.px-opt'), function (x) { x.disabled = true; });
      var who = k === 'pass' ? (App.doc.seats.filter(function (s) { return s.uid === b.getAttribute('data-u'); })[0] || {}).nick : null;
      Net.send({ t: 'quit', next: k === 'pass' ? b.getAttribute('data-u') : null }).then(function () {
        done(); toast(who ? 'Sei uscito: ora il tavolo lo guida ' + who + '.' : 'Hai lasciato la partita: al tuo posto gioca l’automatico.');
      }, function (err) {
        busy = false; Array.prototype.forEach.call(document.querySelectorAll('.px-opt'), function (x) { x.disabled = false; });
        toast(String(err || 'Non sono riuscito a uscire: riprova.'));
      });
    }
  });
  return { ask: ask, close: close };
})();

/* ===== Serie di partite e risultati (condivisi da tutti i giochi) =====
   Serie: con «Nuova partita con lo stesso tavolo» le vittorie si sommano; l'host può scegliere «al meglio di 3 / di 5».
   La tiene l'host nello stato del tavolo (doc.series), aggiornata quando una partita finisce.
   Risultati: a fine partita chi ha l'account registra il proprio sul server (statistiche e classifica tra amici).
   Ogni gioco dice chi ha vinto con Score.setup({ game, result(g) -> [{ won, place, score }] per giocatore }). */
var Score = (function () {
  var cfg = null;
  function setup(c) { cfg = c; }
  function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function result(g) { if (!cfg || !g) return null; try { var r = cfg.result(g); return Array.isArray(r) && r.length === g.players.length ? r : null; } catch (e) { return null; } }
  function need(s) { return s && s.target ? Math.floor(s.target / 2) + 1 : 0; }

  // Solo sull'host, prima di ogni pubblicazione: ogni partita ha un numero (gid); a fine partita la serie si aggiorna una volta sola.
  function beforePublish(doc) {
    if (!doc) return;
    if (doc.phase === 'lobby' || !doc.game) { doc.gid = null; return; }
    if (!doc.gid) doc.gid = rid();
    if (doc.phase !== 'over') return;
    var s = doc.series || (doc.series = { target: 0, n: 0, wins: {}, names: {}, champ: null, last: null });
    if (s.last === doc.gid) return;
    var res = result(doc.game); if (!res) return;
    if (s.champ) { s.n = 0; s.wins = {}; s.champ = null; }   // la serie di prima era già vinta: ne comincia una nuova
    s.last = doc.gid; s.n++;
    doc.game.players.forEach(function (P, i) {
      s.names[P.uid] = P.nick;
      if (!(P.uid in s.wins)) s.wins[P.uid] = 0;
      if (res[i] && res[i].won) s.wins[P.uid]++;
    });
    var k = need(s);
    if (k) s.champ = Object.keys(s.wins).filter(function (u) { return s.wins[u] >= k; }).sort(function (a, b) { return s.wins[b] - s.wins[a]; })[0] || null;
  }
  // Operazione dell'host: tipo di serie (0 = partite singole, 3 o 5 = al meglio di). Ricomincia da zero.
  function op(work, from, o) {
    if (work.host !== from) return { err: 'Solo l’host può farlo.' };
    if (work.phase === 'play') return { err: 'Si cambia tra una partita e l’altra.' };
    var t = o.target === 3 || o.target === 5 ? o.target : 0, last = work.series && work.series.last;
    work.series = { target: t, n: 0, wins: {}, names: {}, champ: null, last: last || null };
    return {};
  }

  function standings(doc) {
    var s = doc && doc.series; if (!s || !s.n) return '';
    var rows = Object.keys(s.wins).sort(function (a, b) { return s.wins[b] - s.wins[a]; });
    var k = need(s), champ = s.champ && s.names[s.champ];
    return '<div class="sc-box" role="status">' +
      (champ ? '<div class="sc-champ">🏆 ' + esc(champ) + ' vince la serie!</div>' : '') +
      '<div class="sc-head"><b>Serie</b> · ' + s.n + (s.n === 1 ? ' partita' : ' partite') + (k ? ' · al meglio di ' + s.target + (champ ? '' : ' (vince chi arriva a ' + k + ')') : '') + '</div>' +
      '<div class="sc-rows">' + rows.map(function (u) { return '<span class="sc-p' + (u === s.champ ? ' on' : '') + (window.Net && u === Net.uid ? ' me' : '') + '">' + esc(s.names[u] || '…') + ' <b>' + s.wins[u] + '</b></span>'; }).join('') + '</div>' +
      (champ ? '<div class="sc-note">Con una nuova partita comincia un’altra serie.</div>' : '') + '</div>';
  }
  var CSS = '.sc-box{display:grid;gap:6px;padding:10px 12px;border-radius:12px;border:1px solid rgba(230,197,111,.45);background:rgba(230,197,111,.08);font-size:15px;line-height:1.35;text-align:left}' +
    '.sc-champ{font-weight:800;font-size:17px}.sc-rows{display:flex;flex-wrap:wrap;gap:6px}.sc-p{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap}.sc-p.on{background:rgba(230,197,111,.35)}.sc-p.me{box-shadow:inset 0 0 0 1px currentColor}' +
    '.sc-note,.sc-head{font-size:13.5px;opacity:.85}';
  function css() { if (!document.getElementById('sc-css')) { var st = document.createElement('style'); st.id = 'sc-css'; st.textContent = CSS; document.head.appendChild(st); } }
  // Sala d'attesa: scelta della serie (host) e classifica della serie in corso.
  function roomHTML(doc, isHost) {
    css();
    var t = doc.series ? doc.series.target || 0 : 0;
    return '<label style="display:grid;gap:6px"><span><b>Serie di partite</b><br><span class="muted" style="font-size:15px">Con «Nuova partita con lo stesso tavolo» le vittorie si sommano.</span></span>' +
      '<select id="opt-series" class="field"' + (isHost ? '' : ' disabled') + ' style="font-size:16px;min-height:44px">' +
      [[0, 'Partite singole (conto le vittorie)'], [3, 'Al meglio di 3'], [5, 'Al meglio di 5']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' + standings(doc);
  }
  function endHTML(doc) { css(); return standings(doc); }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'opt-series' && window.Net) Net.send({ t: 'series', target: +e.target.value }).catch(function (er) { console.warn(er); });
  });

  // Risultato personale sul server (una volta per partita, solo con l'account; le partite di prova non contano).
  var RKEY = 'pp-reported', trying = {};
  function reported() { try { return JSON.parse(localStorage.getItem(RKEY) || '[]'); } catch (e) { return []; } }
  function report() {
    var d = window.App && App.doc;
    if (!cfg || !d || d.phase !== 'over' || !d.game || !d.gid || d.practice || !window.Account || !Account.user() || !window.Net) return;
    var g = d.game, me = -1; g.players.forEach(function (P, i) { if (P.uid === Net.uid) me = i; });
    if (me < 0) return;
    var key = cfg.game + ':' + d.code + ':' + d.gid, done = reported();
    if (done.indexOf(key) >= 0 || (trying[key] && Date.now() - trying[key] < 30000)) return;
    var r = result(g); if (!r || !r[me]) return;
    trying[key] = Date.now();
    Account.rpc('report_result', { p_token: Account.token, p_game: cfg.game, p_match: key, p_won: !!r[me].won, p_place: r[me].place || null, p_players: g.players.length,
      p_score: r[me].score == null ? null : Math.round(r[me].score), p_rivals: g.players.filter(function (P, i) { return i !== me; }).map(function (P) { return String(P.nick || '').slice(0, 18); }) })
      .then(function () { var l = reported(); l.push(key); try { localStorage.setItem(RKEY, JSON.stringify(l.slice(-60))); } catch (e) {} }, function () {});
  }
  setInterval(report, 2500);
  return { setup: setup, beforePublish: beforePublish, op: op, roomHTML: roomHTML, endHTML: endHTML, standings: standings, result: result };
})();

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,
   senza limite di tempo. Durante la partita una barra in alto spiega cosa fare adesso e propone la mossa consigliata
   (quella che sceglierebbe il giocatore automatico). Ogni gioco dà i suoi consigli con Coach.setup({ bots, tip(g, me) }).
   Usa le funzioni globali dei giochi: App, E, BOT, act, myIdx, requireNick, run, enterTable. */
var Coach = (function () {
  var cfg = null, hidden = false, lastHTML = '';
  function setup(c) { cfg = c; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var CSS = '.cx-start{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px dashed rgba(255,255,255,.22);border-radius:12px;font-size:14.5px;line-height:1.35}.cx-start span{flex:1;min-width:180px;opacity:.9}' +
    '.cx-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));z-index:9980;width:min(540px,calc(100vw - 16px));display:flex;gap:10px;align-items:flex-start;padding:10px 10px 10px 12px;border-radius:14px;background:rgba(18,30,44,.94);color:#eef4fb;border:1px solid rgba(140,200,255,.45);box-shadow:0 10px 26px rgba(0,0,0,.45);font:14.5px/1.4 system-ui,-apple-system,sans-serif}' +
    '.cx-bar .cx-t{flex:1;min-width:0}.cx-bar b{color:#9fd3ff}.cx-bar .cx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +
    '.cx-bar button{appearance:none;font:600 13.5px system-ui,sans-serif;border-radius:999px;padding:7px 12px;border:1px solid #9fd3ff;background:transparent;color:inherit;cursor:pointer}.cx-bar button.main{background:#9fd3ff;color:#0e1a26;border-color:#9fd3ff}' +
    '.cx-bar .cx-x{border:0;padding:2px 6px;font-size:20px;line-height:1;opacity:.7}.cx-pill{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:9980;appearance:none;border:1px solid rgba(140,200,255,.6);background:rgba(18,30,44,.94);color:#eef4fb;border-radius:999px;padding:7px 12px;font:600 13.5px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}';
  function css() { if (!document.getElementById('cx-css')) { var s = document.createElement('style'); s.id = 'cx-css'; s.textContent = CSS; document.head.appendChild(s); } }
  function buttonHTML() {
    if (!cfg || (window.App && App.code)) return '';
    css();
    return '<div class="cx-start"><span>' + (cfg.startText || 'Non conosci ancora il gioco? Prova una partita contro i bot: ti spiego ogni mossa.') + '</span><button type="button" class="btn small" data-coach="start">🎓 Partita guidata</button></div>';
  }
  function wait(fn, ms) { return new Promise(function (res, rej) { var t0 = Date.now(), iv = setInterval(function () { if (fn()) { clearInterval(iv); res(); } else if (Date.now() - t0 > ms) { clearInterval(iv); rej('Il tavolo di prova non risponde: riprova.'); } }, 150); }); }
  function start() {
    var nick = requireNick(); if (!nick) return;
    hidden = false;
    run(async function () {
      var code = await Net.create(nick, { practice: true });
      await enterTable(code, nick);
      await wait(function () { return App.doc && App.doc.code === code && Net.isHost; }, 15000);
      for (var i = 0; i < (cfg.bots || 2); i++) await Net.send({ t: 'addbot' });
      await Net.send({ t: 'opt', timer: 0 });
      await Net.send({ t: 'start' });
    });
  }

  function myTurn(g, me) {
    if (me < 0 || !g || g.phase === 'over') return false;
    if (cfg.myTurn) return cfg.myTurn(g, me);
    return E.decider(g) === me;
  }
  function suggest() {
    var g = App.doc && App.doc.game, me = myIdx();
    if (!myTurn(g, me)) return;
    var a = null; try { a = BOT.decide(JSON.parse(JSON.stringify(g)), me); } catch (e) { a = null; }
    if (!a) { flash('Qui non saprei cosa consigliarti: scegli tu.'); return; }
    act(a); flash('Ho giocato per te la mossa consigliata: guarda cosa è successo sul tavolo e nel registro.');
  }
  var flashTxt = null, flashT = null;
  function flash(t) { flashTxt = t; clearTimeout(flashT); flashT = setTimeout(function () { flashTxt = null; paint(); }, 5000); paint(); }
  function paint() {
    // nascosta mentre è aperta una finestra del gioco (benvenuto, scelte, regole): quella spiega già cosa fare
    var d = window.App && App.doc, on = d && d.practice && App.screen === 'table' && d.game && cfg && !App.sheet && !document.querySelector('.pa-back,.px-back');
    var bar = document.querySelector('.cx-bar'), pill = document.querySelector('.cx-pill');
    if (!on) { if (bar) bar.remove(); if (pill) pill.remove(); lastHTML = ''; return; }
    css();
    if (hidden) {
      if (bar) bar.remove();
      if (!pill) { pill = document.createElement('button'); pill.type = 'button'; pill.className = 'cx-pill'; pill.setAttribute('data-coach', 'show'); pill.textContent = '🎓 Guida'; document.body.appendChild(pill); }
      return;
    }
    if (pill) pill.remove();
    var g = d.game, me = myIdx(), mine = myTurn(g, me), txt;
    if (g.phase === 'over' || d.phase === 'over') txt = '<b>Partita finita!</b> Dalla schermata finale puoi giocarne un’altra con lo stesso tavolo, oppure esci e apri un tavolo vero con i tuoi amici.';
    else {
      var t = null; try { t = cfg.tip(g, me, mine); } catch (e) { t = null; }
      if (!t && !mine) { var dd = E.decider(g); t = dd != null && g.players[dd] ? 'Tocca a <b>' + esc(g.players[dd].nick) + '</b> (bot): guarda cosa fa, poi tocca a te.' : 'Aspetta un attimo: gli altri stanno giocando.'; }
      txt = t || 'Tocca a te.';
    }
    if (flashTxt) txt = flashTxt + '<br>' + txt;
    var html = '<span aria-hidden="true">🎓</span><div class="cx-t">' + txt + (mine && g.phase !== 'over' ? '<div class="cx-row"><button type="button" class="main" data-coach="suggest">Fai la mossa consigliata</button><button type="button" data-coach="rules">Regole</button></div>' : '') + '</div><button type="button" class="cx-x" data-coach="hide" aria-label="Nascondi la guida">×</button>';
    if (!bar) { bar = document.createElement('div'); bar.className = 'cx-bar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }
    if (html !== lastHTML) { bar.innerHTML = html; lastHTML = html; }
  }
  setInterval(paint, 700);
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('[data-coach]'); if (!b) return;
    var k = b.getAttribute('data-coach');
    if (k === 'start') start();
    else if (k === 'hide') { hidden = true; paint(); }
    else if (k === 'show') { hidden = false; lastHTML = ''; paint(); }
    else if (k === 'suggest') suggest();
    else if (k === 'rules') { var r = document.querySelector('[data-act="rules"]'); if (r) r.click(); }
  });
  // Tocca a questo giocatore fare qualcosa adesso? (lo usano il richiamo «tocca a te» e la notifica a chi è assente)
  function needs(g, i) { try { return !!(cfg && myTurn(g, i)); } catch (e) { return false; } }
  return { setup: setup, buttonHTML: buttonHTML, start: start, paint: paint, needs: needs };
})();

/* ===== Installazione come app (PWA): Android usa il prompt del browser, iOS mostra le istruzioni ===== */
var PWA = (function () {
  var deferred = null, listeners = [];
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|wv\)/i.test(ua); // browser interni delle app
  var iosNotSafari = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  function standalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }

  // dentro l'app Android (Trusted Web Activity) non serve proporre l'installazione
  var inApp2 = false;
  try {
    if (/[?&]app=android/.test(location.search) || (document.referrer || '').indexOf('android-app://io.github.alessandrop95.boardgames') === 0) sessionStorage.setItem('pp-twa', '1');

/* ===== Scopa: suoni (carte sul panno, presa, segno, scopa) ===== */
(function () {
  var S = Sound, N = S.N;
  function flick(at, v) { S.hiss({ ft: 'highpass', f: [2600, 5600], q: .7, a: .004, dur: .08, vol: v || .16, at: at || 0 }); }
  function thud(at) { S.hiss({ ft: 'bandpass', f: [900, 420], q: 2, a: .002, dur: .05, vol: .13, at: at || 0 }); S.tone({ f: [210, 140], type: 'triangle', dur: .06, vol: .06, lp: 1200, at: at || 0 }); }
  S.setup({
    tracks: ['../binari-italia/audio/m1.mp3', '../binari-italia/audio/m3.mp3', '../presagio/audio/m2.mp3'], musicVol: .18,
    credit: 'Musica: «Carefree», «Fluffing a Duck» ed «Enchanted Valley» di Kevin MacLeod (incompetech.com, CC BY 3.0). Gli effetti sono sintetizzati nel browser.',
    samples: {},
    synth: {
      deal: function () { for (var i = 0; i < 6; i++) flick(i * .06, .1); },
      card: function () { thud(0); flick(.02, .08); },
      pick: function () { flick(0, .08); },
      take: function () { flick(0, .1); flick(.05, .08); S.tone({ f: [N.E5, N.A5], type: 'triangle', dur: .12, vol: .04, at: .05 }); },
      big: function () { flick(0, .12); S.arp([N.C5, N.E5, N.G5], { type: 'triangle', step: .06, dur: .3, vol: .08 }); },
      scopa: function () { S.hiss({ ft: 'highpass', f: [1500, 6000], q: .6, a: .02, dur: .35, vol: .14 }); S.arp([N.G5, N.C6, N.E6, N.G6], { bell: true, parts: [1, 2.76, 5.4], step: .07, dur: 1, vol: .12, at: .2 }); },
      sign: function () { S.tone({ f: N.A5, type: 'sine', dur: .08, vol: .06 }); S.tone({ f: N.E6, type: 'sine', dur: .1, vol: .05, at: .09 }); },
      turn: function () { S.arp([N.G5, N.D6], { bell: true, parts: [1, 2.76, 5.4], step: .12, dur: 1, vol: .1 }); },
      no: function () { S.tone({ f: [N.E4, N.C4], type: 'triangle', dur: .25, vol: .07 }); },
      lose: function () { S.tone({ f: [N.G4, N.C4], type: 'triangle', dur: .6, vol: .1 }); },
      win: function () { S.arp([N.C5, N.E5, N.G5, N.C6, N.E6, N.G6], { type: 'triangle', step: .1, dur: .55, vol: .15 }); S.arp([N.C6, N.G6, N.C7], { bell: true, at: .6, step: .08, vol: .1, dur: 1.6 }); }
    }
  });
  S.scene(true);
})();

      '<button class="btn ghost block" data-act="tohome">Vai alla home del gioco (resti seduto)</button><button class="btn ghost block" data-act="leave">Esci dal tavolo</button></div>' + closeBtn();
  }
  if (s.kind === 'closeconfirm' && App.doc) return '<h2>Chiudere il tavolo ' + esc(App.doc.code) + '?</h2><p class="lead">Il tavolo sparisce dalla lista' + (App.doc.game && App.doc.phase === 'play' ? ', la partita in corso finisce' : '') + ' e tutti tornano alla schermata iniziale. Non si può annullare.</p>' +
    '<button class="btn block red" data-act="closeyes">Chiudi per tutti</button>' + closeBtn('Annulla');
  if (s.kind === 'intro') return introBody(s);
  if (!g) return '';
  if (s.kind === 'log') return '<h2>Le mosse della partita</h2><div class="loglist">' + g.log.slice().reverse().map(function (l) { var c = l.p != null && g.players[l.p] ? pcol(g, l.p) : 'rgba(255,215,94,.5)'; return '<div class="fl k-' + l.k + '" style="border-left-color:' + c + '">' + esc(l.t) + '</div>'; }).join('') + '</div>' + closeBtn();
  if (s.kind === 'player') {
    var P = g.players[s.p]; if (!P) return '';
    var isHost = App.doc.host === Net.uid;
    return '<div class="phead"><span class="pv big" style="--pc:' + pcol(g, s.p) + '">' + esc(P.nick.charAt(0).toUpperCase()) + '</span><div><div class="kicker">' + (s.p === me ? 'Tu' : g.players.length === 4 && me >= 0 && E.team(g, s.p) === E.team(g, me) ? 'Il tuo compagno' : 'Avversario') + '</div><h2>' + Net.dot(P.uid) + esc(P.nick) + '</h2></div></div>' +
      '<div class="tags"><span class="gc">' + P.hand.length + ' carte in mano</span>' + (P.away ? '<span class="gc">assente: gioca l’automatico</span>' : P.bot ? '<span class="gc">giocatore automatico</span>' : '') + '</div>' +
      (isHost && s.p !== me && g.phase !== 'over' ? '<button class="btn ghost block" data-act="auto" data-p="' + s.p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') + closeBtn();
  }
  if (s.kind === 'signs') {
    if (me < 0 || g.players.length !== 4) return '';
    return '<h2>Segni al compagno</h2><p class="lead">Li vede solo ' + esc(g.players[E.partner(g, me)].nick) + '.</p><div class="signs">' + Object.keys(E.SIGNS).map(function (k) { return '<button class="btn ghost block" data-act="sign" data-k="' + k + '">' + esc(E.SIGNS[k]) + '</button>'; }).join('') + '</div>' + closeBtn('Annulla');
  }
  if (s.kind === 'round' && (g.phase === 'scores' || g.phase === 'over') && g.res) return roundBody(g, me, s);
  if (s.kind === 'scorecard') return '<h2>Segnapunti</h2>' + scorecard(g) + closeBtn();
  if (s.kind === 'over' && g.phase === 'over') return overBody(g, me);
  return '';
}
function roundBody(g, me, s) {
  var P = me >= 0 ? g.players[me] : null, waiting = E.pending(g), isHost = App.doc.host === Net.uid, R = g.res;
  return '<div class="kicker">Mano ' + g.hand + '</div><h2>' + (R.w < 0 ? (CFG.tieText || 'Pari, 60 a 60') : (g.players.length === 4 ? 'Vincono ' : 'Vince ') + sideName(g, R.w)) + '</h2>' + roundRows(g, s.fresh) +
    (g.phase === 'scores' ? (P && !P.ready ? '<button class="btn block" data-act="next">Prossima mano</button>' : P ? '<p class="lead">' + (waiting.length ? 'Aspetto ' + waiting.map(function (i) { return pname(g, i); }).join(', ') + '…' : 'Si riparte tra poco…') + '</p>' : '') +
      (isHost && waiting.length && !(waiting.length === 1 && waiting[0] === me) ? '<button class="btn ghost small" data-act="nextround">Inizia senza aspettare</button>' : '') : '') +
    '<button class="btn ghost block" data-act="close">Guarda il tavolo</button>';
}
function roundRows(g, anim) {
  var R = g.res, mt = myIdx() >= 0 ? E.team(g, myIdx()) : -1;
  return '<div class="rr">' + [0, 1].map(function (t, k) {
    return '<div class="rr-row' + (t === mt ? ' me' : '') + '" style="--pc:' + (g.players.length === 4 ? TCOL[t] : pcol(g, t)) + ';animation-delay:' + (anim ? k * .12 : 0) + 's"><span class="rr-n"><b>' + sideName(g, t) + '</b></span>' + (CFG.roundDetail ? CFG.roundDetail(g, t) : '<span class="rr-w">' + R.cards[t] + ' carte prese</span>') +
      '<span class="rr-p"><b>' + R.pts[t] + '</b><small>' + (CFG.roundUnit || 'punti') + '</small></span></div>';
  }).join('') + '</div>' + (CFG.roundExtra ? CFG.roundExtra(g) : '<p class="lead" style="text-align:center">Mani vinte: <b>' + g.wins[0] + '</b> a <b>' + g.wins[1] + '</b></p>');
}
function scorecard(g) {
  if (!g.hist.length) return '<p class="lead">Ancora nessuna mano finita.</p>';
  return '<div class="card-note"><table class="scard"><tr><th></th><th>' + sideName(g, 0) + '</th><th>' + sideName(g, 1) + '</th></tr>' + g.hist.map(function (h, i) { return '<tr><td>' + (i + 1) + '</td><td>' + h[0] + '</td><td>' + h[1] + '</td></tr>'; }).join('') + '</table></div>';
}
function overBody(g, me) {
  var W = g.winners, mt = me >= 0 ? E.team(g, me) : -1, iw = W.length === 1 && W[0] === mt;
  var title = W.length > 1 ? 'Partita pari!' : iw ? (g.players.length === 4 ? 'Avete vinto!' : 'Hai vinto!') : (g.players.length === 4 ? 'Vincono ' : 'Vince ') + sideName(g, W[0]);
  return '<div class="over"><span class="over-cards">' + [0, 10, 20, 30].map(function (c) { return ART.flat(c); }).join('') + '</span><h2>' + title + '</h2><p class="lead">' + (CFG.overLine ? CFG.overLine(g) : 'Mani vinte: ' + g.wins[0] + ' a ' + g.wins[1] + '.') + '</p>' +
    (g.res ? '<details class="lastround"><summary>Ultima mano</summary>' + roundRows(g, false) + '</details>' : '') + scorecard(g) +
    Score.endHTML(App.doc) + (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda il tavolo') + '</div>';
}
function introBody(s) {
  var pages = RU.ORDER.filter(function (k) { return k !== 'tips'; }).map(function (k, i) { return [i ? RU.S[k][0] : 'Benvenuto a ' + CFG.title, RU.S[k][1]]; });
  var p = Math.max(0, Math.min(pages.length - 1, s.page || 0)), pg = pages[p];
  return '<div class="kicker">' + (p + 1) + ' di ' + pages.length + '</div><h2>' + pg[0] + '</h2>' + pg[1] +
    '<div class="row intro-nav">' + (p > 0 ? '<button class="btn ghost" data-act="introprev">Indietro</button>' : '') + (p < pages.length - 1 ? '<button class="btn" data-act="intronext">Avanti</button>' : '<button class="btn" data-act="introdone">Si gioca!</button>') + '<button class="btn ghost small" data-act="introdone">Salta</button></div>';
}

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && s.kind !== 'intro' && Date.now() - (App.sheetAt || 0) > 450) { App.sheet = null; renderSheet(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s && s.kind !== 'help' ? s : null }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'scorecard': App.sheet = { kind: 'scorecard' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet(CFG.key + '-intro-done', '1'); App.sheet = s.after || null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'showround': App.sheet = { kind: 'round' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'team': send({ t: 'team', uid: el.getAttribute('data-uid') }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo, il tempo e i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    // la partita
    case 'hcard': {
      if (!g || me < 0) return;
      var c = +el.getAttribute('data-c');
      if (CFG.pickCard) { CFG.pickCard(g, me, c); break; }
      if (g.phase !== 'play' || g.turn !== me) { App.sel = App.sel === c ? null : c; Game.render(); break; }
      if (App.sel === c) { App.sel = null; act({ a: 'play', c: c }); } else { App.sel = c; Sound.play('pick'); Game.render(); }
      break;
    }
    case 'doplay': if (CFG.doPlay) CFG.doPlay(g, me); else if (App.sel != null) { var cc = App.sel; App.sel = null; act({ a: 'play', c: cc }); } break;
    case 'tcard': if (CFG.pickTable) CFG.pickTable(g, me, +el.getAttribute('data-c')); break;
    case 'signs': App.sheet = { kind: 'signs' }; renderSheet(); break;
    case 'sign': App.sheet = null; renderSheet(); act({ a: 'sign', k: el.getAttribute('data-k') }); toast('Segno mandato al compagno.'); break;
    case 'next': act({ a: 'next' }); break;
    case 'nextround': send({ t: 'nextround' }); break;
  }
});
document.addEventListener('change', function (ev) {
  var id = ev.target.id;
  if (id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  else if (id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
  else if (id.indexOf('opt-') === 0) { var op = { t: 'opt' }, v = ev.target.value; op[id.slice(4)] = /^-?\d+$/.test(v) ? +v : v; send(op); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape') { if (App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; renderSheet(); } }
});

/* ---------- avvio ---------- */
(function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.defs());
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
