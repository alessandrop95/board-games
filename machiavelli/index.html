<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Machiavelli</title>
<meta name="description" content="Il gioco di carte italiano in cui il tavolo è di tutti: tris, poker e scale da smontare e rimontare. Da 2 a 5 giocatori, ognuno dal proprio telefono.">
<meta name="theme-color" content="#0f2a1f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Machiavelli">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="pwa-sw" content="../sw.js" data-scope="../">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;600;700;800;900&display=swap">
<style>
/* ===== Machiavelli — panno verde fiorentino, pergamena, oro e rosso cardinale ===== */
:root {
  --bg: #0f2a1f; --felt: #17432f; --felt-2: #1d5139; --panel: #1b3a2c; --panel-2: #234a38;
  --ink: #f5ecd6; --muted: #c4cdb9; --dim: #8fa190; --gold: #d8b25a; --gold-2: #a8802c; --red: #a7262d; --good: #9fe08a; --bad: #ff8f80;
  --paper: #f6edd6; --line: rgba(216, 178, 90, .34); --line-2: rgba(245, 236, 214, .12);
  --f-disp: "Marcellus", "Trajan Pro", Georgia, serif;
  --f-body: "Mulish", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --cw: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #245a40, var(--bg) 62%) fixed, var(--bg); }
body.busy { cursor: progress; }
.gv { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 400; text-wrap: balance; margin: 0; }
h2 { font-size: 25px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 20px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 60%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); min-width: 0; }
.panel h2 { font-size: 24px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(216, 178, 90, .12); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(167, 38, 45, .22); border-color: rgba(255, 143, 128, .5); }
.btn { appearance: none; border: 0; border-radius: 10px; min-height: 44px; padding: 10px 16px; font: 800 15.5px/1.15 var(--f-body); color: #2b1c05; cursor: pointer;
  background: linear-gradient(180deg, #f0d48c, var(--gold) 55%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 3px 0 #5f4512, 0 6px 14px rgba(0, 0, 0, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 1px 0 #5f4512; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(245, 236, 214, .06); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.red { background: linear-gradient(180deg, #c8484f, var(--red)); color: #fff4ec; box-shadow: 0 3px 0 #4e0f14; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .pchip:focus-visible, .ab:focus-visible, .grp:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: none; border: 1px solid var(--line-2); color: var(--ink); border-radius: 9px; min-height: 36px; padding: 5px 9px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(245, 236, 214, .06); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #1d1710; background: var(--paper); border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #1d1710; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }
.codebig { font-family: var(--f-disp); font-size: 54px; letter-spacing: .14em; color: var(--gold); line-height: 1; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(15, 42, 31, .93); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { font-family: var(--f-disp); font-size: 22px; color: var(--gold); }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line); background: rgba(245, 236, 214, .04); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 22px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.tgl { font-size: 14.5px; color: var(--muted); padding: 6px 2px; } .tgl input { width: 20px; height: 20px; accent-color: var(--gold); }

/* ---------- carte ---------- */
.pc { display: block; width: 100%; height: auto; }
.pc-r { font: 700 34px var(--f-disp); }
.cw { display: block; width: var(--cw); flex: none; position: relative; border-radius: 4px; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .45)); transition: transform .15s var(--ease); touch-action: none; }
.rrow { display: inline-flex; gap: 2px; vertical-align: middle; margin: 4px 0; }
.rrow .pc { width: 34px; }
.rrow.bad { opacity: .75; outline: 2px solid var(--bad); outline-offset: 2px; border-radius: 4px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; position: relative;
  background: radial-gradient(120% 120% at 85% 10%, #2f6a4c 0%, #1d4a35 40%, #11301f 85%); }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 6px); pointer-events: none; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero h1 { font-size: clamp(46px, 12vw, 82px); line-height: .95; color: var(--paper); text-shadow: 0 3px 0 rgba(0, 0, 0, .45); margin-top: 4px; letter-spacing: .02em; }
.hero .tag { color: #e5ecdc; margin-top: 12px; max-width: 54ch; }
.hero-cards { position: relative; height: 190px; max-width: 360px; width: 100%; justify-self: center; }
.hero-cards .hc { position: absolute; width: 74px; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .45)); }
.hc1 { left: 2%; top: 6px; transform: rotate(-12deg); } .hc2 { left: 18%; top: 0; transform: rotate(-4deg); } .hc3 { left: 34%; top: 4px; transform: rotate(5deg); }
.hc4 { left: 46%; top: 80px; transform: rotate(-6deg); } .hc5 { left: 62%; top: 76px; transform: rotate(3deg); } .hc6 { left: 78%; top: 82px; transform: rotate(12deg); }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: 'top' 'players' 'dock' 'table' 'side';
  background: radial-gradient(110% 70% at 50% 35%, var(--felt-2), var(--felt) 55%, #0f3423); }
.gv-top { grid-area: top; } .gv-players { grid-area: players; } .gv > .chat-dock { grid-area: dock; } .gv-table { grid-area: table; } .gv-side { grid-area: side; }
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line-2); background: #0d241a; min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 18px; font-weight: 400; color: var(--gold); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.gv-players { display: flex; gap: 6px; overflow-x: auto; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 7px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; background: #10291e; border-bottom: 1px solid var(--line-2); }
.gv-players::-webkit-scrollbar { display: none; }
.pchip { appearance: none; flex: none; display: flex; align-items: center; gap: 7px; padding: 4px 10px 4px 5px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(245, 236, 214, .05); color: var(--ink); font: 13px var(--f-body); cursor: pointer; position: relative; text-align: left; }
.pv { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 17px var(--f-disp); color: #fff; background: var(--pc); flex: none; }
.pv.big { width: 56px; height: 56px; font-size: 32px; }
.pchip .pn b { display: block; font-size: 13.5px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip .ps { display: flex; gap: 6px; color: var(--muted); font-size: 12.5px; }
.pchip .ps i { font-style: normal; display: inline-flex; align-items: center; gap: 2px; }
.pchip .ps .low { color: var(--bad); font-weight: 800; }
.pchip .ps .op { color: var(--gold); }
.pchip.on { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 16px color-mix(in srgb, var(--pc) 55%, transparent); background: rgba(245, 236, 214, .1); }
.pchip.me .pn b { color: var(--gold); }
.pchip .away { position: absolute; top: -7px; right: -4px; background: var(--red); color: #fff; font-size: 10px; border-radius: 6px; padding: 0 5px; }
.pchip .away.bot { background: #3f5a4b; }

/* tavolo */
.gv-table { overflow-y: auto; overflow-x: hidden; padding: 10px max(10px, env(safe-area-inset-right, 0px)) 14px max(10px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
.tline { font-size: 13.5px; color: var(--muted); margin-bottom: 8px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.groups { display: flex; flex-wrap: wrap; gap: 10px 10px; align-content: flex-start; }
.grp { position: relative; display: flex; padding: 6px 8px 6px 6px; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, .1); background: rgba(0, 0, 0, .14); min-height: calc(var(--cw) * 1.4 + 12px); max-width: 100%; transition: border-color .15s, background .15s, box-shadow .15s; }
.grp .cw + .cw { margin-left: calc(var(--cw) * -0.44); }
.grp.bad { border-color: var(--bad); background: rgba(167, 38, 45, .22); }
.grp.flash { animation: gflash 1.6s ease-out; }
@keyframes gflash { 0%, 40% { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(216, 178, 90, .7); } }
.gtag { position: absolute; left: 8px; bottom: -9px; background: var(--red); color: #fff; font: 800 10px var(--f-body); text-transform: uppercase; letter-spacing: .06em; border-radius: 5px; padding: 1px 5px; }
.grp.newg { appearance: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: calc(var(--cw) * 2.2); border: 2px dashed var(--line); background: rgba(216, 178, 90, .06); color: var(--gold); font: 700 11.5px/1.15 var(--f-body); cursor: pointer; text-align: center; }
.grp.newg .ic { width: 22px; height: 22px; }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; }
.cw.fresh .pc { outline: 2.5px solid var(--gold); outline-offset: -1px; border-radius: 6px; }
.cw.sel { transform: translateY(-9px); }
.cw.sel .pc { outline: 3px solid #7fd3ff; outline-offset: -1px; border-radius: 6px; }
.cw.dz-lift { opacity: .3; }
/* posti mentre si trascina */
body.dragging .grp.dz-can { border-color: var(--good); background: rgba(120, 220, 120, .16); box-shadow: 0 0 0 2px rgba(159, 224, 138, .5); }
body.dragging .grp.dz-work { border-color: #ffd46b; background: rgba(255, 212, 107, .12); }
body.dragging .grp.dz-nope { opacity: .5; }
body.dragging .grp.dz-over.dz-can, body.dragging .grp.dz-over.dz-work { transform: scale(1.03); box-shadow: 0 0 0 3px var(--good), 0 0 18px rgba(159, 224, 138, .6); }
body.dragging .gv-hand.dz-can { box-shadow: inset 0 0 0 3px var(--good); }
body.dragging .gv-hand.dz-over.dz-can { background: rgba(120, 220, 120, .12); }
.dragghost { position: fixed; left: 0; top: 0; z-index: 200; pointer-events: none; display: flex; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .55)); transform-origin: 0 0; }
.dragghost .cw { --cw: 54px; transform: rotate(-4deg); }
.dragghost .cw + .cw { margin-left: -36px; }
.dragghost b { position: absolute; right: -8px; top: -8px; background: var(--gold); color: #2b1c05; border-radius: 999px; font: 900 12px var(--f-body); padding: 1px 7px; }

/* parte bassa */
.gv-side { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; background: #12301f; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.gv-prompt { display: flex; align-items: center; gap: 8px; padding: 7px max(10px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #3a2d12, #2a210e); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 160px; }
.pr-txt b { color: #ffe3a0; }
.pr-b { display: flex; gap: 6px; align-items: center; margin-left: auto; flex: none; }
.gv-prompt .help { color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }
.gv-acts:empty { display: none; }
.gv-acts { display: flex; gap: 6px; padding: 7px max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
.ab { appearance: none; flex: 1 1 0; min-width: 0; min-height: 48px; border-radius: 11px; border: 1px solid var(--line); background: rgba(245, 236, 214, .07); color: var(--ink); font: 800 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 5px 4px; }
.ab .ic { width: 20px; height: 20px; color: var(--gold); }
.ab.pri { background: linear-gradient(180deg, #f0d48c, var(--gold) 55%, var(--gold-2)); color: #2b1c05; border-color: #f0d48c; box-shadow: 0 3px 0 #5f4512; }
.ab.pri .ic { color: #2b1c05; }
.ab[aria-disabled] { opacity: .42; }
.gv-hand { padding: 6px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); max-height: 38vh; overflow-y: auto; border-radius: 10px; transition: background .15s; }
.hd-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); margin-bottom: 6px; }
.hd-head b { color: var(--ink); }
.hd-cards { display: flex; flex-wrap: wrap; gap: 5px 4px; padding-top: 8px; }
.hd-cards .cw { --cw: 46px; }
@media (min-width: 420px) { :root { --cw: 48px; } .hd-cards .cw { --cw: 50px; } }
@media (min-width: 1000px) and (min-height: 650px) {
  :root { --cw: 58px; }
  .gv { grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-areas: 'top top' 'players players' 'dock dock' 'table side'; }
  .gv-side { border-top: 0; border-left: 1px solid var(--line); align-content: start; overflow-y: auto; }
  .gv-hand { max-height: none; } .hd-cards .cw { --cw: 60px; }
  .gv-table { padding: 18px; }
}

/* ---------- finestre ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(4, 12, 8, .6); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 640px; max-height: calc(90vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: linear-gradient(180deg, #244b39, #193729); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; box-shadow: 0 -12px 40px rgba(0, 0, 0, .55); animation: up .28s var(--ease); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 18px; border-bottom: 1px solid var(--line); } }
.sheet .lead { font-size: 15.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.gc { display: inline-flex; align-items: center; gap: 4px; border-radius: 7px; padding: 3px 8px; font-size: 13.5px; background: rgba(245, 236, 214, .06); border: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(13, 36, 26, .96); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 12px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .5); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }
.banner { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; }
.banner span { font-family: var(--f-disp); font-size: clamp(40px, 12vw, 84px); color: var(--paper); text-shadow: 0 4px 0 #000, 0 0 40px rgba(216, 178, 90, .7); animation: ban 2s var(--ease) forwards; text-align: center; }
@keyframes ban { 0% { transform: scale(.6); opacity: 0; } 18% { transform: scale(1.05); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
.phead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.loglist { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.loglist .fl { font-size: 14px; border-left: 3px solid var(--line-2); padding: 3px 8px; }
.intro-art { display: grid; justify-items: center; gap: 4px; }
.intro-list { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.intro-nav { justify-content: flex-end; margin-top: 6px; }
.rules { display: grid; gap: 14px; }
.rsec { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 7px; scroll-margin-top: 10px; }
.rsec ul, .rsec ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

  /* ---------- giocatori ---------- */

        '<span class="pv">' + esc(P.nick.charAt(0).toUpperCase()) + '</span><span class="pn"><b>' + Net.dot(P.uid) + esc(P.nick) + (p === me ? ' (tu)' : '') + '</b><span class="ps"><i class="' + (n <= 2 ? 'low' : '') + '">' + IC('cards') + n + (n === 1 ? ' carta' : ' carte') + '</i>' + (g.opts.open36 && !P.opened ? '<i class="op">da aprire</i>' : '') + '</span></span>' +

  function table(g, me) {

/* ===== Machiavelli: finestre (regole, menu, giocatori, classifica, presentazione) ed eventi ===== */
function renderSheet() {
  var root = $('#sheet'), s = App.sheet;
  if (!s) { root.innerHTML = ''; return; }
  var h = sheetBody(s); if (!h) { App.sheet = null; root.innerHTML = ''; return; }
  if (root._s !== s) { root._s = s; App.sheetAt = Date.now(); }
  root.innerHTML = '<div class="sheet-back" data-act="sheetback"><div class="sheet sh-' + s.kind + '" role="dialog" aria-modal="true">' + h + '</div></div>';
  if (s.kind === 'rules' && s.focus) { var t = document.getElementById('r-' + s.focus); if (t) t.scrollIntoView({ block: 'start' }); }
}
function closeBtn(t) { return '<button class="btn block ghost" data-act="close">' + (t || 'Chiudi') + '</button>'; }
function sheetBody(s) {
  var g = G(), me = myIdx();
  if (s.kind === 'rules') return '<h2>Come si gioca</h2>' + RU.toc() + RU.html() + closeBtn('Ho capito');
  if (s.kind === 'help') return RU.section(s.r) + '<button class="btn ghost small" data-act="rules">Tutte le regole</button>' + closeBtn('Ho capito');
  if (s.kind === 'menu' && App.doc) {
    var d = App.doc;
    return '<h2>Tavolo ' + esc(d.code) + '</h2><div style="display:grid;gap:8px">' +
      '<button class="btn ghost block" data-act="invite">Invita amici al tavolo</button><button class="btn ghost block" data-act="rules">Regole</button><button class="btn ghost block" data-act="intro">Rivedi la presentazione</button><button class="btn ghost block" data-act="log">Tutte le mosse della partita</button>' +
      (d.host !== Net.uid ? '<button class="btn ghost block" data-act="takehost">Prendi il comando del tavolo (se l’host se n’è andato)</button>' : '') +
      (d.host === Net.uid && d.phase !== 'lobby' ? '<button class="btn ghost block" data-act="rematch">Chiudi la partita e torna alla sala d’attesa</button>' : '') +
      (d.host === Net.uid ? '<button class="btn ghost block" data-act="closetable">Chiudi il tavolo per tutti</button>' : '') +
      '<button class="btn ghost block" data-act="tohome">Vai alla home del gioco (resti seduto)</button><button class="btn ghost block" data-act="leave">Esci dal tavolo</button></div>' + closeBtn();
  }
  if (s.kind === 'closeconfirm' && App.doc) return '<h2>Chiudere il tavolo ' + esc(App.doc.code) + '?</h2><p class="lead">Il tavolo sparisce dalla lista' + (App.doc.game && App.doc.phase === 'play' ? ', la partita in corso finisce' : '') + ' e tutti tornano alla schermata iniziale. Non si può annullare.</p>' +
    '<button class="btn block red" data-act="closeyes">Chiudi per tutti</button>' + closeBtn('Annulla');
  if (s.kind === 'intro') return introBody(s);
  if (!g) return '';
  if (s.kind === 'log') return '<h2>Le mosse della partita</h2><div class="loglist">' + g.log.slice().reverse().map(function (l) { var c = l.p != null && g.players[l.p] ? PCOL[g.players[l.p].col % PCOL.length] : 'rgba(216,178,90,.5)'; return '<div class="fl" style="border-left-color:' + c + '">' + esc(l.t) + '</div>'; }).join('') + '</div>' + closeBtn();
  if (s.kind === 'player') {
    var P = g.players[s.p];
    return '<div class="phead"><span class="pv big" style="--pc:' + PCOL[P.col % PCOL.length] + '">' + esc(P.nick.charAt(0).toUpperCase()) + '</span><div><div class="kicker">' + (s.p === me ? 'Tu' : 'Giocatore') + '</div><h2>' + Net.dot(P.uid) + esc(P.nick) + '</h2></div></div>' +
      '<div class="tags"><span class="gc">' + IC('cards') + P.hand.length + ' carte in mano</span><span class="gc">' + P.played + ' carte calate</span>' + (g.opts.open36 ? '<span class="gc">' + (P.opened ? 'ha aperto' : 'deve ancora aprire') + '</span>' : '') + '</div>' +
      (App.doc.host === Net.uid && s.p !== me && g.phase === 'play' ? '<button class="btn ghost block" data-act="auto" data-p="' + s.p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') + closeBtn();

}
function introBody(s) {
  function C(r, su, d) { return (d || 0) * 52 + su * 13 + (r - 1); }
  var pages = [
    ['Benvenuto a Machiavelli', '<div class="intro-art">' + RU.row([C(9, 2), C(10, 2), C(11, 2)]) + RU.row([C(4, 0), C(4, 1), C(4, 3)]) + '</div>' + RU.S.goal[1]],
    ['Ogni turno: giochi o peschi', RU.S.turn[1] + '<p>Le combinazioni sul tavolo puoi <b>smontarle e rimontarle</b> come vuoi, purché alla fine siano tutte valide e tu abbia messo almeno una carta tua.</p>'],
    ['Come si spostano le carte', '<ul class="intro-list"><li><b>Trascina</b> una carta sul posto giusto: dove sta bene, la combinazione si accende di <b>verde</b>.</li><li>Oppure <b>tocca</b> le carte per selezionarle e poi tocca il posto dove metterle.</li>' +
      '<li>La casella tratteggiata crea una <b>nuova combinazione</b>: finché è incompleta è <b>rossa</b>.</li><li><b>Annulla</b> rimette tutto com’era; <b>Fine turno</b> si accende quando il tavolo è tutto valido.</li><li>Gli altri vedono in diretta quello che stai facendo.</li></ul>']
  ];

function overBody(g, me) {
  var F = g.final, W = g.winner;
  var rows = F.order.map(function (p, i) {
    var P = g.players[p], r = F.rows[p];
    return '<div class="fr' + (i === 0 ? ' win' : '') + '" style="--pc:' + PCOL[P.col % PCOL.length] + ';animation-delay:' + (i * .2) + 's"><div class="fr-h"><span class="rk">' + (i + 1) + '</span><b>' + esc(P.nick) + (p === me ? ' (tu)' : '') + '</b><span class="tot">' + r.left + '</span></div>' +
      '<div class="fr-d">' + (r.left ? 'carte rimaste (' + r.pts + ' punti)' : 'nessuna carta: ha chiuso!') + '</div>' + (r.left ? '<div class="fr-c">' + P.hand.map(function (c) { return '<span class="cw">' + ART.card(c) + '</span>'; }).join('') + '</div>' : '') + '</div>';

    '<div class="frs">' + rows + '</div>' + Score.endHTML(App.doc) + (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda il tavolo') + '</div>';
}

/* ---------- eventi ---------- */
function playDone() {
  var g = G(); if (!Work.active()) return;
  if (!Work.played().length) { toast('Metti sul tavolo almeno una carta della tua mano, oppure pesca.'); Sound.play('no'); return; }
  if (!Work.allValid()) { toast('Ci sono combinazioni rosse: sistemale prima di finire il turno.', 'bad'); Sound.play('no'); return; }
  act({ a: 'play', t: Work.table() });
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');

  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && s.kind !== 'intro' && Date.now() - (App.sheetAt || 0) > 450) { App.sheet = null; renderSheet(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s && s.kind !== 'help' ? s : null }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('mc-intro-done', '1'); App.sheet = s.after || null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'sort': App.sortBy = App.sortBy === 'rank' ? 'suit' : 'rank'; lsSet('mc-sort', App.sortBy); Game.render(); break;
    // il turno
    case 'grp': case 'newg': {   // carte selezionate → in questa combinazione / in una nuova
      if (ev.target.closest('.cw') || !Work.active()) return;
      var W = Work.get(); if (!W.sel.length) { if (a === 'newg') toast('Trascina qui una carta, oppure selezionane alcune e tocca qui.'); return; }
      Work.move(W.sel.slice(), a === 'newg' ? 'new' : el.getAttribute('data-g')); Game.render(); break;
    }
    case 'tohand': { if (ev.target.closest('.cw') || !Work.active()) return; var W2 = Work.get(); if (W2.sel.length) { Work.move(W2.sel.slice(), 'hand'); Game.render(); } break; }
    case 'undo': if (Work.active()) { Work.reset(); Game.render(); } break;
    case 'done': playDone(); break;
    case 'draw': if (!Work.active()) return; if (Work.changed()) { App.sheet = { kind: 'drawconfirm' }; renderSheet(); } else act({ a: 'draw' }); break;
    case 'drawyes': App.sheet = null; renderSheet(); Work.reset(); act({ a: 'draw' }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
  if (ev.target.id === 'opt-cards') send({ t: 'opt', cards: +ev.target.value });
  if (ev.target.id === 'opt-open36') send({ t: 'opt', open36: ev.target.checked });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  App.sortBy = lsGet('mc-sort') === 'rank' ? 'rank' : 'suit';
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
