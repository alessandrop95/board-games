<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<style>
/* ===== Gattomina — stile cartoon: colori vivaci, contorni spessi, tavolo da salotto ===== */
:root {
  --bg: #2a1446; --bg-2: #3d1d66; --bg-3: #1a0c2e;
  --ink: #1c0f2e; --paper: #fff8ee; --cream: #ffeccf;
  --pink: #ff5fa8; --yellow: #ffd34d; --teal: #3fd6c2; --orange: #ff8a3d; --red: #ff3d5a; --green: #4ee0ab; --violet: #9b6bff;
  --text: #fff6ff; --muted: #d6c2f0; --line: rgba(255, 255, 255, .16);
  --good: #4ee0ab; --bad: #ff6b81;
  --f-disp: 'Luckiest Guy', 'Fredoka', system-ui, sans-serif;
  --f-body: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --bounce: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--text); font-family: var(--f-body); font-size: 16.5px; line-height: 1.4; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255, 95, 168, .35), transparent 40%), radial-gradient(circle at 85% 30%, rgba(63, 214, 194, .22), transparent 40%),
    radial-gradient(circle, rgba(255, 255, 255, .07) 2.5px, transparent 3px), radial-gradient(circle, rgba(255, 255, 255, .05) 2px, transparent 2.5px),
    linear-gradient(180deg, var(--bg-2), var(--bg) 45%, var(--bg-3));
  background-size: auto, auto, 34px 34px, 34px 34px, auto; background-position: 0 0, 0 0, 0 0, 17px 17px, 0 0; background-attachment: fixed;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-disp); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }

/* ---------- pulsanti ---------- */
.btn {
  appearance: none; cursor: pointer; border: 3px solid var(--ink); border-radius: 16px; min-height: 50px; padding: 10px 18px;
  font-family: var(--f-disp); font-size: 18px; letter-spacing: .04em; color: var(--ink);
  background: linear-gradient(180deg, #ffe680, var(--yellow) 55%, #f2a91c); box-shadow: 0 5px 0 var(--ink), 0 10px 18px rgba(0, 0, 0, .3);
  transition: transform .12s var(--ease), box-shadow .12s, filter .12s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), 0 4px 8px rgba(0, 0, 0, .3); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: rgba(255, 255, 255, .08); color: var(--text); border-color: rgba(255, 255, 255, .35); box-shadow: 0 4px 0 rgba(0, 0, 0, .35); font-family: var(--f-body); font-weight: 600; font-size: 16px; letter-spacing: 0; }
.btn.red { background: linear-gradient(180deg, #ff8a9a, var(--red)); color: #fff; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: 15px; border-radius: 13px; }
.btn.block { width: 100%; }
.btn img { width: 30px; height: 30px; margin: -6px 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input.field { font: inherit; font-size: 18px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; min-height: 50px; width: 100%; box-shadow: inset 0 3px 0 rgba(0, 0, 0, .08); }
input.field.code { font-family: var(--f-disp); letter-spacing: .3em; text-transform: uppercase; text-align: center; }

/* ---------- home ---------- */
.lobby { padding-block: 22px 56px; display: grid; gap: 20px; }
.hero { position: relative; display: grid; gap: 14px; padding: 22px 20px 16px; border-radius: 26px; overflow: hidden; border: 3px solid var(--ink);
  background: radial-gradient(circle at 80% 70%, rgba(255, 211, 77, .45), transparent 45%), linear-gradient(135deg, var(--pink), #b34ad9 60%, #6a2fc2); box-shadow: 0 8px 0 var(--ink), 0 18px 34px rgba(0, 0, 0, .4); }
.hero::before { content: ""; position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .09) 0 10deg, transparent 10deg 20deg); animation: spin 60s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.hero > * { position: relative; }
.hero h1 { font-size: clamp(50px, 15vw, 92px); line-height: .9; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); transform: rotate(-3deg); }
.hero .tag { font-size: 18px; font-weight: 500; max-width: 46ch; margin: 0; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.hero .credit { font-size: 13px; opacity: .85; margin: 0; }
.fan { position: relative; height: 196px; }
.fan .card { position: absolute; left: 50%; top: 8px; --cw: 120px; transform-origin: 50% 120%; animation: bob 3.4s ease-in-out infinite; }
.fan .card:nth-child(2) { animation-delay: -1.1s; } .fan .card:nth-child(3) { animation-delay: -2.2s; }
@keyframes bob { 50% { margin-top: -8px; } }
@media (min-width: 760px) { .hero { grid-template-columns: 1.2fr 1fr; align-items: center; } .fan { height: 240px; } .fan .card { --cw: 146px; } }
.panel { position: relative; background: rgba(255, 255, 255, .07); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 12px; min-width: 0; backdrop-filter: blur(4px); }
.panel h2 { font-size: 24px; color: var(--yellow); text-shadow: 0 2px 0 var(--ink); }
.panel .lead, .lead { color: var(--muted); font-size: 15.5px; margin: 0; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.trow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 16px; background: rgba(255, 255, 255, .05); }
.trow .code { font-family: var(--f-disp); letter-spacing: .15em; color: var(--yellow); }
.trow .grow { flex: 1; min-width: 0; }
.notice { border: 2px solid var(--yellow); padding: 10px 12px; background: rgba(255, 211, 77, .12); border-radius: 14px; font-size: 15px; }
.notice.red { border-color: var(--red); background: rgba(255, 61, 90, .14); }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px; border: 2px dashed var(--line); border-radius: 16px; min-height: 60px; }
.seat.full { border-style: solid; background: rgba(255, 255, 255, .07); }
.seat .ava { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; flex: none; border: 3px solid var(--ink); overflow: hidden; color: var(--ink); }
.seat .ava img { width: 36px; height: 36px; }
.seat .nm { font-weight: 600; overflow-wrap: anywhere; }
.seat .sub { font-size: 13px; color: var(--muted); }
.seat .x { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 22px; padding: 4px 8px; }
.codebig { font-family: var(--f-disp); font-size: 44px; letter-spacing: .25em; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(26, 12, 46, .9); backdrop-filter: blur(8px); border-bottom: 2px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.brand { font-family: var(--f-disp); font-size: 22px; color: var(--yellow); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
.topbar .info { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { appearance: none; border: 2px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .08); color: var(--text); border-radius: 12px; min-height: 38px; padding: 4px 11px; cursor: pointer; font-weight: 600; font-size: 14px; }
.gallery { padding-block: 16px 48px; display: grid; gap: 18px; }
.ggrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); justify-items: center; }
.ggrid .card { --cw: 100%; max-width: 220px; }
.gitem { display: grid; gap: 6px; justify-items: center; width: 100%; }
.gitem .cnt { font-family: var(--f-disp); color: var(--yellow); }

/* ---------- carte ---------- */
.card {
  --cw: 110px; --c1: #ff9ad1; --c2: #e23c8b; --ink: #1c0f2e;
  position: relative; flex: none; width: var(--cw); aspect-ratio: 5 / 7; max-width: 100%; container-type: inline-size; user-select: none; -webkit-user-select: none;
  border-radius: 9% / 6.5%; background: #fff; border: 3px solid #1c0f2e; box-shadow: 0 4px 0 #1c0f2e, 0 8px 16px rgba(0, 0, 0, .35);
}
.card .face { position: absolute; inset: 3.5%; border-radius: 7% / 5%; overflow: hidden; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 42%, var(--c1), var(--c2) 75%); }
.card .rays { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(255, 255, 255, .16) 0 9deg, transparent 9deg 18deg); pointer-events: none; }
.card .ttl { position: relative; z-index: 2; margin: 4cqw 4cqw 0; padding: 2.2cqw 3cqw 1.6cqw; text-align: center; font-family: var(--f-disp); font-size: 11.5cqw; line-height: .95; color: #fff; -webkit-text-stroke: 1.6cqw #1c0f2e; paint-order: stroke fill; letter-spacing: .02em; text-wrap: balance; transform: rotate(-2deg); }
.card .art { position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; }
.card .art .pt { position: absolute; transform: translate(-50%, -50%) rotate(var(--r, 0deg)); filter: drop-shadow(0 1.5cqw 0 rgba(28, 15, 46, .35)); pointer-events: none; }
.card .art .pt.fx { filter: none; opacity: .95; animation: pulse 1.4s ease-in-out infinite; }
.card .txt { position: relative; z-index: 2; margin: 0 4cqw 4cqw; padding: 2.4cqw 3cqw; border-radius: 4cqw; background: rgba(255, 255, 255, .93); border: .9cqw solid #1c0f2e; color: #1c0f2e; text-align: center; line-height: 1.12; }
.card .txt b { display: block; font-family: var(--f-disp); font-weight: 400; font-size: 7.4cqw; letter-spacing: .02em; color: var(--c2); -webkit-text-stroke: 0; }
.card .txt span { display: block; font-size: 6.2cqw; font-weight: 500; margin-top: 1cqw; }
.card .combo { position: absolute; z-index: 3; right: 5cqw; top: 22cqw; padding: 1cqw 2.4cqw; border-radius: 4cqw; background: #fff; border: .8cqw solid #1c0f2e; font-family: var(--f-disp); font-size: 6.5cqw; color: #1c0f2e; transform: rotate(8deg); }
.card.k-bomb .ttl { color: var(--yellow); }
.card.k-bomb { box-shadow: 0 4px 0 #1c0f2e, 0 0 18px rgba(255, 80, 60, .6), 0 8px 16px rgba(0, 0, 0, .35); }
.card.k-bomb .face::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255, 211, 77, .14) 0 6cqw, transparent 6cqw 12cqw); pointer-events: none; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(1.08); } }
/* dettagli animati sulle carte grandi */
.card.big .pt.float, .sheet .card .pt.float, .fan .card .pt.float { animation: floaty 2.4s ease-in-out infinite; }
.card.big .pt.spin, .sheet .card .pt.spin { animation: wobble 2.2s ease-in-out infinite; }
.card.big .pt.tw, .sheet .card .pt.tw, .fan .card .pt.tw { animation: twinkle 1.6s ease-in-out infinite; }
.card.big .pt.beam::before { content: ""; }
@keyframes floaty { 50% { transform: translate(-50%, -62%) rotate(var(--r, 0deg)); } }
@keyframes wobble { 50% { transform: translate(-50%, -50%) rotate(calc(var(--r, 0deg) + 25deg)); } }
@keyframes twinkle { 50% { transform: translate(-50%, -50%) scale(.6) rotate(20deg); opacity: .6; } }
/* dorso */
.card.back .face { background: radial-gradient(circle at 50% 45%, #7a3cd9, #3c1678 70%); align-items: center; justify-content: center; }
.card.back .paws { position: absolute; inset: 0; opacity: .14; background-image: radial-gradient(circle at 30% 30%, #fff 6%, transparent 7%), radial-gradient(circle at 70% 70%, #fff 6%, transparent 7%); background-size: 26cqw 26cqw; }
.card.back .logo { position: relative; width: 62cqw; height: 62cqw; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffe680, var(--yellow) 50%, #f2a91c); border: 1.5cqw solid #1c0f2e; box-shadow: 0 2cqw 0 #1c0f2e; }
.card.back .logo img { position: absolute; width: 70%; left: 18%; top: 22%; }
.card.back .logo img.cat { width: 52%; left: 8%; top: 4%; }
.card.back .word { position: absolute; bottom: 7cqw; left: 0; right: 0; text-align: center; font-family: var(--f-disp); font-size: 10cqw; color: #fff; -webkit-text-stroke: 1.4cqw #1c0f2e; paint-order: stroke fill; transform: rotate(-3deg); }
@container (max-width: 100px) {
  .card .txt { display: none; }
  .card .ttl { font-size: 13cqw; margin-top: 5cqw; }
  .card .combo { top: auto; bottom: 5cqw; right: 5cqw; font-size: 10cqw; }
  .card.back .word { display: none; }
}

/* ---------- tavolo ---------- */
.tv { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
.tv-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, rgba(255, 180, 90, .2), transparent 60%); }
.tv > *:not(.tv-bg) { position: relative; z-index: 1; }
.tv-top { display: flex; align-items: center; gap: 8px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); }
.tv-top .info { flex: 1; min-width: 0; display: grid; line-height: 1.15; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.tv-top .info > * { overflow: hidden; text-overflow: ellipsis; } .tv-top .info b { color: #fff; }
@media (max-width: 420px) { .tv-top .brand { display: none; } }
.tv .chat-dock { margin: 0 12px 4px; background: rgba(26, 12, 46, .7); border-color: rgba(255, 255, 255, .25); font-family: var(--f-body); }
.tv-table { flex: 1 1 auto; min-height: 250px; max-height: min(128vw, 620px); width: calc(100% - 16px); max-width: 820px; margin: auto; container-type: size; }
.tv-rug { position: absolute; left: 8%; right: 8%; top: 12%; bottom: 10%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 40%, #36c2a8, #1a8a7a 60%, #0f5e55); border: 4px solid var(--ink);
  box-shadow: 0 0 0 10px #a8642b, 0 0 0 14px var(--ink), 0 14px 0 14px #6b3a17, 0 18px 0 16px var(--ink), 0 30px 50px rgba(0, 0, 0, .5), inset 0 10px 30px rgba(0, 0, 0, .25); }
.tv-rug::before { content: ""; position: absolute; inset: 7%; border-radius: 50%; border: 3px dashed rgba(255, 255, 255, .25); }
.tv-center { position: absolute; left: 50%; top: 60%; transform: translate(-50%, -50%); display: flex; gap: 6cqw; align-items: center; z-index: 3; }
.deck { position: relative; width: clamp(62px, 17cqh, 92px); aspect-ratio: 5 / 7; cursor: pointer; }
.deck .card { position: absolute; left: 0; top: 0; --cw: 100%; width: 100%; transform: translate(calc(var(--i) * -1.2px), calc(var(--i) * -1.6px)); }
.deck .dcount { position: absolute; z-index: 9; right: -10px; bottom: -10px; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 16px; display: grid; place-items: center; background: #fff; color: var(--ink); border: 3px solid var(--ink); font-family: var(--f-disp); font-size: 16px; }
.deck.warm { animation: jitter 2.6s ease-in-out infinite; }
.deck.hot { animation: jitter .9s ease-in-out infinite; }
.deck.hot .dcount { background: var(--red); color: #fff; }
@keyframes jitter { 0%, 80%, 100% { transform: none; } 84% { transform: rotate(-2deg); } 88% { transform: rotate(2deg); } 92% { transform: rotate(-1deg); } }
.disc { width: clamp(62px, 17cqh, 92px); aspect-ratio: 5 / 7; }
.disc .card { --cw: 100%; width: 100%; transform: rotate(6deg); }
.disc .slot { width: 100%; height: 100%; border-radius: 10px; border: 3px dashed rgba(255, 255, 255, .35); display: grid; place-items: center; font-size: 12px; color: rgba(255, 255, 255, .6); }
.danger { position: absolute; left: 50%; top: 81%; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 20px; background: rgba(28, 15, 46, .78); border: 2px solid rgba(255, 255, 255, .25); white-space: nowrap; font-size: 13px; }
.danger img { width: 28px; height: 28px; filter: drop-shadow(0 0 calc(var(--risk, 0) * 12px) rgba(255, 90, 40, .95)); animation: fuse calc(1.6s - var(--risk, 0) * 1.1s) ease-in-out infinite; }
.danger b { font-family: var(--f-disp); font-size: 18px; color: var(--yellow); }
.danger em { font-style: normal; font-weight: 700; color: hsl(calc(130 - var(--risk, 0) * 130), 90%, 65%); }
@keyframes fuse { 50% { transform: scale(1.15) rotate(-6deg); } }
.playzone { position: absolute; left: 50%; top: 42%; width: min(96%, 460px); transform: translate(-50%, -50%) scale(.7); z-index: 6; opacity: 0; transition: transform .35s var(--bounce), opacity .25s; pointer-events: none; }
.playzone.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.playzone.incoming { opacity: 0 !important; }
.ann { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px 12px 14px; border-radius: 20px; border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink), 0 14px 30px rgba(0, 0, 0, .45);
  background: radial-gradient(circle at 15% 30%, color-mix(in srgb, var(--c1, #fff) 45%, #fff), #fff 70%); color: var(--ink); }
.ann .pcards { position: relative; display: flex; padding: 4px 0 0 2px; }
.ann .pcards .card { --cw: clamp(72px, 21cqw, 104px); transform: rotate(calc((var(--j) - (var(--n) - 1) / 2) * 8deg)); }
.ann .pcards.n2 .card, .ann .pcards.n3 .card { --cw: clamp(62px, 17cqw, 88px); }
.ann .pcards.n5 .card { --cw: clamp(48px, 12cqw, 66px); }
.ann .pcards .card + .card { margin-left: calc(var(--cw) * -.62); }
.ann .nopes { position: absolute; left: 50%; top: 30%; }
.ann .nopes .card { position: absolute; --cw: clamp(56px, 16cqw, 80px); transform: translate(-50%, 0) rotate(calc(-16deg + var(--j) * 28deg)); animation: slam .35s var(--bounce); }
@keyframes slam { from { transform: translate(-50%, -60px) rotate(-40deg) scale(1.6); opacity: 0; } }
.playzone.off .ann .pcards > .card { filter: grayscale(.85) brightness(.75); }
.ann .atext { display: grid; gap: 3px; min-width: 0; }
.ann .who { font-size: 14px; font-weight: 600; color: #4a3a66; }
.ann .who b, .ann .eff b { color: var(--ink); } .ann b.me { color: #c2187a; }
.ann .cname { font-family: var(--f-disp); font-size: clamp(22px, 7cqw, 30px); line-height: 1; color: var(--c2, var(--ink)); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink); letter-spacing: .02em; }
.ann .eff { font-size: 15px; line-height: 1.25; font-weight: 500; }
.ann .eff b.big { font-family: var(--f-disp); font-weight: 400; font-size: 18px; color: #e2491b; }
.ann .astate { margin-top: 2px; font-size: 14px; font-weight: 600; }
.ann .astate .wait { color: #6a4fa8; } .ann .astate .no { color: #c3112f; } .ann .astate .yes { color: #138a62; }
.playzone.off .ann { background: radial-gradient(circle at 15% 30%, #ffd6dc, #fff 70%); }
.ann .bar { position: absolute; left: 14px; right: 14px; bottom: -11px; height: 18px; border-radius: 9px; background: #fff; border: 2.5px solid var(--ink); overflow: hidden; --q: 1; }
.ann .bar i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--q)); background: linear-gradient(90deg, #ff5f72, #ffd34d); transition: transform .2s linear; }
.ann .bar span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-disp); font-size: 13px; color: var(--ink); }

<script>
window.GAME_PREFIX = 'gattomina/v1/';
/* ===== Rete senza account: MQTT su WebSocket verso broker pubblici gratuiti =====
   (Le pagine dei giochi si rigenerano da sole su GitHub a ogni modifica in src/: azione «Ricostruisci i giochi».)
   Modello: il dispositivo "host" del tavolo tiene la verità. Pubblica lo stato completo
   come messaggio "retained" (chi arriva lo riceve subito); gli altri inviano solo azioni.
   Robustezza: controllo continuo che il server risponda, riconnessione immediata quando
   la pagina torna in primo piano, subentro automatico se l'host sparisce. */

var NETQ = new URLSearchParams(location.search);
var NET_PING_MS = +(NETQ.get('ping') || 10000);     // ogni quanto si interroga il server
var NET_DEAD_MS = +(NETQ.get('dead') || 15000);     // silenzio oltre il quale si verifica la connessione
var NET_PROBE_MS = 5000;                            // attesa della risposta alla verifica

/* ---------- client MQTT 3.1.1 minimo ---------- */
function MQ(url) {
  this.url = url; this.subs = {}; this.handlers = []; this.statusHandlers = [];
  this.connected = false; this.closed = false; this.pid = 1; this.buf = new Uint8Array(0);
  this.backoff = 800; this.lastRx = Date.now(); this.id = 'pp' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);
  var self = this;
  this.ready = new Promise(function (res, rej) { self._res = res; self._rej = rej; });
  this._open();
}
MQ.enc = new TextEncoder(); MQ.dec = new TextDecoder();
MQ.str = function (s) { var b = MQ.enc.encode(s); return [b.length >> 8, b.length & 255].concat(Array.from(b)); };
MQ.packet = function (head, body) {
  var len = body.length, rl = [];
  do { var d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; rl.push(d); } while (len > 0);
  var out = new Uint8Array(1 + rl.length + body.length);
  out[0] = head; out.set(rl, 1); out.set(body, 1 + rl.length);
  return out;
};
MQ.prototype._open = function () {
  var self = this, ws;
  clearTimeout(this.retryTimer); this.retryTimer = null;
  try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.ws = null; this._down(); return; }
  ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
  this.openTimer = setTimeout(function () { if (!self.connected && self.ws === ws) self._drop(); }, 7000);
  ws.onopen = function () {
    var body = MQ.str('MQTT').concat([4, 0x02, 0, 45]).concat(MQ.str(self.id));
    ws.send(MQ.packet(0x10, body));
  };
  ws.onmessage = function (ev) {
    if (self.ws !== ws) return;
    self.lastRx = Date.now();
    var chunk = new Uint8Array(ev.data), b = new Uint8Array(self.buf.length + chunk.length);
    b.set(self.buf); b.set(chunk, self.buf.length); self.buf = b; self._parse();
  };
  ws.onclose = function () { if (self.ws === ws) { self.ws = null; self._down(); } };
  ws.onerror = function () {};
};
// Chiude subito una connessione sospetta (anche se il browser la crede ancora aperta) e riparte.
MQ.prototype._drop = function () {
  var ws = this.ws; this.ws = null;
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) {} }
  this._down();
};
MQ.prototype._down = function () {
  var self = this, was = this.connected;
  this.connected = false; clearInterval(this.pinger); clearTimeout(this.openTimer); clearTimeout(this.probeTimer); this.probeTimer = null;
  if (was) this.statusHandlers.forEach(function (f) { f(false); });
  if (this.closed) return;
  if (!this.everUp) { this._rej(new Error('broker non raggiungibile')); this.closed = true; return; }
  if (this.retryTimer) return;
  this.retryTimer = setTimeout(function () { self.retryTimer = null; if (!self.closed && !self.ws) self._open(); }, this.backoff);
  this.backoff = Math.min(this.backoff * 1.7, 8000);
};
// Verifica attiva: manda un ping e, se entro pochi secondi non arriva nulla, considera la connessione morta.
MQ.prototype.probe = function () {
  var self = this;
  if (!this.connected || this.probeTimer) return;
  var since = Date.now();
  this._raw(MQ.packet(0xC0, []));
  this.probeTimer = setTimeout(function () { self.probeTimer = null; if (self.connected && self.lastRx < since) self._drop(); }, NET_PROBE_MS);
};
// Da chiamare quando la pagina torna visibile o la rete torna disponibile.
MQ.prototype.wake = function () {
  if (this.closed) return;
  if (this.connected) { this.probe(); return; }
  if (!this.ws) { this.backoff = 800; this._open(); }
};
MQ.prototype._parse = function () {
  var b = this.buf;
  while (b.length >= 2) {
    var mult = 1, len = 0, i = 1, d;
    do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
    if (b.length < i + len) break;
    this._handle(b[0], b.subarray(i, i + len));
    b = b.subarray(i + len);
  }
  this.buf = b.slice();
};
MQ.prototype._handle = function (h, body) {
  var type = h >> 4, self = this;
  if (type === 2) { // CONNACK
    if (body[1] !== 0) { this._drop(); return; }
    clearTimeout(this.openTimer);
    this.connected = true; this.everUp = true; this.backoff = 800;
    this.pinger = setInterval(function () {
      if (Date.now() - self.lastRx > NET_DEAD_MS) self.probe();
      else self._raw(MQ.packet(0xC0, []));
    }, NET_PING_MS);
    var topics = Object.keys(this.subs); if (topics.length) this._sub(topics);
    this._res(this);
    this.statusHandlers.forEach(function (f) { f(true); });
  } else if (type === 3) { // PUBLISH
    var qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1], topic = MQ.dec.decode(body.subarray(2, 2 + tl)), p = 2 + tl;
    if (qos > 0) { var id = [body[p], body[p + 1]]; p += 2; if (qos === 1) this._raw(MQ.packet(0x40, id)); }
    var payload = MQ.dec.decode(body.subarray(p)), retained = !!(h & 1);
    this.handlers.forEach(function (f) { f(topic, payload, retained); });
  }
};
MQ.prototype._raw = function (pkt) { if (this.ws && this.ws.readyState === 1) { try { this.ws.send(pkt); return true; } catch (e) {} } return false; };
MQ.prototype._nextId = function () { this.pid = this.pid % 65000 + 1; return [this.pid >> 8, this.pid & 255]; };
MQ.prototype._sub = function (topics) {
  var body = this._nextId();
  topics.forEach(function (t) { body = body.concat(MQ.str(t), [0]); });
  this._raw(MQ.packet(0x82, body));
};
MQ.prototype.subscribe = function (topic) { this.subs[topic] = true; if (this.connected) this._sub([topic]); };
MQ.prototype.unsubscribe = function (topic) {
  if (!this.subs[topic]) return; delete this.subs[topic];
  if (this.connected) this._raw(MQ.packet(0xA2, this._nextId().concat(MQ.str(topic))));
};
// Niente coda: un messaggio inviato mentre si è scollegati va perso (chi invia riprova da sé),
// così una mossa vecchia non può arrivare in ritardo dopo che l'app ha detto che non è passata.
MQ.prototype.publish = function (topic, payload, retain) {
  if (!this.connected) return false;
  var body = MQ.str(topic).concat(Array.from(MQ.enc.encode(payload)));
  return this._raw(MQ.packet(0x30 | (retain ? 1 : 0), body));
};
MQ.prototype.onMessage = function (f) { this.handlers.push(f); };
MQ.prototype.onStatus = function (f) { this.statusHandlers.push(f); };

/* ---------- tavolo condiviso ---------- */
var Net = (function () {
  var qs = NETQ;
  var BROKERS = qs.get('broker') ? qs.get('broker').split(',') : [
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://test.mosquitto.org:8081/mqtt'
  ];
  var HOST_TIMEOUT = +(qs.get('hostTimeout') || 20000);          // dopo quanto mostrare l'avviso
  var AUTO_TAKEOVER = +(qs.get('autoTakeover') || HOST_TIMEOUT * 1.5); // dopo quanto subentrare da soli
  var STAGGER = +(qs.get('stagger') || 6000);                     // attesa extra per ogni giocatore prima di me
  var PREFIX = window.GAME_PREFIX || 'polvere-piombo/v1/';
  var uid = null; try { uid = localStorage.getItem('pp-uid'); } catch (e) {}
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6); try { localStorage.setItem('pp-uid', uid); } catch (e) {} }
  var clients = {}, reducer = null, beforePublish = null, onTakeover = null, lobbyInfo = null;
  var LOBBY_BEAT = +(qs.get('lobbyBeat') || 20000);   // ogni quanto l'host conferma che il tavolo è vivo
  var LOBBY_TTL = +(qs.get('lobbyTtl') || 150000);    // oltre questo silenzio il tavolo sparisce dalla lista
  var FIND_MS = +(qs.get('findMs') || 4500);          // attesa massima della risposta quando si cerca un tavolo
  var PRES_MS = +(qs.get('presMs') || 35000);       // oltre questo silenzio un giocatore risulta offline
  function lobbyTopic(id) { return PREFIX + 'lobby/' + id; }
  /* Stesso tavolo aperto in due schede dello stesso telefono/computer: resta attiva solo l'ultima aperta
     (due schede con la stessa identità applicherebbero le mosse due volte e la partita si sdoppierebbe). */
  var TAB = Math.random().toString(36).slice(2, 10), bc = null;
  try { bc = new BroadcastChannel('pp-tables'); bc.onmessage = function (ev) { var m = ev.data || {}; if (m.k === 'open' && T && m.tab !== TAB && m.key === PREFIX + T.code) displaced(); }; } catch (e) { bc = null; }
  function displaced() {
    close({ quiet: true });
    if (document.getElementById('pp-displaced')) return;
    var o = document.createElement('div'); o.id = 'pp-displaced';
    o.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:rgba(8,8,12,.86);color:#fff;font:16px/1.45 system-ui,sans-serif;text-align:center');
    o.innerHTML = '<div style="max-width:340px;display:grid;gap:14px"><b style="font-size:19px">Tavolo aperto in un’altra scheda</b><span>Hai aperto lo stesso tavolo in un’altra scheda o finestra: si gioca da lì. Qui il tavolo è in pausa.</span>' +
      '<button type="button" style="font:inherit;font-weight:700;padding:12px 18px;border-radius:12px;border:0;background:#f2c14e;color:#111;cursor:pointer">Gioca da questa scheda</button></div>';
    o.querySelector('button').onclick = function () { location.reload(); };

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,

/* ---------- l'host muove i giocatori automatici e chiude le finestre dei Soffio! ---------- */
function hostDo(check, a, who) {
  Net.hostApply(function (cur) {
    if (!cur || !cur.game || cur.phase !== 'play') return false;
    var gg = cur.game; if (!check(gg)) return false;
    var err = E.act(gg, who(gg), a(gg)); if (err) return false;
    if (gg.phase === 'over') cur.phase = 'over';
    return true;
  });
}
function driveBots() {
  var doc = App.doc;
  if (!doc || !Net.isHost || doc.phase !== 'play' || !doc.game) return;
  var g = doc.game;
  if (g.pend) {
    var pk = App.code + ':' + g.pend.id + ':' + g.pend.chain.length;
    if (App.resolveKey !== pk) {
      App.resolveKey = pk; clearTimeout(App.resolveTimer);
      App.resolveTimer = setTimeout(function () {
        hostDo(function (gg) { return gg.pend && gg.pend.id + ':' + gg.pend.chain.length === pk.split(':').slice(1).join(':'); }, function () { return { a: 'resolve' }; }, function () { return 0; });
      }, Math.max(0, g.pend.until - Date.now()) + 120);
      // ogni giocatore automatico decide se soffiare o lasciar passare, con un po' di "riflessi"
      var same = function (gg) { return gg.pend && gg.pend.id + ':' + gg.pend.chain.length === pk.split(':').slice(1).join(':'); };
      g.players.forEach(function (P, i) {
        if (!P.bot || !E.canNope(g, i)) return;
        var a = BOT.decide(g, i);
        setTimeout(function () { hostDo(function (gg) { return same(gg) && gg.players[i].bot && E.canNope(gg, i); }, function () { return a ? { a: 'nope' } : { a: 'pass' }; }, function () { return i; }); }, (a ? 1500 : 1200) + Math.random() * 2200);
      });
    }
    // tutti hanno lasciato passare: si risolve subito, senza aspettare la fine del tempo
    if (E.allPassed(g) && App.allKey !== pk) {
      App.allKey = pk;
      setTimeout(function () { hostDo(function (gg) { return gg.pend && gg.pend.id + ':' + gg.pend.chain.length === pk.split(':').slice(1).join(':') && E.allPassed(gg); }, function () { return { a: 'resolve' }; }, function () { return 0; }); }, g.pend.chain.length ? 1800 : 700);
    }
    return;
  }
  var d = E.decider(g);
  if (d == null || !g.players[d].bot) return;
  var key = App.code + ':' + g.seq;
  if (App.botKey === key) return;
  App.botKey = key; clearTimeout(App.botTimer);
  var wait = g.flash && (g.flash.kind === 'boom' || g.flash.kind === 'defuse') && g.flash.n === g.fx ? 2600 : 1100;
  App.botTimer = setTimeout(function () {
    hostDo(function (gg) { return gg.seq === g.seq && E.decider(gg) === d && gg.players[d].bot; }, function (gg) { return BOT.decide(gg, d) || { a: 'draw' }; }, function () { return d; });
  }, wait + Math.random() * 500);
}

/* ---------- stato in arrivo ---------- */
function onDoc() {
  var g = App.doc.game, me = myIdx();
  if (App.screen !== 'table') { driveBots(); Turns.watch(App.doc); paintCur(); return; }
  if (g && me >= 0) {
    var P = g.players[me];
    App.sel = (App.sel || []).filter(function (c) { return P.hand.indexOf(c) >= 0; });
    if (g.turn !== me || g.pend || g.wait) App.sel = [];
    // fogli automatici quando devo scegliere qualcosa
    var w = g.wait, key = w && w.who === me ? 'w' + g.seq + w.type : g.peek && g.peek.p === me ? 'f' + g.peek.n : g.phase === 'over' ? 'over' : null;
    if (key && key !== App.sheetKey) {
      App.sheetKey = key;
      var kind = key.charAt(0) === 'w' ? w.type : key === 'over' ? 'over' : 'future';
      var delay = kind === 'insert' ? 3000 : kind === 'over' ? 2800 : kind === 'future' ? 700 : 300;
      setTimeout(function () { if (App.screen === 'table' && App.sheetKey === key && (!App.sheet || App.sheet.kind === 'rules')) { App.sheet = { kind: kind }; renderSheet(); } }, delay);
    }
    if (App.sheet && ['favor', 'insert', 'five'].indexOf(App.sheet.kind) >= 0 && !(w && w.who === me && w.type === App.sheet.kind)) App.sheet = null;
    if (App.sheet && (App.sheet.kind === 'target' || App.sheet.kind === 'name') && (g.turn !== me || g.pend || g.wait)) App.sheet = null;
  }
  render(); driveBots(); Turns.watch(App.doc);
}

function statusLine(g, me) {
  var who = function (i) { return i === me ? 'tu' : g.players[i] ? '<b>' + esc(g.players[i].nick) + '</b>' : ''; };
  if (g.phase === 'over') return g.winner === me ? '<b>Hai vinto!</b> Sei l’ultimo rimasto intero.' : 'Vince ' + who(g.winner) + ', l’ultimo rimasto intero.';
  var sel = App.sel || [];
  if (sel.length === 1 && g.turn === me) { var T0 = D.TYPES[E.ty(sel[0])]; return '<b>' + T0.n + '</b>: ' + T0.txt; }
  if (g.pend) {
    var canN = E.canNope(g, me), passed = g.pend.passed.indexOf(me) >= 0;
    return canN && !passed ? '<b>Puoi rispondere:</b> soffia per ' + (g.pend.chain.length % 2 ? 'rimettere in gioco la carta' : 'annullarla') + ', oppure lascia passare.' : 'Si aspetta chi vuole rispondere con un Soffio!…';
  }
  if (g.wait) {
    var w = g.wait;
    if (w.type === 'favor') return w.who === me ? '<b>Fusa!</b> Scegli una carta da regalare a ' + who(w.to) + '.' : who(w.who) + ' sceglie una carta da regalare a ' + who(w.to) + '.';
    if (w.type === 'insert') return w.who === me ? 'Rimetti la Gattomina nel mazzo dove vuoi: gli altri non vedranno dove.' : who(w.who) + ' sta nascondendo la Gattomina nel mazzo…';
    return w.who === me ? 'Scegli una carta dagli scarti.' : who(w.who) + ' fruga tra gli scarti.';
  }
  if (me >= 0 && !g.players[me].alive) return '👻 Sei esploso. Tocca a ' + who(g.turn) + '.';
  if (g.turn === me) return '<b>Tocca a te' + (g.turns > 1 ? ' (ancora ' + g.turns + ' turni)' : '') + '.</b> Gioca le carte che vuoi, poi pesca per finire il turno.';
  return 'Tocca a ' + who(g.turn) + (g.turns > 1 ? ' (' + g.turns + ' turni)' : '') + '.';
}

  root.innerHTML = '<div class="sheet-back" data-act="sheetback"><div class="sheet sh-' + s.kind + '" role="dialog" aria-modal="true">' + h + '</div></div>';

      '<button class="btn block" data-act="insertok">Nascondi qui</button><button class="btn block ghost" data-act="insertrand">Mettila a caso</button>';
  }
  if (s.kind === 'future' && g.peek && g.peek.p === me) return '<h2>La Sfera ti mostra…</h2><p class="lead">Le prime carte del mazzo, dalla prima in cima. Solo tu le vedi.</p><div class="cards future">' + g.peek.cards.map(function (c, i) { return '<div class="fut">' + GMCards.html(c) + '<span>' + (i + 1) + 'ª</span></div>'; }).join('') + '</div><button class="btn block" data-act="close">Ricevuto</button>';
  if (s.kind === 'player') {
    var Q = g.players[s.p];
    return '<h2>' + esc(Q.nick) + '</h2><p class="lead">' + (Q.alive ? Q.hand.length + (Q.hand.length === 1 ? ' carta in mano' : ' carte in mano') : 'È esploso.') + '</p>' +
      (App.doc.host === Net.uid && s.p !== me && Q.alive && g.phase === 'play' ? '<button class="btn ghost block" data-act="auto" data-p="' + s.p + '">' + (Q.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') +
      '<button class="btn block" data-act="close">Chiudi</button>';
  }
  if (s.kind === 'over' && g.phase === 'over') {
    var W = g.players[g.winner];
    return '<div class="over"><img class="crown" src="' + GMCards.src('1f3c6') + '" alt=""><h2>' + (g.winner === me ? 'Hai vinto!' : 'Vince ' + esc(W.nick)) + '</h2><p class="lead">L’ultimo rimasto intero al tavolo. Gli altri sono esplosi in ordine sparso.</p>' +
      Score.endHTML(App.doc) + (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + '<button class="btn block ghost" data-act="close">Guarda il tavolo</button></div>';
  }
  return '';
}

var RULES = '<p>Nel mazzo si nascondono le <b>Gattomine</b>: chi ne pesca una esplode ed esce dalla partita. Vince l’ultimo che resta intero.</p>' +
  '<h3>Il tuo turno</h3><ul><li>Gioca quante carte vuoi (anche nessuna).</li><li>Poi <b>pesca una carta</b>: è così che finisce il turno.</li><li>Se peschi una Gattomina e hai una <b>Scatoletta</b>, la calmi e la rimetti nel mazzo dove vuoi, di nascosto. Senza Scatoletta esplodi.</li></ul>' +
  '<h3>Le carte</h3><ul><li><b>Agguato</b>: finisci senza pescare; il prossimo fa 2 turni (se era già sotto Agguato, i turni si sommano: 4, 6…).</li><li><b>Pisolino</b>: finisci un turno senza pescare.</li><li><b>Fusa</b>: un giocatore ti regala una carta a sua scelta.</li><li><b>Gomitolo</b>: mescola il mazzo.</li><li><b>Sfera</b>: guardi le prime 3 carte del mazzo.</li><li><b>Soffio!</b>: annulla una carta appena giocata da chiunque, anche fuori turno. Dopo ogni carta giocata compare al centro un riquadro che spiega chi la gioca, su chi e cosa succederà: hai 9 secondi (l’host può sceglierne da 6 a 15) per toccare «Soffio!» oppure «Lascia passare». Se tutti lasciano passare si va avanti subito. Si può soffiare anche su un Soffio!. Non ferma Gattomina e Scatoletta.</li></ul>' +
  '<h3>I mici</h3><ul><li>Da soli non fanno nulla.</li><li><b>Due uguali</b>: rubi una carta a caso a un giocatore.</li><li><b>Tre uguali</b>: chiedi una carta precisa; se ce l’ha, te la deve dare.</li><li><b>Cinque carte diverse</b>: prendi la carta che vuoi dagli scarti.</li></ul>' +
  '<h3>All’inizio</h3><p>Ognuno riceve 7 carte e 1 Scatoletta. Nel mazzo ci sono tante Gattomine quanti i giocatori meno uno, più le Scatolette avanzate (solo 2 se siete in 2 o 3).</p>' +
  '<h3>Giocare online</h3><p>Chi apre il tavolo è l’host: il suo telefono tiene la partita e muove i giocatori automatici. Se si disconnette, gli altri possono prendere il comando dopo qualche secondo.</p>' +
  '<h3>Grafica</h3><p>Le illustrazioni sono emoji 3D di Noto Emoji di Google (licenza Apache 2.0), combinate in carte originali.</p>' +
  '<h3>Musica e suoni</h3><p>«Monkeys Spinning Monkeys» e «Sneaky Snitch» di Kevin MacLeod (incompetech.com), licenza CC BY 3.0. Miagolii: Dcrosby (CC BY-SA 3.0) e Heismark (pubblico dominio); fusa di jim_mowatt (pubblico dominio); soffio di Zabuhailo (CC0); esplosione di pubblico dominio, tutti da Wikimedia Commons. Gli altri effetti sono sintetizzati.</p>';

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-pl],.tv-hand .card');
  if (!el) return;
  var a = el.getAttribute('data-act'), g = App.doc && App.doc.game, me = myIdx();
  if (a === 'sheetback') { if (ev.target === el && App.sheet && ['favor', 'insert', 'five'].indexOf(App.sheet.kind) < 0) { App.sheet = null; renderSheet(); } return; }
  if (!a && el.hasAttribute('data-pl')) { App.sheet = { kind: 'player', p: +el.getAttribute('data-pl') }; renderSheet(); return; }
  if (!a && el.classList.contains('card')) {
    if (!g || me < 0) return;
    var c = +el.getAttribute('data-c');
    if (g.pend && E.canNope(g, me) && E.ty(c) === 'soffio') { act({ a: 'nope', card: c }); return; }
    if (g.turn !== me || g.pend || g.wait) { var T0 = D.TYPES[E.ty(c)]; toast(T0.n + ': ' + T0.s + '.'); return; }
    var i = App.sel.indexOf(c); if (i >= 0) App.sel.splice(i, 1); else App.sel.push(c);
    render(); return;
  }
  switch (a) {
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'gallery': App.screen = 'gallery'; render(); window.scrollTo(0, 0); break;
    case 'tolobby': App.screen = 'lobby'; render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + (el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'draw': case 'drawtap': if (g && g.turn === me && !g.pend && !g.wait && g.phase === 'play') act({ a: 'draw' }); break;
    case 'nope': act({ a: 'nope' }); break;
    case 'pass': App.passedKey = g && g.pend ? g.pend.id + ':' + g.pend.chain.length : null; send({ t: 'act', a: { a: 'pass' } }); render(); break;
    case 'peek': App.sheet = { kind: 'future' }; renderSheet(); break;
    case 'decide': if (g && g.wait) { App.sheet = { kind: g.wait.type }; renderSheet(); } break;
    case 'playsel': {
      var sel = App.sel.slice(), kind = E.comboKind(sel);
      if (!kind) { toast('Si giocano una carta azione, due o tre carte uguali, o cinque carte diverse.'); break; }
      if (E.needsTarget(kind)) { if (!E.targets(g, me).length) { toast('Nessun avversario ha carte in mano.'); break; } App.sheet = { kind: 'target' }; renderSheet(); break; }
      act({ a: 'play', cards: sel }); break;
    }
    case 'target': {
      var tp = +el.getAttribute('data-p'), k2 = E.comboKind(App.sel);
      if (k2 === 'trio') { App.sheet = { kind: 'name', target: tp }; renderSheet(); break; }
      App.sheet = null; renderSheet(); act({ a: 'play', cards: App.sel.slice(), target: tp }); break;
    }
    case 'name': { var tgt = App.sheet.target; App.sheet = null; renderSheet(); act({ a: 'play', cards: App.sel.slice(), target: tgt, name: el.getAttribute('data-t') }); break; }
    case 'give': App.sheet = null; renderSheet(); act({ a: 'give', card: +el.getAttribute('data-cid') }); break;
    case 'take': App.sheet = null; renderSheet(); act({ a: 'take', card: +el.getAttribute('data-cid') }); break;
    case 'inspick': App.sheet.pos = +el.getAttribute('data-pos'); renderSheet(); break;
    case 'insertok': { var pos = App.sheet.pos || 0; App.sheet = null; renderSheet(); act({ a: 'insert', pos: pos }); break; }
    case 'insertrand': App.sheet = null; renderSheet(); act({ a: 'insert', pos: 'rand' }); break;
  }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'inspos' && App.sheet && App.sheet.kind === 'insert') {
    var v = +ev.target.value, n = +ev.target.max; App.sheet.pos = v;
    $('#inslbl').textContent = v === 0 ? 'in cima (la pesca il prossimo!)' : v >= n ? 'in fondo al mazzo' : 'come ' + (v + 1) + 'ª carta dall’alto';
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-nope') send({ t: 'opt', nopeMs: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet && ['favor', 'insert', 'five'].indexOf(App.sheet.kind) < 0) { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  GMCards.preload();
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
