<meta name="description" content="Strategia dieselpunk: cinque fazioni si contendono le campagne intorno a una Fabbrica di mech. Da 2 a 5 giocatori, ognuno dal proprio telefono.">
<meta name="theme-color" content="#1c1915">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* ===== Campi d'Acciaio — dieselpunk: grafite calda, ottone, ruggine; titoli da manifesto industriale ===== */
:root {
  --bg: #1b1814; --bg-2: #26211b; --panel: #2a241d; --panel-2: #352d24; --panel-3: #43392d;
  --ink: #f2ead9; --muted: #b8ab92; --dim: #8a7f6c; --brass: #d6a54e; --brass-2: #a87a2a; --rust: #c2513c; --good: #9bcf74; --bad: #ff8a70;
  --line: rgba(214, 165, 78, .28); --line-2: rgba(255, 240, 210, .1);
  --f-disp: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #2e271f, var(--bg) 60%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 26px; font-weight: 800; text-transform: uppercase; }
h3 { font-size: 21px; font-weight: 800; }
h4 { font-size: 17px; font-weight: 700; margin: 14px 0 6px; color: var(--brass); text-transform: uppercase; letter-spacing: .05em; }
p { margin: 0; }
a { color: var(--brass); }
.muted { color: var(--muted); }
.bad { color: var(--bad); }
.ic { width: 1.15em; height: 1.15em; vertical-align: -.2em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }

/* colori delle fazioni */
.fc-brina { color: #9cc6ec; } .fc-ferro { color: #f08a72; } .fc-steppa { color: #f2cf72; } .fc-carbone { color: #cfcfdb; } .fc-campi { color: #f3ead2; }
.fc-b-brina { --fc: #3f7fbf; } .fc-b-ferro { --fc: #b5402f; } .fc-b-steppa { --fc: #d9a530; } .fc-b-carbone { --fc: #77777f; } .fc-b-campi { --fc: #e8e1cf; }
.fc-l-brina { border-left-color: #3f7fbf !important; } .fc-l-ferro { border-left-color: #c84a36 !important; } .fc-l-steppa { border-left-color: #d9a530 !important; } .fc-l-carbone { border-left-color: #8a8a96 !important; } .fc-l-campi { border-left-color: #e8e1cf !important; }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); min-width: 0; }
.panel h2 { font-size: 22px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(214, 165, 78, .12); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(194, 81, 60, .18); border-color: rgba(255, 138, 112, .5); }
.btn { appearance: none; border: 0; border-radius: 10px; min-height: 44px; padding: 10px 16px; font: 700 15.5px/1.15 var(--f-body); color: #241a08; cursor: pointer;
  background: linear-gradient(180deg, #e8bd66, var(--brass) 55%, var(--brass-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 3px 0 #6b4a14, 0 6px 14px rgba(0, 0, 0, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 1px 0 #6b4a14; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 240, 210, .06); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.gold { background: linear-gradient(180deg, #ffe39a, #f2c14e 60%, #c9921c); }
.btn.red { background: linear-gradient(180deg, #e0755e, var(--rust)); color: #fff4ec; box-shadow: 0 3px 0 #6e2416; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opt:focus-visible, .mcol:focus-visible, .pchip:focus-visible, .zb:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.iconbtn { appearance: none; background: none; border: 1px solid var(--line-2); color: var(--ink); border-radius: 9px; min-height: 36px; padding: 5px 9px; font: 600 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 240, 210, .06); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 600 13.5px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip.on { background: rgba(214, 165, 78, .25); border-color: var(--brass); }
.chip .dot { background: var(--rust); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #1d1710; background: #f3ead6; border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; max-width: 170px; }
select.field { color: #1d1710; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 54px; letter-spacing: .14em; color: var(--brass); line-height: 1; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(27, 24, 20, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line); background: rgba(255, 240, 210, .04); }
.seat .ava .portrait { display: block; }
.seat .ava.empty { width: 40px; height: 44px; display: grid; place-items: center; color: var(--dim); }
.seat .nm { font-weight: 700; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.trow { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(255, 240, 210, .03); }
.trow .grow { flex: 1; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: end; grid-template-columns: 1fr; padding: 20px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; position: relative;
  background: linear-gradient(180deg, rgba(27, 24, 20, .1), rgba(27, 24, 20, .85)), radial-gradient(120% 120% at 80% 0%, #6b5434 0%, #3a3024 40%, #1f1b16 75%); }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero h1 { font-size: clamp(44px, 9vw, 76px); font-weight: 800; text-transform: uppercase; line-height: .9; letter-spacing: .01em; color: var(--ink); text-shadow: 0 3px 0 rgba(0, 0, 0, .5); }
.hero .tag { color: #e6dac2; margin-top: 10px; max-width: 54ch; }
.hero .faces { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.hero-art { width: 100%; max-width: 420px; justify-self: center; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .5)); }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto auto; grid-template-areas: 'top' 'players' 'dock' 'map' 'prompt' 'mat'; background: var(--bg); }
.gv-top { grid-area: top; } .gv-players { grid-area: players; } .gv > .chat-dock { grid-area: dock; } .gv-map { grid-area: map; } .gv-prompt { grid-area: prompt; } .gv-mat { grid-area: mat; }
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line-2); background: #17140f; min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 18px; text-transform: uppercase; letter-spacing: .02em; }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.gv-players { display: flex; gap: 6px; overflow-x: auto; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; background: #1d1a15; border-bottom: 1px solid var(--line-2); }
.gv-players::-webkit-scrollbar { display: none; }
.pchip { appearance: none; flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 12px; border: 1px solid var(--line-2); border-left: 3px solid var(--fc); background: rgba(255, 240, 210, .04); color: var(--ink); font: 13px var(--f-body); cursor: pointer; position: relative; text-align: left; }
.pchip .pp .portrait { display: block; }
.pchip .pn b { display: block; font-size: 13.5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip .ps { display: flex; gap: 6px; color: var(--muted); font-size: 12.5px; }
.pchip .ps i { font-style: normal; display: inline-flex; align-items: center; gap: 1px; }
.pchip .ps .st { color: #f2c14e; font-weight: 700; }
.pchip.on { border-color: var(--fc); box-shadow: 0 0 0 1px var(--fc), 0 0 16px color-mix(in srgb, var(--fc) 55%, transparent); background: rgba(255, 240, 210, .09); }
.pchip.dec { border-color: var(--brass); }
.pchip.me .pn b { color: var(--brass); }
.pchip .away { position: absolute; top: -6px; right: -4px; background: var(--rust); color: #fff; font-size: 10px; border-radius: 6px; padding: 0 4px; }
.gv-map { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(100% 80% at 50% 40%, #2c261f, #15120e); }
.gv-board { position: absolute; inset: 0; }
.bd-stage { position: absolute; inset: 0; touch-action: none; cursor: grab; overflow: hidden; }
.bd-stage.drag { cursor: grabbing; }
.bd-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.bd-world canvas, .bd-world svg { position: absolute; left: 0; top: 0; display: block; }
.bd-world canvas { filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .6)); }
.bd-hit { fill: transparent; cursor: pointer; }
.bd-flow { fill: none; stroke: rgba(225, 245, 255, .55); stroke-linecap: round; stroke-dasharray: 3 30; animation: bdflow 2.2s linear infinite; pointer-events: none; }
.bd-flow.b { stroke: rgba(225, 245, 255, .3); stroke-dasharray: 2 41; animation-duration: 3.1s; }
@keyframes bdflow { to { stroke-dashoffset: -33; } }
.bd-hl { pointer-events: none; stroke-width: 4; stroke-dasharray: 11 7; animation: bdmarch 1.2s linear infinite; }
.bd-hl.reach { fill: rgba(255, 214, 120, .16); stroke: #ffd98a; }
.bd-hl.push { fill: rgba(255, 160, 80, .2); stroke: #ffae6a; }
.bd-hl.fight { fill: rgba(230, 80, 60, .22); stroke: #ff7a60; }
.bd-hl.pick { fill: rgba(255, 255, 255, .08); stroke: rgba(255, 245, 225, .75); }
.bd-hl.chosen { fill: rgba(255, 214, 120, .3); stroke: #ffd98a; stroke-dasharray: none; stroke-width: 5; animation: none; }
@keyframes bdmarch { to { stroke-dashoffset: -36; } }
.bd-unit { cursor: pointer; }
.bd-ring { fill: none; stroke: #ffd98a; stroke-width: 3; opacity: 0; transition: opacity .2s; }
.bd-unit.sel .bd-ring { opacity: 1; }
.bd-unit.pick .bd-ring { opacity: 1; stroke: #fff6dc; stroke-dasharray: 6 5; animation: bdmarch 1.4s linear infinite; }
.bd-unit.dim { opacity: .5; }
.bd-arrow { fill: none; stroke: #ffd98a; stroke-width: 5; stroke-dasharray: 10 8; stroke-linecap: round; opacity: .9; }
.bd-float { font: 800 26px var(--f-body); fill: #fff6dc; stroke: #2a1e10; stroke-width: 5px; paint-order: stroke; pointer-events: none; }
.bd-float.spend { fill: #ffc8b8; font-size: 22px; }
.glint { animation: glint 3.2s ease-in-out infinite; }
@keyframes glint { 0%, 70%, 100% { opacity: 0; } 80% { opacity: .95; } }
.bd-bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-2px); } }
.gv-feed { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); right: 60px; top: 8px; display: grid; gap: 3px; pointer-events: auto; cursor: pointer; max-width: 560px; }
.gv-feed .fl { font-size: 12.5px; line-height: 1.3; color: #efe4cc; background: rgba(20, 17, 13, .72); border-left: 3px solid var(--line); padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(4px); opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gv-feed .fl.last { opacity: 1; white-space: normal; animation: flin .4s var(--ease); }
@keyframes flin { from { transform: translateY(-6px); opacity: 0; } }
.gv-zoom { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 8px; display: grid; gap: 6px; }
.zb { appearance: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(30, 26, 21, .85); color: var(--ink); font: 700 20px var(--f-body); cursor: pointer; display: inline-grid; place-items: center; }
.zb.s { width: 30px; height: 30px; font-size: 17px; }
.zb:disabled { opacity: .4; }
.gv-prompt { background: linear-gradient(180deg, #2f281f, #241f19); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.pr { display: grid; gap: 7px; }
.pr p { font-size: 15px; }
.pr.me { }
.pr .pb { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.pr .pb .btn { min-height: 40px; padding: 8px 13px; font-size: 14.5px; }
.hbtn { appearance: none; background: none; border: 1px solid var(--line); color: var(--brass); width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; margin-left: auto; }
.hbtn .ic { width: 22px; height: 22px; }
.mvs { display: flex; gap: 6px; flex-wrap: wrap; }
.mv { font-size: 13px; background: rgba(255, 240, 210, .07); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 9px; display: inline-flex; gap: 3px; align-items: center; }
.carry { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.lg { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; margin-left: 4px; }
.lg i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 2px solid; }
.lg-r { border-color: #ffd98a !important; } .lg-p { border-color: #ffae6a !important; } .lg-f { border-color: #ff7a60 !important; }
.coerce { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.coerce input { width: 20px; height: 20px; accent-color: var(--brass); }
.gv-mat { background: #1f1a15; border-top: 1px solid var(--line-2); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.mstats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mtitle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.mtitle small { color: var(--muted); }
.mtitle .portrait { display: block; }
.chips { display: flex; gap: 7px; flex-wrap: wrap; font-size: 13.5px; }
.chips i { font-style: normal; display: inline-flex; align-items: center; gap: 2px; }
.chips .st { color: #f2c14e; font-weight: 700; }
.mbtns { margin-left: auto; display: flex; gap: 5px; }
.mcols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 5px; margin-top: 6px; }
.mcol { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2); background: #2a231c; cursor: pointer; display: grid; grid-template-rows: 1fr auto; min-width: 0; transition: transform .15s, box-shadow .2s; }
.mcol .mtop, .mcol .mbot { display: grid; grid-template-columns: auto 1fr; column-gap: 4px; align-items: center; padding: 5px 6px; position: relative; min-width: 0; }
.mcol .mtop { background: linear-gradient(180deg, #4a3f31, #3a3127); padding-right: 20px; }
.mcol .mbot { background: linear-gradient(180deg, #2d2721, #231e19); border-top: 1px dashed rgba(255, 240, 210, .12); }
.mcol .mi { grid-row: span 3; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(214, 165, 78, .2); color: var(--brass); }
.mcol .mi .ic { width: 17px; height: 17px; }
.mcol b { font-size: 13px; line-height: 1.1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcol small { font-size: 11.5px; color: var(--muted); line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.mcol small.ok { color: var(--good); } .mcol small.lack { color: #e3a08e; }
.mcol small .have { opacity: .8; }
.mcol .pips { display: flex; gap: 3px; }
.mcol .pip { width: 7px; height: 7px; border-radius: 50%; border: 1px solid #7fae5c; }
.mcol .pip.on { background: #7fae5c; }
.mcol .mst, .mcol .mrec { position: absolute; right: 4px; top: 4px; opacity: .3; color: var(--ink); }
.mcol .mst.on, .mcol .mrec.on { opacity: 1; color: var(--brass); }
.mcol .mrec { top: auto; bottom: 4px; }
.mcol .lastb { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%) rotate(-6deg); font-size: 10.5px; background: rgba(20, 17, 13, .85); border: 1px solid var(--line-2); padding: 1px 6px; border-radius: 6px; color: var(--muted); white-space: nowrap; pointer-events: none; }
.mcol.can { border-color: var(--brass); box-shadow: 0 0 0 1px rgba(214, 165, 78, .5); animation: canpulse 1.8s ease-in-out infinite; }
.mcol.can:hover { transform: translateY(-2px); }
@keyframes canpulse { 50% { box-shadow: 0 0 0 1px rgba(214, 165, 78, .9), 0 0 14px rgba(214, 165, 78, .45); } }
.mcol.no { opacity: .42; }
.mcol.cur { border-color: #ffd98a; box-shadow: 0 0 0 2px #ffd98a; }
.mcol.fac .mtop { background: linear-gradient(180deg, #4a3a46, #3a2e38); }
@media (max-width: 560px) {
  .mcol .mi { display: none; } .mcol .mtop, .mcol .mbot { grid-template-columns: minmax(0, 1fr); padding: 5px 5px 6px; }
  .mcol b { font-size: 12.5px; white-space: normal; } .mcol small { font-size: 11px; } .mcol small .have { display: block; }
  .mcol .mbot { padding-right: 18px; }
  .chips { font-size: 12.5px; gap: 5px; } .mtitle small { display: none; }
  .gv-info b { font-size: 16px; }
}

/* layout largo: mappa a sinistra, pannello a destra */
@media (min-width: 1000px) and (min-height: 600px) {
  .gv { grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: 'top top' 'players players' 'dock dock' 'map prompt' 'map mat'; }

/* ===== Serie di partite e risultati (condivisi da tutti i giochi) =====

   La tiene l'host nello stato del tavolo (doc.series), aggiornata quando una partita finisce.

      [[0, 'Partite singole (conto le vittorie)'], [3, 'Al meglio di 3'], [5, 'Al meglio di 5']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' + standings(doc);

/* ---------- l'host muove i giocatori automatici ---------- */
function hostDo(check, a, who) {
  Net.hostApply(function (cur) {
    if (!cur || !cur.game || cur.phase !== 'play') return false;
    var gg = cur.game; if (!check(gg)) return false;
    var aa = a(gg); if (!aa) return false;
    var err = E.act(gg, who(gg), aa); if (err) { console.warn('bot', err, aa); return false; }

  });
}

  var g = doc.game, d = E.decider(g);
  if (d == null || !g.players[d].bot) return;

  App.botKey = key; clearTimeout(App.botTimer);
  var wait = g.pend && g.pend.k === 'combat' ? 1400 : g.ts && g.ts.stage === 'pick' ? 1500 : 1200;
  App.botTimer = setTimeout(function () {

  }, wait + Math.random() * 600);
}

    else if (g.pend && g.pend.k === 'enc' && g.pend.p === me) { key = 'en' + g.seq; kind = 'enc'; }

  /* ---------- piano locale (anteprima delle mosse) ---------- */
  function startPlan(k, extra) { var g = G(); App.plan = { k: k, seq: g.seq, moves: [], sel: null, carry: 0, hexes: [] }; for (var x in extra || {}) App.plan[x] = extra[x]; }
  function simMoves(g, me) {

    return { sim: sim, moved: moved };
  }
  function view(g, me) {
    var opts = { hl: {}, arrows: [] }, show = g, plan = App.plan;
    if (!plan || me < 0) {
      if (g.pend && g.pend.k === 'combat') opts.hl[g.pend.h] = 'fight';
      return { g: g, opts: opts };
    }
    var P = g.players[me];
    if (plan.k === 'move' || plan.k === 'fmove') {
      var s = simMoves(g, me), max = plan.k === 'fmove' ? 1 : E.moveCount(P);
      show = s.sim;
      opts.arrows = plan.moves.map(function (m) { return [m.from, m.to]; });
      if (plan.sel) {
        opts.sel = plan.sel;
        var tg = E.moveTargets(show, me, plan.sel, plan.k === 'fmove' ? 2 : undefined);
        Object.keys(tg).forEach(function (k) { opts.hl[k] = E.fightersAt(show, me, k).length ? 'fight' : E.enemiesAt(show, me, k).length ? 'push' : 'reach'; });
      } else if (plan.moves.length < max) {
        opts.pickUnits = {}; E.myUnits(show, me).forEach(function (u) { if (s.moved.indexOf(u.id) < 0 && Object.keys(E.moveTargets(show, me, u.id, plan.k === 'fmove' ? 2 : undefined)).length) opts.pickUnits[u.id] = true; });
      }
      plan._moved = s.moved; plan._sim = show;
    } else if (plan.k === 'produce') {
      Object.keys(E.produceHexes(g, me)).forEach(function (k) { opts.hl[k] = plan.hexes.indexOf(k) >= 0 ? 'chosen' : 'pick'; });
    } else if (plan.k === 'deploy' || plan.k === 'build' || plan.k === 'trade' || plan.k === 'fwk') {
      var cand = plan.k === 'deploy' ? E.deployHexes(g, me) : plan.k === 'build' ? E.buildHexes(g, me) : workerHexes(g, me);
      Object.keys(cand).forEach(function (k) { opts.hl[k] = plan.hex === k ? 'chosen' : 'pick'; });
    }
    return { g: show, opts: opts };
  }
  function workerHexes(g, me) { var o = {}; E.myUnits(g, me, 'W').forEach(function (u) { if (E.isTerr(u.h) && E.HEX[u.h].t !== 'L') o[u.h] = true; }); return o; }

  /* ---------- tocchi sulla mappa ---------- */
  function onTap(k, uid) {

      var sim = plan._sim || g, moved = plan._moved || [], max = plan.k === 'fmove' ? 1 : E.moveCount(g.players[me]);
      var u = uid ? E.unit(sim, uid) : null;
      if (u && u.p === me && moved.indexOf(u.id) < 0 && plan.moves.length < max && (!plan.sel || uid !== plan.sel || !k || !E.moveTargets(sim, me, plan.sel)[k])) {
        if (plan.sel === uid) { plan.sel = null; } else { plan.sel = uid; plan.carry = 0; Sound.play('tap'); }
        render(); return;
      }
      if (plan.sel && k) {
        var tg = E.moveTargets(sim, me, plan.sel, plan.k === 'fmove' ? 2 : undefined);

          var left = E.unitsAt(sim, mu.h).filter(function (x) { return x.p === me && x.id !== mu.id && carry.indexOf(x.id) < 0; }).length;
          plan.moves.push({ u: plan.sel, to: k, from: mu.h, carry: carry, res: left === 0 });
          plan.sel = null; Sound.play(mu.k === 'M' ? 'mech' : 'march'); render(); return;
        }

    }
    if (plan && plan.k === 'produce' && k) {
      var ok = E.produceHexes(g, me);

      var i = plan.hexes.indexOf(k);
      if (i >= 0) plan.hexes.splice(i, 1); else if (plan.hexes.length < E.produceCount(g.players[me])) plan.hexes.push(k); else { toast('Puoi scegliere al massimo ' + E.produceCount(g.players[me]) + ' territori: togline uno prima.'); return; }
      render(); return;
    }
    if (plan && (plan.k === 'deploy' || plan.k === 'build' || plan.k === 'trade' || plan.k === 'fwk') && k) {
      var cand = plan.k === 'deploy' ? E.deployHexes(g, me) : plan.k === 'build' ? E.buildHexes(g, me) : workerHexes(g, me);
      if (!cand[k]) { toast(plan.k === 'build' ? 'Si costruisce dove hai un lavoratore, in un territorio senza strutture (non sui laghi).' : 'Scegli un territorio illuminato: ci deve essere un tuo lavoratore.'); return; }

  function mat(g, me) {

    (who ? '<p>' + who + '</p>' : '') + (ul ? '<div class="tags">' + ul + '</div>' : '') + (st ? '<p>' + IC(st.s) + ' ' + D.STRUCTS[st.s].n + ' di ' + fname(g, st.p) + ': ' + D.STRUCTS[st.s].d + '</p>' : '') +
    (r && (r.f + r.m + r.w + r.o) ? '<p>Risorse qui: ' + resIcons(r) + '</p>' : '') + (tags.length ? '<ul class="hx">' + tags.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' : '') + closeBtn();
}

/* ---------- scheda giocatore / fazione ---------- */
function playerBody(g, p, me, intro) {
  var P = g.players[p], f = F[P.fac], m = D.MATS[P.mat], mine = p === me;
  var stars = P.stars.length ? P.stars.map(function (s) { return '<span class="gc">' + IC('star') + D.STARS[s].n + '</span>'; }).join('') : '<span class="muted">Nessuna stella, per ora.</span>';
  var abil = '<div class="abil"><div class="ab on"><b>' + f.ab.n + '</b><small>' + f.ab.d + '</small></div>' + f.mechs.map(function (mm, i) { var on = P.mechs.indexOf(i) >= 0; return '<div class="ab' + (on ? ' on' : '') + '"><b>' + (on ? '✓ ' : '') + mm.n + '</b><small>' + mm.d + '</small>' + (on ? '' : '<em>si sblocca schierando un mech</em>') + '</div>'; }).join('') + '</div>';
  var counts = '<div class="tags"><span class="gc">' + IC('coin') + P.coins + ' monete</span><span class="gc">' + IC('power') + P.power + ' potere</span><span class="gc">' + IC('pop') + P.pop + ' popolarità</span><span class="gc">' + IC('card') + P.hand.length + ' carte</span>' +
    '<span class="gc">' + IC('worker') + E.workersOnBoard(g, p) + '/8 lavoratori</span><span class="gc">' + IC('mech') + P.mechs.length + '/4 mech</span><span class="gc">' + IC('build') + E.structCount(P) + '/4 strutture</span><span class="gc">' + IC('upgrade') + E.upCount(P) + '/6 aggiornamenti</span><span class="gc">' + IC('enlist') + P.recruits.length + '/4 reclute</span>' +
    (P.fcard != null ? '<span class="gc">' + IC('factory') + esc(D.FACTORY[P.fcard].n) + '</span>' : '') + '</div>';
  var intro1 = intro ? '<p class="lead"><b>Questa è la tua fazione.</b> Le regole per tutti sono le stesse: cambiano l’abilità speciale, le abilità dei mech e la plancia. Tocca il ? in basso quando hai un dubbio: ogni azione ha la sua spiegazione.</p>' : '';
  var objs = mine ? '<p>' + IC('objective') + ' Obiettivi segreti: ' + P.obj.map(function (id) { return '<b>' + esc(D.OBJECTIVES[id].n) + '</b> (' + esc(D.OBJECTIVES[id].d) + ')'; }).join(' · ') + '</p>' : '<p class="muted">' + P.obj.length + ' obiettivi segreti' + (P.objDone.length ? ', ' + P.objDone.length + ' completati' : '') + '.</p>';
  return '<div class="phead">' + ART.portrait(P.fac, 92) + '<div><div class="kicker">' + esc(P.nick) + (mine ? ' · tu' : '') + '</div><h2 class="fc-' + P.fac + '">' + f.n + '</h2><p>' + f.heroFull + ' · plancia ' + m.n.toLowerCase() + ' (n. ' + P.mat + ')</p></div></div>' + intro1 +
    '<h4>Stelle (' + P.stars.length + '/6)</h4><div class="tags">' + stars + '</div>' + counts + '<h4>Abilità</h4>' + abil + objs +
    (App.doc.host === Net.uid && !mine && g.phase === 'play' ? '<button class="btn ghost block" data-act="auto" data-p="' + p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') + closeBtn(intro ? 'Iniziamo!' : 'Chiudi');
}

/* ---------- battaglia ---------- */
function combatBody(g, me, s) {
  var c = g.pend; if (!c || c.k !== 'combat') return '';
  var side = c.a === me ? 'a' : c.d === me ? 'd' : null; if (!side) return '';
  if (c.pick[side]) return '<h2>⚔ Battaglia</h2><p class="lead">Hai scelto. Aspetto la scelta di ' + fname(g, side === 'a' ? c.d : c.a) + '…</p>' + closeBtn('Guarda la mappa');
  var op = side === 'a' ? c.d : c.a, P = g.players[me], O = g.players[op];
  var maxD = E.maxDial(g, me), maxC = E.maxCards(g, me, c.h);
  if (s.pw == null) s.pw = Math.min(maxD, Math.max(0, Math.ceil(maxD / 2))); if (!s.sel) s.sel = [];
  var total = s.pw + s.sel.reduce(function (a, i) { return a + P.hand[i]; }, 0);
  var units = function (p) { return E.unitsAt(g, c.h).filter(function (u) { return u.p === p; }).map(function (u) { return u.k === 'C' ? IC('hero') : u.k === 'M' ? IC('mech') : IC('worker'); }).join(''); };
  return '<h2>⚔ Battaglia in ' + tname(c.h).toLowerCase() + '</h2>' +
    '<div class="vs"><div class="side">' + ART.portrait(P.fac, 64) + '<b>Tu</b><span class="fc-' + P.fac + '">' + units(me) + '</span><small>' + (side === 'a' ? 'attacchi: in pareggio vinci tu' : 'difendi') + '</small></div><div class="vsx">contro</div>' +
    '<div class="side">' + ART.portrait(O.fac, 64) + '<b>' + esc(O.nick) + '</b><span class="fc-' + O.fac + '">' + units(op) + '</span><small>ha ' + O.power + ' potere e ' + O.hand.length + ' carte; può usarne fino a ' + E.maxCards(g, op, c.h) + '</small></div></div>' +
    (c.pre.length ? '<div class="pre">' + c.pre.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + '</div>' : '') +
    '<h4>' + IC('power') + ' Quanto potere usi? (hai ' + P.power + ', massimo ' + maxD + ')</h4><div class="dial"><button class="zb" data-act="dial" data-d="-1"' + (s.pw > 0 ? '' : ' disabled') + '>−</button><b class="dv">' + s.pw + '</b><button class="zb" data-act="dial" data-d="1"' + (s.pw < maxD ? '' : ' disabled') + '>+</button><input type="range" id="dialr" min="0" max="' + maxD + '" value="' + s.pw + '" aria-label="Potere"></div>' +
    '<h4>' + IC('card') + ' Carte combattimento (al massimo ' + maxC + ': una per personaggio o mech' + (E.has(g, me, 'militia') ? ', +1 per la Milizia' : '') + ')</h4>' +
    (P.hand.length ? '<div class="hand">' + P.hand.map(function (v, i) { var on = s.sel.indexOf(i) >= 0; return '<button class="hc' + (on ? ' on' : '') + '" data-act="cbcard" data-i="' + i + '"' + (!on && s.sel.length >= maxC ? ' disabled' : '') + '>' + ART.cardFace(v) + '</button>'; }).join('') + '</div>' : '<p class="muted">Non hai carte combattimento.</p>') +
    '<div class="ctot">Totale: <b>' + total + '</b></div><p class="muted">Il potere usato si perde comunque, anche se vinci. Chi perde torna alla base con tutte le pedine di quel territorio.</p>' +
    '<button class="btn block" data-act="cbok">Conferma in segreto</button><button class="btn ghost small" data-act="help" data-r="combat">Come funzionano le battaglie?</button>';
}
function revealBody(g) {
  var c = g.lastCombat; if (!c) return '';
  var side = function (p, pk, t, w) { var P = g.players[p]; return '<div class="side' + (w ? ' win' : ' lose') + '">' + ART.portrait(P.fac, 64) + '<b>' + esc(P.nick) + '</b><div class="rv">' + IC('power') + '<span>' + pk.power + '</span>' + pk.cards.map(function (v) { return ART.cardFace(v); }).join('') + '</div><div class="rt" data-t="' + t + '">0</div>' + (w ? '<em>vince</em>' : '<em>torna alla base</em>') + '</div>'; };
  return '<h2>⚔ Battaglia in ' + tname(c.h).toLowerCase() + '</h2><div class="vs reveal">' + side(c.a, c.pa, c.ta, c.win === c.a) + '<div class="vsx">contro</div>' + side(c.d, c.pd, c.td, c.win === c.d) + '</div>' +
    '<p class="lead">' + fname(g, c.win) + ' vince ' + (c.win === c.a ? '(chi attacca vince anche in pareggio) ' : '') + 'e prende una stella se ne ha ancora a disposizione.' + (c.popLoss ? ' ' + fname(g, c.a) + ' perde ' + c.popLoss + ' popolarità per i lavoratori cacciati.' : '') + '</p>' + closeBtn('Continua');
}
function animateReveal() {
  document.querySelectorAll('.sh-reveal .rt').forEach(function (e) { var t = +e.getAttribute('data-t'), i = 0; var iv = setInterval(function () { e.textContent = ++i > t ? t : i; if (i >= t) clearInterval(iv); }, 70); });
}

/* ---------- incontro ---------- */
function encBody(g, me, s) {
  var e = g.pend; if (!e || e.k !== 'enc' || e.p !== me) return '';
  var card = D.ENCOUNTERS[e.card], P = g.players[me]; s.sel = s.sel || []; s.sub = s.sub || {};
  var art = '<div class="encart"><canvas id="enccv" width="10" height="10"></canvas><div class="encn"><b>' + esc(card.n) + '</b></div></div>';
  setTimeout(paintEncounter, 0);
  var opts = card.o.map(function (o, i) {
    var can = E.canPay(g, me, o.cost), on = s.sel.indexOf(i) >= 0, why = !can ? 'Non puoi pagare' : '';
    if (can && o.gain.mech && P.mechs.length >= 4) why = 'Hai già tutti i mech'; if (can && o.gain.st && (E.structCount(P) >= 4 || E.structAt(g, e.h))) why = E.structAt(g, e.h) ? 'Qui c’è già una struttura' : 'Hai già tutte le strutture';
    if (can && o.gain.up && E.upCount(P) >= 6) why = 'Hai già tutti gli aggiornamenti'; if (can && o.gain.en && P.recruits.length >= 4) why = 'Hai già tutte le reclute';
    return '<button class="opt enco' + (on ? ' on' : '') + '" data-act="encopt" data-i="' + i + '"' + (why ? ' disabled' : '') + '><span class="en-n">' + ['Gentile', 'Generoso', 'Prepotente'][i] + '</span><b>' + esc(o.t) + '</b><span class="cg">' + costChips(o.cost) + ' → ' + gainChips(o.gain) + '</span>' + (why ? '<em>' + why + '</em>' : '') + '</button>';
  }).join('');
  var subs = s.sel.map(function (i, k) { var gain = card.o[i].gain; var h = subPicker(g, me, gain, 'enc' + k, s.sub[k] || (s.sub[k] = {}), e.h); return h ? '<div class="subbox"><b>Per «' + esc(card.o[i].t) + '»</b>' + h + '</div>' : ''; }).join('');
  return '<h2>Incontro</h2>' + art + '<p class="lead"><i>' + esc(card.t) + '</i></p><p class="muted">' + (e.max === 2 ? 'Con la Diplomazia puoi scegliere <b>fino a 2 opzioni</b>.' : 'Scegli una opzione.') + ' Quello che guadagni arriva in ' + tname(e.h).toLowerCase() + '.</p><div class="opts">' + opts + '</div>' + subs +
    '<button class="btn block" data-act="encok"' + (s.sel.length ? '' : ' disabled') + '>Conferma</button>';
}
function paintEncounter() {
  var cv = document.getElementById('enccv'), g = G(); if (!cv || !g || !g.pend || g.pend.k !== 'enc') return;
  var H = E.HEX[g.pend.h], cell = [H.c, H.r, H.t, 0, 0, '', []], tmp = document.createElement('canvas');
  Terrain.paintMap(tmp, [cell], { scale: 2, R: 160 });
  var w = cv.parentNode.clientWidth || 300, h = Math.round(w * 0.42);
  cv.width = w * 2; cv.height = h * 2; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  var ctx = cv.getContext('2d'), sw = tmp.width * 0.62, sh = sw * h / w;
  ctx.drawImage(tmp, (tmp.width - sw) / 2, (tmp.height - sh) / 2, sw, sh, 0, 0, cv.width, cv.height);
}

/* ---------- fine partita ---------- */
function overBody(g, me) {
  var rows = g.final.map(function (x, i) {
    var P = g.players[x.p];
    return '<tr class="' + (i === 0 ? 'win' : '') + '"><td>' + (i + 1) + '</td><td class="pl">' + ART.portrait(P.fac, 28) + '<b>' + esc(P.nick) + '</b></td><td>' + x.coins + '</td><td title="' + x.stars + ' stelle × ' + x.tier.star + '">' + x.starC + '<small>' + x.stars + '×' + x.tier.star + '</small></td>' +
      '<td title="' + x.terr + ' territori × ' + x.tier.terr + '">' + x.terrC + '<small>' + x.terr + '×' + x.tier.terr + '</small></td><td title="' + x.res + ' risorse">' + x.resC + '<small>' + Math.floor(x.res / 2) + '×' + x.tier.res + '</small></td><td>' + x.bonusC + '</td><td class="tot">' + x.total + '</td></tr>';
  }).join('');
  var W = g.players[g.winner], B = D.BONUS[g.bonus];
  return '<div class="over"><div class="crown">' + ART.portrait(W.fac, 100) + '</div><h2>' + (g.winner === me ? 'Hai vinto!' : 'Vince ' + esc(W.nick)) + '</h2><p class="lead">' + F[W.fac].n + ' chiude con ' + g.final[0].total + ' monete.</p>' +
    '<div class="tscroll"><table class="score"><tr><th></th><th>Giocatore</th><th>' + IC('coin') + '</th><th>' + IC('star') + '</th><th>Terr.</th><th>Risorse</th><th>Bonus</th><th>Totale</th></tr>' + rows + '</table></div>' +
    '<p class="muted">Stelle, territori e coppie di risorse valgono di più con più popolarità (0–6, 7–12, 13–18). Bonus delle strutture: «' + esc(B.n) + '» — ' + esc(B.d) + '.</p>' +
    Score.endHTML(App.doc) + (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda la mappa') + '</div>';
}

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && ['combat', 'enc', 'factory'].indexOf(s.kind) < 0) { App.sheet = null; renderSheet(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s }; renderSheet(); break;
    case 'factions': App.sheet = { kind: 'factions' }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) { App.sheet = s.back; } else App.sheet = null; renderSheet(); if (g) Game.render(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; App.introShown = false; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'objectives': App.sheet = { kind: 'objectives' }; renderSheet(); break;
    case 'claim': App.sheet = null; renderSheet(); act({ a: 'objective', id: +el.getAttribute('data-id') }); break;
    case 'togglemat': App.matOpen = !App.matOpen; lsSet('ca-mat', App.matOpen ? '1' : '0'); Game.render(); break;
    case 'zin': Board.zoomAt(1.3); break;
    case 'zout': Board.zoomAt(1 / 1.3); break;
    case 'zfit': Board.fit(); break;
    // scelta della colonna
    case 'col': {
      if (!g || !g.ts || g.ts.p !== me || g.ts.stage !== 'pick' || g.pend) { if (g && g.ts && g.ts.p === me) return; toast('Puoi scegliere la colonna quando è il tuo turno.'); return; }
      var col = +el.getAttribute('data-col');
      if (!E.colAllowed(g, me, col)) { toast(col === g.players[me].last ? 'Hai usato questa colonna nel turno scorso: scegline un’altra.' : 'Colonna non disponibile.'); return; }
      act({ a: 'col', col: col }); break;
    }
    // azioni in alto
    case 'skiptop': act({ a: 'skip' }); break;
    case 'movecoins': act({ a: 'move', coins: true }); break;
    case 'desel': if (App.plan) { App.plan.sel = null; Game.render(); } break;
    case 'carry': if (App.plan) { App.plan.carry = Math.max(0, App.plan.carry + +el.getAttribute('data-d')); var mu = App.plan._sim && E.unit(App.plan._sim, App.plan.sel); if (mu) { var wn = E.myUnits(App.plan._sim, me, 'W').filter(function (w) { return w.h === mu.h && App.plan._moved.indexOf(w.id) < 0; }).length; App.plan.carry = Math.min(App.plan.carry, wn); } Game.render(); } break;
    case 'undomove': if (App.plan) { App.plan.moves.pop(); App.plan.sel = null; Game.render(); } break;
    case 'confirmmove': if (App.plan) act({ a: 'move', moves: App.plan.moves.map(function (m) { return { u: m.u, to: m.to, carry: m.carry, res: m.res }; }) }); break;
    case 'confirmfmove': if (App.plan && App.plan.moves[0]) { var m0 = App.plan.moves[0]; act({ a: 'fmove', move: { u: m0.u, to: m0.to, carry: [], res: m0.res } }); } break;
    case 'confirmproduce': if (App.plan) act({ a: 'produce', hexes: App.plan.hexes.slice() }); break;
    case 'bolster': act({ a: 'bolster', opt: el.getAttribute('data-o') }); break;
    case 'tradePop': act({ a: 'trade', opt: 'pop' }); break;
    case 'tradeRes': App.sheet = { kind: 'trade', r: {} }; renderSheet(); break;
    case 'tradehex': if (s) { s.hex = el.getAttribute('data-k'); renderSheet(); } break;
    case 'rp': { var key = el.getAttribute('data-rp'), r = el.getAttribute('data-r'), d = +el.getAttribute('data-d'); var obj = key === 'trade' ? (s.r = s.r || {}) : key === 'facsub' ? (s.sub.ar = s.sub.ar || {}) : (function () { var k = +key.slice(3); s.sub[k] = s.sub[k] || {}; return (s.sub[k].ar = s.sub[k].ar || {}); })(); obj[r] = Math.max(0, (obj[r] || 0) + d); renderSheet(); break; }
    case 'confirmtrade': { var r2 = {}; for (var x in s.r) if (s.r[x]) r2[x] = s.r[x]; App.sheet = null; renderSheet(); act({ a: 'trade', opt: 'res', r: r2, hex: s.hex }); break; }
    case 'usefactory': { var fc = D.FACTORY[g.players[me].fcard]; if (fc.gain.ar || fc.gain.up) { App.sheet = { kind: 'facsub', sub: {} }; renderSheet(); } else act({ a: 'factory', sub: {} }); break; }
    case 'confirmfacsub': { var sb = s.sub; App.sheet = null; renderSheet(); act({ a: 'factory', sub: sb }); break; }
    // azioni in basso
    case 'endturn': act({ a: 'end' }); break;
    case 'cancelplan': App.plan = null; Game.render(); break;
    case 'bottom': {
      var b = D.BOTTOM[g.ts.col];
      if (b.k === 'upgrade') App.sheet = { kind: 'upgrade', sub: {} };
      else if (b.k === 'enlist') App.sheet = { kind: 'enlist', sub: {} };
      else App.sheet = { kind: b.k };
      renderSheet(); break;
    }
    case 'pickmech': case 'pickstruct': {
      App.sheet = null; renderSheet();
      var k3 = a === 'pickmech' ? 'deploy' : 'build', cand = Object.keys(k3 === 'deploy' ? E.deployHexes(g, me) : E.buildHexes(g, me));
      Game.startPlan(k3, a === 'pickmech' ? { m: +el.getAttribute('data-v') } : { s: el.getAttribute('data-v') });
      if (cand.length === 1) App.plan.hex = cand[0];
      if (!cand.length) { App.plan = null; toast(k3 === 'build' ? 'Non hai territori adatti: serve un tuo lavoratore in un territorio senza strutture (non un lago).' : 'Serve un tuo lavoratore in un territorio (non un lago).'); }
      Game.render(); break;
    }
    case 'confirmplace': { var pl = App.plan; if (!pl) break; act(pl.k === 'deploy' ? { a: 'deploy', m: pl.m, hex: pl.hex, coerce: App.coerce } : { a: 'build', s: pl.s, hex: pl.hex, coerce: App.coerce }); break; }
    case 'sub': {
      var keyS = el.getAttribute('data-key'), f = el.getAttribute('data-f'), v = el.getAttribute('data-v');
      var target = keyS === 'upgrade' || keyS === 'enlist' || keyS === 'facsub' ? s.sub : (s.sub[+keyS.slice(3)] = s.sub[+keyS.slice(3)] || {});
      var parts = f.split('.'); if (parts.length === 2) { target[parts[0]] = target[parts[0]] || {}; target[parts[0]][parts[1]] = parts[1] === 'col' ? +v : v; } else target[f] = f === 'mech' ? +v : v;
      renderSheet(); break;
    }
    case 'confirmupgrade': { var u = s.sub.up; App.sheet = null; renderSheet(); act({ a: 'upgrade', up: u.up, col: u.col, coerce: App.coerce }); break; }
    case 'confirmenlist': { var en = s.sub.en; App.sheet = null; renderSheet(); act({ a: 'enlist', col: en.col, once: en.once, coerce: App.coerce }); break; }
    // battaglia, incontri, Fabbrica
    case 'opencombat': App.sheet = { kind: 'combat' }; renderSheet(); break;
    case 'openenc': App.sheet = { kind: 'enc' }; renderSheet(); break;
    case 'openfactory': App.sheet = { kind: 'factory' }; renderSheet(); break;
    case 'dial': s.pw = Math.max(0, Math.min(E.maxDial(g, me), s.pw + +el.getAttribute('data-d'))); renderSheet(); break;
    case 'cbcard': { var i = +el.getAttribute('data-i'), j = s.sel.indexOf(i); if (j >= 0) s.sel.splice(j, 1); else s.sel.push(i); renderSheet(); break; }
    case 'cbok': { var hand = g.players[me].hand, cards = s.sel.map(function (i) { return hand[i]; }); var pw = s.pw; App.sheet = null; renderSheet(); act({ a: 'combat', power: pw, cards: cards }); break; }
    case 'encopt': { var oi = +el.getAttribute('data-i'), max = g.pend.max, k4 = s.sel.indexOf(oi); if (k4 >= 0) { s.sel.splice(k4, 1); s.sub = {}; } else { if (s.sel.length >= max) s.sel = max === 1 ? [] : s.sel.slice(1); s.sel.push(oi); s.sub = {}; } renderSheet(); break; }
    case 'encok': { var sel = s.sel.slice(), subs = sel.map(function (x, k) { return s.sub[k] || {}; }); App.sheet = null; App.sheetKey = 'en' + g.seq; renderSheet(); act({ a: 'enc', opts: sel, sub: subs }); break; }
    case 'pickfactory': App.sheet = null; renderSheet(); act({ a: 'factory', id: +el.getAttribute('data-id') }); break;
  }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'dialr' && App.sheet && App.sheet.kind === 'combat') { App.sheet.pw = +ev.target.value; var dv = document.querySelector('.dv'); if (dv) dv.textContent = App.sheet.pw; var g = G(), me = myIdx(); var tot = App.sheet.pw + App.sheet.sel.reduce(function (a, i) { return a + g.players[me].hand[i]; }, 0); var ct = document.querySelector('.ctot b'); if (ct) ct.textContent = tot; }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-ban') send({ t: 'opt', ban: ev.target.value === '1' });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
  if (ev.target.id === 'coerce') { App.coerce = ev.target.checked; Game.render(); }
  if (ev.target.id === 'dialr') renderSheet();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('mcol')) e.target.click();
  if (e.key === 'Escape' && App.sheet && ['combat', 'enc', 'factory'].indexOf(App.sheet.kind) < 0) { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  App.matOpen = lsGet('ca-mat') !== '0';
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
