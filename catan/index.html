<style>
/* ===== Catan — tavolo di legno scuro, pergamena, oro del grano e blu del mare ===== */
:root {
  --bg: #1d1610; --bg-2: #241b13; --panel: #2b2118; --panel-2: #36291d; --panel-3: #443424;
  --ink: #f6ead2; --muted: #c9b9a0; --dim: #9a8a72; --gold: #e6b54c; --gold-2: #b07f22; --red: #c0462c; --sea: #2f7ea3; --good: #9bd77f; --bad: #ff917a;
  --paper: #f4e7c8; --paper-ink: #2b2016;
  --line: rgba(230, 181, 76, .32); --line-2: rgba(246, 234, 210, .12);
  --f-disp: "Fraunces", Georgia, serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #3a2a1a, var(--bg) 60%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); text-wrap: balance; margin: 0; }
h2 { font-size: 25px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 20px; font-weight: 700; }
h4 { font: 800 13px var(--f-body); margin: 10px 0 4px; color: var(--gold); text-transform: uppercase; letter-spacing: .1em; }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.bad { color: var(--bad); } .good { color: var(--good); } .gold { color: var(--gold); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 70%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); min-width: 0; }
.panel h2 { font-size: 23px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(230, 181, 76, .12); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(192, 70, 44, .2); border-color: rgba(255, 145, 122, .5); }
.btn { appearance: none; border: 0; border-radius: 10px; min-height: 44px; padding: 10px 16px; font: 800 15.5px/1.15 var(--f-body); color: #2d1d06; cursor: pointer; letter-spacing: .01em;
  background: linear-gradient(180deg, #f6d68a, var(--gold) 55%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 3px 0 #6b4a14, 0 6px 14px rgba(0, 0, 0, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 1px 0 #6b4a14; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(246, 234, 210, .06); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.red { background: linear-gradient(180deg, #db6a50, var(--red)); color: #fff4ec; box-shadow: 0 3px 0 #5e1a10; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .pchip:focus-visible, .zb:focus-visible, .ab:focus-visible, .hd-c:focus-visible, .hd-dev:focus-visible, .bk:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: none; border: 1px solid var(--line-2); color: var(--ink); border-radius: 9px; min-height: 36px; padding: 5px 9px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(246, 234, 210, .06); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 700 13.5px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: rgba(230, 181, 76, .25); border-color: var(--gold); }
.chip .dot { background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #1d1710; background: var(--paper); border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #1d1710; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 54px; letter-spacing: .14em; color: var(--gold); line-height: 1; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(29, 22, 16, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 21px; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line); background: rgba(246, 234, 210, .04); }
.seat .ava .pico { display: block; }
.seat .ava.empty { width: 38px; height: 24px; display: grid; place-items: center; color: var(--dim); }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.trow { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(246, 234, 210, .03); }
.trow .grow { flex: 1; min-width: 0; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.tgl { font-size: 14.5px; color: var(--muted); padding: 6px 2px; } .tgl input { width: 20px; height: 20px; accent-color: var(--gold); }

/* risorse, carte, pezzi */
.ccard { display: block; width: 100%; height: auto; }
.ccard-t { font: 900 11px var(--f-body); letter-spacing: .06em; }
.ccard-k { font: 900 9.5px var(--f-body); letter-spacing: .1em; fill: #fff; }
.ccard-n { font: 800 12px var(--f-disp); fill: #2b2016; }
.ccard-s { font: 700 8.5px var(--f-body); fill: #7a6a52; }
.rdot { display: inline-flex; align-items: center; gap: 2px; vertical-align: middle; height: 24px; padding: 0 4px 0 2px; border-radius: 7px; background: color-mix(in srgb, var(--rc) 30%, #f4e7c8); border: 1.5px solid var(--rd); }
.rdot .rico { width: 19px; height: 19px; }
.rdot b { font-size: 13.5px; color: #2b2016; padding-right: 1px; }
.costrow { display: inline-flex; gap: 3px; flex-wrap: wrap; vertical-align: middle; }
.pico { display: inline-block; vertical-align: middle; overflow: visible; }
.die { display: inline-block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; position: relative;
  background: linear-gradient(180deg, rgba(29, 22, 16, .1), rgba(29, 22, 16, .88)), radial-gradient(120% 120% at 85% 0%, #2f7ea3 0%, #1f5570 35%, #2a2016 80%); }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 30deg at 80% 30%, rgba(255, 255, 255, .03) 0 30deg, transparent 30deg 60deg); pointer-events: none; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero h1 { font-size: clamp(54px, 13vw, 92px); font-weight: 800; line-height: .95; color: var(--paper); text-shadow: 0 3px 0 rgba(0, 0, 0, .45); margin-top: 4px; letter-spacing: .02em; }
.hero .tag { color: #efe3cb; margin-top: 12px; max-width: 54ch; }
.hero-cards { position: relative; height: 200px; max-width: 380px; width: 100%; justify-self: center; }
.hero-cards .hc { position: absolute; width: 92px; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .5)); }
.hc1 { left: 4%; top: 22px; transform: rotate(-14deg); } .hc2 { left: 26%; top: 6px; transform: rotate(-4deg); z-index: 2; } .hc3 { left: 48%; top: 8px; transform: rotate(6deg); z-index: 3; } .hc4 { left: 70%; top: 26px; transform: rotate(15deg); z-index: 4; }
.hero-dice { position: absolute; left: 30%; bottom: 0; z-index: 5; display: flex; gap: 6px; transform: rotate(-6deg); }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: 'top' 'players' 'dock' 'map' 'side'; background: var(--bg); }
.gv-top { grid-area: top; } .gv-players { grid-area: players; } .gv > .chat-dock { grid-area: dock; } .gv-map { grid-area: map; } .gv-side { grid-area: side; }
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line-2); background: #17110c; min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 18px; }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.gv-players { display: flex; gap: 6px; overflow-x: auto; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 7px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; background: #1b140e; border-bottom: 1px solid var(--line-2); }
.gv-players::-webkit-scrollbar { display: none; }
.pchip { appearance: none; flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border-radius: 12px; border: 1px solid var(--line-2); border-left: 4px solid var(--pc); background: rgba(246, 234, 210, .04); color: var(--ink); font: 13px var(--f-body); cursor: pointer; position: relative; text-align: left; }
.pchip .pw .pico { display: block; }
.pchip .pn b { display: block; font-size: 13.5px; max-width: 118px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip .ps { display: flex; gap: 7px; color: var(--muted); font-size: 12.5px; }
.pchip .ps i { font-style: normal; display: inline-flex; align-items: center; gap: 1px; }
.pchip .ps .sc { color: var(--gold); font-weight: 800; }
.pchip .ps .sc small { font-size: 10.5px; color: var(--muted); margin-left: 1px; }
.pchip .ps .low { color: var(--bad); font-weight: 800; }
.pchip .aw { display: flex; gap: 2px; color: var(--gold); }
.pchip .aw i { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(230, 181, 76, .2); border: 1px solid var(--gold); }
.pchip.on { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 16px color-mix(in srgb, var(--pc) 55%, transparent); background: rgba(246, 234, 210, .09); }
.pchip.me .pn b { color: var(--gold); }
.pchip .away { position: absolute; top: -7px; right: -4px; background: var(--red); color: #fff; font-size: 10px; border-radius: 6px; padding: 0 5px; }
.pchip .away.bot { background: #5a4a36; }
.gv-map { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(100% 80% at 50% 40%, #1d4c63, #0d1f2a); }
.gv-board { position: absolute; inset: 0; }
.bd-stage { position: absolute; inset: 0; touch-action: none; cursor: grab; overflow: hidden; }
.bd-stage.drag { cursor: grabbing; }
.bd-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.bd-world canvas, .bd-world svg { position: absolute; left: 0; top: 0; display: block; }
.bd-svg { overflow: visible; }
.tk-n { font: 800 17px var(--f-disp); }
.tk-n.hot { font-size: 19px; }
.bd-token.robbed { opacity: .55; }
.hb-t { font: 900 9.5px var(--f-body); fill: #1d3d52; }
.hb-t.big { font-size: 11.5px; }
.hb-q { font: 800 8px var(--f-body); fill: #6a7d88; }
.bd-rob { transition: transform .7s var(--ease); }
.bd-rob-in { filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .5)); }
.bd-hothex { fill: rgba(255, 238, 160, .22); stroke: #fff3b0; stroke-width: 6; stroke-linejoin: round; opacity: .9; pointer-events: none; filter: drop-shadow(0 0 6px #ffcf40); animation: hotp 1.3s ease-in-out 3; }
.bd-token.hot > circle:nth-child(2) { stroke: #ffcf40; stroke-width: 3.2; }
@keyframes hotp { 50% { opacity: .35; } }
.bd-spot-v { fill: #fff6c8; stroke: #2a1a08; stroke-width: 2.6; animation: spot 1.1s ease-in-out infinite; filter: drop-shadow(0 0 3px rgba(255, 240, 180, .9)); }
.bd-spot-v.city { fill: rgba(255, 246, 200, .25); stroke: #fff6c8; stroke-width: 3.4; }
.bd-spot-v.on { fill: #ffd24a; stroke: #fff; animation: none; }
.bd-spot-e { stroke: #fff6c8; stroke-width: 7; stroke-linecap: round; animation: spot 1.1s ease-in-out infinite; filter: drop-shadow(0 0 2px #2a1a08) drop-shadow(0 0 3px rgba(255, 240, 180, .8)); }
.bd-spot-e.on { stroke: #ffd24a; animation: none; }
.bd-spot-h { fill: rgba(255, 70, 40, .16); stroke: #fff0d8; stroke-width: 3.6; stroke-dasharray: 9 6; animation: spot 1.1s ease-in-out infinite; }
.bd-spot-h.on { fill: rgba(255, 60, 40, .3); stroke: #ffd24a; stroke-dasharray: none; animation: none; }
@keyframes spot { 50% { opacity: .5; } }
.bd-ghost { opacity: .75; pointer-events: none; animation: spot .9s ease-in-out infinite; }
.bd-drop { animation: drop .45s var(--ease) both; }
@keyframes drop { from { transform: translateY(-24px) scale(1.3); opacity: 0; } }
.bd-ring { fill: none; stroke-width: 3; animation: ring 1.2s ease-out forwards; pointer-events: none; }
@keyframes ring { to { r: 34px; opacity: 0; } }
.bd-puff { fill: rgba(40, 40, 46, .5); animation: puff 1.1s ease-out forwards; pointer-events: none; }
@keyframes puff { to { r: 60px; opacity: 0; } }
.bd-float { font: 900 20px var(--f-body); fill: #fff6dc; stroke: #2a1e10; stroke-width: 5px; paint-order: stroke; pointer-events: none; animation: floatup 2s var(--ease) forwards; }
@keyframes floatup { to { transform: translateY(-24px); opacity: 0; } }
.bd-fly { animation: fly 1.9s var(--ease) both; pointer-events: none; }
@keyframes fly { 0% { transform: translate(var(--x0), var(--y0)) scale(.4); opacity: 0; } 20% { opacity: 1; transform: translate(var(--x0), var(--y0)) scale(1.1); } 70% { transform: translate(var(--x1), var(--y1)) scale(1); opacity: 1; } 100% { transform: translate(var(--x1), calc(var(--y1) - 14px)) scale(1); opacity: 0; } }
.bd-x2 { font: 900 10px var(--f-body); fill: #fff; stroke: #000; stroke-width: 2.5px; paint-order: stroke; }
.gv-feed { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); right: 56px; top: 8px; display: grid; gap: 3px; cursor: pointer; max-width: 560px; }
.gv-feed .fl { font-size: 12px; line-height: 1.3; color: #f1ead6; background: rgba(20, 15, 10, .8); border-left: 3px solid var(--line); padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(4px); opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gv-feed .fl:last-child { opacity: 1; white-space: normal; animation: flin .4s var(--ease); }
@keyframes flin { from { transform: translateY(-6px); opacity: 0; } }
.gv-zoom { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 8px; display: grid; gap: 6px; }
.zb { appearance: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(29, 22, 16, .88); color: var(--ink); font: 800 20px var(--f-body); cursor: pointer; display: inline-grid; place-items: center; }
.zb.s { width: 34px; height: 34px; font-size: 18px; }
.zb:disabled { opacity: .35; }
.gv-legend { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: center; pointer-events: none; }
.gv-legend .lg { pointer-events: auto; display: inline-flex; gap: 8px; align-items: center; background: rgba(20, 15, 10, .92); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13.5px; max-width: 100%; }
.gv-legend .x { appearance: none; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 6px; }

/* parte bassa: scambio, istruzioni, pulsanti, mano */
.gv-side { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; background: #20180f; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.gv-trade:empty { display: none; }
.tr { padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #1f4a5e, #173847); border-bottom: 1px solid rgba(140, 200, 230, .35); display: grid; gap: 6px; animation: flin .35s var(--ease); }
.tr.in { background: linear-gradient(180deg, #245a3a, #1a4029); }
.tr-h { display: flex; align-items: center; gap: 6px; font-size: 14.5px; flex-wrap: wrap; }
.tr-h > span { flex: 1; min-width: 200px; line-height: 1.8; }
.tr-ps { display: flex; gap: 6px; flex-wrap: wrap; }
.tr-p { display: flex; gap: 6px; align-items: center; border-left: 4px solid var(--pc); padding: 2px 8px; border-radius: 8px; background: rgba(0, 0, 0, .2); font-size: 13.5px; min-height: 36px; }
.tr-wait { color: var(--muted); font-style: italic; } .tr-no { color: var(--bad); display: inline-flex; gap: 2px; align-items: center; }
.tr-s { font-size: 14px; }
.gv-prompt { display: flex; align-items: center; gap: 8px; padding: 7px max(10px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #3a2c14, #2a200f); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 150px; }
.pr-txt b { color: #ffe3a0; }
.gv-prompt .btn { flex: none; }
.pr-b { display: flex; gap: 6px; align-items: center; margin-left: auto; flex: none; }
.gv-prompt .help { flex: none; color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }
.dz { display: inline-flex; gap: 4px; flex: none; }
.dz.rolling .die { animation: roll .7s var(--ease); }
.dz.rolling .die:last-child { animation-delay: .06s; }
@keyframes roll { 0% { transform: translateY(-30px) rotate(-200deg) scale(.6); opacity: 0; } 60% { transform: translateY(3px) rotate(15deg) scale(1.05); opacity: 1; } 100% { transform: none; } }

    COST: COST, PIECES: PIECES, DEV: DEV, DEVN: DEVN, VPNAMES: VPNAMES, BANK: BANK, PCOL: PCOL,

/* ---------- l'host muove i giocatori automatici ---------- */
function hostDo(who, pick) {
  Net.hostApply(function (cur) {
    if (!cur || !cur.game || cur.phase !== 'play') return false;
    var gg = cur.game, aa = pick(gg); if (!aa) return false;
    var err = E.act(gg, who, aa);
    if (err) {
      console.warn('automatico', err, aa);
      var alt = gg.stage === 'main' && gg.turn === who ? (gg.trade ? { a: 'cancel' } : { a: 'end' }) : gg.stage === 'roll' && gg.turn === who ? { a: 'roll' } : gg.stage === 'road2' && gg.turn === who ? { a: 'endroads' } : null;
      if (!alt || E.act(gg, who, alt)) return false;
    }
    if (gg.phase === 'over') cur.phase = 'over';
    return true;
  });
}
function humansPending(g) { if (!g.trade) return false; return g.players.some(function (P, q) { return q !== g.turn && !P.bot && !g.trade.resp[q]; }); }
function driveBots() {
  var doc = App.doc;
  if (!doc || !Net.isHost || doc.phase !== 'play' || !doc.game) return;
  var g = doc.game;
  // risposte dei giocatori automatici alle proposte di scambio
  if (g.trade) g.players.forEach(function (P, q) {
    if (!P.bot || q === g.turn || g.trade.resp[q]) return;
    var key = 'r' + g.trade.id + ':' + q; if (App.botKeys['r' + q] === key) return; App.botKeys['r' + q] = key;
    setTimeout(function () { hostDo(q, function (gg) { return gg.players[q].bot && gg.trade && gg.trade.id === g.trade.id ? BOT.respond(gg, q) : null; }); }, 900 + Math.random() * 900);
  });
  // scarti col 7: tutti i giocatori automatici che devono scartare
  var list = [];
  if (g.stage === 'discard') g.players.forEach(function (P, q) { if (P.bot && E.mustDiscard(g, q)) list.push(q); });
  else { var d = E.decider(g); if (d != null && g.players[d].bot) list.push(d); }
  list.forEach(function (p, k) {
    var key = App.code + ':' + g.seq + ':' + p;
    if (App.botKeys[p] === key) return;
    App.botKeys[p] = key;
    var wait = g.stage === 'setup' ? 1100 : g.stage === 'discard' ? 900 + k * 400 : g.stage === 'roll' ? 1000 : 1300;
    setTimeout(function () {
      hostDo(p, function (gg) {
        if (gg.phase !== 'play' || !gg.players[p].bot) return null;
        if (gg.stage === 'discard' ? !E.mustDiscard(gg, p) : E.decider(gg) !== p) return null;
        var a = BOT.decide(gg, p, { patience: humansPending(gg) });
        if (!a && gg.trade) {   // aspetta le risposte degli umani, ma non all'infinito
          var tid = gg.trade.id;
          setTimeout(function () { hostDo(p, function (g2) { return g2.trade && g2.trade.id === tid && g2.turn === p && g2.players[p].bot ? BOT.decide(g2, p, {}) : null; }); }, 9000);
        }
        return a;
      });
    }, wait + Math.random() * 500);
  });
}

/* ---------- stato in arrivo ---------- */
function onDoc() {
  var g = G(), me = myIdx();
  if (App.screen !== 'table') { driveBots(); Turns.watch(App.doc); paintCur(); return; }
  if (g) {
    var P = me >= 0 ? g.players[me] : null, key = null, kind = null;
    if (g.phase === 'over') { key = 'over' + App.code + g.winner; kind = 'over'; }
    else if (P && E.mustDiscard(g, me)) { key = 'discard' + g.seq + ':' + g.turnN; kind = 'discard'; }
    else if (P && g.stage === 'steal' && g.turn === me) { key = 'steal' + g.turnN + ':' + g.seq; kind = 'steal'; }
    if (key && key !== App.sheetKey && !(App.sheet && App.sheet.kind === 'intro')) {
      if (kind === 'discard' && App.sheet && App.sheet.kind === 'discard') App.sheetKey = key;
      else { App.sheetKey = key; App.sheet = { kind: kind, sel: {} }; App.pick = null; }
    }
    if (App.sheet && App.sheet.kind === 'discard' && !(P && E.mustDiscard(g, me))) App.sheet = null;
    if (App.sheet && App.sheet.kind === 'steal' && g.stage !== 'steal') App.sheet = null;
    if (App.sheet && App.sheet.kind === 'trade' && (g.turn !== me || g.stage !== 'main')) App.sheet = null;
    if (App.sheet && App.sheet.kind === 'build' && (g.turn !== me || g.stage !== 'main')) App.sheet = null;
    // scelta del posto: si chiude se non è più il momento
    if (App.pick && !pickStillValid(g, me)) App.pick = null;
    if (me >= 0 && !App.introShown) { App.introShown = true; if (!lsGet('ct-intro-done')) App.sheet = { kind: 'intro', page: 0, after: App.sheet }; }
    if (g.phase === 'play' && App.seenFirstDoc && me >= 0) {
      var tk = g.turn + ':' + g.turnN;
      if (g.turn === me && g.stage === 'roll' && App.lastTurnKey !== tk) { Sound.play('turn'); banner('Tocca a te!'); }
      if (g.stage === 'setup' && E.decider(g) === me && App.lastTurnKey !== 'S' + g.setup.i) { Sound.play('turn'); }
      if (g.turn === me && g.stage === 'roll') App.lastTurnKey = tk;
      if (g.stage === 'setup' && E.decider(g) === me) App.lastTurnKey = 'S' + g.setup.i;
    }
    sounds(g, me);
    App.seenFirstDoc = true;
  }
  render(); driveBots(); Turns.watch(App.doc);
}
function pickStillValid(g, me) {
  var k = App.pick && App.pick.k; if (!k || g.phase !== 'play' || me < 0) return false;
  if (g.stage === 'setup') return E.decider(g) === me;
  if (g.turn !== me) return false;
  if (k === 'robber') return g.stage === 'robber';
  if (g.stage === 'road2') return k === 'road';
  return g.stage === 'main';
}
var DEVSND = { knight: 'knight', road2: 'card', plenty: 'card', mono: 'card' };
function sounds(g, me) {
  if (App.lastFxN === g.fxN) return; var first = App.lastFxN == null; App.lastFxN = g.fxN; if (first) return;
  (g.fx || []).forEach(function (e) {
    if (e.k === 'roll') { Sound.play('dice'); App.diceAt = Date.now(); if (e.d[0] + e.d[1] === 7) setTimeout(function () { Sound.play('robber'); banner('7! Arriva il ladro'); }, 650); }
    else if (e.k === 'prod') { if (me >= 0 && e.gains[me]) setTimeout(function () { Sound.play('prod'); }, 600); }
    else if (e.k === 'build') Sound.play(e.what === 'road' ? 'road' : e.what === 'city' ? 'city' : 'settle');
    else if (e.k === 'buy') Sound.play('buy');
    else if (e.k === 'robber') Sound.play('robber');
    else if (e.k === 'steal') { Sound.play('steal'); if (e.from === me) toast(esc(g.players[e.p].nick) + ' ti ha rubato ' + D.RN[e.r] + '.', 'bad'); else if (e.p === me) toast('Hai rubato ' + D.RN[e.r] + ' a ' + esc(g.players[e.from].nick) + '.'); }
    else if (e.k === 'play') { Sound.play(DEVSND[e.c] || 'card'); if (e.p !== me) toast(esc(g.players[e.p].nick) + ' gioca ' + esc(D.DEVN[e.c]) + (e.c === 'mono' ? ': prende tutto il ' + D.RN[e.r] + ' (' + e.n + ')' : '') + '.'); }
    else if (e.k === 'lr') { Sound.play('special'); toast(pname(g, e.p) + ' ha la <b>Strada più lunga</b>: +2 punti.'); }
    else if (e.k === 'la') { Sound.play('special'); toast(pname(g, e.p) + ' ha l’<b>Esercito più grande</b>: +2 punti.'); }
    else if (e.k === 'discard') Sound.play('discard');
    else if (e.k === 'offer') { if (e.p !== me) Sound.play('offer'); }
    else if (e.k === 'resp') { if (g.turn === me && !e.ok) Sound.play('no'); else if (g.turn === me) Sound.play('offer'); }
    else if (e.k === 'trade') Sound.play('deal');
    else if (e.k === 'bank') Sound.play('bank');
    else if (e.k === 'over') Sound.play('win');
  });
}

/* ===== Catan: schermata di gioco =====
   In alto i giocatori, al centro l'isola, sotto lo scambio in corso, i dadi con la riga che dice cosa fare,
   i pulsanti del turno (Lancia, Costruisci, Commercia, Carte, Fine turno) e le tue carte.
   Su schermi larghi l'isola sta a sinistra e il resto in una colonna a destra. */
var Game = (function () {

  function el(id) { return document.getElementById(id); }

  function mount(g) {
    $('#app').innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + ART.DEFS + '</svg><div class="gv" id="gv">' +
      '<header class="gv-top"><button class="iconbtn brandbtn" data-act="menu" aria-label="Menu">☰</button><span class="gv-info" id="gv-info"></span>' + Sound.buttonHTML() + '<span id="gv-chat">' + Chat.badgeHTML() + '</span><button class="iconbtn" data-act="rules" aria-label="Regole">' + IC('help') + '<span class="hide-s"> Regole</span></button></header>' +
      '<div class="gv-players" id="gv-players"></div>' + Chat.dockHTML() +
      '<div class="gv-map"><div id="gv-board" class="gv-board"></div><div class="gv-feed" id="gv-feed" data-act="log"></div>' +
      '<div class="gv-zoom"><button class="zb" data-act="zin" aria-label="Avvicina">+</button><button class="zb" data-act="zout" aria-label="Allontana">−</button><button class="zb" data-act="zfit" aria-label="Mostra tutta l’isola">⤢</button></div><div class="gv-legend" id="gv-legend"></div></div>' +
      '<div class="gv-side"><div class="gv-trade" id="gv-trade"></div><div class="gv-prompt" id="gv-prompt" aria-live="polite"></div><div class="gv-acts" id="gv-acts"></div><div class="gv-hand" id="gv-hand"></div></div></div>';
    Board.mount(el('gv-board'), g, { onHex: onHex, onEmpty: function () { if (App.pickSel != null) { App.pickSel = null; render(); } } });
    mountedFor = App.code + ':' + JSON.stringify(g.hex).length + g.hex.map(function (h) { return h.n; }).join(',');
    setTimeout(function () { Board.fit(); }, 80);
  }
  function unmount() { if (mountedFor) { Board.unmount(); mountedFor = null; } }
  function render() {
    var g = G(), me = myIdx();
    var sig = App.code + ':' + JSON.stringify(g.hex).length + g.hex.map(function (h) { return h.n; }).join(',');
    if (mountedFor !== sig || !el('gv') || !Board.mounted(g)) mount(g);
    var pk = curPick(g, me);
    if (pk && App.pickSel != null && pk.list.indexOf(App.pickSel) < 0) App.pickSel = null;
    if (!pk) App.pickSel = null;
    if (pk) pk.sel = App.pickSel;
    Board.update(g, { pick: pk, onPick: onPick, hot: hotHexes(g), follow: !(me >= 0 && g.turn === me) });
    setHTML('gv-info', info(g));
    setHTML('gv-players', players(g, me));
    setHTML('gv-trade', tradeBar(g, me));
    setHTML('gv-prompt', prompt(g, me, pk));
    setHTML('gv-acts', actions(g, me));
    setHTML('gv-hand', me >= 0 ? hand(g, me) : '<div class="hd-row"><span class="muted">Stai guardando la partita.</span></div>');
    setHTML('gv-feed', feed(g));
    setHTML('gv-legend', legend(g, me, pk));
    var chat = el('gv-chat'); if (chat) { var ch = Chat.badgeHTML(); if (chat._h !== ch) { chat.innerHTML = ch; chat._h = ch; } }
    var dz = document.querySelector('.dz'); if (dz && Date.now() - (App.diceAt || 0) < 700) { dz.classList.add('rolling'); setTimeout(function () { dz.classList.remove('rolling'); }, 720); }
  }
  function info(g) {
    var t = g.phase === 'over' ? 'Partita finita' : g.stage === 'setup' ? 'Fondazione' : 'Giro ' + g.round;
    return '<b>Catan</b> <span class="muted">· ' + connInfo(t + ' · ' + g.opts.vp + ' punti · tavolo ' + esc(App.code)) + '</span><span id="tt" class="tt"></span>';
  }

  /* ---------- posti da scegliere sull'isola ---------- */
  function curPick(g, me) {
    if (me < 0 || g.phase !== 'play') return null;
    var col = g.players[me].col;
    if (g.stage === 'setup') { if (E.decider(g) !== me) return null; return g.setup.step === 'settle' ? { k: 'settle', list: E.legalSettles(g, me, true), col: col } : { k: 'road', list: E.legalRoads(g, me, g.setup.last), col: col }; }
    if (g.turn !== me) return null;
    if (g.stage === 'robber') return { k: 'robber', list: E.robberTargets(g, me), col: col };
    if (g.stage === 'road2') return { k: 'road', list: E.legalRoads(g, me), col: col };
    if (g.stage === 'main' && App.pick && !g.trade) {
      var k = App.pick.k;
      return { k: k, list: k === 'road' ? E.legalRoads(g, me) : k === 'settle' ? E.legalSettles(g, me, false) : E.legalCities(g, me), col: col };
    }
    return null;
  }
  function onPick(id) {
    var g = G(), me = myIdx(), pk = curPick(g, me); if (!pk) return;
    if (App.pickSel === id) { confirmPick(); return; }
    App.pickSel = id; render();
  }
  function confirmPick() {
    var g = G(), me = myIdx(), pk = curPick(g, me), id = App.pickSel; if (!pk || id == null) return;
    App.pickSel = null;
    if (g.stage === 'setup') act(pk.k === 'settle' ? { a: 'settle', v: id } : { a: 'road', e: id });
    else if (pk.k === 'robber') act({ a: 'robber', h: id });
    else { act(pk.k === 'road' ? { a: 'build', k: 'road', e: id } : { a: 'build', k: pk.k, v: id }); if (g.stage === 'main') App.pick = null; }
  }
  function hotHexes(g) {
    if (!g.dice || g.stage === 'setup' || g.phase !== 'play') return [];

    if (n !== 7) g.hex.forEach(function (h, i) { if (h.n === n && i !== g.robber) out.push(i); });
    return out;
  }
  function onHex(hi) { App.pickSel = null; App.sheet = { kind: 'hex', h: hi }; render(); renderSheet(); }
  function legend(g, me, pk) {
    if (pk && g.stage === 'main' && App.pick) {
      var nm = { road: 'strada', settle: 'colonia', city: 'città' }[pk.k];
      return '<div class="lg">' + (pk.list.length ? 'Tocca un posto che lampeggia per la ' + nm : 'Nessun posto valido per la ' + nm) + '<button class="x" data-act="unpick" aria-label="Annulla">×</button></div>';
    }
    return '';
  }

  /* ---------- giocatori ---------- */
  function players(g, me) {
    var dec = E.decider(g);
    return g.players.map(function (P, p) {
      var on = g.phase === 'play' && (dec === p || (g.stage === 'discard' && E.mustDiscard(g, p))), vpv = E.visibleVP(g, p), hid = p === me ? E.vpCards(P) : 0;
      var cards = E.total(P.res), devs = P.devs.length;
      return '<button class="pchip' + (on ? ' on' : '') + (p === me ? ' me' : '') + '" style="--pc:' + D.PCOL[P.col].c + '" data-act="player" data-p="' + p + '" aria-label="' + esc(P.nick) + ', ' + vpv + ' punti visibili, ' + cards + ' carte">' +
        '<span class="pw">' + ART.pieceIcon(P.col, 24) + '</span><span class="pn"><b>' + Net.dot(P.uid) + esc(P.nick) + (p === me ? ' (tu)' : '') + '</b><span class="ps">' +
        '<i class="sc" title="Punti">' + IC('star') + vpv + (hid ? '<small>+' + hid + '</small>' : '') + '</i><i class="' + (cards > 7 ? 'low' : '') + '" title="Carte risorsa">' + IC('cards') + cards + '</i><i title="Carte sviluppo">' + IC('dev') + devs + '</i>' +
        (P.knights ? '<i title="Cavalieri giocati">' + IC('knight') + P.knights + '</i>' : '') + '</span></span>' +
        (g.lr === p || g.la === p ? '<span class="aw">' + (g.lr === p ? '<i title="Strada più lunga">' + IC('road') + '</i>' : '') + (g.la === p ? '<i title="Esercito più grande">' + IC('knight') + '</i>' : '') + '</span>' : '') +
        (P.away ? '<span class="away">assente</span>' : P.bot && g.phase === 'play' ? '<span class="away bot">auto</span>' : '') + '</button>';
    }).join('');
  }

  /* ---------- scambio in corso ---------- */
  function tradeBar(g, me) {
    var T = g.trade; if (!T || g.phase !== 'play') return '';
    var off = g.turn, give = ART.resRow(T.give), get = ART.resRow(T.get);
    if (me === off) {
      var rows = g.players.map(function (P, q) {
        if (q === off) return '';
        var r = T.resp[q], st = r === 'yes' ? '<button class="btn small" data-act="deal" data-p="' + q + '">Scambia con ' + esc(P.nick) + '</button>' : r === 'no' ? '<span class="tr-no">' + IC('x') + ' no</span>' : '<span class="tr-wait">sta decidendo…</span>';
        return '<div class="tr-p" style="--pc:' + D.PCOL[P.col].c + '"><b>' + esc(P.nick) + '</b>' + st + '</div>';
      }).join('');
      var allNo = g.players.every(function (P, q) { return q === off || T.resp[q] === 'no'; });
      if (allNo) rows += '<p class="tr-s muted">Nessuno accetta: ritira la proposta e prova a offrire di più, oppure commercia con la banca.</p>';
      return '<div class="tr"><div class="tr-h">' + IC('trade') + ' <span>La tua proposta: dai ' + give + ' chiedi ' + get + '</span><button class="btn ghost small" data-act="cancel">Ritira</button></div><div class="tr-ps">' + rows + '</div></div>';
    }
    var head = '<div class="tr-h">' + IC('trade') + ' <span>' + pname(g, off) + ' ' + (me >= 0 ? 'ti dà' : 'dà') + ' ' + give + ' e chiede ' + get + '</span></div>';
    if (me < 0) return '<div class="tr">' + head + '</div>';
    var r2 = T.resp[me], can = E.has(g.players[me].res, T.get);
    var body = r2 === 'yes' ? '<p class="tr-s good">Hai accettato: ora ' + pname(g, off) + ' sceglie con chi scambiare.</p>' : r2 === 'no' ? '<p class="tr-s muted">Hai rifiutato.</p>'
      : '<div class="row"><button class="btn small" data-act="respond" data-ok="1"' + (can ? '' : ' disabled') + '>' + IC('check') + ' Accetto</button><button class="btn ghost small" data-act="respond" data-ok="0">Rifiuto</button>' + (can ? '' : '<span class="muted small">Non hai le carte richieste.</span>') + '</div>';
    return '<div class="tr in">' + head + body + '</div>';
  }

  /* ---------- cosa fare adesso ---------- */
  function diceHTML(g) { return g.dice ? '<span class="dz">' + ART.die(g.dice[0], false, 34) + ART.die(g.dice[1], true, 34) + '</span>' : ''; }
  function prompt(g, me, pk) {
    var P = me >= 0 ? g.players[me] : null, h = '', help = 'turn', btn = '', mine = me >= 0 && g.turn === me;
    if (g.phase === 'over') { h = '<b>Partita finita.</b> Vince ' + pname(g, g.winner) + ' con ' + E.vp(g, g.winner) + ' punti.'; btn = '<button class="btn small" data-act="showover">Classifica</button>'; help = 'end'; }
    else if (pk && App.pickSel != null) {
      var what = pk.k === 'robber' ? 'Spostare qui il ladro?' : g.stage === 'setup' ? (pk.k === 'settle' ? 'Mettere qui la colonia?' : 'Mettere qui la strada?') : pk.k === 'road' ? (g.stage === 'road2' ? 'Strada gratis qui?' : 'Costruire qui la strada?') : pk.k === 'settle' ? 'Costruire qui la colonia?' : 'Trasformare questa colonia in città?';
      h = '<b>' + what + '</b>' + (pk.k === 'settle' && g.stage === 'setup' ? ' <span class="muted">' + spotInfo(g, App.pickSel) + '</span>' : '') + (pk.k === 'robber' ? ' <span class="muted">' + robInfo(g, me, App.pickSel) + '</span>' : '');
      btn = '<button class="btn small" data-act="pickok">' + IC('check') + ' Conferma</button><button class="btn ghost small" data-act="pickno">' + (g.stage === 'main' ? 'Annulla' : 'Cambia') + '</button>';
      help = pk.k === 'robber' ? 'seven' : g.stage === 'setup' ? 'setup' : 'build';
    }
    else if (g.stage === 'setup') {
      var d = E.decider(g), second = g.setup.i >= g.players.length;
      if (d === me) { h = g.setup.step === 'settle' ? '<b>Fondazione:</b> tocca un incrocio che lampeggia per la tua ' + (second ? '<b>seconda</b> colonia (ti dà subito le risorse delle tessere vicine)' : '<b>prima</b> colonia') + '.' : '<b>Ora la strada:</b> tocca un lato che lampeggia, attaccato alla colonia appena messa.'; help = 'setup'; }
      else { h = 'Fondazione: ' + pname(g, d) + ' sta piazzando ' + (g.setup.step === 'settle' ? 'una colonia' : 'una strada') + '…'; help = 'setup'; }
    }
    else if (g.stage === 'discard') {
      var need = me >= 0 ? E.mustDiscard(g, me) : 0, who = g.players.map(function (Q, q) { return E.mustDiscard(g, q) ? pname(g, q) : null; }).filter(Boolean);
      h = need ? '<b>È uscito il 7:</b> hai più di 7 carte, scartane <b>' + need + '</b>.' : 'È uscito il 7: aspetto che ' + who.join(', ') + ' scartino metà delle carte…';
      if (need) btn = '<button class="btn small" data-act="opendiscard">Scegli</button>'; help = 'seven';
    }
    else if (mine) {
      if (g.stage === 'roll') { h = '<b>Tocca a te!</b> Lancia i dadi' + (P.devs.some(function (x) { return x.k !== 'vp' && x.t < g.turnN; }) && !g.devUsed ? ' (prima puoi giocare una carta sviluppo)' : '') + '.'; }
      else if (g.stage === 'robber') { h = '<b>Sposta il ladro:</b> tocca la tessera dove metterlo (lampeggiano quelle possibili).'; help = 'seven'; }
      else if (g.stage === 'steal') { h = '<b>Scegli a chi rubare</b> una carta.'; btn = '<button class="btn small" data-act="opensteal">Scegli</button>'; help = 'seven'; }
      else if (g.stage === 'road2') { h = '<b>Strade gratis:</b> tocca un lato che lampeggia (' + g.free + ' rimast' + (g.free === 1 ? 'a' : 'e') + ').'; btn = '<button class="btn ghost small" data-act="endroads">Basta così</button>'; help = 'dev'; }
      else if (g.trade) { h = 'Aspetta le risposte alla tua proposta, poi scegli con chi scambiare.'; help = 'trade'; }
      else { h = '<b>Il tuo turno:</b> costruisci, commercia o gioca una carta. Quando hai finito, <b>Fine turno</b>.'; help = 'build'; }
    } else {
      var T = g.players[g.turn], doing = { roll: 'sta per lanciare i dadi', robber: 'sta spostando il ladro', steal: 'sceglie a chi rubare', road2: 'costruisce strade gratis', main: g.trade ? 'propone uno scambio' : 'sta giocando il turno' }[g.stage] || 'sta decidendo';
      h = 'Tocca a ' + pname(g, g.turn) + (T.bot ? ' <span class="muted">(automatico)</span>' : '') + ': ' + doing + '…';
      if (P && P.bot) btn = '<button class="btn small" data-act="resume">Riprendo io</button>';

    return diceHTML(g) + '<div class="pr-txt">' + h + '</div><span class="pr-b">' + btn + '<button class="iconbtn help" data-act="help" data-r="' + help + '" aria-label="Spiegazione">' + IC('help') + '</button></span>';
  }
  function spotInfo(g, v) { var nums = CTData.verts[v].hexes.map(function (hi) { return g.hex[hi].n ? g.hex[hi].n + ' ' + D.RN[D.TERR[g.hex[hi].t].r] : null; }).filter(Boolean); return nums.join(' · '); }
  function robInfo(g, me, h) { var vs = E.victimsAt(g, me, h).filter(function (o) { return !(g.opts.gentle && E.visibleVP(g, o) <= 2); }); return vs.length ? 'potrai rubare a ' + vs.map(function (q) { return esc(g.players[q].nick); }).join(' o ') : 'qui non c’è nessuno da derubare'; }

  /* ---------- pulsanti del turno ---------- */
  function actions(g, me) {
    if (me < 0 || g.phase !== 'play') return '';
    var mine = g.turn === me, P = g.players[me], playable = P.devs.filter(function (d) { return d.k !== 'vp' && d.t < g.turnN; }).length;
    var b = function (act, ic, label, on, primary, extra) { return '<button class="ab' + (primary ? ' pri' : '') + (on ? '' : ' off') + '" data-act="' + act + '"' + (on ? '' : ' aria-disabled="true"') + '>' + ic + '<span>' + label + '</span>' + (extra || '') + '</button>'; };
    if (mine && g.stage === 'roll') return b('roll', IC('dice'), 'Lancia i dadi', true, true) + b('devs', IC('dev'), 'Carte', true, false, playable && !g.devUsed ? '<i class="ab-n">' + playable + '</i>' : '');
    var main = mine && g.stage === 'main' && !g.trade;

  /* ---------- le tue carte ---------- */

      return '<button class="hd-c' + (n ? '' : ' zero') + '" data-act="res" data-r="' + r + '" aria-label="' + n + ' ' + D.RN[r] + '">' + ART.resCard(r) + '<span class="n">' + n + '</span>' + (rt[r] < 4 ? '<span class="rt">' + rt[r] + ':1</span>' : '') + '</button>';
    }).join('');

      '<div class="hd-sub"><span class="' + (tot > 7 ? 'bad' : 'muted') + '">' + tot + ' carte' + (tot > 7 ? ' — attento al 7!' : '') + '</span>' + pcs + '<span class="sc">' + IC('star') + ' ' + E.vp(g, me) + '/' + g.opts.vp + '</span></div>';

  function feed(g) { return g.log.slice(-2).map(function (l) { var c = l.p != null && g.players[l.p] ? D.PCOL[g.players[l.p].col].c : 'rgba(217,180,90,.5)'; return '<div class="fl" style="border-left-color:' + c + '">' + esc(l.t) + '</div>'; }).join(''); }

/* ===== Catan: finestre (costruire, commerciare, carte sviluppo, scarto, furto, tessere, giocatori, classifica) ed eventi ===== */
function renderSheet() {
  var root = $('#sheet'), s = App.sheet;
  if (!s) { root.innerHTML = ''; return; }
  var h = sheetBody(s); if (!h) { App.sheet = null; root.innerHTML = ''; return; }
  if (root._s !== s) { root._s = s; App.sheetAt = Date.now(); }
  var y = root.querySelector('.sheet') && root._s === s ? root.querySelector('.sheet').scrollTop : 0;
  root.innerHTML = '<div class="sheet-back' + (s.kind === 'hex' ? ' light' : '') + '" data-act="sheetback"><div class="sheet sh-' + s.kind + '" role="dialog" aria-modal="true">' + h + '</div></div>';
  if (y) root.querySelector('.sheet').scrollTop = y;
  if (s.kind === 'rules' && s.focus) { var t = document.getElementById('r-' + s.focus); if (t) t.scrollIntoView({ block: 'start' }); }
}
function closeBtn(t) { return '<button class="btn block ghost" data-act="close">' + (t || 'Chiudi') + '</button>'; }
function step(act, r, n, canDown, canUp, extra) {
  return '<div class="stp"><span class="stp-r">' + ART.resDot(r) + '<span>' + D.RN1[r] + (extra || '') + '</span></span><button class="zb s" data-act="' + act + '" data-r="' + r + '" data-d="-1"' + (canDown ? '' : ' disabled') + ' aria-label="Meno ' + D.RN[r] + '">−</button><b>' + n + '</b><button class="zb s" data-act="' + act + '" data-r="' + r + '" data-d="1"' + (canUp ? '' : ' disabled') + ' aria-label="Più ' + D.RN[r] + '">+</button></div>';
}
function sum(o) { var n = 0; for (var k in o) n += o[k] || 0; return n; }
var TILEIMG = {};
function tileImg(t) { if (!TILEIMG[t]) { var c = document.createElement('canvas'); CTPainter.tile(c, t, 160); TILEIMG[t] = c.toDataURL(); } return '<img class="tile-img" src="' + TILEIMG[t] + '" alt="">'; }

function sheetBody(s) {
  var g = G(), me = myIdx(), P = g && me >= 0 ? g.players[me] : null;
  if (s.kind === 'rules') return '<h2>Come si gioca</h2>' + RU.toc() + RU.html() + closeBtn('Ho capito');
  if (s.kind === 'help') return RU.section(s.r) + '<button class="btn ghost small" data-act="rules">Tutte le regole</button>' + closeBtn('Ho capito');
  if (s.kind === 'menu' && App.doc) {
    var d = App.doc;
    return '<h2>Tavolo ' + esc(d.code) + '</h2><div style="display:grid;gap:8px">' +
      '<button class="btn ghost block" data-act="invite">Invita amici al tavolo</button><button class="btn ghost block" data-act="rules">Regole</button><button class="btn ghost block" data-act="costs">Costi delle costruzioni</button><button class="btn ghost block" data-act="intro">Rivedi la presentazione</button><button class="btn ghost block" data-act="log">Tutte le mosse della partita</button>' +
      (d.host !== Net.uid ? '<button class="btn ghost block" data-act="takehost">Prendi il comando del tavolo (se l’host se n’è andato)</button>' : '') +
      (d.host === Net.uid && d.phase !== 'lobby' ? '<button class="btn ghost block" data-act="rematch">Chiudi la partita e torna alla sala d’attesa</button>' : '') +
      (d.host === Net.uid ? '<button class="btn ghost block" data-act="closetable">Chiudi il tavolo per tutti</button>' : '') +
      '<button class="btn ghost block" data-act="tohome">Vai alla home del gioco (resti seduto)</button><button class="btn ghost block" data-act="leave">Esci dal tavolo</button></div>' + closeBtn();
  }
  if (s.kind === 'closeconfirm' && App.doc) return '<h2>Chiudere il tavolo ' + esc(App.doc.code) + '?</h2><p class="lead">Il tavolo sparisce dalla lista' + (App.doc.game && App.doc.phase === 'play' ? ', la partita in corso finisce' : '') + ' e tutti tornano alla schermata iniziale. Non si può annullare.</p>' +
    '<button class="btn block red" data-act="closeyes">Chiudi per tutti</button>' + closeBtn('Annulla');
  if (s.kind === 'intro') return introBody(s);
  if (s.kind === 'costs') return '<h2>' + IC('build') + ' Costi</h2>' + RU.S.build[1] + closeBtn();
  if (!g) return '';
  if (s.kind === 'log') return '<h2>Le mosse della partita</h2><div class="loglist">' + g.log.slice().reverse().map(function (l) { var c = l.p != null && g.players[l.p] ? D.PCOL[g.players[l.p].col].c : 'rgba(217,180,90,.5)'; return '<div class="fl" style="border-left-color:' + c + '">' + esc(l.t) + '</div>'; }).join('') + '</div>' + closeBtn();
  if (s.kind === 'hex') return hexBody(g, me, s.h);
  if (s.kind === 'player') return playerBody(g, s.p, me);
  if (s.kind === 'over' && g.phase === 'over') return overBody(g, me);
  if (!P) return '';
  if (s.kind === 'build') return buildBody(g, me);
  if (s.kind === 'trade') return tradeBody(g, me, s);
  if (s.kind === 'devs') return devsBody(g, me, s);
  if (s.kind === 'discard') return discardBody(g, me, s);
  if (s.kind === 'steal') return stealBody(g, me);
  return '';
}

/* ---------- costruire ---------- */
function buildBody(g, me) {
  var P = g.players[me], main = g.turn === me && g.stage === 'main' && !g.trade;
  function costHave(c) { return D.RES.filter(function (r) { return c[r]; }).map(function (r) { var ok = P.res[r] >= c[r]; return '<span class="ch' + (ok ? ' ok' : '') + '">' + ART.resDot(r, c[r]) + '</span>'; }).join(''); }
  function row(k, icon, name, gives, left, legal, btnAct, btnTxt) {
    var c = D.COST[k], has = E.has(P.res, c), why = !main ? 'Si costruisce nel tuo turno, dopo il lancio.' : !has ? 'Ti mancano delle risorse.' : left <= 0 ? 'Hai finito questi pezzi.' : legal === 0 ? 'Non c’è un posto valido.' : '';
    return '<div class="bl' + (why ? ' no' : '') + '"><div class="bl-i">' + icon + '</div><div class="bl-t"><b>' + name + '</b><small>' + gives + (left != null ? ' · ne hai ancora ' + left : '') + '</small><div class="bl-c">' + costHave(c) + '</div>' + (why && main ? '<small class="bad">' + why + '</small>' : '') + '</div>' +
      '<button class="btn small" data-act="' + btnAct + '" data-k="' + k + '"' + (why ? ' disabled' : '') + '>' + btnTxt + '</button></div>';
  }
  return '<h2>' + IC('build') + ' Costruisci</h2><p class="lead">Scegli cosa costruire: poi tocca sull’isola il posto che lampeggia e conferma. Le risorse che hai sono in verde.</p><div class="bls">' +
    row('road', ART.piece('road', P.col, 34), 'Strada', 'allunga la tua rete', P.pieces.road, E.legalRoads(g, me).length, 'buildpick', 'Scegli dove') +
    row('settle', ART.piece('settle', P.col, 34), 'Colonia', '+1 punto, produce 1', P.pieces.settle, E.legalSettles(g, me, false).length, 'buildpick', 'Scegli dove') +
    row('city', ART.piece('city', P.col, 34), 'Città', '+1 punto in più, produce 2', P.pieces.city, E.legalCities(g, me).length, 'buildpick', 'Scegli quale') +
    row('dev', '<span class="bl-dev">' + ART.devBack() + '</span>', 'Carta sviluppo', 'cavaliere, punto o progresso', null, g.deck.length, 'buydev', g.deck.length ? 'Compra' : 'Finite') +
    '</div><button class="btn ghost small" data-act="help" data-r="build">Regole delle costruzioni</button>' + closeBtn();
}

/* ---------- commerciare ---------- */
function tradeBody(g, me, s) {
  var P = g.players[me], rt = E.rates(g, me);
  s.give = s.give || {}; s.get = s.get || {}; s.tab = s.tab || 'players';
  var tabs = '<div class="tabs"><button class="chip' + (s.tab === 'players' ? ' on' : '') + '" data-act="ttab" data-t="players">Con i giocatori</button><button class="chip' + (s.tab === 'bank' ? ' on' : '') + '" data-act="ttab" data-t="bank">' + IC('bank') + ' Con la banca e i porti</button></div>';
  if (s.tab === 'players') {
    var give = D.RES.map(function (r) { var n = s.give[r] || 0; return step('tgive', r, n, n > 0, n < P.res[r] && !(s.get[r]), ' <small class="muted">(hai ' + P.res[r] + ')</small>'); }).join('');
    var get = D.RES.map(function (r) { var n = s.get[r] || 0; return step('tget', r, n, n > 0, n < 9 && !(s.give[r])); }).join('');
    var ok = sum(s.give) > 0 && sum(s.get) > 0, left = 12 - g.offers;
    return '<h2>' + IC('trade') + ' Commercia</h2>' + tabs + '<p class="lead">Proponi uno scambio a tutti: gli altri accettano o rifiutano dal loro telefono e tu scegli con chi chiudere.</p>' +
      '<div class="tcols"><div><h4>Dai</h4>' + give + '</div><div><h4>Chiedi</h4>' + get + '</div></div>' +
      '<button class="btn block" data-act="tpropose"' + (ok && left > 0 ? '' : ' disabled') + '>Proponi a tutti</button>' + (left <= 3 ? '<p class="muted">Puoi fare ancora ' + left + ' propost' + (left === 1 ? 'a' : 'e') + ' in questo turno.</p>' : '') +
      '<button class="btn ghost small" data-act="help" data-r="trade">Regole del commercio</button>' + closeBtn();
  }
  if (s.bg && P.res[s.bg] < rt[s.bg]) s.bg = null;
  if (s.bt && (s.bt === s.bg || g.bank[s.bt] <= 0)) s.bt = null;
  var gv = D.RES.map(function (r) { var can = P.res[r] >= rt[r]; return '<button class="bk' + (s.bg === r ? ' on' : '') + '" data-act="bgive" data-r="' + r + '"' + (can ? '' : ' disabled') + '>' + ART.resDot(r) + '<b>' + rt[r] + ':1</b><small>hai ' + P.res[r] + '</small></button>'; }).join('');
  var gt = D.RES.map(function (r) { var can = g.bank[r] > 0 && r !== s.bg; return '<button class="bk' + (s.bt === r ? ' on' : '') + '" data-act="bget" data-r="' + r + '"' + (can ? '' : ' disabled') + '>' + ART.resDot(r) + '<small>banca ' + g.bank[r] + '</small></button>'; }).join('');
  var ports = g.harbors.filter(function (h) { var e = D.edges[h.e]; return E.owner(g, e.a) === me || E.owner(g, e.b) === me; }).map(function (h) { return h.k === '3' ? 'porto 3:1' : 'porto 2:1 ' + D.RN[h.k]; });
  return '<h2>' + IC('trade') + ' Commercia</h2>' + tabs + '<p class="lead">Dai alla banca più carte uguali e ricevi 1 carta a scelta. ' + (ports.length ? 'Hai: <b>' + ports.join(', ') + '</b>.' : 'Senza porti il cambio è 4:1: costruisci su un molo per cambiare a 3:1 o 2:1.') + '</p>' +
    '<h4>Dai</h4><div class="bks">' + gv + '</div><h4>Ricevi</h4><div class="bks">' + gt + '</div>' +
    '<button class="btn block" data-act="bankok"' + (s.bg && s.bt ? '' : ' disabled') + '>' + (s.bg && s.bt ? 'Dai ' + rt[s.bg] + ' ' + D.RN[s.bg] + ' per 1 ' + D.RN[s.bt] : 'Scegli cosa dai e cosa ricevi') + '</button>' + closeBtn();
}

/* ---------- carte sviluppo ---------- */
var DEVTXT = {
  knight: 'Sposta il ladro e ruba una carta. Conta per l’Esercito più grande.', vp: 'Vale 1 punto. Non si gioca: si scopre a fine partita.',
  road2: 'Costruisci gratis 2 strade.', plenty: 'Prendi dalla banca 2 risorse a scelta.', mono: 'Scegli una risorsa: tutti ti danno quelle che hanno.'
};
function devsBody(g, me, s) {
  var P = g.players[me];
  if (s.mode === 'plenty') {
    s.rs = s.rs || [];
    var chips = D.RES.map(function (r) { var n = s.rs.filter(function (x) { return x === r; }).length; return '<button class="bk' + (n ? ' on' : '') + '" data-act="plentyr" data-r="' + r + '"' + (g.bank[r] > 0 ? '' : ' disabled') + '>' + ART.resDot(r) + (n ? '<b>×' + n + '</b>' : '') + '<small>banca ' + g.bank[r] + '</small></button>'; }).join('');
    return '<h2>Invenzione</h2><p class="lead">Scegli 2 risorse da prendere dalla banca (anche uguali). Tocca di nuovo per togliere.</p><div class="bks">' + chips + '</div>' +
      '<button class="btn block" data-act="plentyok"' + (s.rs.length === 2 ? '' : ' disabled') + '>Prendi ' + (s.rs.length ? s.rs.map(function (r) { return D.RN[r]; }).join(' e ') : '') + '</button><button class="btn ghost block" data-act="devback">Indietro</button>';
  }
  if (s.mode === 'mono') {
    var others = function (r) { var n = 0; g.players.forEach(function (Q, q) { if (q !== me) n += Q.res[r]; }); return n; };
    var ch = D.RES.map(function (r) { return '<button class="bk' + (s.r === r ? ' on' : '') + '" data-act="monor" data-r="' + r + '">' + ART.resDot(r) + '<small>' + D.RN[r] + '</small></button>'; }).join('');
    return '<h2>Monopolio</h2><p class="lead">Scegli una risorsa: tutti gli altri ti danno <b>tutte</b> le carte di quella risorsa che hanno in mano. Non sai quante ne hanno: indovina guardando cosa producono!</p><div class="bks">' + ch + '</div>' +
      '<button class="btn block" data-act="monook"' + (s.r ? '' : ' disabled') + '>Prendi tutto il ' + (s.r ? D.RN[s.r] : '…') + '</button><button class="btn ghost block" data-act="devback">Indietro</button>';
  }
  var kinds = ['knight', 'road2', 'plenty', 'mono', 'vp'], list = '';
  kinds.forEach(function (k) {
    var cs = P.devs.filter(function (d) { return d.k === k; }); if (!cs.length) return;
    var fresh = cs.filter(function (d) { return d.t >= g.turnN; }).length, why = E.canPlayDev(g, me, k);
    var btn = k === 'vp' ? '<span class="good">' + IC('star') + ' +' + cs.length + ' punt' + (cs.length > 1 ? 'i' : 'o') + '</span>' : '<button class="btn small" data-act="playdev" data-k="' + k + '"' + (why ? ' disabled' : '') + '>Gioca</button>';
    list += '<div class="dv"><div class="dv-c">' + ART.devCard(k) + (cs.length > 1 ? '<span class="n">×' + cs.length + '</span>' : '') + '</div><div class="dv-t"><b>' + esc(D.DEVN[k]) + '</b><small>' + DEVTXT[k] + '</small>' +
      (fresh && k !== 'vp' ? '<small class="muted">' + (fresh === cs.length ? 'Comprat' + (fresh > 1 ? 'e' : 'a') + ' in questo turno: si gioca dal prossimo.' : fresh + ' comprata in questo turno.') + '</small>' : '') +
      (why && k !== 'vp' && !fresh ? '<small class="muted">' + esc(why) + '</small>' : '') + '</div>' + btn + '</div>';
  });
  return '<h2>' + IC('dev') + ' Le tue carte sviluppo</h2><p class="lead">Una carta per turno, anche prima di lanciare i dadi. Le carte sono segrete: gli altri vedono solo quante ne hai.' + (P.knights ? ' Cavalieri giocati: <b>' + P.knights + '</b>.' : '') + '</p>' +
    (list ? '<div class="dvs">' + list + '</div>' : '<p class="muted">Non hai carte sviluppo. Si comprano con ' + RU.cost(D.COST.dev) + ' da «Costruisci».</p>') +
    '<p class="muted">Nel mazzo ne restano ' + g.deck.length + '.</p><button class="btn ghost small" data-act="help" data-r="dev">Regole delle carte</button>' + closeBtn();
}

/* ---------- scarto col 7, furto ---------- */
function discardBody(g, me, s) {
  var P = g.players[me], need = E.mustDiscard(g, me); if (!need) return '';
  s.sel = s.sel || {}; var n = sum(s.sel);
  var rows = D.RES.map(function (r) { var k = s.sel[r] || 0; return P.res[r] ? step('dstep', r, k, k > 0, k < P.res[r] && n < need, ' <small class="muted">(hai ' + P.res[r] + ')</small>') : ''; }).join('');
  return '<h2>' + ART.robberIcon(22) + ' È uscito il 7!</h2><p class="lead">Hai ' + E.total(P.res) + ' carte: devi scartarne <b>' + need + '</b> (metà, per difetto). Scegli quali.</p>' + rows +
    '<button class="btn block" data-act="discardok"' + (n === need ? '' : ' disabled') + '>' + (n === need ? 'Scarta queste ' + need + ' carte' : 'Ne hai scelte ' + n + ' di ' + need) + '</button><button class="btn ghost small" data-act="discardauto">Scegli tu per me</button>';
}
function stealBody(g, me) {
  if (g.stage !== 'steal' || g.turn !== me) return '';
  return '<h2>' + ART.robberIcon(22) + ' A chi rubi?</h2><p class="lead">Prendi una carta a caso a uno dei giocatori che hanno una costruzione sulla tessera del ladro.</p><div class="rlist">' +
    g.victims.map(function (q) { var Q = g.players[q]; return '<button class="trow rt" data-act="stealp" data-p="' + q + '" style="--pc:' + D.PCOL[Q.col].c + '">' + ART.pieceIcon(Q.col, 26) + '<span class="grow"><b>' + esc(Q.nick) + '</b><small>' + E.total(Q.res) + ' carte in mano · ' + E.visibleVP(g, q) + ' punti</small></span>' + IC('end') + '</button>'; }).join('') + '</div>';
}

/* ---------- tessera ---------- */
function hexBody(g, me, hi) {
  var T = g.hex[hi], ter = D.TERR[T.t], r = ter.r, H = D.hexes[hi];
  var who = H.v.map(function (v) { return g.vown[v]; }).filter(Boolean).map(function (o) { return '<span class="gc" style="border-left:4px solid ' + D.PCOL[g.players[o.p].col].c + '">' + esc(g.players[o.p].nick) + ' · ' + (o.city ? 'città (2)' : 'colonia (1)') + '</span>'; }).join('');
  var pips = T.n ? D.PIPS[T.n] : 0;
  return '<div class="hx-h">' + tileImg(T.t) + '<div><div class="kicker">Tessera</div><h2>' + ter.n + '</h2>' + (r ? '<p class="lead">Produce ' + ART.resDot(r) + ' <b>' + D.RN[r] + '</b></p>' : '<p class="lead">Non produce niente.</p>') + '</div></div>' +
    (T.n ? '<p>Numero <b class="' + (pips === 5 ? 'bad' : '') + '">' + T.n + '</b>: esce in media <b>' + pips + ' volte su 36</b> lanci' + (pips === 5 ? ', uno dei più frequenti' : pips <= 2 ? ', raramente' : '') + '.</p>' : '') +
    (g.robber === hi ? '<p class="why">' + ART.robberIcon(16) + ' Qui c’è il ladro: questa tessera non produce finché non viene spostato.</p>' : '') +
    (who ? '<h4>Chi raccoglie qui</h4><div class="tags">' + who + '</div>' : '<p class="muted">Nessuno ha ancora costruito attorno a questa tessera.</p>') + closeBtn();
}

/* ---------- giocatore ---------- */
function playerBody(g, p, me) {
  var P = g.players[p], rt = E.rates(g, p), ports = D.RES.filter(function (r) { return rt[r] < 4; }).map(function (r) { return rt[r] + ':1 ' + D.RN[r]; });
  var s = 0, c = 0; for (var v in g.vown) if (g.vown[v].p === p) { if (g.vown[v].city) c++; else s++; }
  return '<div class="phead">' + ART.pieceIcon(P.col, 60) + '<div><div class="kicker">' + (p === me ? 'Tu' : 'Giocatore') + ' · ' + D.PCOL[P.col].n.toLowerCase() + '</div><h2>' + Net.dot(P.uid) + esc(P.nick) + '</h2></div></div>' +
    '<div class="tags"><span class="gc">' + IC('star') + E.visibleVP(g, p) + ' punti visibili' + (p === me && E.vpCards(P) ? ' + ' + E.vpCards(P) + ' segreti' : '') + '</span><span class="gc">' + ART.piece('settle', P.col, 16) + s + ' colonie</span><span class="gc">' + ART.piece('city', P.col, 16) + c + ' città</span>' +
    '<span class="gc">' + IC('cards') + E.total(P.res) + ' carte risorsa</span><span class="gc">' + IC('dev') + P.devs.length + ' carte sviluppo</span><span class="gc">' + IC('knight') + P.knights + ' cavalieri giocati</span><span class="gc">' + IC('road') + 'strada più lunga: ' + P.road + '</span>' +
    (g.lr === p ? '<span class="gc gold">' + IC('road') + ' Strada più lunga +2</span>' : '') + (g.la === p ? '<span class="gc gold">' + IC('knight') + ' Esercito più grande +2</span>' : '') + (ports.length ? '<span class="gc">' + IC('harbor') + ports.join(', ') + '</span>' : '') + '</div>' +
    (App.doc.host === Net.uid && p !== me && g.phase === 'play' ? '<button class="btn ghost block" data-act="auto" data-p="' + p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') + closeBtn();
}

/* ---------- presentazione ---------- */
function introBody(s) {
  var pages = [
    ['Benvenuto su Catan', '<div class="intro-art">' + ['wood', 'brick', 'wool', 'grain', 'ore'].map(function (r) { return ART.resCard(r); }).join('') + '</div>' +
      '<p>Cinque risorse, cinque terreni. Con le risorse costruisci <b>strade</b>, <b>colonie</b> (1 punto) e <b>città</b> (2 punti). Vince chi arriva per primo a <b>' + ((G() && G().opts.vp) || 10) + ' punti</b>.</p>'],
    ['Si comincia: la fondazione', '<p>Ognuno piazza gratis <b>2 colonie</b> con una <b>strada</b> ciascuna: un giro in ordine e uno al contrario. Gli incroci validi <b>lampeggiano</b>: tocca, poi conferma.</p><p>Scegli incroci che toccano numeri <b>frequenti</b>: più puntini sotto il numero, più spesso esce. <b class="bad">6</b> e <b class="bad">8</b> sono i migliori.</p>'],
    ['Ogni turno', '<div class="intro3"><div>' + ART.die(5, false, 40) + '<b>Lancia i dadi</b><small>le tessere col numero producono per tutti</small></div><div>' + ART.resCard('wool') + '<b>Commercia</b><small>con gli altri o con la banca</small></div><div>' + ART.piece('settle', 0, 40) + '<b>Costruisci</b><small>poi tocca Fine turno</small></div></div>' +
      '<p>Col <b>7</b> non produce nessuno: chi ha più di 7 carte ne scarta metà e chi ha lanciato sposta il <b>ladro</b> e ruba una carta.</p>'],
    ['Come si usa lo schermo', '<ul class="intro-list"><li><b>In alto</b> i giocatori: punti ' + IC('star') + ', carte ' + IC('cards') + ', carte sviluppo ' + IC('dev') + '. Toccali per i dettagli.</li><li><b>L’isola</b> si trascina e si ingrandisce con due dita. Tocca una tessera per sapere cosa produce e quanto spesso.</li>' +
      '<li><b>La riga dorata</b> ti dice sempre cosa fare; il ' + IC('help') + ' spiega la regola di quel momento.</li><li><b>I pulsanti</b> sotto: Costruisci, Commercia, Carte, Fine turno.</li><li><b>In fondo</b> le tue carte. Se hai un porto vedi il cambio (3:1 o 2:1) sulla carta.</li></ul>']
  ];
  var p = Math.max(0, Math.min(pages.length - 1, s.page || 0)), pg = pages[p];
  return '<div class="kicker">' + (p + 1) + ' di ' + pages.length + '</div><h2>' + pg[0] + '</h2>' + pg[1] +
    '<div class="row intro-nav">' + (p > 0 ? '<button class="btn ghost" data-act="introprev">Indietro</button>' : '') + (p < pages.length - 1 ? '<button class="btn" data-act="intronext">Avanti</button>' : '<button class="btn" data-act="introdone">Iniziamo!</button>') + '<button class="btn ghost small" data-act="introdone">Salta</button></div>';
}

/* ---------- fine partita ---------- */
function overBody(g, me) {
  var F = g.final, W = g.winner;
  var rows = F.order.map(function (p, i) {
    var x = F.rows[p], P = g.players[p], parts = [];
    if (x.settle) parts.push(ART.piece('settle', P.col, 16) + ' ' + x.settle + ' colon' + (x.settle > 1 ? 'ie' : 'ia') + ' <b>+' + x.settle + '</b>');
    if (x.city) parts.push(ART.piece('city', P.col, 16) + ' ' + x.city + ' citt' + 'à <b>+' + x.city * 2 + '</b>');
    if (x.lr) parts.push(IC('road') + ' Strada più lunga <b>+2</b>');
    if (x.la) parts.push(IC('knight') + ' Esercito più grande <b>+2</b>');
    if (x.vpc) parts.push(IC('dev') + ' Carte punto <b>+' + x.vpc + '</b>');
    return '<div class="fr' + (i === 0 ? ' win' : '') + '" style="--pc:' + D.PCOL[P.col].c + ';animation-delay:' + (i * .25) + 's"><div class="fr-h"><span class="rk">' + (i + 1) + '</span>' + ART.pieceIcon(P.col, 28) + '<b>' + esc(P.nick) + (p === me ? ' (tu)' : '') + '</b><span class="tot">' + x.vp + '</span></div>' +
      '<div class="fr-d">' + parts.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '<span>' + IC('knight') + ' ' + x.knights + ' cavalieri · ' + IC('road') + ' strada ' + x.road + '</span></div></div>';
  }).join('');
  return '<div class="over"><div class="crown">' + ART.piece('city', g.players[W].col, 92) + '</div><h2>' + (W === me ? 'Hai vinto!' : 'Vince ' + esc(g.players[W].nick)) + '</h2>' +
    '<p class="lead">' + F.rows[W].vp + ' punti al ' + g.round + 'º giro.</p><div class="frs">' + rows + '</div>' +
    Score.endHTML(App.doc) + (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda l’isola') + '</div>';
}

/* ---------- eventi ---------- */
function needTurn(g, me, stages) {
  if (!g || me < 0) return false;
  if (g.phase !== 'play') return false;
  if (g.turn !== me) { toast('Non è il tuo turno.'); return false; }
  if (stages.indexOf(g.stage) < 0) { toast(g.stage === 'roll' ? 'Prima lancia i dadi.' : g.trade ? 'Prima chiudi o ritira la proposta di scambio.' : 'Prima finisci quello che stai facendo.'); return false; }
  if (g.trade && stages.indexOf('roll') < 0) { toast('Prima chiudi o ritira la proposta di scambio.'); return false; }
  return true;
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && s.kind !== 'intro' && Date.now() - (App.sheetAt || 0) > 450) { App.sheet = null; renderSheet(); if (g) Game.render(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s && s.kind !== 'help' ? s : null }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'costs': App.sheet = { kind: 'costs' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('ct-intro-done', '1'); App.sheet = s.after || null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else App.sheet = null; renderSheet(); if (g) Game.render(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; App.pick = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'zin': Board.zoomAt(1.35); break;
    case 'zout': Board.zoomAt(1 / 1.35); break;
    case 'zfit': Board.fit(); break;
    // turno
    case 'roll': if (needTurn(g, me, ['roll'])) act({ a: 'roll' }); break;
    case 'end': if (needTurn(g, me, ['main'])) { App.pick = null; act({ a: 'end' }); } break;
    case 'build': if (needTurn(g, me, ['main'])) { App.sheet = { kind: 'build' }; renderSheet(); } break;
    case 'trade': if (needTurn(g, me, ['main'])) { App.sheet = { kind: 'trade', tab: App.tradeTab || 'players', give: {}, get: {} }; renderSheet(); } break;
    case 'res': {
      if (!g || me < 0) return;
      var rr = el.getAttribute('data-r'), rt0 = E.rates(g, me)[rr];
      if (g.turn === me && g.stage === 'main' && !g.trade) { App.sheet = { kind: 'trade', tab: g.players[me].res[rr] >= rt0 ? 'bank' : 'players', give: {}, get: {}, bg: g.players[me].res[rr] >= rt0 ? rr : null }; renderSheet(); }
      else toast(D.RN1[rr] + ': ne hai ' + g.players[me].res[rr] + '. Con la banca la cambi ' + rt0 + ':1.');
      break;
    }
    case 'devs': if (g && me >= 0) { App.sheet = { kind: 'devs' }; renderSheet(); } break;
    case 'buildpick': { var k = el.getAttribute('data-k'); App.pick = { k: k }; App.pickSel = null; App.sheet = null; renderSheet(); Game.render(); Board.fit(); break; }
    case 'unpick': App.pick = null; App.pickSel = null; Game.render(); break;
    case 'buydev': App.sheet = null; renderSheet(); act({ a: 'build', k: 'dev' }); break;
    case 'pickok': Game.confirmPick(); break;
    case 'pickno': App.pickSel = null; if (g && g.stage === 'main') App.pick = null; Game.render(); break;
    case 'endroads': act({ a: 'endroads' }); break;
    // commercio
    case 'ttab': s.tab = el.getAttribute('data-t'); App.tradeTab = s.tab; renderSheet(); break;
    case 'tgive': case 'tget': { var side = a === 'tgive' ? s.give : s.get, r1 = el.getAttribute('data-r'); side[r1] = Math.max(0, (side[r1] || 0) + +el.getAttribute('data-d')); renderSheet(); break; }
    case 'tpropose': { var gv = s.give, gt = s.get; App.sheet = null; renderSheet(); act({ a: 'offer', give: gv, get: gt }); break; }
    case 'bgive': s.bg = el.getAttribute('data-r'); if (s.bt === s.bg) s.bt = null; renderSheet(); break;
    case 'bget': s.bt = el.getAttribute('data-r'); renderSheet(); break;
    case 'bankok': { var bg = s.bg, bt = s.bt; s.bt = null; act({ a: 'bank', give: bg, get: bt }); break; }
    case 'cancel': act({ a: 'cancel' }); break;
    case 'deal': act({ a: 'deal', id: g.trade.id, with: +el.getAttribute('data-p') }); break;
    case 'respond': if (g && g.trade) act({ a: 'respond', id: g.trade.id, ok: el.getAttribute('data-ok') === '1' }); break;
    // carte sviluppo
    case 'playdev': {
      var dk = el.getAttribute('data-k');
      if (dk === 'plenty') { s.mode = 'plenty'; s.rs = []; renderSheet(); break; }
      if (dk === 'mono') { s.mode = 'mono'; s.r = null; renderSheet(); break; }
      App.sheet = null; renderSheet(); act({ a: 'play', k: dk }); break;
    }
    case 'devback': s.mode = null; renderSheet(); break;
    case 'plentyr': {   // tocchi: aggiunge (anche due uguali); a scelta piena toglie quella risorsa o sostituisce l'ultima
      var pr = el.getAttribute('data-r'), cnt = s.rs.filter(function (x) { return x === pr; }).length;
      if (s.rs.length < 2 && cnt < g.bank[pr]) s.rs.push(pr);
      else if (cnt) s.rs = s.rs.filter(function (x) { return x !== pr; });
      else s.rs[1] = pr;
      renderSheet(); break;
    }
    case 'plentyok': { var rs = s.rs.slice(); App.sheet = null; renderSheet(); act({ a: 'play', k: 'plenty', rs: rs }); break; }
    case 'monor': s.r = el.getAttribute('data-r'); renderSheet(); break;
    case 'monook': { var mr = s.r; App.sheet = null; renderSheet(); act({ a: 'play', k: 'mono', r: mr }); break; }
    // scarto e furto
    case 'opendiscard': App.sheet = { kind: 'discard', sel: {} }; renderSheet(); break;
    case 'dstep': { var r2 = el.getAttribute('data-r'); s.sel[r2] = Math.max(0, (s.sel[r2] || 0) + +el.getAttribute('data-d')); renderSheet(); break; }
    case 'discardok': { var sel = {}; D.RES.forEach(function (r) { if (s.sel[r]) sel[r] = s.sel[r]; }); App.sheet = null; renderSheet(); act({ a: 'discard', res: sel }); break; }
    case 'discardauto': { var mv = BOT.decide(clone(g), me, {}); if (mv && mv.a === 'discard') { s.sel = mv.res; renderSheet(); } break; }
    case 'opensteal': App.sheet = { kind: 'steal' }; renderSheet(); break;
    case 'stealp': App.sheet = null; renderSheet(); act({ a: 'steal', from: +el.getAttribute('data-p') }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
  if (ev.target.id === 'opt-vp') send({ t: 'opt', vp: +ev.target.value });
  if (ev.target.id === 'opt-gentle') send({ t: 'opt', gentle: ev.target.checked });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; renderSheet(); if (G()) Game.render(); }
});

/* ---------- avvio ---------- */
(function boot() {
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
