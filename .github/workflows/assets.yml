name: Scarica illustrazioni
on:
  push:
    branches: [main]
    paths: ['tools/assets.json', 'tools/fetch_assets.py', '.github/workflows/assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica da Wikimedia Commons
        run: python3 tools/fetch_assets.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presagio/img/src
          git diff --cached --quiet || (git commit -m "Illustrazioni di pubblico dominio da Wikimedia Commons" && git push)
