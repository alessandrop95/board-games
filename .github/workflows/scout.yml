name: Provini illustrazioni
on:
  push:
    branches: [scout]
    paths: ['scout/queries.json']
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scout/scout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scout/out
          git commit -m "Provini" && git push
