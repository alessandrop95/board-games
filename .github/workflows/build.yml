name: Ricostruisci i giochi
# A ogni modifica dei sorgenti (anche fatta dal telefono su github.com) rigenera le pagine dei giochi
# con build.py, le salva nel repository e fa ripartire la pubblicazione su GitHub Pages.
# Si rigenerano solo i giochi i cui sorgenti sono cambiati (src/<gioco>/, o src/shared/ e build.py per tutti).
# Protezione delle modifiche a mano: se una pagina è stata cambiata direttamente (non è identica a quella che
# build.py produceva dai sorgenti di quel momento), NON viene sovrascritta e compare un avviso: riporta la modifica
# anche in src/ e la pagina tornerà ad aggiornarsi da sola.
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      giochi:
        description: 'Giochi da ricostruire, separati da spazi (polvere-e-piombo presagio gattomina campi-acciaio binari-italia catan machiavelli)'
        required: true
        default: 'campi-acciaio'
permissions:
  contents: write
  pages: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Controlla che il codice non abbia errori di scrittura
        run: |
          fail=0
          for f in $(find src -name '*.js'); do node --check "$f" || fail=1; done
          if [ $fail = 1 ]; then echo "::error::C'è un errore di sintassi in un file JavaScript: le pagine NON sono state aggiornate."; exit 1; fi
      - name: Scegli i giochi da ricostruire
        id: which
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.giochi }}
        run: |
          if [ -n "$INPUT" ]; then games="$INPUT"
          else
            if git cat-file -e "$BEFORE" 2>/dev/null; then changed=$(git diff --name-only "$BEFORE" HEAD); else changed=$(git diff --name-only HEAD~1 HEAD); fi
            games=""
            for g in polvere-e-piombo presagio gattomina campi-acciaio binari-italia catan machiavelli; do
              if echo "$changed" | grep -q "^src/$g/"; then games="$games $g"; fi
            done
            # build.py o le parti condivise: si ricostruiscono tutti i giochi
            if echo "$changed" | grep -q -e "^src/shared/" -e "^build.py$"; then games="polvere-e-piombo presagio gattomina campi-acciaio binari-italia catan machiavelli"; fi
          fi
          safe=""
          for g in $games; do
            last=$(git log -1 --format=%H -- "$g/index.html")
            if [ -z "$last" ]; then safe="$safe $g"; continue; fi
            rm -rf /tmp/wt; git worktree add -q --detach /tmp/wt "$last"
            (cd /tmp/wt && python3 build.py >/dev/null 2>&1 || true)
            if cmp -s "/tmp/wt/$g/index.html" <(git show "$last:$g/index.html"); then safe="$safe $g"
            else echo "::warning::La pagina $g/index.html è stata modificata a mano: non la ricostruisco per non perdere le tue modifiche. Riporta la modifica anche nei file in src/$g/ (o in build.py) e la pagina tornerà ad aggiornarsi da sola."; fi
            git worktree remove --force /tmp/wt
          done
          games="$safe"
          echo "Giochi da ricostruire:$games"
          echo "games=$games" >> "$GITHUB_OUTPUT"
      - name: Genera le pagine
        if: steps.which.outputs.games != ''
        run: python3 build.py ${{ steps.which.outputs.games }}
      - name: Salva le pagine aggiornate
        id: save
        if: steps.which.outputs.games != ''
        env:
          MSG: ${{ github.event.head_commit.message }}
          GAMES: ${{ steps.which.outputs.games }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for g in $GAMES; do git add "$g/index.html"; done
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; echo "Pagine già aggiornate."; exit 0; fi
          first=$(printf '%s' "${MSG:-avvio manuale}" | head -n 1)
          git commit -m "Pagine dei giochi ricostruite ($first)"
          git pull --rebase origin main
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Avvia la pubblicazione su GitHub Pages
        if: steps.save.outputs.changed == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
