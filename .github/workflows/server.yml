name: Server (Supabase)
# Pubblica database e funzione delle notifiche sul progetto Supabase indicato nei segreti del repository:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD  (vedi README, «Configurare il server»).
# Ogni giorno fa anche una piccola richiesta al server, così il progetto gratuito non viene sospeso.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'tools/server/**', '.github/workflows/server.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: server
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - name: Controlla i segreti
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Mancano i segreti del repository:$missing. Vedi il README, sezione «Configurare il server»."; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collega il progetto
        run: supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Aggiorna il database
        run: echo y | supabase db push -p "$SUPABASE_DB_PASSWORD" --include-all
      - name: Chiavi delle notifiche (create solo la prima volta)
        id: keys
        run: |
          HAVE=$(supabase secrets list --project-ref "$REF" | grep -c VAPID_PRIVATE_JWK || true)
          PUB=""
          if [ -f server.json ]; then PUB=$(node -e "try{console.log(require('./server.json').vapid||'')}catch(e){console.log('')}"); fi
          if [ "$HAVE" -gt 0 ] && [ -n "$PUB" ]; then
            echo "Chiavi già presenti: le tengo (gli iscritti continuano a ricevere le notifiche)."
          else
            node tools/server/vapid.mjs > "$RUNNER_TEMP/vapid.json"
            PUB=$(node -e "console.log(require(process.argv[1]).publicKey)" "$RUNNER_TEMP/vapid.json")
            PRIV=$(node -e "console.log(JSON.stringify(require(process.argv[1]).privateJwk))" "$RUNNER_TEMP/vapid.json")
            echo "::add-mask::$PRIV"
            supabase secrets set --project-ref "$REF" "VAPID_PUBLIC=$PUB" "VAPID_PRIVATE_JWK=$PRIV" "SITE_URL=$SITE"
            rm -f "$RUNNER_TEMP/vapid.json"
          fi
          echo "pub=$PUB" >> "$GITHUB_OUTPUT"
      - name: Pubblica la funzione delle notifiche
        run: supabase functions deploy notify --project-ref "$REF" --no-verify-jwt
      - name: Scrivi server.json (indirizzo e chiavi pubbliche, nessun segreto)
        env:
          PUB: ${{ steps.keys.outputs.pub }}
        run: |
          supabase projects api-keys --project-ref "$REF" -o json > "$RUNNER_TEMP/keys.json"
          node -e "
            const k = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            const pick = k.find(x => x.name === 'anon') || k.find(x => x.type === 'publishable');
            if (!pick) { console.error('Chiave pubblica (anon) non trovata'); process.exit(1); }
            const ref = process.env.REF, base = 'https://' + ref + '.supabase.co';
            require('fs').writeFileSync('server.json', JSON.stringify({ url: base, anon: pick.api_key, fn: base + '/functions/v1/notify', vapid: process.env.PUB }, null, 1) + '\n');
          " "$RUNNER_TEMP/keys.json"
          rm -f "$RUNNER_TEMP/keys.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.json
          if git diff --cached --quiet; then echo "server.json invariato."; exit 0; fi
          git commit -m "Server: indirizzo e chiavi pubbliche aggiornati"
          git pull --rebase origin main
          git push
      - name: Prova il server
        run: |
          URL=$(node -e "console.log(require('./server.json').url)"); ANON=$(node -e "console.log(require('./server.json').anon)")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H 'Content-Type: application/json' -d '{}'
          echo
          FN=$(node -e "console.log(require('./server.json').fn)")
          curl -sS -X POST "$FN" -H 'Content-Type: application/json' -H 'Origin: https://alessandrop95.github.io' -d '{"kind":"table","token":"x"}'
          echo
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tieni attivo il progetto gratuito
        run: |
          [ -f server.json ] || { echo "Server non ancora configurato."; exit 0; }
          URL=$(node -e "console.log(require('./server.json').url)"); ANON=$(node -e "console.log(require('./server.json').anon)")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H 'Content-Type: application/json' -d '{}'
