name: Cerca illustrazioni candidate
on:
  push:
    branches: [main]
    paths: ['tools/candidates.json', 'tools/fetch_candidates.py', '.github/workflows/candidates.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cerca su Wikimedia Commons
        run: python3 tools/fetch_candidates.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/cand
          git diff --cached --quiet || (git commit -m "Illustrazioni candidate (miniature) da Wikimedia Commons" && git pull --rebase && git push)
