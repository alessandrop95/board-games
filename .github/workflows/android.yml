name: App Android
# Costruisce l'app Android (APK) e la pubblica tra le «Releases» del repository.
# Il sito offre il download da: https://github.com/<utente>/<repo>/releases/latest/download/board-games.apk
#
# Serve un solo segreto del repository: ANDROID_KEYSTORE_PASSWORD (una password lunga, vedi README «App Android»).
# La prima volta il workflow crea la chiave di firma android/firma.p12, protetta da quella password, e la salva nel repository:
# ogni versione successiva viene firmata con la stessa chiave, così il telefono accetta gli aggiornamenti.
on:
  push:
    branches: [main]
    paths: ['android/**', 'tools/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      N: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Controlla il segreto
        id: chk
        run: |
          # senza segreto l'app viene solo compilata (prova), non firmata né pubblicata
          if [ -z "$KSP" ]; then echo "::warning::Manca il segreto ANDROID_KEYSTORE_PASSWORD: faccio solo una prova di compilazione. Vedi il README, sezione «App Android»."; echo "ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ ${#KSP} -lt 12 ]; then echo "::error::ANDROID_KEYSTORE_PASSWORD è troppo corta: usa almeno 12 caratteri."; exit 1; fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Funzione per salvare nel repository
        if: steps.chk.outputs.ok == '1'
        run: |
          cat > "$RUNNER_TEMP/salva.sh" <<'EOF'
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$@"
          git diff --cached --quiet && exit 0
          git commit -q -m "App Android: $1"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Non riesco a salvare $1 nel repository."; exit 1
          EOF
          chmod +x "$RUNNER_TEMP/salva.sh"
      - name: Chiave di firma (creata solo la prima volta)
        if: steps.chk.outputs.ok == '1'
        run: |
          if [ ! -f android/firma.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore android/firma.p12 -alias boardgames \
              -keyalg RSA -keysize 3072 -validity 20000 -storepass:env KSP -keypass:env KSP \
              -dname "CN=Board Games, O=${{ github.repository_owner }}, C=IT"
            "$RUNNER_TEMP/salva.sh" android/firma.p12
            echo "Creata una nuova chiave di firma." >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! keytool -list -storetype PKCS12 -keystore android/firma.p12 -storepass:env KSP >/dev/null 2>&1; then
            echo "::error::La password ANDROID_KEYSTORE_PASSWORD non apre android/firma.p12. Rimetti la password usata la prima volta."; exit 1
          fi
      - name: Collegamento app-sito (assetlinks.json)
        if: steps.chk.outputs.ok == '1'
        run: |
          FP=$(keytool -list -v -storetype PKCS12 -keystore android/firma.p12 -alias boardgames -storepass:env KSP | sed -n 's/^.*SHA256: *//p' | head -1)
          [ -n "$FP" ] || { echo "::error::Impronta della chiave non trovata."; exit 1; }
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "io.github.alessandrop95.boardgames",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FP" > android/assetlinks.json
          "$RUNNER_TEMP/salva.sh" android/assetlinks.json
          {
            echo '### Collegamento app-sito'
            echo 'Per nascondere la barra dell’indirizzo nell’app, questo file deve stare in `https://${{ github.repository_owner }}.github.io/.well-known/assetlinks.json` (vedi README «App Android»):'
            echo '```json'; cat android/assetlinks.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Costruisci l'APK
        env:
          BG_KEYSTORE: ${{ steps.chk.outputs.ok == '1' && format('{0}/android/firma.p12', github.workspace) || '' }}
          BG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle -p android --no-daemon assembleRelease -PversionCode="$N" 2>&1 | tee "$RUNNER_TEMP/gradle.txt"; then
            # mostra il motivo anche nelle annotazioni del workflow
            sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.txt" | grep -v '^\s*$' | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E '^e: |error:|ERROR' "$RUNNER_TEMP/gradle.txt" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -n "$BG_KEYSTORE" ] || APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || { echo "::error::APK non trovato: $(cd android/app/build/outputs && find . -name '*.apk' | tr '\n' ' ')"; exit 1; }
          cp "$APK" board-games.apk
          ls -l board-games.apk
      - name: Pubblica la versione
        if: steps.chk.outputs.ok == '1'
        run: |
          V="1.$N"
          git fetch -q origin main
          gh release create "app-$V" board-games.apk \
            --target "$(git rev-parse FETCH_HEAD)" --latest \
            --title "Board Games per Android $V" \
            --notes "App Android di Board Games. Scarica **board-games.apk** sul telefono e aprilo per installarlo (la prima volta Android chiede di permettere l’installazione da questa fonte). Gli aggiornamenti si installano sopra la versione precedente."
          # tiene solo le ultime 3 versioni
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^app-' | sort -t. -k2 -n -r | tail -n +4 | while read t; do gh release delete "$t" --yes --cleanup-tag || true; done
          git pull -q --rebase origin main
          printf '{\n "version": "%s",\n "apk": "https://github.com/%s/releases/latest/download/board-games.apk",\n "date": "%s"\n}\n' "$V" "${{ github.repository }}" "$(date -u +%F)" > app.json
          "$RUNNER_TEMP/salva.sh" app.json
          echo "Pubblicata la versione $V." >> "$GITHUB_STEP_SUMMARY"
      - name: Prova riuscita
        if: steps.chk.outputs.ok != '1'
        run: |
          echo "L'app si compila correttamente. Per firmarla e pubblicarla aggiungi il segreto ANDROID_KEYSTORE_PASSWORD (README, «App Android») e rilancia il workflow." >> "$GITHUB_STEP_SUMMARY"
