name: Scarica musica e suoni
on:
  push:
    branches: [main]
    paths: ['tools/audio.json', 'tools/fetch_audio.py', '.github/workflows/audio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica da Wikimedia Commons
        run: python3 tools/fetch_audio.py
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */audio/src tools/audio-report.json
          git diff --cached --quiet || (git commit -m "Musica e suoni con licenza libera da Wikimedia Commons" && git push)
