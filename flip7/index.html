<style>
/* ===== Flip 7 — luna park di notte: ruota panoramica, lucine, fari che si incrociano, carte che si girano ===== */
:root {
  --bg: #12062e; --deep: #0b0420; --panel: rgba(30, 12, 70, .8); --panel-2: rgba(52, 22, 110, .72);
  --ink: #fbf6ff; --muted: #d6c8f2; --dim: #9d8cc8; --gold: #ffd23d; --gold-2: #f59e0b; --coral: #ff5ad1; --good: #5dff9a; --bad: #ff6b81;
  --line: rgba(255, 210, 61, .4); --line-2: rgba(255, 255, 255, .16);
  --f-disp: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); overflow-x: clip; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(90% 60% at 50% 0%, #3a1580, #12062e 60%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 25px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 19px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 12px 30px rgba(6, 18, 48, .35); min-width: 0; }
.panel h2 { font-size: 24px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(255, 215, 94, .14); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(200, 50, 40, .3); border-color: rgba(255, 143, 128, .55); }
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 44px; padding: 10px 18px; font: 800 15.5px/1.15 var(--f-body); color: #3b2500; cursor: pointer;
  background: linear-gradient(180deg, #fff1a0, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #a86a00, 0 8px 18px rgba(0, 0, 0, .4); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 0 #a86a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #ff8a70, #d8402c); color: #fff; box-shadow: 0 3px 0 #7c1e12; }
.btn.small { min-height: 36px; padding: 7px 13px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opp:focus-visible, .slot:focus-visible, .pile:focus-visible, .ch-p:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 5px 10px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--coral); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #24104f; background: #f7f2ff; border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #24104f; }
.back-link { color: #eaf3ff; text-decoration: none; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 56px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 0 18px rgba(255, 210, 61, .6), 0 3px 0 rgba(0, 0, 0, .45); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(16, 5, 40, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; flex-wrap: wrap; row-gap: 6px; justify-content: flex-end; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 24px; color: var(--gold); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
@media (max-width: 640px) {
  .topbar .wrap { row-gap: 0; padding-block: 6px 8px; }
  .topbar .wrap > * { order: 2; }
  .topbar .wrap > .brand, .topbar .wrap > .info { order: 0; }
  .topbar .wrap::after { content: ""; order: 1; flex-basis: 100%; height: 6px; }
  .topbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 21px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 0 0 2px rgba(255, 255, 255, .5); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(24, 8, 60, .97); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 14px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }

/* ---------- carte (3D) ---------- */
.f7c { display: block; position: relative; width: var(--cw, 60px); aspect-ratio: 100 / 140; perspective: 700px; flex: none; }
.f7c-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s var(--ease); }
.f7c-f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9%/6.5%; filter: drop-shadow(0 2px 2.5px rgba(0, 0, 0, .5)); }
.f7c-back { transform: rotateY(180deg); }
.f7c:not(.up) .f7c-in, .predown .f7c-in { transform: rotateY(180deg); }
.predown .f7c-in { transition: none; }
.f7c-svg { display: block; width: 100%; height: 100%; }
.f7c.flipin .f7c-in { animation: flipin .6s var(--ease); }
@keyframes flipin { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.12); } 100% { transform: rotateY(0) scale(1); } }
.f7c.flat { --cw: 40px; }
.flyhide { visibility: hidden !important; }
.rrow { display: inline-flex; gap: 3px; vertical-align: middle; margin: 4px 0; }
.rrow .f7c { --cw: 34px; }


/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 26px 22px 22px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, .25); overflow: hidden; position: relative;
  background: radial-gradient(60% 80% at 80% 20%, rgba(255, 90, 209, .45), transparent 60%), radial-gradient(50% 60% at 10% 90%, rgba(61, 214, 255, .35), transparent 60%), linear-gradient(180deg, #2a0f62 0%, #170640 100%); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
.marquee { position: absolute; inset: 6px; border-radius: 20px; pointer-events: none; background:
  radial-gradient(circle, #ffe7a0 0 2.6px, transparent 3.4px) 0 0 / 22px 12px repeat-x, radial-gradient(circle, #ffe7a0 0 2.6px, transparent 3.4px) 11px 100% / 22px 12px repeat-x; opacity: .9; animation: marq 1.2s steps(2) infinite; }
@keyframes marq { 50% { opacity: .45; } }
@media (min-width: 820px) { .hero { grid-template-columns: 1.05fr .95fr; } }
.hero-txt { position: relative; }
.hero .kicker { color: #ffd23d; }
.hero h1 { font-size: clamp(64px, 17vw, 120px); line-height: .85; color: #fff; margin-top: 6px; letter-spacing: .01em; text-shadow: 0 0 6px #fff, 0 0 18px #ff5ad1, 0 0 40px #ff2fb4, 0 5px 0 #6a0f6a; }
.hero h1 span { color: #ffd23d; margin-left: .08em; text-shadow: 0 0 6px #fff3c8, 0 0 22px #ffb100, 0 5px 0 #7a4a00; display: inline-block; animation: neon 3.5s ease-in-out infinite; }
@keyframes neon { 0%, 18%, 22%, 100% { opacity: 1; } 20% { opacity: .55; } 60% { transform: rotate(-4deg) scale(1.05); } }
.hero .tagline { color: #f1e6ff; margin-top: 12px; max-width: 54ch; font-weight: 700; }
.hero .tagline b { color: #ffd23d; }
.hero-art { position: relative; height: 210px; max-width: 400px; width: 100%; justify-self: center; }
.wheel { position: absolute; left: 50%; top: -6px; width: 150px; height: 150px; margin-left: -75px; border-radius: 50%; border: 3px solid rgba(255, 210, 61, .7); box-shadow: 0 0 18px rgba(255, 90, 209, .5), inset 0 0 18px rgba(255, 90, 209, .3); animation: spin 26s linear infinite; }
.wheel i { position: absolute; left: 50%; top: 50%; width: 150px; height: 2px; margin: -1px 0 0 -75px; background: rgba(255, 210, 61, .45); }
.wheel i:nth-child(2) { transform: rotate(30deg); } .wheel i:nth-child(3) { transform: rotate(60deg); } .wheel i:nth-child(4) { transform: rotate(90deg); } .wheel i:nth-child(5) { transform: rotate(120deg); } .wheel i:nth-child(6) { transform: rotate(150deg); }
.wheel b { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: #ffd23d; box-shadow: 0 0 12px #ffd23d; }
@keyframes spin { to { transform: rotate(360deg); } }
.hero-art .hc { position: absolute; bottom: 0; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .55)); animation: hcbob 4s ease-in-out infinite; }
.hero-art .f7c { --cw: 64px; }
.hc1 { left: 0; --r: -20deg; --y: -4px; } .hc2 { left: 11%; --r: -13deg; --y: -16px; animation-delay: -.5s; } .hc3 { left: 23%; --r: -6deg; --y: -24px; animation-delay: -1s; } .hc4 { left: 35%; --r: 0deg; --y: -28px; animation-delay: -1.5s; }
.hc5 { left: 47%; --r: 6deg; --y: -24px; animation-delay: -2s; } .hc6 { left: 59%; --r: 12deg; --y: -16px; animation-delay: -2.5s; } .hc7 { left: 71%; --r: 18deg; --y: -6px; animation-delay: -3s; } .hc8 { left: 82%; --r: 25deg; --y: 6px; animation-delay: -3.5s; }
.hero-art .hc { transform: translateY(var(--y)) rotate(var(--r)); }
@keyframes hcbob { 50% { transform: translateY(calc(var(--y) - 8px)) rotate(var(--r)); } }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
  grid-template-areas: 'top' 'opp' 'dock' 'mid' 'prompt' 'me'; overflow: hidden; -webkit-user-select: none; user-select: none; }
.gv-top { grid-area: top; } .gv-opp { grid-area: opp; } .gv > .chat-dock { grid-area: dock; } .gv-mid { grid-area: mid; } .gv-prompt { grid-area: prompt; } .gv-me { grid-area: me; }
.gv > *:not(.fair) { position: relative; z-index: 1; }
/* il luna park sullo sfondo */
.fair { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(90% 60% at 50% 0%, #3a1580 0%, #1c0848 45%, #0b0420 100%); }
.fair .st { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #fff; animation: twinkle 3s ease-in-out infinite; opacity: .2; }
@keyframes twinkle { 50% { opacity: .95; } }
.fw { position: absolute; right: -90px; top: 70px; width: 320px; height: 320px; border-radius: 50%; border: 3px solid rgba(255, 210, 61, .35); box-shadow: 0 0 30px rgba(255, 90, 209, .25); animation: spin 60s linear infinite; opacity: .7; }
.fw .sp { position: absolute; left: 50%; top: 50%; width: 160px; height: 2px; margin-top: -1px; background: linear-gradient(90deg, rgba(255, 210, 61, .5), rgba(255, 90, 209, .2)); transform-origin: 0 50%; transform: rotate(var(--a)); }
.fw .sp em { position: absolute; right: -10px; top: -9px; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, #fff3c8 0 30%, #ff5ad1 70%); box-shadow: 0 0 12px #ff5ad1; animation: blink 2s ease-in-out infinite; }
.fw .sp:nth-child(2n) em { background: radial-gradient(circle, #fff 0 30%, #3dd6ff 70%); box-shadow: 0 0 12px #3dd6ff; animation-delay: -1s; }
.fw .hub { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; background: #ffd23d; box-shadow: 0 0 18px #ffd23d; }
.fw-leg { position: absolute; right: 40px; top: 230px; width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 300px solid rgba(255, 210, 61, .08); }
@keyframes blink { 50% { opacity: .35; } }
.beam { position: absolute; bottom: -10%; width: 90px; height: 120%; background: linear-gradient(0deg, rgba(255, 240, 200, .16), transparent 80%); transform-origin: 50% 100%; filter: blur(6px); }
.beam.b1 { left: 10%; animation: sweep 9s ease-in-out infinite; } .beam.b2 { left: 70%; animation: sweep 11s ease-in-out infinite reverse; }
@keyframes sweep { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(24deg); } }
.lights { position: absolute; left: 0; right: 0; top: 46px; height: 34px; }
.lights::before { content: ""; position: absolute; left: -5%; right: -5%; top: 0; height: 30px; border-bottom: 2px solid rgba(0, 0, 0, .55); border-radius: 0 0 50% 50% / 0 0 100% 100%; }
.lights i { position: absolute; top: calc(4px + 22px * sin(calc(var(--k) / 23 * 180deg))); left: calc(var(--k) * 4.2%); width: 9px; height: 12px; border-radius: 50% 50% 45% 45%; background: hsl(calc(var(--k) * 47), 95%, 66%); box-shadow: 0 0 10px hsl(calc(var(--k) * 47), 95%, 60%); animation: blink 1.6s steps(2) infinite; animation-delay: calc(var(--k) * -.3s); }
.felt { position: absolute; left: -10%; right: -10%; bottom: -30%; height: 72%; border-radius: 50% 50% 0 0 / 22% 22% 0 0; background: radial-gradient(70% 60% at 50% 30%, #2a0f6a, #160540 70%); border-top: 4px solid rgba(255, 210, 61, .5); box-shadow: 0 -10px 40px rgba(255, 90, 209, .15), inset 0 20px 50px rgba(0, 0, 0, .4); }

.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); background: rgba(16, 5, 40, .78); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 19px; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px rgba(255, 210, 61, .6); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.pv { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--f-disp); color: #1a0636; background: var(--pc); flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .6), 0 0 10px color-mix(in srgb, var(--pc) 60%, transparent); }
.pv.big { width: 54px; height: 54px; font-size: 30px; }

/* avversari */
.gv-opp { display: flex; gap: 8px; overflow-x: auto; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.gv-opp:empty { display: none; }
.gv-opp::-webkit-scrollbar { display: none; }
.opp { appearance: none; flex: none; display: grid; gap: 4px; padding: 6px 7px 7px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(22, 8, 56, .72); backdrop-filter: blur(6px); color: var(--ink); font: 12.5px var(--f-body); cursor: pointer; text-align: left; position: relative; min-width: 108px; transition: transform .2s, box-shadow .2s, opacity .3s, filter .3s; overflow: hidden; }
.opp.on { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc), 0 0 22px color-mix(in srgb, var(--pc) 60%, transparent); transform: translateY(-1px); }
.opp.st-bust { filter: grayscale(.7) brightness(.8); }
.opp.st-stay { border-color: rgba(93, 255, 154, .55); }
.opp.st-flip7 { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 26px rgba(255, 210, 61, .7); }
.opp-h { display: flex; align-items: center; gap: 5px; min-width: 0; }
.opp-h .pv { width: 20px; height: 20px; font-size: 12px; }
.opp-h b { font-size: 13px; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp-s { display: flex; gap: 6px; align-items: baseline; color: var(--muted); font-size: 11.5px; }
.rs { font: 800 17px var(--f-disp); color: #fff; }
.sc-tot { margin-left: auto; color: var(--gold); font-weight: 800; }
.opp-t:empty { display: none; }
.opp-t { display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font: 800 10px var(--f-body); text-transform: uppercase; letter-spacing: .04em; border-radius: 6px; padding: 1px 5px; background: rgba(255, 255, 255, .14); }
.tag .ic { width: 11px; height: 11px; }
.tag.s-stay { background: #1f9a58; } .tag.s-bust { background: #c8233c; } .tag.s-frozen { background: #2b8fd6; } .tag.s-flip7 { background: var(--gold); color: #4a2a00; } .tag.s-in { background: rgba(255, 255, 255, .18); }
.tag.dealer { background: #6a3ad0; padding: 1px 3px; } .tag.away { background: #c8402c; } .tag.bot { background: #4a3a8a; } .tag.wait { background: rgba(255, 255, 255, .18); animation: pulse 1.4s ease-in-out infinite; } .tag.ok { background: #2f9a58; }
@keyframes pulse { 50% { opacity: .5; } }
.ovl { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; border-radius: inherit; }
.ovl.ice { background: linear-gradient(135deg, rgba(220, 245, 255, .55), rgba(120, 200, 245, .25) 50%, rgba(220, 245, 255, .45)); box-shadow: inset 0 0 18px rgba(255, 255, 255, .8); }
.ovl.ice::after { content: "❄"; font-size: 30px; color: #fff; text-shadow: 0 0 10px #7fd0ff; opacity: .85; }
.ovl.x .ic { width: 60%; height: 60%; color: rgba(255, 70, 100, .55); }

  background: radial-gradient(60% 55% at 50% 45%, rgba(255, 240, 200, .26), transparent 70%), linear-gradient(180deg, transparent, rgba(255, 90, 209, .12)); border: 1px dashed rgba(255, 210, 61, .3); }

  .gv { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: 'top top' 'opp opp' 'dock dock' 'mid me' 'prompt me'; }

}

.intro-art { display: grid; justify-items: center; gap: 4px; }

</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
window.GAME_PREFIX = 'flip7/v1/';
/* ===== Flip 7: motore delle regole (gira sull'host; lo stato è JSON) =====
   94 carte: un solo 0, poi tante copie quanto il valore (un 1, due 2 … dodici 12), i modificatori +2 +4 +6 +8 +10 e ×2,
   e tre copie di ognuna delle azioni: Congela (FRZ), Flip Three (F3) e Seconda possibilità (SC).
   A ogni manche il mazziere dà una carta scoperta a testa, poi a turno ognuno sceglie se pescare ancora o fermarsi.
   Un numero doppio fa sballare (zero punti), a meno di avere una Seconda possibilità. Sette numeri diversi: Flip 7!
   La manche finisce subito e chi ci è riuscito prende 15 punti in più. Si gioca fino a 200 punti: vince chi ne ha di più.
   Le carte usate restano fuori dal mazzo fino a quando non finisce: solo allora si rimescolano. */
var F7Engine = (function () {
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var MODS = ['+2', '+4', '+6', '+8', '+10', 'x2'], ACTS = ['FRZ', 'F3', 'SC'];
  function fullDeck() {
    var d = [0], v, k;
    for (v = 1; v <= 12; v++) for (k = 0; k < v; k++) d.push(v);
    MODS.forEach(function (m) { d.push(m); });
    ACTS.forEach(function (a) { for (k = 0; k < 3; k++) d.push(a); });
    return d;
  }
  function isNum(c) { return typeof c === 'number'; }
  function isMod(c) { return MODS.indexOf(c) >= 0; }
  function isAct(c) { return ACTS.indexOf(c) >= 0; }
  var ANAME = { FRZ: 'Congela', F3: 'Flip Three', SC: 'Seconda possibilità' };
  function cname(c) { return isNum(c) ? String(c) : isMod(c) ? (c === 'x2' ? '×2' : c) : ANAME[c]; }
  function nick(g, p) { return g.players[p].nick; }
  function log(g, t, k, p) { g.log.push({ n: ++g.logN, t: t, k: k || '', p: p == null ? null : p }); if (g.log.length > 120) g.log.splice(0, g.log.length - 120); }
  function fx(g, e) { e.n = ++g.fxN; g.fx.push(e); if (g.fx.length > 40) g.fx.splice(0, g.fx.length - 40); }

  /* ---------- punteggio ---------- */
  function uniq(P) { return P.nums.length; }
  function score(P) {
    if (P.st === 'bust') return 0;
    var s = P.nums.reduce(function (a, b) { return a + b; }, 0);
    if (P.mods.indexOf('x2') >= 0) s *= 2;
    P.mods.forEach(function (m) { if (m !== 'x2') s += +m.slice(1); });
    if (P.st === 'flip7') s += 15;
    return s;
  }
  function active(P) { return P.st === 'in'; }
  function actives(g) { return g.players.map(function (P, i) { return active(P) ? i : -1; }).filter(function (i) { return i >= 0; }); }
  function nextActive(g, from) { var n = g.players.length; for (var k = 1; k <= n; k++) { var i = (from + k) % n; if (active(g.players[i])) return i; } return -1; }

  /* ---------- mazzo ---------- */
  function drawCard(g) {
    if (!g.deck.length) {
      if (!g.disc.length) return null;
      g.deck = shuffle(g.disc); g.disc = [];
      log(g, 'Il mazzo è finito: le carte delle manche passate vengono rimescolate (quelle sul tavolo restano dove sono).', 'sys');
      fx(g, { k: 'reshuffle' });
    }
    return g.deck.pop();
  }

  /* ---------- nuova partita e nuova manche ---------- */
  function newGame(seats, opts) {
    opts = opts || {};
    var target = [100, 200, 300].indexOf(+opts.target) >= 0 ? +opts.target : 200;
    var g = {
      v: 1, phase: 'play', seq: 0, turnN: 0, round: 0,
      opts: { target: target },
      players: seats.map(function (s, i) { return { uid: s.uid, nick: s.nick, bot: !!s.bot, away: false, col: i, nums: [], mods: [], sc: false, st: 'in', total: 0, hist: [], ready: false, last: null }; }),
      deck: shuffle(fullDeck()), disc: [], dealer: Math.floor(rand() * seats.length), turn: 0,
      stage: 'deal', dealQ: [], todo: [], f3: null, choice: null, pass: false, ended: null,
      log: [], logN: 0, fx: [], fxN: 0, winners: null, final: null, roundRes: null
    };
    startRound(g, true);
    return g;
  }
  function startRound(g, first) {
    g.round++; g.phase = 'play'; g.roundRes = null; g.stage = 'deal'; g.todo = []; g.f3 = null; g.choice = null; g.pass = false; g.ended = null;
    if (!first) g.dealer = (g.dealer + 1) % g.players.length;
    g.players.forEach(function (P) { P.nums = []; P.mods = []; P.sc = false; P.st = 'in'; P.ready = false; P.last = null; P.bustCard = null; });
    var n = g.players.length; g.dealQ = []; for (var k = 1; k <= n; k++) g.dealQ.push((g.dealer + k) % n);
    log(g, 'Manche ' + g.round + ': distribuisce ' + nick(g, g.dealer) + '. Una carta scoperta a testa.', 'sys', g.dealer);
    fx(g, { k: 'round', round: g.round, dealer: g.dealer });
    advance(g);
  }

  /* ---------- una carta arriva a un giocatore ---------- */
  // ctx: 'deal' (prima carta), 'hit' (ha chiesto carta), 'f3' (sta pescando le tre carte di Flip Three)
  function give(g, p, ctx) {
    var P = g.players[p], c = drawCard(g);
    if (c == null) { log(g, 'Non ci sono più carte da pescare: la manche finisce qui.', 'sys'); fx(g, { k: 'nocards' }); if (g.ended == null) g.ended = -1; return; }
    P.last = c;
    if (isNum(c)) {
      if (P.nums.indexOf(c) >= 0) {
        if (P.sc) {
          P.sc = false; g.disc.push(c, 'SC');
          fx(g, { k: 'save', p: p, c: c, ctx: ctx });
          log(g, nick(g, p) + ' pesca un altro ' + c + ', ma la Seconda possibilità lo salva: le due carte vanno via.', 'save', p);
          return;
        }
        P.st = 'bust'; P.bustCard = c;
        fx(g, { k: 'bust', p: p, c: c, ctx: ctx });
        log(g, nick(g, p) + ' pesca un secondo ' + c + ' e sballa! Niente punti in questa manche.', 'bust', p);
        if (g.f3 && g.f3.p === p) { g.f3.left = 0; g.f3.held.forEach(function (a) { g.disc.push(a); }); g.f3.held = []; }
        return;
      }
      P.nums.push(c);
      fx(g, { k: 'card', p: p, c: c, ctx: ctx });
      if (uniq(P) === 7) {
        P.st = 'flip7'; g.ended = p;
        fx(g, { k: 'flip7', p: p });
        log(g, nick(g, p) + ' fa FLIP 7! Sette numeri diversi: la manche finisce subito, +15 punti.', 'flip7', p);
      } else log(g, nick(g, p) + (ctx === 'deal' ? ' riceve un ' : ' pesca un ') + c + '.', 'card', p);
      return;
    }
    if (isMod(c)) {
      P.mods.push(c);
      fx(g, { k: 'card', p: p, c: c, ctx: ctx });
      log(g, nick(g, p) + (ctx === 'deal' ? ' riceve il modificatore ' : ' pesca il modificatore ') + cname(c) + '.', 'mod', p);
      return;
    }
    // azioni
    fx(g, { k: 'action', p: p, c: c, ctx: ctx });
    if (c === 'SC') {
      if (!P.sc) { P.sc = true; log(g, nick(g, p) + ' pesca una Seconda possibilità e la tiene da parte.', 'act', p); return; }
      g.todo.unshift({ p: p, c: 'SC' });   // ne ha già una: la regala subito a chi non ce l'ha
      log(g, nick(g, p) + ' pesca un’altra Seconda possibilità: deve regalarla.', 'act', p);
      return;
    }
    if (ctx === 'f3' && g.f3 && g.f3.p === p) { g.f3.held.push(c); log(g, nick(g, p) + ' pesca ' + cname(c) + ': la userà dopo le tre carte.', 'act', p); return; }
    g.todo.unshift({ p: p, c: c });
    log(g, nick(g, p) + ' pesca ' + cname(c) + '.', 'act', p);
  }

  // a chi può andare una carta azione
  function targets(g, t) {
    var a = actives(g);
    if (t.c === 'SC') return a.filter(function (i) { return i !== t.p && !g.players[i].sc; });
    return a;
  }
  function apply(g, by, c, to) {
    var T = g.players[to];
    if (c === 'FRZ') {
      T.st = 'frozen';
      fx(g, { k: 'freeze', p: to, by: by });
      log(g, (by === to ? nick(g, by) + ' congela se stesso' : nick(g, by) + ' congela ' + nick(g, to)) + ': ' + score(T) + ' punti al sicuro, fuori dalla manche.', 'frz', to);
    } else if (c === 'F3') {
      g.f3 = { p: to, left: 3, held: [], by: by };
      fx(g, { k: 'flip3', p: to, by: by });
      log(g, nick(g, by) + ' dà Flip Three a ' + (by === to ? 'se stesso' : nick(g, to)) + ': tre carte in fila!', 'f3', to);
    } else if (c === 'SC') {
      T.sc = true;
      fx(g, { k: 'gift', p: to, by: by });
      log(g, nick(g, by) + ' regala la Seconda possibilità a ' + nick(g, to) + '.', 'act', to);
    }
  }

  /* ---------- il motore va avanti da solo finché non serve una scelta ---------- */
  function advance(g) {
    for (var guard = 0; guard < 400; guard++) {
      if (g.ended != null) return endRound(g);
      if (g.choice) return;
      if (g.todo.length && (!g.f3 || g.todo[0].c === 'SC')) {
        var t = g.todo.shift(), ts = targets(g, t);
        if (!ts.length) { g.disc.push(t.c); fx(g, { k: 'waste', p: t.p, c: t.c }); log(g, cname(t.c) + ' non può andare a nessuno: finisce negli scarti.', 'sys', t.p); continue; }
        if (ts.length === 1) { apply(g, t.p, t.c, ts[0]); if (t.c !== 'SC') g.disc.push(t.c); continue; }
        g.choice = { p: t.p, c: t.c, opts: ts };
        fx(g, { k: 'choose', p: t.p, c: t.c });
        return;
      }
      if (g.f3) {
        if (g.f3.left > 0 && active(g.players[g.f3.p])) { g.f3.left--; give(g, g.f3.p, 'f3'); continue; }
        var f = g.f3; g.f3 = null;
        if (active(g.players[f.p])) for (var h = f.held.length - 1; h >= 0; h--) g.todo.unshift({ p: f.p, c: f.held[h] });
        else f.held.forEach(function (a) { g.disc.push(a); });
        continue;
      }
      if (g.stage === 'deal') {
        if (g.dealQ.length) { var q = g.dealQ.shift(); if (active(g.players[q])) give(g, q, 'deal'); continue; }
        g.stage = 'turn'; g.pass = false;
        var first = nextActive(g, g.dealer);
        if (first < 0) return endRound(g);
        g.turn = first; g.turnN++;
        fx(g, { k: 'turn', p: first });
        return;
      }
      // turni
      if (!actives(g).length) return endRound(g);
      if (g.pass || !active(g.players[g.turn])) {
        g.pass = false;
        var nx = nextActive(g, g.turn);
        g.turn = nx; g.turnN++;
        fx(g, { k: 'turn', p: nx });
      }
      return;
    }
  }

  function endRound(g) {
    // le azioni rimaste in sospeso finiscono negli scarti
    if (g.choice) g.disc.push(g.choice.c); if (g.f3) g.f3.held.forEach(function (a) { g.disc.push(a); }); g.todo.forEach(function (t) { g.disc.push(t.c); });
    g.choice = null; g.f3 = null; g.todo = []; g.stage = 'end';
    var pts = g.players.map(score), f7 = g.ended != null && g.ended >= 0 ? g.ended : null;
    g.players.forEach(function (P, i) { P.total += pts[i]; P.hist.push(pts[i]); P.ready = !!P.bot; if (P.st === 'in') P.st = 'stay'; });
    g.roundRes = { pts: pts, f7: f7, st: g.players.map(function (P) { return P.st; }), nums: g.players.map(function (P) { return P.nums.slice(); }), mods: g.players.map(function (P) { return P.mods.slice(); }) };
    // le carte del tavolo vanno negli scarti (non tornano nel mazzo fino a quando non finisce)
    g.players.forEach(function (P) { P.nums.forEach(function (c) { g.disc.push(c); }); P.mods.forEach(function (c) { g.disc.push(c); }); if (P.sc) g.disc.push('SC'); if (P.st === 'bust' && P.bustCard != null) g.disc.push(P.bustCard); });
    log(g, 'Fine della manche ' + g.round + (f7 != null ? ' (Flip 7 di ' + nick(g, f7) + ')' : '') + '. ' + g.players.map(function (P, i) { return P.nick + ' ' + pts[i]; }).join(', ') + '.', 'round');
    var max = Math.max.apply(null, g.players.map(function (P) { return P.total; }));
    var top = g.players.map(function (P, i) { return P.total === max ? i : -1; }).filter(function (i) { return i >= 0; });
    if (max >= g.opts.target && top.length === 1) {
      g.winners = top;
      g.final = { order: g.players.map(function (P, i) { return i; }).sort(function (a, b) { return g.players[b].total - g.players[a].total || a - b; }) };
      g.phase = 'over';
      log(g, 'Vince ' + nick(g, top[0]) + ' con ' + max + ' punti!', 'win', top[0]);
      fx(g, { k: 'roundEnd', round: g.round, over: true });
      fx(g, { k: 'over', p: top[0] });
    } else {
      if (max >= g.opts.target) log(g, 'Pari in testa a ' + max + ' punti: si gioca un’altra manche per decidere chi vince.', 'sys');
      g.tie = max >= g.opts.target;
      g.phase = 'scores';
      fx(g, { k: 'roundEnd', round: g.round, over: false });
    }
  }

  /* ---------- azioni ---------- */
  function decider(g) {
    if (g.phase !== 'play') return null;
    if (g.choice) return g.choice.p;
    if (g.stage === 'turn') return g.turn;
    return null;
  }
  function pending(g) {
    var d = decider(g);
    if (d != null) return [d];
    if (g.phase === 'scores') return g.players.map(function (P, i) { return P.ready ? -1 : i; }).filter(function (i) { return i >= 0; });
    return [];
  }
  function act(g, p, a) {
    if (!a || typeof a.a !== 'string') return 'Mossa non valida.';
    if (g.phase === 'over') return 'La partita è finita.';
    if (!g.players[p]) return 'Non sei al tavolo.';
    var r = doAct(g, p, a);
    if (!r) g.seq++;
    return r;
  }
  function doAct(g, p, a) {
    var P = g.players[p];
    if (g.phase === 'scores') {
      if (a.a !== 'next') return 'La manche è finita: tocca «Prossima manche».';
      if (P.ready) return null;
      P.ready = true;
      if (g.players.every(function (Q) { return Q.ready || Q.bot; })) { startRound(g); fx(g, { k: 'next' }); }
      return null;
    }
    if (g.phase !== 'play') return 'Mossa non valida.';
    if (g.choice) {
      if (g.choice.p !== p) return 'Aspetta: ' + nick(g, g.choice.p) + ' sta scegliendo a chi dare ' + cname(g.choice.c) + '.';
      if (a.a !== 'target') return 'Prima scegli a chi dare ' + cname(g.choice.c) + '.';
      var to = +a.t;
      if (g.choice.opts.indexOf(to) < 0) return g.choice.c === 'SC' ? 'Scegli un giocatore ancora in gioco che non abbia già una Seconda possibilità.' : 'Scegli un giocatore ancora in gioco.';
      var c = g.choice.c; g.choice = null;
      apply(g, p, c, to); if (c !== 'SC') g.disc.push(c);
      advance(g);
      return null;
    }
    if (g.stage !== 'turn') return 'Aspetta un attimo.';
    if (g.turn !== p) return 'Non è il tuo turno.';
    if (a.a === 'hit') {
      fx(g, { k: 'hit', p: p });
      give(g, p, 'hit'); g.pass = true;
      advance(g);
      return null;
    }
    if (a.a === 'stay') {
      if (!P.nums.length && !P.mods.length) return 'Non hai ancora carte: devi pescare.';
      P.st = 'stay';
      fx(g, { k: 'stay', p: p, s: score(P) });
      log(g, nick(g, p) + ' si ferma con ' + score(P) + ' punti.', 'stay', p);
      g.pass = true;
      advance(g);
      return null;
    }
    return 'Mossa sconosciuta.';
  }

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,
   senza limite di tempo. Durante la partita una barra in alto spiega cosa fare adesso e propone la mossa consigliata
   (quella che sceglierebbe il giocatore automatico). Ogni gioco dà i suoi consigli con Coach.setup({ bots, tip(g, me) }).

  var CSS = '.cx-start{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px dashed rgba(255,255,255,.22);border-radius:12px;font-size:14.5px;line-height:1.35}.cx-start span{flex:1;min-width:180px;opacity:.9}' +

    '.cx-bar .cx-t{flex:1;min-width:0}.cx-bar b{color:#9fd3ff}.cx-bar .cx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +

    '.cx-bar .cx-x{border:0;padding:2px 6px;font-size:20px;line-height:1;opacity:.7}.cx-pill{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:9980;appearance:none;border:1px solid rgba(140,200,255,.6);background:rgba(18,30,44,.94);color:#eef4fb;border-radius:999px;padding:7px 12px;font:600 13.5px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}';

function chooseBody(g, me) {
  var ch = g.choice; if (!ch || ch.p !== me) return '';
  var t = { FRZ: ['Congela!', 'Chi la riceve si ferma subito e incassa i punti che ha. Bloccare chi va forte… o salvarti?'], F3: ['Flip Three!', 'Chi la riceve deve pescare tre carte di fila: più numeri ha, più rischia di sballare.'], SC: ['Un’altra Seconda possibilità!', 'Ne hai già una: regala questa a un giocatore in gioco che non ce l’ha.'] }[ch.c];
  return '<div class="ch-head"><span class="ch-card">' + ART.flat(ch.c) + '</span><div><div class="kicker">Hai pescato</div><h2>' + t[0] + '</h2><p class="lead">' + t[1] + '</p></div></div><div class="ch-list">' +
    ch.opts.map(function (i) {
      var P = g.players[i];
      return '<button class="ch-p" data-act="target" data-t="' + i + '" style="--pc:' + pcol(g, i) + '"><span class="pv">' + esc(P.nick.charAt(0).toUpperCase()) + '</span><span class="ch-n"><b>' + esc(P.nick) + (i === me ? ' (tu)' : '') + '</b><small>' + E.score(P) + ' in tavola · rischio ' + Math.round(E.bustRisk(g, i) * 100) + '% · Σ ' + P.total + (P.sc ? ' · ♥' : '') + '</small></span><span class="ch-cards">' + P.nums.map(function (c) { return ART.card(c, true, { mini: true }); }).join('') + '</span></button>';
    }).join('') + '</div><p class="lead" style="font-size:13.5px">Il «rischio» è la probabilità di sballare con la prossima carta.</p>';
}
function scorecard(g, me) {
  var n = g.players[0].hist.length; if (!n) return '<p class="lead">Ancora nessuna manche finita.</p>';
  var head = '<tr><th></th>' + g.players.map(function (P, i) { return '<th style="--pc:' + pcol(g, i) + '"><span class="pv">' + esc(P.nick.charAt(0).toUpperCase()) + '</span>' + esc(P.nick) + '</th>'; }).join('') + '</tr>';
  var rows = ''; for (var r = 0; r < n; r++) rows += '<tr><td>' + (r + 1) + '</td>' + g.players.map(function (P) { var v = P.hist[r]; return '<td class="' + (v <= 0 ? 'neg' : '') + '">' + v + '</td>'; }).join('') + '</tr>';
  var max = Math.max.apply(null, g.players.map(function (P) { return P.total; }));
  return '<div class="card-note"><table class="scard">' + head + rows + '<tr class="tot"><td>Σ</td>' + g.players.map(function (P) { return '<td class="' + (P.total === max ? 'best' : '') + '">' + P.total + '</td>'; }).join('') + '</tr></table></div>';
}
function overBody(g, me, s) {
  var W = g.winners, order = g.final.order, iw = W.indexOf(me) >= 0;
  var podium = order.slice(0, 3).map(function (p, k) { var P = g.players[p]; return '<div class="pod p' + (k + 1) + '" style="--pc:' + pcol(g, p) + '"><span class="pv big">' + esc(P.nick.charAt(0).toUpperCase()) + '</span><b>' + esc(P.nick) + '</b><span class="pod-s">' + P.total + '</span><span class="pod-b">' + (1 + order.slice(0, k).filter(function (q) { return g.players[q].total > P.total; }).length) + '</span></div>'; }).join('');
  return '<div class="over"><span class="over-card">' + ART.flat(7) + '</span><h2>' + (iw ? 'Hai vinto!' : 'Vince ' + esc(g.players[W[0]].nick)) + '</h2>' +
    '<p class="lead">' + esc(g.players[W[0]].nick) + ' ha superato i ' + g.opts.target + ' punti dopo ' + g.round + ' manche.</p>' +
    '<div class="podium">' + podium + '</div>' + (g.roundRes ? '<details class="lastround"><summary>Ultima manche</summary>' + roundRows(g, me, false) + '</details>' : '') + scorecard(g, me) +
    Score.endHTML(App.doc) + (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda il tavolo') + '</div>';
}
function introBody(s) {
  var pages = [
    ['Benvenuto a Flip 7', '<div class="intro-art">' + RU.row([4, 9, 0, 12, 7]) + '</div>' + RU.S.goal[1]],
    ['Pesca o fermati', RU.S.turn[1] + RU.row([3, 8, 11, 8], { bad: [1, 3] }) + '<p>Un numero che hai già? <b>Sballi</b> e fai zero. Sette numeri diversi? <b>Flip 7</b>: +15 punti!</p>'],
    ['Le carte speciali', RU.row(['+4', 'x2', 'FRZ', 'F3', 'SC']) + '<p>I <b>modificatori</b> aggiungono punti o raddoppiano. <b>Congela</b> ferma un giocatore, <b>Flip Three</b> lo costringe a pescare tre carte, la <b>Seconda possibilità</b> ti salva da un doppione. Le azioni le dai tu a chi vuoi!</p>']
  ];
  var p = Math.max(0, Math.min(pages.length - 1, s.page || 0)), pg = pages[p];
  return '<div class="kicker">' + (p + 1) + ' di ' + pages.length + '</div><h2>' + pg[0] + '</h2>' + pg[1] +
    '<div class="row intro-nav">' + (p > 0 ? '<button class="btn ghost" data-act="introprev">Indietro</button>' : '') + (p < pages.length - 1 ? '<button class="btn" data-act="intronext">Avanti</button>' : '<button class="btn" data-act="introdone">Si gioca!</button>') + '<button class="btn ghost small" data-act="introdone">Salta</button></div>';
}

/* ---------- eventi ---------- */
// i punti della manche contano da zero fino al valore
function countUp() {
  document.querySelectorAll('.sheet .cnt[data-to]').forEach(function (n, k) {
    var to = +n.getAttribute('data-to'); if (!to || n._go) return; n._go = 1;
    var t0 = performance.now() + 300 + k * 140, d = Math.min(1200, 350 + to * 10);
    requestAnimationFrame(function step(t) { var x = Math.max(0, Math.min(1, (t - t0) / d)); n.textContent = Math.round(to * (1 - Math.pow(1 - x, 3))); if (x < 1) requestAnimationFrame(step); else { n.classList.add('done'); Sound.play('tick'); } });
  });
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && s.kind !== 'intro' && Date.now() - (App.sheetAt || 0) > 450) { App.sheet = null; renderSheet(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s && s.kind !== 'help' ? s : null }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'scorecard': App.sheet = { kind: 'scorecard' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('f7-intro-done', '1'); App.sheet = s.after || null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'showround': App.sheet = { kind: 'round' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    // il turno
    case 'hit':
      if (!g || g.phase !== 'play') return;
      if (g.choice) { if (g.choice.p === me) { App.sheet = { kind: 'choose' }; renderSheet(); } return; }
      if (g.stage !== 'turn' || g.turn !== me) { toast('Aspetta il tuo turno.'); Sound.play('no'); return; }
      act({ a: 'hit' }); break;
    case 'stay':
      if (!g || g.phase !== 'play' || g.stage !== 'turn' || g.turn !== me) return;
      act({ a: 'stay' }); break;
    case 'choose': App.sheet = { kind: 'choose' }; renderSheet(); break;
    case 'target': App.sheet = null; renderSheet(); act({ a: 'target', t: +el.getAttribute('data-t') }); break;
    case 'next': act({ a: 'next' }); break;
    case 'nextround': send({ t: 'nextround' }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
  if (ev.target.id === 'opt-target') send({ t: 'opt', target: +ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.defs());
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
