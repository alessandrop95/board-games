<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prendi 6!</title>
<meta name="description" content="Il gioco delle teste di toro: tutti insieme giocate una carta e chi mette la sesta in una fila se la prende. Vince chi prende meno teste. Da 2 a 10 giocatori, ognuno dal proprio telefono.">
<meta name="theme-color" content="#4f7a2a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prendi 6!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="pwa-sw" content="../sw.js" data-scope="../">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* ===== Prendi 6! — la fattoria: colline, staccionata, teste di toro ===== */
:root {
  --bg: #1d2a14; --deep: #121c0c; --panel: rgba(30, 44, 22, .86); --panel-2: rgba(52, 76, 36, .72);
  --ink: #f4f8ff; --muted: #c5d4ef; --dim: #8ea6cf; --gold: #ffd75e; --gold-2: #f0a91c; --coral: #ff7a59; --good: #8ff0a4; --bad: #ff8f80;
  --line: rgba(255, 215, 94, .38); --line-2: rgba(255, 255, 255, .16);
  --f-disp: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); overflow-x: clip; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: linear-gradient(180deg, #121c0c 0%, #2a3e1c 55%, #3a5426 100%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 25px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 19px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 12px 30px rgba(6, 18, 48, .35); min-width: 0; }
.panel h2 { font-size: 24px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(255, 215, 94, .14); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(200, 50, 40, .3); border-color: rgba(255, 143, 128, .55); }
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 44px; padding: 10px 18px; font: 800 15.5px/1.15 var(--f-body); color: #3b2500; cursor: pointer;
  background: linear-gradient(180deg, #fff1a0, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #a86a00, 0 8px 18px rgba(8, 24, 64, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 0 #a86a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #ff8a70, #d8402c); color: #fff; box-shadow: 0 3px 0 #7c1e12; }
.btn.small { min-height: 36px; padding: 7px 13px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opp:focus-visible, .slot:focus-visible, .pile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 5px 10px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--coral); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #13284f; background: #f4f8ff; border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #13284f; }
.back-link { color: #eaf3ff; text-decoration: none; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 56px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 3px 0 rgba(8, 24, 64, .45); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(13, 36, 84, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; flex-wrap: wrap; row-gap: 6px; justify-content: flex-end; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 24px; color: var(--gold); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
@media (max-width: 640px) {
  .topbar .wrap { row-gap: 0; padding-block: 6px 8px; }
  .topbar .wrap > * { order: 2; }
  .topbar .wrap > .brand, .topbar .wrap > .info { order: 0; }
  .topbar .wrap::after { content: ""; order: 1; flex-basis: 100%; height: 6px; }
  .topbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 21px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 0 0 2px rgba(255, 255, 255, .5); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(22, 34, 14, .96); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 14px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }

/* ---------- carte (3D) ---------- */
.skc { display: block; position: relative; width: var(--cw, 60px); aspect-ratio: 100 / 140; perspective: 700px; flex: none; }
.skc-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s var(--ease); }
.skc-f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9%/6.5%; filter: drop-shadow(0 2px 2.5px rgba(6, 18, 48, .45)); }
.skc-back { transform: rotateY(180deg); }
.skc:not(.up) .skc-in, .predown .skc-in { transform: rotateY(180deg); }
.predown .skc-in { transition: none; }
.skc-svg { display: block; width: 100%; height: 100%; }
.skc.flipin .skc-in { animation: flipin .6s var(--ease); }
@keyframes flipin { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.12); } 100% { transform: rotateY(0) scale(1); } }
.skc.flat { --cw: 40px; }
.flyhide { visibility: hidden !important; }
.rrow { display: inline-flex; gap: 3px; vertical-align: middle; margin: 4px 0; }
.rrow .skc { --cw: 34px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, .35); overflow: hidden; position: relative;
  background: radial-gradient(60% 70% at 85% 15%, rgba(255, 207, 63, .35), transparent 60%), linear-gradient(180deg, #d6a800 0%, #4f7a2a 55%, #22340f 100%); box-shadow: 0 16px 40px rgba(8, 24, 64, .35); }
.hero::before { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30px; height: 90px; background: radial-gradient(closest-side, rgba(255, 255, 255, .85), transparent) 0 0 / 120px 90px repeat-x; opacity: .7; pointer-events: none; animation: drift 40s linear infinite; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero .kicker { color: #7a2c10; }
.hero h1 { font-size: clamp(56px, 15vw, 104px); line-height: .9; color: #fff; text-shadow: 0 4px 0 #4f7a2a, 0 10px 26px rgba(22, 34, 14, .45); margin-top: 6px; letter-spacing: .01em; }
.hero .tag { color: #12305f; margin-top: 12px; max-width: 54ch; font-weight: 700; }
.hero-art { position: relative; height: 200px; max-width: 380px; width: 100%; justify-self: center; }
.hero-balloon { position: absolute; width: 120px; left: 50%; top: -14px; margin-left: -60px; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(22, 34, 14, .35)); }
@keyframes bob { 50% { transform: translateY(-10px) rotate(3deg); } }
.hero-art .hc { position: absolute; bottom: 0; filter: drop-shadow(0 8px 12px rgba(22, 34, 14, .4)); }
.hero-art .skc { --cw: 70px; }
.hc1 { left: 2%; transform: rotate(-18deg) translateY(-6px); } .hc2 { left: 17%; transform: rotate(-9deg) translateY(-18px); } .hc3 { left: 33%; transform: rotate(-1deg) translateY(-24px); }
.hc4 { left: 49%; transform: rotate(7deg) translateY(-18px); } .hc5 { left: 64%; transform: rotate(15deg) translateY(-6px); } .hc6 { left: 79%; transform: rotate(23deg) translateY(8px); }
@keyframes drift { to { background-position: 1200px 0; } }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
  grid-template-areas: 'top' 'opp' 'dock' 'mid' 'prompt' 'me'; overflow: hidden; -webkit-user-select: none; user-select: none; }
.gv-top { grid-area: top; } .gv-opp { grid-area: opp; } .gv > .chat-dock { grid-area: dock; } .gv-mid { grid-area: mid; } .gv-prompt { grid-area: prompt; } .gv-me { grid-area: me; }
.gv > *:not(.sky) { position: relative; z-index: 1; }
/* la fattoria: cielo, sole, colline e staccionata */
.sky { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, #5f9fd8 0%, #9cc8ea 35%, #c9e4b0 60%, #4f7a2a 61%, #2a4a14 100%); overflow: hidden; }
.sun { position: absolute; width: 90px; height: 90px; border-radius: 50%; right: 10%; top: 8%; background: radial-gradient(circle, #fff8d0 0 35%, rgba(255, 220, 120, .6) 50%, transparent 70%); }
.hill { position: absolute; bottom: 30%; width: 80%; height: 30%; border-radius: 50% 50% 0 0; background: #6a9a3a; }
.hill.h1 { left: -20%; } .hill.h2 { right: -25%; bottom: 26%; background: #5a8a30; }
.fence { position: absolute; left: 0; right: 0; bottom: 34%; height: 22px; background: repeating-linear-gradient(90deg, transparent 0 34px, #c99a5c 34px 40px), linear-gradient(transparent 5px, #c99a5c 5px 9px, transparent 9px 13px, #c99a5c 13px 17px, transparent 17px); opacity: .7; }
.gv::after { content: ""; position: absolute; inset: 0; background: rgba(10, 20, 6, .35); z-index: 0; pointer-events: none; }

.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); background: rgba(22, 34, 14, .72); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 19px; font-weight: 800; color: var(--gold); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.pv { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--f-disp); color: #fff; background: var(--pc); flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
.pv.big { width: 54px; height: 54px; font-size: 30px; }

/* avversari */
.gv-opp { display: flex; gap: 8px; overflow-x: auto; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.gv-opp:empty { display: none; }
.gv-opp::-webkit-scrollbar { display: none; }
.opp { appearance: none; flex: none; display: grid; gap: 4px; padding: 6px 7px 7px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .28); background: rgba(22, 34, 14, .55); backdrop-filter: blur(6px); color: var(--ink); font: 12.5px var(--f-body); cursor: pointer; text-align: left; position: relative; transition: transform .2s, box-shadow .2s; }
.opp.on { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc), 0 0 22px color-mix(in srgb, var(--pc) 60%, transparent); transform: translateY(-1px); }
.opp-h { display: flex; align-items: center; gap: 5px; min-width: 0; }
.opp-h .pv { width: 20px; height: 20px; font-size: 12px; }
.opp-h b { font-size: 13px; max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp-s { display: flex; gap: 5px; align-items: baseline; color: var(--muted); font-size: 11.5px; }
.sc-vis { font: 800 15px var(--f-disp); color: #fff; }
.sc-hid { color: var(--dim); }
.sc-tot { margin-left: auto; color: var(--gold); font-weight: 800; }
.opp-t:empty { display: none; }
.opp-t { display: flex; gap: 3px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 3px; font: 800 10px var(--f-body); text-transform: uppercase; letter-spacing: .04em; border-radius: 6px; padding: 1px 5px; background: rgba(255, 255, 255, .14); }
.tag.end { background: var(--gold); color: #4a2a00; } .tag.away { background: #c8402c; } .tag.bot { background: #3a5a8a; } .tag.wait { background: rgba(255, 255, 255, .18); animation: pulse 1.4s ease-in-out infinite; } .tag.ok { background: #2f9a58; }
@keyframes pulse { 50% { opacity: .5; } }
.board { display: grid; grid-template-columns: repeat(4, auto); gap: 2px; justify-content: start; }
.board .slot { display: block; position: relative; }
.opp .board .skc, .pboard .board .skc, .rr-b .skc { --cw: 17px; }
.opp .skc-f { filter: none; }
.board .slot.gone { width: var(--cw, 17px); aspect-ratio: 100 / 140; border-radius: 3px; border: 1px dashed rgba(255, 255, 255, .25); }
.opp .board .slot.gone { --cw: 17px; }

/* centro: mazzo, carta in mano, scarti */
.gv-mid { padding: 4px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); display: grid; gap: 6px; justify-items: center; --pw: clamp(54px, 15vw, 82px); }
.lastbar { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--gold); color: #4a2a00; font: 800 13.5px var(--f-body); box-shadow: 0 4px 14px rgba(0, 0, 0, .3); animation: pulse 1.6s ease-in-out infinite; }
.piles { display: flex; gap: clamp(20px, 8vw, 40px); align-items: flex-end; justify-content: center; }
.pile, .hand { appearance: none; background: none; border: 0; padding: 0; color: var(--ink); display: grid; justify-items: center; gap: 4px; position: relative; font: inherit; }
.pile { cursor: pointer; }
.pile[aria-disabled] { cursor: default; }
.pl { font: 800 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .55); }
.pl i { font-style: normal; opacity: .75; }
.deck { width: var(--pw); height: calc(var(--pw) * 1.4 + 22px); }
.deck .stk { position: absolute; left: 0; top: calc(var(--k) * -2px); }
.deck .skc, .disc .skc, .hand .skc { --cw: var(--pw); }
.deck .pl { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.disc { width: var(--pw); height: calc(var(--pw) * 1.4 + 22px); }
.disc .under, .disc .dtop { position: absolute; left: 0; top: 0; }
.disc .under { transform: rotate(-5deg); opacity: .8; }
.disc .dtop { transform: rotate(3deg); }
.disc .dempty { position: absolute; left: 0; top: 0; width: var(--pw); aspect-ratio: 100 / 140; border-radius: 9px; border: 2px dashed rgba(255, 255, 255, .4); }
.disc .pl { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.hand { width: calc(var(--pw) * 1.12); height: calc(var(--pw) * 1.4 + 22px); }
.hslot { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: var(--pw); aspect-ratio: 100 / 140; border-radius: 9px; border: 2px dashed rgba(255, 255, 255, .35); display: grid; place-items: center; text-align: center; }
.hand.full .hslot { border-color: transparent; }
.hand.full .hc-card { animation: float 2.6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-5px) rotate(-1.5deg); } }
.hand-empty { font: 700 11px/1.2 var(--f-body); color: rgba(255, 255, 255, .85); padding: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.hand .pl { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); white-space: nowrap; max-width: calc(var(--pw) + 8px); overflow: hidden; text-overflow: ellipsis; }
.pile.can .skc, .pile.can .dempty { animation: glow 1.6s ease-in-out infinite; border-radius: 9px; }
.pile.deck.can .stk:last-child .skc { animation: glow 1.6s ease-in-out infinite; }
.pile.deck.can .stk:not(:last-child) .skc { animation: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px rgba(255, 215, 94, .9), 0 0 14px rgba(255, 215, 94, .6); } 50% { box-shadow: 0 0 0 3px rgba(255, 255, 255, .95), 0 0 26px rgba(255, 215, 94, .9); } }
.pile.disc.picked .dtop { transform: translateY(-12px) rotate(0) scale(1.06); transition: transform .2s var(--ease); }
.pile.disc.picked .dtop .skc { box-shadow: 0 0 0 3px #fff, 0 0 26px #8fe3ff; border-radius: 9px; animation: none; }
.pile.disc.dropping .dempty, .pile.disc.dropping .dtop .skc { box-shadow: 0 0 0 3px var(--coral), 0 0 22px var(--coral); animation: none; border-radius: 9px; }

/* barra delle istruzioni */
.gv-prompt { display: flex; align-items: center; gap: 8px; margin: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); padding: 7px 8px 7px 12px; border-radius: 14px; background: rgba(22, 34, 14, .78); backdrop-filter: blur(8px); border: 1px solid var(--line); flex-wrap: wrap; box-shadow: 0 6px 18px rgba(6, 18, 48, .3); }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 160px; }
.pr-txt b { color: #ffe7a0; }
.pr-b { display: flex; gap: 6px; align-items: center; margin-left: auto; flex: none; }
.gv-prompt .help { color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }

/* la mia griglia */

<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
window.GAME_PREFIX = 'prendi6/v1/';
/* ===== Prendi 6!: motore delle regole (gira sull'host; lo stato è JSON) =====
   104 carte numerate da 1 a 104; ognuna ha delle teste di toro (punti di penalità): il 55 ne ha 7, i doppi
   (11, 22, …) 5, i multipli di 10 ne hanno 3, quelli che finiscono per 5 ne hanno 2, le altre 1.
   A ogni manche: 10 carte a testa e 4 file sul tavolo, ognuna con una carta. A ogni turno tutti scelgono
   insieme e di nascosto una carta; poi le carte si mettono, dalla più bassa alla più alta, in fondo alla fila
   che finisce con il numero più vicino sotto (la differenza più piccola). Chi mette la sesta carta in una fila
   si prende le cinque carte della fila e la sua diventa la prima. Chi ha una carta più bassa di tutte le file
   sceglie una fila da prendere e la sua carta la sostituisce.
   La partita finisce quando qualcuno arriva a 66 teste (a fine manche): vince chi ne ha meno.
   Variante «tattica»: si usano solo le carte da 1 a 10 × giocatori + 4, così si sa quali carte ci sono. */
var P6Engine = (function () {
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function bulls(v) { return v === 55 ? 7 : v % 11 === 0 ? 5 : v % 10 === 0 ? 3 : v % 5 === 0 ? 2 : 1; }
  function sum(cards) { return cards.reduce(function (s, v) { return s + bulls(v); }, 0); }
  function nick(g, p) { return g.players[p].nick; }
  function log(g, t, k, p) { g.log.push({ n: ++g.logN, t: t, k: k || '', p: p == null ? null : p }); if (g.log.length > 90) g.log.splice(0, g.log.length - 90); }
  function fx(g, e) { e.n = ++g.fxN; g.fx.push(e); if (g.fx.length > 30) g.fx.splice(0, g.fx.length - 30); }
  function last(r) { return r[r.length - 1]; }
  // la fila dove va la carta v (null se è più bassa di tutte)
  function target(rows, v) { var best = null; rows.forEach(function (r, i) { if (last(r) < v && (best == null || last(r) > last(rows[best]))) best = i; }); return best; }
  function deckFor(g) { var n = g.opts.tactic ? g.players.length * 10 + 4 : 104, d = []; for (var v = 1; v <= n; v++) d.push(v); return shuffle(d); }

  function newGame(seats, opts) {
    opts = opts || {};
    var g = {
      v: 1, phase: 'pick', seq: 0, turnN: 0, round: 0,
      opts: { target: [33, 66, 99].indexOf(+opts.target) >= 0 ? +opts.target : 66, tactic: !!opts.tactic },
      players: seats.map(function (s, i) { return { uid: s.uid, nick: s.nick, bot: !!s.bot, away: false, col: i, hand: [], pick: null, pile: [], total: 0, hist: [], ready: false }; }),
      rows: [], queue: [], chooser: null, plays: null, log: [], logN: 0, fx: [], fxN: 0, winners: null, final: null, roundRes: null
    };
    startRound(g);
    return g;
  }
  function startRound(g) {
    g.round++; g.phase = 'pick'; g.roundRes = null; g.queue = []; g.chooser = null; g.plays = null;
    var d = deckFor(g);
    g.players.forEach(function (P) { P.hand = d.splice(0, 10).sort(function (a, b) { return a - b; }); P.pick = null; P.pile = []; P.ready = false; });
    g.rows = [0, 1, 2, 3].map(function () { return [d.pop()]; }).sort(function (a, b) { return a[0] - b[0]; });
    g.turnN++;
    log(g, 'Manche ' + g.round + ': 10 carte a testa, 4 file sul tavolo (' + g.rows.map(function (r) { return r[0]; }).join(', ') + ').', 'sys');
    fx(g, { k: 'deal', round: g.round });
  }
  function decider(g) {
    if (g.phase === 'choose') return g.chooser;
    if (g.phase !== 'pick') return null;
    for (var i = 0; i < g.players.length; i++) if (g.players[i].pick == null) return i;
    return null;
  }
  function pending(g) {
    if (g.phase === 'choose') return [g.chooser];
    if (g.phase === 'pick') return g.players.map(function (P, i) { return i; }).filter(function (i) { return g.players[i].pick == null; });
    if (g.phase === 'scores') return g.players.map(function (P, i) { return i; }).filter(function (i) { return !g.players[i].ready; });
    return [];
  }
  function startResolve(g) {
    g.queue = g.players.map(function (P, p) { return { p: p, v: P.pick }; }).sort(function (a, b) { return a.v - b.v; });
    g.plays = g.queue.map(function (x) { return { p: x.p, v: x.v }; });
    g.players.forEach(function (P) { P.hand.splice(P.hand.indexOf(P.pick), 1); P.pick = null; });
    fx(g, { k: 'reveal', plays: g.plays });
    log(g, 'Si scoprono: ' + g.plays.map(function (x) { return nick(g, x.p) + ' ' + x.v; }).join(', ') + '.', 'reveal');
    process(g);
  }
  function takeRow(g, p, r, v, why) {
    var P = g.players[p], cards = g.rows[r], b = sum(cards);
    P.pile = P.pile.concat(cards); g.rows[r] = [v];
    fx(g, { k: 'take', p: p, r: r, v: v, cards: cards, bulls: b, why: why });
    log(g, nick(g, p) + (why === 'low' ? ' ha la carta più bassa (' + v + ') e prende' : ' mette la sesta carta (' + v + ') e prende') + ' la fila ' + (r + 1) + ': ' + b + (b > 1 ? ' teste.' : ' testa.'), 'take', p);
  }
  function process(g) {
    while (g.queue.length) {
      var x = g.queue[0], r = target(g.rows, x.v);
      if (r == null) { g.phase = 'choose'; g.chooser = x.p; fx(g, { k: 'needrow', p: x.p, v: x.v }); return; }
      g.queue.shift();
      if (g.rows[r].length >= 5) takeRow(g, x.p, r, x.v, 'six');
      else { g.rows[r].push(x.v); fx(g, { k: 'place', p: x.p, v: x.v, r: r, i: g.rows[r].length - 1 }); }
    }
    g.chooser = null;
    if (!g.players[0].hand.length) { endRound(g); return; }
    g.phase = 'pick'; g.turnN++;
    fx(g, { k: 'turn' });
  }
  function endRound(g) {
    var pts = g.players.map(function (P) { return sum(P.pile); });
    g.players.forEach(function (P, i) { P.total += pts[i]; P.hist.push(pts[i]); P.ready = !!P.bot; });
    g.roundRes = { pts: pts, piles: g.players.map(function (P) { return P.pile.slice().sort(function (a, b) { return a - b; }); }) };
    log(g, 'Fine della manche ' + g.round + ': ' + g.players.map(function (P, i) { return P.nick + ' ' + pts[i]; }).join(', ') + '.', 'round');
    if (g.players.some(function (P) { return P.total >= g.opts.target; })) {
      var order = g.players.map(function (P, i) { return i; }).sort(function (a, b) { return g.players[a].total - g.players[b].total || a - b; });
      var place = g.players.map(function (P) { return 1 + g.players.filter(function (Q) { return Q.total < P.total; }).length; });
      g.winners = order.filter(function (i) { return place[i] === 1; });
      g.final = { order: order, place: place };
      g.phase = 'over';
      log(g, (g.winners.length > 1 ? 'Pari! Vincono ' + g.winners.map(function (i) { return nick(g, i); }).join(' e ') : 'Vince ' + nick(g, g.winners[0])) + ' con ' + g.players[g.winners[0]].total + ' teste.', 'win', g.winners[0]);
      fx(g, { k: 'roundEnd', round: g.round, over: true });
      fx(g, { k: 'over', p: g.winners[0] });
    } else {
      g.phase = 'scores';
      fx(g, { k: 'roundEnd', round: g.round, over: false });
    }
  }
  function act(g, p, a) {
    if (!a || typeof a.a !== 'string') return 'Mossa non valida.';
    if (g.phase === 'over') return 'La partita è finita.';
    if (!g.players[p]) return 'Non sei al tavolo.';
    var r = doAct(g, p, a);
    if (!r) g.seq++;
    return r;
  }
  function doAct(g, p, a) {
    var P = g.players[p];
    if (g.phase === 'scores') {
      if (a.a !== 'next') return 'Tocca «Prossima manche».';
      if (P.ready) return null;
      P.ready = true;
      if (g.players.every(function (Q) { return Q.ready || Q.bot; })) { startRound(g); fx(g, { k: 'next' }); }
      return null;
    }
    if (g.phase === 'choose') {
      if (g.chooser !== p) return 'Aspetta: ' + nick(g, g.chooser) + ' sta scegliendo quale fila prendere.';
      if (a.a !== 'row') return 'Scegli quale fila prendere.';
      var r = +a.r; if (!(r >= 0 && r < 4) || r !== Math.floor(r)) return 'Scegli una delle quattro file.';
      var x = g.queue.shift();
      takeRow(g, p, r, x.v, 'low');
      process(g);
      return null;
    }
    if (g.phase !== 'pick') return 'Mossa non valida.';
    if (a.a === 'unpick') { if (P.pick == null) return null; P.pick = null; fx(g, { k: 'picked', p: p, on: false }); return null; }
    if (a.a !== 'pick') return 'Mossa sconosciuta.';
    var v = +a.v; if (P.hand.indexOf(v) < 0) return 'Questa carta non è nella tua mano.';
    P.pick = v;
    fx(g, { k: 'picked', p: p, on: true });
    if (g.players.every(function (Q) { return Q.pick != null; })) startResolve(g);
    return null;
  }
  function forceNext(g) { if (g.phase !== 'scores') return false; g.players.forEach(function (P) { P.ready = true; }); startRound(g); fx(g, { k: 'next' }); g.seq++; return true; }

  return { newGame: newGame, act: act, decider: decider, pending: pending, forceNext: forceNext, bulls: bulls, sum: sum, target: target, last: last, setRandom: setRandom, shuffle: shuffle };
})();

/* ===== Serie di partite e risultati (condivisi da tutti i giochi) =====
   Serie: con «Nuova partita con lo stesso tavolo» le vittorie si sommano; l'host può scegliere «al meglio di 3 / di 5».
   La tiene l'host nello stato del tavolo (doc.series), aggiornata quando una partita finisce.
   Risultati: a fine partita chi ha l'account registra il proprio sul server (statistiche e classifica tra amici).
   Ogni gioco dice chi ha vinto con Score.setup({ game, result(g) -> [{ won, place, score }] per giocatore }). */
var Score = (function () {
  var cfg = null;
  function setup(c) { cfg = c; }
  function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function result(g) { if (!cfg || !g) return null; try { var r = cfg.result(g); return Array.isArray(r) && r.length === g.players.length ? r : null; } catch (e) { return null; } }
  function need(s) { return s && s.target ? Math.floor(s.target / 2) + 1 : 0; }

  // Solo sull'host, prima di ogni pubblicazione: ogni partita ha un numero (gid); a fine partita la serie si aggiorna una volta sola.
  function beforePublish(doc) {
    if (!doc) return;
    if (doc.phase === 'lobby' || !doc.game) { doc.gid = null; return; }
    if (!doc.gid) doc.gid = rid();
    if (doc.phase !== 'over') return;
    var s = doc.series || (doc.series = { target: 0, n: 0, wins: {}, names: {}, champ: null, last: null });
    if (s.last === doc.gid) return;
    var res = result(doc.game); if (!res) return;
    if (s.champ) { s.n = 0; s.wins = {}; s.champ = null; }   // la serie di prima era già vinta: ne comincia una nuova
    s.last = doc.gid; s.n++;
    doc.game.players.forEach(function (P, i) {
      s.names[P.uid] = P.nick;
      if (!(P.uid in s.wins)) s.wins[P.uid] = 0;
      if (res[i] && res[i].won) s.wins[P.uid]++;
    });
    var k = need(s);
    if (k) s.champ = Object.keys(s.wins).filter(function (u) { return s.wins[u] >= k; }).sort(function (a, b) { return s.wins[b] - s.wins[a]; })[0] || null;
  }
  // Operazione dell'host: tipo di serie (0 = partite singole, 3 o 5 = al meglio di). Ricomincia da zero.
  function op(work, from, o) {
    if (work.host !== from) return { err: 'Solo l’host può farlo.' };
    if (work.phase === 'play') return { err: 'Si cambia tra una partita e l’altra.' };
    var t = o.target === 3 || o.target === 5 ? o.target : 0, last = work.series && work.series.last;

  function standings(doc) {

    var k = need(s), champ = s.champ && s.names[s.champ];
    return '<div class="sc-box" role="status">' +
      (champ ? '<div class="sc-champ">🏆 ' + esc(champ) + ' vince la serie!</div>' : '') +
      '<div class="sc-head"><b>Serie</b> · ' + s.n + (s.n === 1 ? ' partita' : ' partite') + (k ? ' · al meglio di ' + s.target + (champ ? '' : ' (vince chi arriva a ' + k + ')') : '') + '</div>' +
      '<div class="sc-rows">' + rows.map(function (u) { return '<span class="sc-p' + (u === s.champ ? ' on' : '') + (window.Net && u === Net.uid ? ' me' : '') + '">' + esc(s.names[u] || '…') + ' <b>' + s.wins[u] + '</b></span>'; }).join('') + '</div>' +
      (champ ? '<div class="sc-note">Con una nuova partita comincia un’altra serie.</div>' : '') + '</div>';
  }
  var CSS = '.sc-box{display:grid;gap:6px;padding:10px 12px;border-radius:12px;border:1px solid rgba(230,197,111,.45);background:rgba(230,197,111,.08);font-size:15px;line-height:1.35;text-align:left}' +
    '.sc-champ{font-weight:800;font-size:17px}.sc-rows{display:flex;flex-wrap:wrap;gap:6px}.sc-p{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap}.sc-p.on{background:rgba(230,197,111,.35)}.sc-p.me{box-shadow:inset 0 0 0 1px currentColor}' +
    '.sc-note,.sc-head{font-size:13.5px;opacity:.85}';
  function css() { if (!document.getElementById('sc-css')) { var st = document.createElement('style'); st.id = 'sc-css'; st.textContent = CSS; document.head.appendChild(st); } }
  // Sala d'attesa: scelta della serie (host) e classifica della serie in corso.
  function roomHTML(doc, isHost) {
    css();
    var t = doc.series ? doc.series.target || 0 : 0;
    return '<label style="display:grid;gap:6px"><span><b>Serie di partite</b><br><span class="muted" style="font-size:15px">Con «Nuova partita con lo stesso tavolo» le vittorie si sommano.</span></span>' +
      '<select id="opt-series" class="field"' + (isHost ? '' : ' disabled') + ' style="font-size:16px;min-height:44px">' +
      [[0, 'Partite singole (conto le vittorie)'], [3, 'Al meglio di 3'], [5, 'Al meglio di 5']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' + standings(doc);
  }
  function endHTML(doc) { css(); return standings(doc); }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'opt-series' && window.Net) Net.send({ t: 'series', target: +e.target.value }).catch(function (er) { console.warn(er); });
  });

  // Risultato personale sul server (una volta per partita, solo con l'account; le partite di prova non contano).
  var RKEY = 'pp-reported', trying = {};
  function reported() { try { return JSON.parse(localStorage.getItem(RKEY) || '[]'); } catch (e) { return []; } }
  function report() {
    var d = window.App && App.doc;
    if (!cfg || !d || d.phase !== 'over' || !d.game || !d.gid || d.practice || !window.Account || !Account.user() || !window.Net) return;
    var g = d.game, me = -1; g.players.forEach(function (P, i) { if (P.uid === Net.uid) me = i; });
    if (me < 0) return;
    var key = cfg.game + ':' + d.code + ':' + d.gid, done = reported();
    if (done.indexOf(key) >= 0 || (trying[key] && Date.now() - trying[key] < 30000)) return;
    var r = result(g); if (!r || !r[me]) return;
    trying[key] = Date.now();
    Account.rpc('report_result', { p_token: Account.token, p_game: cfg.game, p_match: key, p_won: !!r[me].won, p_place: r[me].place || null, p_players: g.players.length,
      p_score: r[me].score == null ? null : Math.round(r[me].score), p_rivals: g.players.filter(function (P, i) { return i !== me; }).map(function (P) { return String(P.nick || '').slice(0, 18); }) })
      .then(function () { var l = reported(); l.push(key); try { localStorage.setItem(RKEY, JSON.stringify(l.slice(-60))); } catch (e) {} }, function () {});
  }
  setInterval(report, 2500);
  return { setup: setup, beforePublish: beforePublish, op: op, roomHTML: roomHTML, endHTML: endHTML, standings: standings, result: result };
})();

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,
   senza limite di tempo. Durante la partita una barra in alto spiega cosa fare adesso e propone la mossa consigliata
   (quella che sceglierebbe il giocatore automatico). Ogni gioco dà i suoi consigli con Coach.setup({ bots, tip(g, me) }).
   Usa le funzioni globali dei giochi: App, E, BOT, act, myIdx, requireNick, run, enterTable. */
var Coach = (function () {
  var cfg = null, hidden = false, lastHTML = '';
  function setup(c) { cfg = c; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var CSS = '.cx-start{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px dashed rgba(255,255,255,.22);border-radius:12px;font-size:14.5px;line-height:1.35}.cx-start span{flex:1;min-width:180px;opacity:.9}' +
    '.cx-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));z-index:9980;width:min(540px,calc(100vw - 16px));display:flex;gap:10px;align-items:flex-start;padding:10px 10px 10px 12px;border-radius:14px;background:rgba(18,30,44,.94);color:#eef4fb;border:1px solid rgba(140,200,255,.45);box-shadow:0 10px 26px rgba(0,0,0,.45);font:14.5px/1.4 system-ui,-apple-system,sans-serif}' +
    '.cx-bar .cx-t{flex:1;min-width:0}.cx-bar b{color:#9fd3ff}.cx-bar .cx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +
    '.cx-bar button{appearance:none;font:600 13.5px system-ui,sans-serif;border-radius:999px;padding:7px 12px;border:1px solid #9fd3ff;background:transparent;color:inherit;cursor:pointer}.cx-bar button.main{background:#9fd3ff;color:#0e1a26;border-color:#9fd3ff}' +
    '.cx-bar .cx-x{border:0;padding:2px 6px;font-size:20px;line-height:1;opacity:.7}.cx-pill{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:9980;appearance:none;border:1px solid rgba(140,200,255,.6);background:rgba(18,30,44,.94);color:#eef4fb;border-radius:999px;padding:7px 12px;font:600 13.5px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}';
  function css() { if (!document.getElementById('cx-css')) { var s = document.createElement('style'); s.id = 'cx-css'; s.textContent = CSS; document.head.appendChild(s); } }
  function buttonHTML() {
    if (!cfg || (window.App && App.code)) return '';
    css();
    return '<div class="cx-start"><span>' + (cfg.startText || 'Non conosci ancora il gioco? Prova una partita contro i bot: ti spiego ogni mossa.') + '</span><button type="button" class="btn small" data-coach="start">🎓 Partita guidata</button></div>';
  }
  function wait(fn, ms) { return new Promise(function (res, rej) { var t0 = Date.now(), iv = setInterval(function () { if (fn()) { clearInterval(iv); res(); } else if (Date.now() - t0 > ms) { clearInterval(iv); rej('Il tavolo di prova non risponde: riprova.'); } }, 150); }); }
  function start() {
    var nick = requireNick(); if (!nick) return;
    hidden = false;
    run(async function () {
      var code = await Net.create(nick, { practice: true });
      await enterTable(code, nick);
      await wait(function () { return App.doc && App.doc.code === code && Net.isHost; }, 15000);
      for (var i = 0; i < (cfg.bots || 2); i++) await Net.send({ t: 'addbot' });

  function myTurn(g, me) {

  }
  var flashTxt = null, flashT = null;

    }
    if (pill) pill.remove();

    if (g.phase === 'over' || d.phase === 'over') txt = '<b>Partita finita!</b> Dalla schermata finale puoi giocarne un’altra con lo stesso tavolo, oppure esci e apri un tavolo vero con i tuoi amici.';
    else {
      var t = null; try { t = cfg.tip(g, me, mine); } catch (e) { t = null; }
      if (!t && !mine) { var dd = E.decider(g); t = dd != null && g.players[dd] ? 'Tocca a <b>' + esc(g.players[dd].nick) + '</b> (bot): guarda cosa fa, poi tocca a te.' : 'Aspetta un attimo: gli altri stanno giocando.'; }

    var html = '<span aria-hidden="true">🎓</span><div class="cx-t">' + txt + (mine && g.phase !== 'over' ? '<div class="cx-row"><button type="button" class="main" data-coach="suggest">Fai la mossa consigliata</button><button type="button" data-coach="rules">Regole</button></div>' : '') + '</div><button type="button" class="cx-x" data-coach="hide" aria-label="Nascondi la guida">×</button>';
    if (!bar) { bar = document.createElement('div'); bar.className = 'cx-bar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }

  function setup(onBack) { handler = onBack; }
  function guard(code) {
    var url = location.pathname + '?t=' + code;
    if (history.state && history.state.ppTable === code) history.replaceState({ ppTable: code }, '', url);
    else history.pushState({ ppTable: code }, '', url);
  }
  window.addEventListener('popstate', function (ev) {
    // la chat aperta si chiude con "indietro", restando al tavolo
    if (window.Chat && Chat.isOpen()) { Chat.close(); if (window.App && App.code && App.screen === 'table') guard(App.code); return; }
    if (handler) handler(ev.state || null);
  });
  return { setup: setup, guard: guard };
})();

/* ===== Reazioni rapide al tavolo (condivise): un tocco e tutti vedono l'emoji per qualche secondo =====
   Il pulsante sta accanto a «Chat» nella barra in alto (Chat.badgeHTML lo aggiunge). Passano direttamente
   tra i giocatori sul canale «react» del tavolo, come la chat, senza cronologia. */
var Reactions = (function () {
  var EMO = ['😂', '👏', '😱', '😡', '😎', '🤞', '🙏', '💀'];

    '.rx-pick button{appearance:none;border:0;background:rgba(255,255,255,.06);border-radius:12px;font-size:28px;line-height:1;width:52px;height:52px;cursor:pointer}.rx-pick button:active{transform:scale(.9)}' +
    '.rx-lay{position:fixed;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));z-index:9989;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}' +
    '.rx-b{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(20,18,26,.88);color:#fff;font:600 15px system-ui,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:rxpop 3.2s ease-out forwards}' +
    '.rx-b i{font-style:normal;font-size:34px;line-height:1;animation:rxbig .6s ease-out}' +
    '@keyframes rxin{from{opacity:0;transform:translateY(-6px)}}@keyframes rxbig{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}' +
    '@keyframes rxpop{0%{opacity:0;transform:translateY(-10px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}' +
    '@media (prefers-reduced-motion: reduce){.rx-b,.rx-b i,.rx-pick{animation:none}}';
  function css() { if (!document.getElementById('rx-css')) { var s = document.createElement('style'); s.id = 'rx-css'; s.textContent = CSS; document.head.appendChild(s); } }
  function buttonHTML() { css(); return '<button class="iconbtn rx-btn" type="button" data-rx="open" aria-label="Reazione rapida">😊</button>'; }
  function myNick() {
    var d = window.App && App.doc; if (!d || !window.Net) return '';
    var s = d.seats.filter(function (x) { return x.uid === Net.uid; })[0];
    return s ? s.nick : (window.Account && Account.user() ? Account.user().username : 'Spettatore');
  }
  function close() { var p = document.querySelector('.rx-pick'); if (p) p.remove(); open = false; }

    css(); close(); open = true;
    var p = document.createElement('div'); p.className = 'rx-pick'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Scegli una reazione');
    p.innerHTML = EMO.map(function (e) { return '<button type="button" data-rx="send" data-e="' + e + '">' + e + '</button>'; }).join('');
    document.body.appendChild(p);
  }

    css();
    var lay = document.querySelector('.rx-lay'); if (!lay) { lay = document.createElement('div'); lay.className = 'rx-lay'; lay.setAttribute('aria-live', 'polite'); document.body.appendChild(lay); }
    while (lay.children.length > 3) lay.firstChild.remove();
    var b = document.createElement('div'); b.className = 'rx-b'; b.innerHTML = '<i></i><span></span>';
    b.querySelector('i').textContent = e; b.querySelector('span').textContent = nick;

  }

    if (EMO.indexOf(e) < 0 || !window.Net) return;

    s.push(now);
    var d = window.App && App.doc, seat = d && d.seats.filter(function (x) { return x.uid === m.uid; })[0];

  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) close(); });
  return { buttonHTML: buttonHTML, send: send, show: show, EMO: EMO };
})();

/* ===== Suoni e musica (condiviso) =====
   Musica di sottofondo da file (licenze libere), effetti in parte registrati e in parte sintetizzati con Web Audio.
   Le preferenze (musica / effetti) valgono per questo telefono. Il suono parte solo dopo il primo tocco (regole dei browser). */

/* ---------- l'host muove i giocatori automatici ---------- */
function botStep(p, wait) {
  var g = G(), key = App.code + ':' + g.seq + ':' + p;
  if (App.botKeys[p] === key) return; App.botKeys[p] = key;
  setTimeout(function () {
    Net.hostApply(function (cur) {
      if (!cur || !cur.game || cur.phase !== 'play') return false;
      var gg = cur.game; if (!gg.players[p] || !gg.players[p].bot) return false;
      var a = BOT.decide(gg, p); if (!a) return false;
      var err = E.act(gg, p, a);
      if (err) { console.warn('automatico', err, a); return false; }
      if (gg.phase === 'over') cur.phase = 'over';
      return true;
    });
  }, wait);
}
function driveBots() {
  var doc = App.doc;
  if (!doc || !Net.isHost || doc.phase !== 'play' || !doc.game) return;
  var g = doc.game;
  if (g.phase === 'pick') g.players.forEach(function (P, p) { if (P.bot && P.pick == null) botStep(p, 900 + Math.random() * 1400 + p * 120); });
  else if (g.phase === 'choose' && g.players[g.chooser].bot) botStep(g.chooser, 1600);
  else if (g.phase === 'scores' && g.players.every(function (P) { return P.ready || P.bot; })) {
    var key = App.code + ':next:' + g.round; if (App.botKeys.next === key) return; App.botKeys.next = key;
    setTimeout(function () { Net.hostApply(function (cur) { return !!(cur && cur.game && cur.game.round === g.round && E.forceNext(cur.game)); }); }, 5000);
  }
}

/* ---------- stato in arrivo ---------- */
function onDoc() {
  var g = G(), me = myIdx();
  // partita nuova sullo stesso tavolo (rivincita con le stesse persone): fogli, animazioni e suoni ripartono da zero
  if (App.gidSeen && App.doc.gid !== App.gid) { App.sheetKey = null; App.sheet = null; App.lastFxN = 0; App.hide = {}; App.mode = null; App.sel = []; App.shown = {}; App.pw = null; }
  App.gid = App.doc.gid; App.gidSeen = true;
  // il tavolo è tornato in sala d'attesa (nuova partita con le stesse persone): i contatori degli effetti ripartono da zero
  if (!g && App.lastFxN) { App.lastFxN = 0; App.hide = {}; }
  if (App.screen !== 'table') { driveBots(); Turns.watch(App.doc); paintCur(); return; }
  if (g) {
    if (me >= 0 && !App.introShown) { App.introShown = true; if (!lsGet('p6-intro-done')) App.sheet = { kind: 'intro', page: 0 }; }
    var hk = g.round + ':' + g.turnN; if (App.handKey !== hk) { App.handKey = hk; App.sel = []; App.cho = false; }
    if (App.sheet && App.sheet.kind === 'round' && g.phase !== 'scores' && g.phase !== 'over') App.sheet = null;
  } else App.mode = null;
  render(); if (g) Game.fx(g, me); driveBots(); Turns.watch(App.doc);
  if (g) App.seenFirstDoc = true;
}

/* ===== Prendi 6!: schermata di gioco (le 4 file, la mano, le carte scoperte) e animazioni =====
   Quando tutti hanno scelto, le carte scoperte compaiono in ordine dalla più bassa e vanno nelle file una alla

  }
  function art(v) { v = +v; return v === 1 || v === 8 || v === 11 || (v >= 80 && v <= 89) ? 'l’' : 'il '; }   // l’1, l’8, l’11, l’80…
  function heads(n) { return '<span class="hds">' + ART.head() + '<b>' + n + '</b></span>'; }
  function status(g, p) {
    var P = g.players[p];

function renderSheet() {

  var sc = same && root.querySelector('.sheet') ? root.querySelector('.sheet').scrollTop : 0;
  root.innerHTML = '<div class="sheet-back' + (same ? ' still' : '') + '" data-act="sheetback"><div class="sheet sh-' + s.kind + '" role="dialog" aria-modal="true">' + h + '</div></div>'; root._h = h;
  if (sc) root.querySelector('.sheet').scrollTop = sc;
  if (s.kind === 'rules' && s.focus) { var t = document.getElementById('r-' + s.focus); if (t) t.scrollIntoView({ block: 'start' }); }
  s.fresh = false;
}

/* ---------- eventi ---------- */

    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s && s.kind !== 'help' ? s : null }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'scorecard': App.sheet = { kind: 'scorecard' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('p6-intro-done', '1'); App.sheet = s.after || null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'showround': App.sheet = { kind: 'round' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;

    case 'totable': toTable(); break;

    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;

    case 'hcard': {
      if (!g || g.phase !== 'pick' || me < 0 || g.players[me].pick != null) return;

  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
