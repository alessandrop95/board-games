<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presagio</title>
<meta name="description" content="Gioco di carte a prese con previsione, da 3 a 6 giocatori, ognuno dal proprio telefono.">
<meta name="theme-color" content="#12142a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presagio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="pwa-sw" content="../sw.js" data-scope="../">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:wght@400;600;700&family=Uncial+Antiqua&display=swap">
<style>
/* Layout: tavolo da osservatorio notturno; giocatori in fila in alto, presa al centro su panno blu, mano e previsione in un pannello fisso in basso */
:root {
  --night: #12142a; --night-2: #1b1e3c; --night-3: #272a52; --felt: #1f3550;
  --ivory: #f5eedb; --gold: #d8b25a; --gold-2: #a4823a; --text: #ece6d6; --muted: #a9a4c4;
  --ok: #8fd19e; --bad: #f08a7a; --line: rgba(236, 230, 214, .14);
  --f-disp: 'Uncial Antiqua', 'Cinzel', Georgia, serif;
  --f-label: 'Cinzel', Georgia, serif;
  --f-body: 'EB Garamond', Georgia, 'Times New Roman', serif;
  --dock-h: 210px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; color: var(--text); font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background-color: var(--night);
  background-image: radial-gradient(ellipse 90% 50% at 50% -10%, rgba(120, 110, 220, .22), transparent 70%), radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 70% 12%, #fff6 50%, transparent 51%), radial-gradient(1px 1px at 85% 60%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 40% 80%, #fff4 50%, transparent 51%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night-2); }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { appearance: none; cursor: pointer; border: 1px solid #0006; border-radius: 999px; padding: 10px 20px; min-height: 46px; font-family: var(--f-label); font-weight: 700; font-size: 15px; letter-spacing: .06em;
  background: linear-gradient(180deg, #f0d48a, #c39a45); color: #231a08; box-shadow: inset 0 1px 0 #fff8, 0 3px 10px #0007; }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); box-shadow: none; font-family: var(--f-body); font-weight: 400; font-size: 16px; letter-spacing: 0; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: 14px; }
.btn.block { width: 100%; }
input.field { font: inherit; font-size: 18px; color: #1b1a2e; background: var(--ivory); border: 2px solid var(--gold-2); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%; }
input.field.code { font-family: var(--f-label); font-weight: 700; letter-spacing: .3em; text-transform: uppercase; text-align: center; }

/* lobby */
.lobby { padding-block: 26px 48px; display: grid; gap: 20px; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }
.hero { display: grid; gap: 14px; align-items: center; }
.hero h1 { font-family: var(--f-disp); font-size: clamp(46px, 13vw, 84px); line-height: .95; color: var(--ivory); text-shadow: 0 0 30px rgba(216, 178, 90, .35); }
.hero .tag { font-size: 18px; color: #d7d0ea; max-width: 44ch; margin: 0; }
.fan { position: relative; height: 170px; }
.fan .card { position: absolute; left: 50%; top: 6px; --cw: 96px; transform-origin: 50% 130%; box-shadow: 0 10px 22px #0009; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.3fr 1fr; } .fan { height: 210px; } .fan .card { --cw: 120px; } }
.panel { background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-family: var(--f-label); font-size: 20px; color: var(--ivory); letter-spacing: .04em; }
.lead { color: var(--muted); font-size: 15px; margin: 0; }
.grid2 { display: grid; gap: 16px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.notice { border-left: 3px solid var(--gold); padding: 8px 12px; background: rgba(216, 178, 90, .08); border-radius: 0 8px 8px 0; font-size: 15px; }
.notice.red { border-color: var(--bad); background: rgba(240, 138, 122, .1); }
.trow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; }
.trow .code { font-family: var(--f-label); font-weight: 700; letter-spacing: .2em; color: var(--gold); }
.trow .grow { flex: 1; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px dashed var(--line); border-radius: 10px; min-height: 56px; }
.seat.full { border-style: solid; background: rgba(255, 255, 255, .04); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; background: var(--night-3); display: grid; place-items: center; font-family: var(--f-label); color: var(--gold); flex: none; }
.seat .nm { font-weight: 700; overflow-wrap: anywhere; }
.seat .sub { font-size: 13px; color: var(--muted); }
.seat .x { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 22px; padding: 4px 8px; }
.codebig { font-family: var(--f-label); font-size: 36px; font-weight: 700; letter-spacing: .3em; color: var(--gold); }
.switch { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.switch input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--gold); flex: none; }
.switch b { font-weight: 600; }
.switch.ro { cursor: default; opacity: .85; }

/* carte */
.card { --cw: 80px; width: var(--cw); aspect-ratio: 100 / 140; flex: none; position: relative; border-radius: calc(var(--cw) * .08); box-shadow: 0 2px 6px #0008, 0 0 0 1px #0006; background: var(--ivory); user-select: none; }
.card svg { width: 100%; height: 100%; display: block; }
.card.back { background: #1d1c3d; }

/* tavolo */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(18, 20, 42, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.topbar .brand { font-family: var(--f-disp); color: var(--gold); font-size: 21px; }
.topbar .info { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--text); border-radius: 999px; min-height: 36px; padding: 4px 12px; cursor: pointer; font-size: 14px; }
.board { padding-block: 12px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.players { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.pl { position: relative; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); display: grid; gap: 2px; min-width: 0; text-align: left; appearance: none; color: inherit; font: inherit; }
.pl .nk { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
.pl .sc { font-family: var(--f-label); font-size: 13px; color: var(--muted); }
.pl .bt { display: flex; gap: 6px; align-items: baseline; font-family: var(--f-label); font-size: 14px; }
.pl .bt .t { font-size: 20px; font-weight: 700; color: var(--ivory); }
.pl .bt.hit .t { color: var(--ok); } .pl .bt.over .t { color: var(--bad); }
.pl.turn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(216, 178, 90, .3); }
.pl.me { background: rgba(216, 178, 90, .08); }
.pl .dealer { position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #231a08; font-family: var(--f-label); font-weight: 700; font-size: 11px; display: grid; place-items: center; }
.pl.flash { animation: glow 1.2s ease-out; }
@keyframes glow { 0% { box-shadow: 0 0 0 3px var(--ok), 0 0 26px var(--ok); } 100% { box-shadow: none; } }

.felt { position: relative; border-radius: 18px; padding: 14px; min-height: 230px; background: radial-gradient(ellipse at 50% 40%, #2c4d70, var(--felt) 70%); border: 1px solid #0006; box-shadow: inset 0 0 40px #0008; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.trumpbox { display: grid; justify-items: center; gap: 4px; font-family: var(--f-label); font-size: 12px; color: #cdd8e6; text-align: center; }
.trumpbox .card { --cw: 64px; }
.trumpbox .none { width: 64px; aspect-ratio: 100/140; border-radius: 6px; border: 1px dashed #fff4; display: grid; place-items: center; font-size: 11px; padding: 4px; }
.trick { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; min-width: 0; }
.tc { display: grid; justify-items: center; gap: 4px; }
.tc .card { --cw: 72px; animation: drop .25s ease-out; }
.tc .who { font-size: 13px; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #dfe7f1; }
.tc.win .card { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(216, 178, 90, .7); }
.tc.win .who { color: var(--gold); font-weight: 700; }
.trick .msg { color: #cdd8e6; font-size: 15px; align-self: center; }
@keyframes drop { from { transform: translateY(-14px) scale(1.06); opacity: 0; } }
.status { font-size: 15px; color: #dfe7f1; grid-column: 1 / -1; border-top: 1px solid #ffffff1a; padding-top: 8px; }
.status b { color: var(--gold); font-weight: 600; }
.feed { display: grid; gap: 2px; font-size: 14px; color: var(--muted); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: linear-gradient(180deg, #1f2146, #121329); border-top: 1px solid #ffffff22; box-shadow: 0 -10px 26px #0009; padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { display: grid; gap: 8px; padding-block: 8px 10px; }
.dock .hint { font-size: 15px; color: #dcd6ee; min-height: 22px; }
.dock .hint b { color: var(--gold); font-weight: 600; }
.hand { display: flex; padding: 12px 4px 4px 4px; overflow-x: auto; min-height: 124px; -webkit-overflow-scrolling: touch; }
.hand .card { --cw: 74px; cursor: pointer; transition: transform .15s ease; }
.hand .card + .card { margin-left: var(--ov, 6px); }
.hand .card.ok:hover, .hand .card.sel { transform: translateY(-10px); }
.hand .card.sel { box-shadow: 0 0 0 3px var(--gold), 0 8px 16px #000a; }
.hand .card.no { filter: brightness(.55) saturate(.6); cursor: not-allowed; }
.hand .empty { color: var(--muted); align-self: center; }
.bids { display: flex; gap: 6px; flex-wrap: wrap; }
.bids button { appearance: none; min-width: 46px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ivory); font-family: var(--f-label); font-weight: 700; font-size: 18px; cursor: pointer; }
.bids button.fb { opacity: .3; text-decoration: line-through; cursor: not-allowed; }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.suits button { appearance: none; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--ivory); min-height: 56px; display: grid; justify-items: center; gap: 2px; cursor: pointer; font-size: 13px; padding: 6px; }

.sheet-back { position: fixed; inset: 0; z-index: 40; background: #05061099; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, #24264d, #15162e); border: 1px solid #ffffff22; border-bottom: 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(30px); } }
.sheet h2 { font-family: var(--f-label); font-size: 21px; color: var(--ivory); }
.sheet .rules { display: grid; gap: 10px; font-size: 16px; }
.sheet .rules h3 { font-family: var(--f-label); font-size: 16px; color: var(--gold); margin-top: 4px; }
.sheet .rules p, .sheet .rules ul { margin: 0; }
.sheet .rules ul { padding-left: 20px; display: grid; gap: 4px; }
.tbl-wrap { overflow-x: auto; }
table.sc { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
table.sc th, table.sc td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.sc th:first-child, table.sc td:first-child, table.sc .l { text-align: left; }
table.sc th { font-family: var(--f-label); font-weight: 700; font-size: 13px; color: var(--muted); }
table.sc .pos { color: var(--ok); } table.sc .neg { color: var(--bad); }
table.sc tr.tot td { font-weight: 700; color: var(--ivory); border-bottom: 0; }
table.sc .small { font-size: 12px; color: var(--muted); display: block; }
.winner { font-family: var(--f-disp); font-size: 30px; color: var(--gold); text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: #0b0c1df2; border: 1px solid var(--gold-2); color: var(--ivory); padding: 10px 14px; border-radius: 10px; font-size: 15px; max-width: min(90vw, 460px); text-align: center; }
.stamp { position: fixed; left: 50%; top: 40%; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); font-family: var(--f-disp); font-size: clamp(30px, 9vw, 56px); color: var(--gold); text-shadow: 0 0 24px rgba(216, 178, 90, .6), 0 3px 0 #000; animation: stamp 1.3s ease-out forwards; white-space: nowrap; }
@keyframes stamp { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }

</style>

<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
window.GAME_PREFIX = 'presagio/v1/';
/* ===== Rete senza account: MQTT su WebSocket verso broker pubblici gratuiti =====
   Modello: il dispositivo "host" del tavolo tiene la verità. Pubblica lo stato completo
   come messaggio "retained" (chi arriva lo riceve subito); gli altri inviano solo azioni.
   Robustezza: controllo continuo che il server risponda, riconnessione immediata quando
   la pagina torna in primo piano, subentro automatico se l'host sparisce. */

var NETQ = new URLSearchParams(location.search);
var NET_PING_MS = +(NETQ.get('ping') || 10000);     // ogni quanto si interroga il server
var NET_DEAD_MS = +(NETQ.get('dead') || 15000);     // silenzio oltre il quale si verifica la connessione
var NET_PROBE_MS = 5000;                            // attesa della risposta alla verifica

/* ---------- client MQTT 3.1.1 minimo ---------- */
function MQ(url) {
  this.url = url; this.subs = {}; this.handlers = []; this.statusHandlers = [];
  this.connected = false; this.closed = false; this.pid = 1; this.buf = new Uint8Array(0);
  this.backoff = 800; this.lastRx = Date.now(); this.id = 'pp' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);
  var self = this;
  this.ready = new Promise(function (res, rej) { self._res = res; self._rej = rej; });
  this._open();
}
MQ.enc = new TextEncoder(); MQ.dec = new TextDecoder();
MQ.str = function (s) { var b = MQ.enc.encode(s); return [b.length >> 8, b.length & 255].concat(Array.from(b)); };
MQ.packet = function (head, body) {
  var len = body.length, rl = [];
  do { var d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; rl.push(d); } while (len > 0);
  var out = new Uint8Array(1 + rl.length + body.length);
  out[0] = head; out.set(rl, 1); out.set(body, 1 + rl.length);
  return out;
};
MQ.prototype._open = function () {
  var self = this, ws;
  clearTimeout(this.retryTimer); this.retryTimer = null;
  try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.ws = null; this._down(); return; }
  ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
  this.openTimer = setTimeout(function () { if (!self.connected && self.ws === ws) self._drop(); }, 7000);
  ws.onopen = function () {
    var body = MQ.str('MQTT').concat([4, 0x02, 0, 45]).concat(MQ.str(self.id));
    ws.send(MQ.packet(0x10, body));
  };
  ws.onmessage = function (ev) {
    if (self.ws !== ws) return;
    self.lastRx = Date.now();
    var chunk = new Uint8Array(ev.data), b = new Uint8Array(self.buf.length + chunk.length);
    b.set(self.buf); b.set(chunk, self.buf.length); self.buf = b; self._parse();
  };
  ws.onclose = function () { if (self.ws === ws) { self.ws = null; self._down(); } };
  ws.onerror = function () {};
};
// Chiude subito una connessione sospetta (anche se il browser la crede ancora aperta) e riparte.
MQ.prototype._drop = function () {
  var ws = this.ws; this.ws = null;
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) {} }
  this._down();
};
MQ.prototype._down = function () {
  var self = this, was = this.connected;
  this.connected = false; clearInterval(this.pinger); clearTimeout(this.openTimer); clearTimeout(this.probeTimer); this.probeTimer = null;
  if (was) this.statusHandlers.forEach(function (f) { f(false); });
  if (this.closed) return;
  if (!this.everUp) { this._rej(new Error('broker non raggiungibile')); this.closed = true; return; }
  if (this.retryTimer) return;
  this.retryTimer = setTimeout(function () { self.retryTimer = null; if (!self.closed && !self.ws) self._open(); }, this.backoff);
  this.backoff = Math.min(this.backoff * 1.7, 8000);
};
// Verifica attiva: manda un ping e, se entro pochi secondi non arriva nulla, considera la connessione morta.
MQ.prototype.probe = function () {
  var self = this;
  if (!this.connected || this.probeTimer) return;
  var since = Date.now();
  this._raw(MQ.packet(0xC0, []));
  this.probeTimer = setTimeout(function () { self.probeTimer = null; if (self.connected && self.lastRx < since) self._drop(); }, NET_PROBE_MS);
};
// Da chiamare quando la pagina torna visibile o la rete torna disponibile.
MQ.prototype.wake = function () {
  if (this.closed) return;
  if (this.connected) { this.probe(); return; }
  if (!this.ws) { this.backoff = 800; this._open(); }
};
MQ.prototype._parse = function () {
  var b = this.buf;
  while (b.length >= 2) {
    var mult = 1, len = 0, i = 1, d;
    do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
    if (b.length < i + len) break;
    this._handle(b[0], b.subarray(i, i + len));
    b = b.subarray(i + len);
  }
  this.buf = b.slice();
};
MQ.prototype._handle = function (h, body) {
  var type = h >> 4, self = this;
  if (type === 2) { // CONNACK
    if (body[1] !== 0) { this._drop(); return; }
    clearTimeout(this.openTimer);
    this.connected = true; this.everUp = true; this.backoff = 800;
    this.pinger = setInterval(function () {
      if (Date.now() - self.lastRx > NET_DEAD_MS) self.probe();
      else self._raw(MQ.packet(0xC0, []));
    }, NET_PING_MS);
    var topics = Object.keys(this.subs); if (topics.length) this._sub(topics);
    this._res(this);
    this.statusHandlers.forEach(function (f) { f(true); });
  } else if (type === 3) { // PUBLISH
    var qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1], topic = MQ.dec.decode(body.subarray(2, 2 + tl)), p = 2 + tl;
    if (qos > 0) { var id = [body[p], body[p + 1]]; p += 2; if (qos === 1) this._raw(MQ.packet(0x40, id)); }
    var payload = MQ.dec.decode(body.subarray(p)), retained = !!(h & 1);
    this.handlers.forEach(function (f) { f(topic, payload, retained); });
  }
};
MQ.prototype._raw = function (pkt) { if (this.ws && this.ws.readyState === 1) { try { this.ws.send(pkt); return true; } catch (e) {} } return false; };
MQ.prototype._nextId = function () { this.pid = this.pid % 65000 + 1; return [this.pid >> 8, this.pid & 255]; };
MQ.prototype._sub = function (topics) {

      var code = newCode();
      var ex = await probeState(b.c, code, 1200);
      b.c.unsubscribe(topic(code, 'state'));
      if (ex && ex.code) continue;

/* ===== Timer di turno (condiviso): se un giocatore non fa niente per troppo tempo,
   l'host lo fa giocare in automatico finché non torna. ===== */
var Turns = (function () {
  var cfg = null, lastKey = null, timer = null;
  var DEFAULT = 60;
  function secs(doc) { var t = doc && doc.opts && doc.opts.timer; return t == null ? DEFAULT : +t; }
  // cfg: { decider(game) -> indice|null, onTimeout(doc, indice) -> true se ha cambiato qualcosa }
  function setup(c) {
    cfg = c;
    Net.setBeforePublish(function (doc) {
      if (!doc.game || doc.phase !== 'play') { doc.turnKey = null; return; }
      var d = cfg.decider(doc.game), key = doc.game.seq + ':' + d;
      if (doc.turnKey !== key) { doc.turnKey = key; doc.turnSince = Date.now(); }
    });
    setInterval(tick, 1000);
  }
  // Da chiamare a ogni nuovo stato: solo l'host arma il timer.
  function watch(doc) {
    if (!cfg) return;
    var s = secs(doc);
    if (!Net.isHost || !doc || !doc.game || doc.phase !== 'play' || !s || !doc.turnKey) { clearTimeout(timer); lastKey = null; return; }
    if (doc.turnKey === lastKey) return;
    lastKey = doc.turnKey; clearTimeout(timer);
    var d = cfg.decider(doc.game);
    if (d == null || doc.game.players[d].bot) return;
    var key = doc.turnKey, wait = Math.max(500, (doc.turnSince || Date.now()) + s * 1000 - Date.now());
    timer = setTimeout(function () {
      Net.hostApply(function (cur) {
        if (!cur.game || cur.phase !== 'play' || cur.turnKey !== key) return false;
        var dd = cfg.decider(cur.game);
        if (dd == null || cur.game.players[dd].bot) return false;
        return cfg.onTimeout(cur, dd);
      });
    }, wait);
  }
  // Conto alla rovescia visibile a chi deve giocare (elemento #tt), solo negli ultimi 20 secondi.
  function tick() {
    var el = document.getElementById('tt'); if (!el) return;
    var doc = App.doc, s = secs(doc);
    if (!doc || !doc.turnSince || !s) { el.textContent = ''; return; }
    var rem = Math.ceil((doc.turnSince + s * 1000 - Date.now()) / 1000);
    el.textContent = rem > 0 && rem <= 20 ? ' Ancora ' + rem + ' s, poi gioca l’automatico.' : '';
  }
  function optionHTML(doc, isHost) {
    var s = secs(doc), opts = [[0, 'Nessun limite'], [30, '30 secondi'], [60, '60 secondi'], [120, '2 minuti']];
    return '<label class="tt-opt" style="display:grid;gap:6px"><span><b>Timer di turno</b><br><span class="muted" style="font-size:15px">Se un giocatore resta fermo oltre questo tempo, gioca l’automatico al suo posto finché non torna.</span></span>' +
      '<select id="opt-timer" class="field"' + (isHost ? '' : ' disabled') + ' style="font-size:16px;min-height:44px">' +
      opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === s ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>';
  }
  function awayLog(g, p) {
    if (!g.log) return;
    g.log.push({ n: ++g.logN, t: g.players[p].nick + ' non risponde: gioca l’automatico finché non torna.', k: 'sys' });
    if (g.log.length > 70) g.log.splice(0, g.log.length - 70);
  }
  return { setup: setup, watch: watch, secs: secs, optionHTML: optionHTML, awayLog: awayLog };
})();

    '<section class="panel"><span class="lead">Codice del tavolo</span><span class="codebig">' + esc(d.code) + '</span><div class="row"><button class="btn" data-act="invite">Invita amici</button><button class="btn ghost small" data-act="copylink">Copia link</button></div>' +
    '<p class="lead">Chi apre il link si siede dal suo telefono, senza registrarsi. Servono da 3 a 6 giocatori; i posti mancanti si riempiono con giocatori automatici.</p></section>' +
    '<section class="panel"><h2>Al tavolo (' + n + '/6)</h2><div class="seats">' + seats + '</div>' +
    '<label class="switch' + (isHost ? '' : ' ro') + '"><input type="checkbox" id="opt-noeven"' + (noEven ? ' checked' : '') + (isHost ? '' : ' disabled') + '><span><b>Somma delle previsioni diversa dalle prese</b><br><span class="muted" style="font-size:15px">Il mazziere, che dichiara per ultimo, non può dire il numero che renderebbe la somma uguale alle prese della mano.</span></span></label>' +
    Turns.optionHTML(d, isHost) +
    (isHost ? '<div class="row"><button class="btn ghost" data-act="addbot"' + (n >= 6 ? ' disabled' : '') + '>Aggiungi giocatore automatico</button><button class="btn" data-act="start"' + (n < 3 ? ' disabled' : '') + '>Inizia la partita</button></div>' + (n < 3 ? '<p class="lead">Mancano ' + (3 - n) + ' giocatori per iniziare.</p>' : '<p class="lead">In ' + n + ' si giocano ' + rounds + ' mani.</p>')
      : seated ? '<p class="lead">In attesa che l’host inizi la partita.</p>' : '<button class="btn" data-act="jointable" data-code="' + esc(d.code) + '">Siediti</button>') +
    '</section></div>';
}

function tableHTML() {
  var d = App.doc, g = d.game, me = myIdx(), k = g.players.length;
  var order = []; var st = me >= 0 ? me : 0; for (var i = 0; i < k; i++) order.push((st + i) % k);
  var sum = E.bidSum(g), allBid = g.players.every(function (P) { return P.bid != null; });
  var pls = order.map(function (i) {
    var P = g.players[i], cls = 'pl' + (g.turn === i && g.phase !== 'over' ? ' turn' : '') + (i === me ? ' me' : '');
    var bt = P.bid == null ? '<span class="muted">prevede…</span>' : '<span class="t">' + P.tricks + '</span><span class="muted">/ ' + P.bid + ' prese</span>';
    var btc = P.bid == null ? '' : P.tricks === P.bid ? ' hit' : P.tricks > P.bid ? ' over' : '';
    return '<button class="' + cls + '" data-pl="' + i + '">' + (g.dealer === i ? '<span class="dealer" title="Mazziere">M</span>' : '') + '<span class="nk">' + esc(P.nick) + (i === me ? ' (tu)' : P.bot ? ' <span class="muted" style="font-weight:400;font-size:13px">auto</span>' : '') + '</span>' +
      '<span class="bt' + btc + '">' + bt + '</span><span class="sc">' + P.score + ' punti</span></button>';
  }).join('');
  var trumpTxt = g.trump != null ? 'Briscola<br><b style="color:' + ART.SUITCOL[g.trump] + ';filter:brightness(1.5)">' + suitName(g.trump) + '</b>' : g.phase === 'trump' ? 'Briscola<br>da scegliere' : 'Niente<br>briscola';
  var trumpCard = g.trumpCard != null ? cardHTML(g.trumpCard) : '<div class="none">ultima mano</div>';
  var trick = '', show = g.trick.length ? g.trick : (g.lastTrick && (g.phase === 'play' || g.phase === 'roundEnd' || g.phase === 'over') ? g.lastTrick.cards : []);
  var showing = show.length && !g.trick.length;
  if (show.length) trick = show.map(function (t, j) { return '<div class="tc' + (showing && j === g.lastTrick.wi ? ' win' : '') + '">' + cardHTML(t.c) + '<span class="who">' + esc(t.p === me ? 'tu' : g.players[t.p].nick) + '</span></div>'; }).join('');
  if (showing) trick += '<div class="msg">Presa a <b>' + esc(g.lastTrick.winner === me ? 'te' : g.players[g.lastTrick.winner].nick) + '</b></div>';
  if (!show.length) trick = '<div class="msg">' + (g.phase === 'bid' ? 'Si fanno le previsioni.' : g.phase === 'trump' ? 'Si sceglie la briscola.' : 'Il tavolo è vuoto.') + '</div>';
  var status = statusLine(g, me, sum, allBid);
  var feed = g.log.slice(-3).map(function (l) { return '<div>' + esc(l.t) + '</div>'; }).join('');
  return '<div class="topbar"><div class="wrap"><span class="brand">Presagio</span><span class="info">' + connInfo('Mano ' + g.round + ' di ' + g.rounds + ' · ' + esc(d.code)) + '</span><button class="iconbtn" data-act="scores">Punti</button><button class="iconbtn" data-act="menu">Menu</button></div></div>' +
    '<main class="wrap board">' + hostBanner() + '<div class="players">' + pls + '</div>' +
    '<section class="felt"><div class="trumpbox">' + trumpCard + '<span>' + trumpTxt + '</span></div><div class="trick">' + trick + '</div><div class="status">' + status + '<div class="feed" style="margin-top:6px">' + feed + '</div></div></section></main>' + dockHTML(g, me, sum);
}
function statusLine(g, me, sum, allBid) {
  var who = function (i) { return i === me ? 'tu' : esc(g.players[i].nick); };
  var pr = 'Previsioni: <b>' + sum + '</b> su ' + g.round + (g.round === 1 ? ' presa' : ' prese') + (allBid ? (sum > g.round ? ' · ne mancano per tutti' : sum < g.round ? ' · ne avanzano' : ' · somma pari') : '');
  if (g.phase === 'over') return 'Partita finita.';
  if (g.phase === 'roundEnd') return 'Fine della mano ' + g.round + '. ' + pr;
  if (g.phase === 'trump') return 'Il mazziere (' + who(g.dealer) + ') sceglie la briscola.';
  if (g.phase === 'bid') return (g.turn === me ? '<b>Tocca a te prevedere.</b> ' : 'Prevede <b>' + who(g.turn) + '</b>. ') + pr + (g.opts.noEven ? ' · regola somma diversa' : '');
  var ls = E.leadSuit(g);
  return (g.turn === me ? '<b>Tocca a te.</b>' : 'Gioca <b>' + who(g.turn) + '</b>.') + (ls != null ? ' Si risponde a ' + suitName(ls) + '.' : '') + ' ' + pr;
}
function dockHTML(g, me, sum) {
  if (me < 0) return '<div class="dock"><div class="wrap"><div class="hint">Stai guardando la partita.</div></div></div>';
  var P = g.players[me], myTurn = g.turn === me && g.phase !== 'over', hint = '', extra = '';
  var playable = g.phase === 'play' && myTurn ? E.playable(g, me) : null;
  var hand = P.hand.length ? P.hand.map(function (c) {
    var cls = playable ? (playable.indexOf(c) >= 0 ? 'ok' : 'no') : '';
    if (App.sel === c) cls += ' sel';
    return cardHTML(c, cls);
  }).join('') : '<span class="empty">Nessuna carta in mano.</span>';
  if (g.phase === 'bid' && myTurn) {
    var f = E.forbiddenBid(g, me), b = '';
    for (var i = 0; i <= g.round; i++) b += '<button data-act="bid" data-b="' + i + '"' + (i === f ? ' class="fb" disabled aria-label="' + i + ' non consentito"' : '') + '>' + i + '</button>';
    hint = '<b>La tua previsione.</b> Quante prese farai? Finora ' + sum + ' su ' + g.round + '.' + (f != null ? ' Non puoi dire ' + f + '.' : '');
    extra = '<div class="bids">' + b + '</div>';
  } else if (g.phase === 'trump' && myTurn) {
    hint = '<b>È uscito un Arcimago.</b> Scegli tu il colore di briscola.';
    extra = '<div class="suits">' + D.SUITS.map(function (s) { return '<button data-act="trump" data-s="' + s.id + '">' + ART.emblem(s.id, 24) + s.n + '</button>'; }).join('') + '</div>';
  } else if (g.phase === 'play' && myTurn) {
    var need = P.bid - P.tricks;
    hint = '<b>Tocca a te.</b> ' + (need > 0 ? 'Ti servono ancora ' + need + (need === 1 ? ' presa.' : ' prese.') : need === 0 ? 'Hai le prese che volevi: ora evitale.' : 'Hai già ' + (-need) + (need === -1 ? ' presa' : ' prese') + ' di troppo.') + (App.sel != null ? '' : ' Tocca una carta.');
    if (App.sel != null) extra = '<button class="btn block" data-act="playsel">Gioca ' + esc(E.cardName(App.sel)) + '</button>';
  } else if (g.phase === 'roundEnd') {
    hint = myTurn || App.doc.host === Net.uid ? 'Mano finita. Quando siete pronti, avvia la prossima.' : 'Mano finita. Attendi che ' + esc(g.players[g.turn].nick) + ' avvii la prossima.';
    if (myTurn || App.doc.host === Net.uid) extra = '<button class="btn block" data-act="next">Prossima mano</button>';
  } else if (g.phase === 'over') { hint = 'Partita finita.'; extra = '<button class="btn block" data-act="showover">Classifica</button>'; }
  else hint = P.bid == null ? 'Aspetta il tuo turno per la previsione.' : 'Hai previsto ' + P.bid + (P.bid === 1 ? ' presa' : ' prese') + ', ne hai fatte ' + P.tricks + '.';
  if (myTurn && g.phase !== 'over') hint += '<span id="tt"></span>';
  if (P.bot && g.phase !== 'over') { hint = '<b>Stai giocando in automatico</b> perché sei stato fermo troppo a lungo.'; extra = '<button class="btn block" data-act="resume">Riprendo io</button>'; }
  return '<div class="dock"><div class="wrap"><div class="hint">' + hint + '</div><div class="hand" aria-label="La tua mano">' + hand + '</div>' + extra + '</div></div>';
}

/* ---------- fogli ---------- */
function renderSheet() {
  var root = $('#sheet'), s = App.sheet;
  if (!s) { root.innerHTML = ''; return; }
  var h = sheetBody(s); if (!h) { App.sheet = null; root.innerHTML = ''; return; }
  root.innerHTML = '<div class="sheet-back" data-act="sheetback"><div class="sheet" role="dialog" aria-modal="true">' + h + '</div></div>';
}
function scoreTable(g, onlyRound) {
  var head = '<tr><th>' + (onlyRound ? 'Giocatore' : 'Mano') + '</th>' + (onlyRound ? '<th>Previsione</th><th>Prese</th><th>Punti</th><th>Totale</th>' : g.players.map(function (P) { return '<th>' + esc(P.nick) + '</th>'; }).join('')) + '</tr>';
  var body = '';
  if (onlyRound) {
    var r = g.round - 1;
    body = g.players.map(function (P) { var h = P.hist[r]; return '<tr><td>' + esc(P.nick) + '</td><td>' + h.bid + '</td><td>' + h.tricks + '</td><td class="' + (h.delta >= 0 ? 'pos' : 'neg') + '">' + (h.delta > 0 ? '+' : '') + h.delta + '</td><td>' + h.score + '</td></tr>'; }).join('');
  } else {
    var n = g.players[0].hist.length;
    for (var i = 0; i < n; i++) body += '<tr><td>' + (i + 1) + '</td>' + g.players.map(function (P) { var h = P.hist[i]; return '<td><span class="' + (h.delta >= 0 ? 'pos' : 'neg') + '">' + (h.delta > 0 ? '+' : '') + h.delta + '</span><span class="small">' + h.tricks + '/' + h.bid + ' · ' + h.score + '</span></td>'; }).join('') + '</tr>';
    if (!n) body = '<tr><td colspan="' + (g.players.length + 1) + '" class="muted" style="text-align:left">Ancora nessuna mano conclusa.</td></tr>';
    body += '<tr class="tot"><td>Totale</td>' + g.players.map(function (P) { return '<td>' + P.score + '</td>'; }).join('') + '</tr>';
  }
  return '<div class="tbl-wrap"><table class="sc">' + head + body + '</table></div>';
}
function sheetBody(s) {
  var g = App.doc && App.doc.game, me = myIdx();
  if (s.kind === 'rules') return '<h2>Regole</h2><div class="rules">' + RULES + '</div><button class="btn block" data-act="close">Chiudi</button>';
  if (s.kind === 'scores' && g) return '<h2>Punteggi</h2><p class="lead">In ogni casella: punti della mano, poi prese/previsione e totale.</p>' + scoreTable(g) + '<button class="btn block" data-act="close">Chiudi</button>';
  if (s.kind === 'round' && g && g.phase === 'roundEnd') {
    var can = g.turn === me || App.doc.host === Net.uid;
    return '<h2>Fine della mano ' + g.round + ' di ' + g.rounds + '</h2>' + scoreTable(g, true) +
      (can ? '<button class="btn block" data-act="next">Prossima mano</button>' : '<p class="lead">Attendi che ' + esc(g.players[g.turn].nick) + ' avvii la prossima mano.</p>') + '<button class="btn block ghost" data-act="close">Guarda il tavolo</button>';
  }
  if (s.kind === 'over' && g && g.phase === 'over') {
    var rank = g.players.map(function (P, i) { return { P: P, i: i }; }).sort(function (a, b) { return b.P.score - a.P.score; });
    return '<div class="winner">' + (g.winner.length > 1 ? 'Pari merito' : 'Vince ' + esc(g.players[g.winner[0]].nick)) + '</div>' +
      '<div class="tbl-wrap"><table class="sc"><tr><th>#</th><th class="l">Giocatore</th><th>Indovinate</th><th>Punti</th></tr>' + rank.map(function (r, k) { var ok = r.P.hist.filter(function (h) { return h.bid === h.tricks; }).length; return '<tr><td>' + (k + 1) + '</td><td class="l">' + esc(r.P.nick) + (r.i === me ? ' (tu)' : '') + '</td><td>' + ok + '/' + r.P.hist.length + '</td><td>' + r.P.score + '</td></tr>'; }).join('') + '</table></div>' +
      (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') +
      '<button class="btn block ghost" data-act="scores">Tutti i punteggi</button><button class="btn block ghost" data-act="close">Guarda il tavolo</button>';
  }
  if (s.kind === 'menu' && App.doc) {
    var d = App.doc;
    return '<h2>Tavolo ' + esc(d.code) + '</h2><div style="display:grid;gap:8px">' +
      '<button class="btn ghost block" data-act="invite">Invita amici al tavolo</button><button class="btn ghost block" data-act="rules">Regole</button>' +
      (d.host !== Net.uid ? '<button class="btn ghost block" data-act="takehost">Prendi il comando del tavolo (se l’host se n’è andato)</button>' : '') +
      (d.host === Net.uid && d.phase !== 'lobby' ? '<button class="btn ghost block" data-act="rematch">Chiudi la partita e torna alla sala d’attesa</button>' : '') +
      '<button class="btn ghost block" data-act="leave">Esci dal tavolo</button></div><button class="btn block" data-act="close">Chiudi</button>';
  }
  if (s.kind === 'player' && g) {
    var P = g.players[s.p];
    return '<h2>' + esc(P.nick) + '</h2><p class="lead">' + P.score + ' punti · ' + (P.bid == null ? 'non ha ancora previsto' : 'ha previsto ' + P.bid + ', ne ha fatte ' + P.tricks) + ' · ' + P.hand.length + ' carte in mano</p>' +
      (App.doc.host === Net.uid && s.p !== me && g.phase !== 'over' ? '<button class="btn ghost block" data-act="auto" data-p="' + s.p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') +
      '<button class="btn block" data-act="close">Chiudi</button>';
  }
  return '';
}

var RULES = '<p>Si gioca con 60 carte: quattro casate (Fiamme, Maree, Foreste, Sabbie) con valori da 1 a 13, più 4 <b>Arcimaghi</b> e 4 <b>Giullari</b>.</p>' +
  '<h3>Le mani</h3><p>Nella prima mano ognuno riceve 1 carta, nella seconda 2 e così via, finché il mazzo basta: 20 mani in 3, 15 in 4, 12 in 5, 10 in 6. Il mazziere cambia ogni mano.</p>' +
  '<h3>La briscola</h3><ul><li>Dopo la distribuzione si scopre la prima carta del mazzo: il suo colore è la briscola.</li><li>Se è un Giullare non c’è briscola.</li><li>Se è un Arcimago, il mazziere sceglie il colore.</li><li>Nell’ultima mano non resta niente da scoprire: si gioca senza briscola.</li></ul>' +
  '<h3>La previsione</h3><p>A turno, partendo da chi siede dopo il mazziere, ognuno dichiara quante prese farà. Con la regola <b>somma diversa</b>, il mazziere non può dichiarare il numero che renderebbe la somma uguale alle prese della mano.</p>' +
  '<h3>Le prese</h3><ul><li>Apre chi siede dopo il mazziere; poi apre chi ha vinto l’ultima presa.</li><li>Bisogna rispondere al colore di chi apre, se lo si ha. Arcimaghi e Giullari si possono giocare sempre.</li><li>Se si apre con un Arcimago, gli altri giocano quello che vogliono. Se si apre con un Giullare, il colore lo decide la prima carta numerata.</li><li>Vince il primo Arcimago; altrimenti la briscola più alta; altrimenti la carta più alta del colore di uscita. Se tutti giocano Giullari, vince il primo.</li></ul>' +
  '<h3>Punti</h3><ul><li>Previsione esatta: 20 punti più 10 per ogni presa.</li><li>Previsione sbagliata: −10 per ogni presa di differenza.</li></ul>' +
  '<h3>Giocare online</h3><p>Chi apre il tavolo è l’host: il suo telefono tiene la partita e muove i giocatori automatici. Se si disconnette, gli altri possono prendere il comando dopo qualche secondo. Le partite passano da un server pubblico gratuito: usa un soprannome.</p>';

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-pl],.hand .card');
  if (!el) return;
  var a = el.getAttribute('data-act'), g = App.doc && App.doc.game, me = myIdx();
  if (a === 'sheetback') { if (ev.target === el) { App.sheet = null; renderSheet(); } return; }
  if (!a && el.hasAttribute('data-pl')) { App.sheet = { kind: 'player', p: +el.getAttribute('data-pl') }; renderSheet(); return; }
  if (!a && el.classList.contains('card')) {
    var c = +el.getAttribute('data-c');
    if (!g || g.phase !== 'play' || g.turn !== me) { return; }
    if (el.classList.contains('no')) { var ls = E.leadSuit(g); toast('Devi rispondere a ' + suitName(ls) + ': puoi giocare solo quel colore, un Arcimago o un Giullare.'); return; }
    if (App.sel === c) { act({ a: 'play', c: c }); return; }
    App.sel = c; render(); return;
  }
  switch (a) {
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'scores': App.sheet = { kind: 'scores' }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; send({ t: 'rematch' }); break;
    case 'takehost': App.sheet = null; Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'bid': act({ a: 'bid', b: +el.getAttribute('data-b') }); break;
    case 'trump': act({ a: 'trump', s: +el.getAttribute('data-s') }); break;
    case 'playsel': if (App.sel != null) act({ a: 'play', c: App.sel }); break;
    case 'next': App.sheet = null; act({ a: 'next' }); break;
    case 'resume': send({ t: 'back' }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-noeven') send({ t: 'opt', noEven: ev.target.checked });
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet) { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.DEFS);
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if (t === last || myNick()) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
