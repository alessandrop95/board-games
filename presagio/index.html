<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presagio</title>
<meta name="description" content="Gioco di carte a prese con previsione, da 3 a 6 giocatori, ognuno dal proprio telefono.">
<meta name="theme-color" content="#06050d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presagio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="pwa-sw" content="../sw.js" data-scope="../">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
/* Presagio — fantasy moderno: notte cosmica viola-indaco, oro antico, incisioni ottocentesche accese di luce.
   Layout del tavolo: posti disposti su un tavolo ovale (avversari sull'arco alto), presa al centro,
   la tua mano a ventaglio in basso. Home e sala d'attesa: pannelli di vetro scuro su cielo stellato. */
:root {
  --void: #06050d; --night: #0d0b1c; --night-2: #151230; --glass: rgba(20, 17, 42, .62); --glass-2: rgba(30, 26, 62, .72);
  --line: rgba(214, 196, 255, .14); --line-2: rgba(230, 194, 120, .35);
  --text: #eee8f8; --muted: #a59fc2; --gold: #e6c278; --gold-2: #b38a3d; --violet: #9b7bff;
  --ok: #7be0a5; --bad: #ff8f86;
  --fiamme: #ff8a3d; --maree: #4cb8ff; --foreste: #4fe08f; --sabbie: #f2b640;
  --f-disp: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
  --f-label: 'Cinzel', Georgia, serif;
  --f-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--void); }
body {
  margin: 0; color: var(--text); font-family: var(--f-body); font-size: 18px; font-weight: 500; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background-color: var(--void);
  background-image:
    radial-gradient(ellipse 90% 55% at 50% -12%, rgba(124, 92, 255, .28), transparent 70%),
    radial-gradient(ellipse 70% 40% at 100% 100%, rgba(230, 194, 120, .08), transparent 70%),
    radial-gradient(1px 1px at 12% 18%, #fff9 50%, transparent 51%), radial-gradient(1px 1px at 72% 9%, #fff8 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 86% 42%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 33% 64%, #fff6 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 82%, #fff5 50%, transparent 51%), radial-gradient(1.2px 1.2px at 4% 92%, #fff6 50%, transparent 51%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* pulsanti */
.btn { appearance: none; cursor: pointer; border: 1px solid rgba(255, 236, 190, .5); border-radius: 999px; padding: 10px 22px; min-height: 48px;
  font-family: var(--f-label); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
  background: linear-gradient(180deg, #f6dfa3, #c99a45 60%, #a8792c); color: #1f1407;
  box-shadow: inset 0 1px 0 #fff9, 0 0 0 1px #0006, 0 8px 22px rgba(230, 194, 120, .22); transition: transform .15s var(--ease), box-shadow .2s; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:hover { box-shadow: inset 0 1px 0 #fff9, 0 0 0 1px #0006, 0 8px 28px rgba(230, 194, 120, .38); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: rgba(255, 255, 255, .04); color: var(--text); border: 1px solid var(--line); box-shadow: none; font-family: var(--f-label); font-weight: 400; letter-spacing: .06em; text-transform: none; font-size: 15px; }
.btn.ghost:hover { border-color: var(--line-2); }
.btn.small { min-height: 38px; padding: 6px 16px; font-size: 13.5px; }
.btn.block { width: 100%; }
input.field, select.field { font: inherit; font-size: 18px; color: var(--text); background: rgba(10, 8, 24, .7); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 14px; min-height: 50px; width: 100%; }
input.field::placeholder { color: #8d86ad; }
input.field.code { font-family: var(--f-label); font-weight: 700; letter-spacing: .4em; text-transform: uppercase; text-align: center; }

/* home */
.lobby { padding-block: 22px 56px; display: grid; gap: 20px; }
.back-link { color: var(--muted); text-decoration: none; font-family: var(--f-label); font-size: 14px; letter-spacing: .08em; }
.hero { position: relative; display: grid; gap: 14px; align-items: end; min-height: 300px; border-radius: 22px; overflow: hidden; padding: 22px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(6, 5, 13, .1), rgba(6, 5, 13, .85) 78%), url(img/hero.jpg) center 30% / cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 20%, rgba(230, 194, 120, .18), transparent 60%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero h1 { font-family: var(--f-disp); font-weight: 700; font-size: clamp(46px, 13vw, 88px); line-height: .95; letter-spacing: .02em;
  background: linear-gradient(180deg, #fff7df, #e6c278 55%, #9f7430); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 22px rgba(230, 194, 120, .35)); }
.hero .tag { font-size: 19px; color: #e4dcf5; max-width: 40ch; margin: 0; }
.hero .credit { font-size: 14px; font-style: italic; color: #cfc6ee; opacity: .85; text-shadow: 0 1px 6px #000, 0 0 2px #000; }
.fan { position: relative; height: 170px; }
.fan .card { position: absolute; left: 50%; top: 6px; --cw: 100px; transform-origin: 50% 140%; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.3fr 1fr; min-height: 340px; } .fan { height: 220px; } .fan .card { --cw: 124px; } }
.panel { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; min-width: 0; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); }
.panel h2 { font-family: var(--f-label); font-weight: 700; font-size: 18px; color: var(--gold); letter-spacing: .14em; text-transform: uppercase; }
.lead { color: var(--muted); font-size: 16px; margin: 0; }
.grid2 { display: grid; gap: 16px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.notice { border: 1px solid var(--line-2); padding: 10px 14px; background: rgba(230, 194, 120, .08); border-radius: 14px; font-size: 16px; }
.notice.red { border-color: rgba(255, 143, 134, .5); background: rgba(255, 143, 134, .08); }
.trow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, .025); }
.trow .code { font-family: var(--f-label); font-weight: 700; letter-spacing: .2em; color: var(--gold); }
.trow .grow { flex: 1; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px dashed var(--line); border-radius: 14px; min-height: 58px; }
.seat.full { border-style: solid; background: rgba(255, 255, 255, .03); }
.seat .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-label); font-weight: 700; color: #1f1407; flex: none; background: radial-gradient(circle at 35% 30%, #fff1c9, #e6c278 45%, #8f6526); box-shadow: 0 0 14px rgba(230, 194, 120, .35); }
.seat:not(.full) .ava { background: rgba(255, 255, 255, .06); color: var(--muted); box-shadow: none; }
.seat .nm { font-weight: 700; overflow-wrap: anywhere; }
.seat .sub { font-size: 14px; color: var(--muted); }
.seat .x { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 22px; padding: 4px 8px; }
.codebig { font-family: var(--f-disp); font-size: 40px; font-weight: 700; letter-spacing: .3em; color: var(--gold); text-shadow: 0 0 22px rgba(230, 194, 120, .4); }
.switch { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.switch input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--gold); flex: none; }
.switch b { font-weight: 700; }
.switch.ro { cursor: default; opacity: .85; }

/* ---------- carte ---------- */
.card { --cw: 80px; --sc: var(--gold); --sg: rgba(230, 194, 120, .45); width: var(--cw); aspect-ratio: 5 / 7; flex: none; position: relative; container-type: inline-size;
  border-radius: calc(var(--cw) * .085); user-select: none; -webkit-user-select: none;
  background: linear-gradient(155deg, var(--sc), #f3dc9f 42%, #7c5a24 58%, var(--sc));
  box-shadow: 0 8px 18px rgba(0, 0, 0, .55), 0 0 calc(var(--cw) * .14) var(--sg); }
.card .face { position: absolute; inset: 1.5px; border-radius: calc(var(--cw) * .075); overflow: hidden; background: #06050c; }
.card .art { position: absolute; inset: 0; background-size: 140% auto; background-repeat: no-repeat; }
.card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 5, 13, .35), rgba(6, 5, 13, 0) 30%, rgba(6, 5, 13, .05) 60%, rgba(6, 5, 13, .7)); }
.card.s-fiamme { --sc: var(--fiamme); --sg: rgba(255, 138, 61, .45); } .card.s-fiamme .art { background-image: url(img/card-fiamme.jpg); }
.card.s-maree { --sc: var(--maree); --sg: rgba(76, 184, 255, .45); } .card.s-maree .art { background-image: url(img/card-maree.jpg); }
.card.s-foreste { --sc: var(--foreste); --sg: rgba(79, 224, 143, .42); } .card.s-foreste .art { background-image: url(img/card-foreste.jpg); }
.card.s-sabbie { --sc: var(--sabbie); --sg: rgba(242, 182, 64, .45); } .card.s-sabbie .art { background-image: url(img/card-sabbie.jpg); }
.card .corner { position: absolute; top: 4.5cqw; left: 5.5cqw; display: grid; justify-items: center; gap: .5cqw; color: var(--sc); filter: drop-shadow(0 0 3px var(--sg)) drop-shadow(0 1px 1px #000); }
.card .corner b { font: 700 15cqw/1 var(--f-label); color: #fff6e0; text-shadow: 0 0 6px var(--sc); }
.card .corner .ic { width: 11cqw; height: 11cqw; }
.card .corner.br { top: auto; left: auto; bottom: 4.5cqw; right: 5.5cqw; transform: rotate(180deg); }
.ic { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card .medal { position: absolute; left: 50%; top: 50%; width: 50cqw; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(6, 5, 14, .78) 0 52%, rgba(6, 5, 14, .25) 66%, transparent 70%); display: grid; place-items: center; }
.card .medal span { font: 700 25cqw/1 var(--f-label); color: #fff8ea; text-shadow: 0 0 10px var(--sc), 0 0 3px #fff; }
.card .pips { position: absolute; inset: 0; }
.card .pips i { position: absolute; width: 3.6cqw; height: 3.6cqw; margin: -1.8cqw; border-radius: 50%; background: var(--sc); box-shadow: 0 0 5px var(--sc); }
.card .label { position: absolute; left: 0; right: 0; bottom: 18cqw; text-align: center; font: 700 7.4cqw/1 var(--f-label); letter-spacing: .2em; text-transform: uppercase; color: var(--sc); text-shadow: 0 0 6px #000, 0 0 8px var(--sg); }
.card.k-w { --sc: #b48cff; --sg: rgba(180, 140, 255, .6); background: linear-gradient(155deg, #b48cff, #ffe7a8 40%, #6a46c7 60%, #ffe7a8); }
.card.k-w .art { background: url(img/card-arcimago.jpg) 30% 60% / cover; }
.card.k-j { --sc: #ff79b8; --sg: rgba(255, 121, 184, .5); background: linear-gradient(155deg, #ff79b8, #c8fff4 42%, #8a2c62 58%, #c8fff4); }
.card.k-j .art { background: url(img/card-giullare.jpg) 50% 25% / cover; }
.card .title { position: absolute; left: 0; right: 0; bottom: 14cqw; text-align: center; font: 700 11.5cqw/1 var(--f-disp); color: #fff1cc; text-shadow: 0 0 10px var(--sc), 0 2px 4px #000; }
.card .sub { position: absolute; left: 0; right: 0; bottom: 6.5cqw; text-align: center; font: 600 5.6cqw/1 var(--f-label); letter-spacing: .18em; text-transform: uppercase; color: var(--sc); text-shadow: 0 1px 3px #000; }
.card .foil { position: absolute; inset: -40% -60%; background: linear-gradient(115deg, transparent 38%, rgba(255, 236, 190, .0) 44%, rgba(255, 236, 190, .32) 50%, rgba(180, 140, 255, .22) 55%, transparent 62%); mix-blend-mode: screen; animation: foil 5s ease-in-out infinite; pointer-events: none; }
.card.k-j .foil { background: linear-gradient(115deg, transparent 38%, rgba(200, 255, 244, .28) 50%, rgba(255, 121, 184, .22) 55%, transparent 62%); }
@keyframes foil { 0% { transform: translateX(-35%); } 55%, 100% { transform: translateX(35%); } }
.card.back { --sc: var(--gold); background: linear-gradient(155deg, #e6c278, #fff1c9 40%, #7c5a24 60%, #e6c278); }
.card.back .face { background: radial-gradient(circle at 50% 45%, #231c52, #0a0819 72%); }
.card.back .disc { position: absolute; left: 10%; width: 80%; top: 50%; aspect-ratio: 1; transform: translateY(-50%); border-radius: 50%; background: url(img/cielo-disc.jpg) center / cover; box-shadow: 0 0 0 1px rgba(230, 194, 120, .7), 0 0 14cqw rgba(230, 194, 120, .3); animation: spin 140s linear infinite; }
.card.back .rim { position: absolute; inset: 4cqw; border-radius: 5cqw; border: 1px solid rgba(230, 194, 120, .45); }
.card.back .word { position: absolute; left: 0; right: 0; bottom: 7cqw; text-align: center; font: 700 7cqw/1 var(--f-label); letter-spacing: .3em; color: var(--gold); text-shadow: 0 0 8px rgba(230, 194, 120, .6); }
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
@container (max-width: 74px) {
  .card .label, .card .pips, .card .corner.br, .card .sub { display: none; }
  .card .corner b { font-size: 19cqw; }
  .card .medal { width: 58cqw; } .card .medal span { font-size: 30cqw; }
  .card .title { font-size: 13cqw; bottom: 8cqw; }
}

/* ---------- tavolo ---------- */
.tv { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
.tv-sky { position: absolute; inset: -20%; z-index: 0; pointer-events: none; background: url(img/cielo-disc.jpg) center / min(140vmin, 1100px) no-repeat; opacity: .13; animation: skyspin 300s linear infinite; }
@keyframes skyspin { to { transform: rotate(360deg); } }
.tv > *:not(.tv-sky) { position: relative; z-index: 1; }
.tv-top { display: flex; align-items: center; gap: 8px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px)); }
.tv-top .brand { font-family: var(--f-disp); font-weight: 700; font-size: 21px; background: linear-gradient(180deg, #fff3cf, #e6c278); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tv-top .info { flex: 1; min-width: 0; display: grid; font-family: var(--f-label); font-size: 12.5px; letter-spacing: .08em; color: var(--muted); white-space: nowrap; line-height: 1.2; }
.tv-top .info > * { overflow: hidden; text-overflow: ellipsis; }
.tv-top .info b { color: var(--text); font-weight: 600; }
.tv-top .info small { font-size: 10.5px; letter-spacing: .16em; opacity: .8; }
.iconbtn { appearance: none; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--text); border-radius: 999px; min-height: 36px; padding: 4px 12px; cursor: pointer; font-family: var(--f-label); font-size: 13px; letter-spacing: .04em; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(9, 8, 20, .85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.topbar .brand { font-family: var(--f-disp); font-weight: 700; color: var(--gold); font-size: 21px; }
.topbar .info { flex: 1; min-width: 0; font-family: var(--f-label); font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv-banner { margin: 0 14px 6px; }

.tv-table { position: relative; container-type: size; flex: 1 1 auto; min-height: 230px; max-height: min(122vw, 640px); width: calc(100% - 20px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); max-width: 860px; margin: auto; }
.tv-oval { position: absolute; left: 7%; right: 7%; top: 13%; bottom: 7%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 42%, rgba(52, 40, 110, .55), rgba(16, 12, 38, .85) 62%, rgba(8, 6, 20, .95));
  box-shadow: 0 0 0 1px rgba(230, 194, 120, .55), 0 0 0 7px rgba(10, 8, 22, .9), 0 0 0 8px rgba(230, 194, 120, .28), 0 30px 60px rgba(0, 0, 0, .6), inset 0 0 60px rgba(124, 92, 255, .25); }
.tv-oval::before { content: ""; position: absolute; inset: 9% 16%; border-radius: 50%; background: url(img/cielo-disc.jpg) center / contain no-repeat; opacity: .16; mix-blend-mode: screen; }
.tv-trump, .tv-pr { position: absolute; bottom: 0; display: flex; align-items: center; gap: 8px; font-family: var(--f-label); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); z-index: 2; line-height: 1.25; }
.tv-trump { left: 0; }
.tv-pr { right: 0; flex-direction: row-reverse; text-align: right; }
.tv-pr .orb { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: baseline; justify-content: center; padding-top: 13px; font: 700 19px/1 var(--f-label); letter-spacing: 0; color: #fff3cf; border: 1px solid rgba(230, 194, 120, .55); background: radial-gradient(circle at 35% 30%, rgba(180, 140, 255, .45), rgba(40, 30, 90, .85) 60%, rgba(12, 10, 28, .95)); box-shadow: 0 0 14px rgba(124, 92, 255, .35); }
.tv-pr .orb small { font-size: 11px; color: var(--muted); margin-left: 1px; }
.tv-pr b, .tv-trump b { display: block; font-size: 11px; letter-spacing: .1em; }
.tv-pr b { color: var(--gold); }
.tv-pr.over .orb { box-shadow: 0 0 14px rgba(255, 120, 110, .45); } .tv-pr.under .orb { box-shadow: 0 0 14px rgba(90, 200, 255, .45); } .tv-pr.even .orb { box-shadow: 0 0 16px rgba(230, 194, 120, .6); }
.tv-trump .card { --cw: 46px; transform: rotate(-8deg); }
.tv-trump .none { width: 46px; aspect-ratio: 5/7; border-radius: 5px; border: 1px dashed var(--line-2); display: grid; place-items: center; font-size: 9px; padding: 3px; }
.tv-trump b { color: var(--tc, var(--gold)); text-shadow: 0 0 8px var(--tc, transparent); }
.tv-zone { position: absolute; left: 50%; top: 55%; width: 0; height: 0; z-index: 3; }
.tv-zone .card { position: absolute; --cw: clamp(46px, min(15vw, 18cqh), 82px); margin-left: calc(var(--cw) / -2); margin-top: calc(var(--cw) * -.7); transition: box-shadow .3s; }
.tv-zone .card.win { box-shadow: 0 0 0 2px var(--gold), 0 0 28px rgba(230, 194, 120, .9), 0 10px 22px #000a; z-index: 5; }
.tv-msg { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); width: 52%; text-align: center; font-family: var(--f-label); font-size: 13px; letter-spacing: .08em; color: #cfc6ee; z-index: 2; pointer-events: none; }
.tv-seat { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; width: 92px; z-index: 4; text-align: center; cursor: pointer; appearance: none; border: 0; background: none; padding: 0; color: inherit; }
.tv-ava { --p: 0; position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font: 700 20px/1 var(--f-label); color: #1f1407;
  background: radial-gradient(circle at 35% 30%, #fff1c9, #e6c278 45%, #8f6526); box-shadow: 0 0 0 2px rgba(10, 8, 22, .9), 0 0 0 3px rgba(230, 194, 120, .4), 0 8px 18px rgba(0, 0, 0, .55); transition: box-shadow .3s; }
.tv-seat.bot .tv-ava { background: radial-gradient(circle at 35% 30%, #e6defd, #9b7bff 50%, #4b3592); }
.tv-seat.turn .tv-ava { box-shadow: 0 0 0 2px rgba(10, 8, 22, .9), 0 0 0 4px var(--gold), 0 0 26px rgba(230, 194, 120, .8); animation: breathe 1.8s ease-in-out infinite; }
.tv-seat.turn .tv-ava::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 61%, #000 62%); mask: radial-gradient(circle, transparent 61%, #000 62%); opacity: .9; }

<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
window.GAME_PREFIX = 'presagio/v1/';
/* ===== Rete senza account: MQTT su WebSocket verso broker pubblici gratuiti =====
   Modello: il dispositivo "host" del tavolo tiene la verità. Pubblica lo stato completo
   come messaggio "retained" (chi arriva lo riceve subito); gli altri inviano solo azioni.
   Robustezza: controllo continuo che il server risponda, riconnessione immediata quando
   la pagina torna in primo piano, subentro automatico se l'host sparisce. */

var NETQ = new URLSearchParams(location.search);
var NET_PING_MS = +(NETQ.get('ping') || 10000);     // ogni quanto si interroga il server
var NET_DEAD_MS = +(NETQ.get('dead') || 15000);     // silenzio oltre il quale si verifica la connessione
var NET_PROBE_MS = 5000;                            // attesa della risposta alla verifica

/* ---------- client MQTT 3.1.1 minimo ---------- */
function MQ(url) {
  this.url = url; this.subs = {}; this.handlers = []; this.statusHandlers = [];
  this.connected = false; this.closed = false; this.pid = 1; this.buf = new Uint8Array(0);
  this.backoff = 800; this.lastRx = Date.now(); this.id = 'pp' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);
  var self = this;
  this.ready = new Promise(function (res, rej) { self._res = res; self._rej = rej; });
  this._open();
}
MQ.enc = new TextEncoder(); MQ.dec = new TextDecoder();
MQ.str = function (s) { var b = MQ.enc.encode(s); return [b.length >> 8, b.length & 255].concat(Array.from(b)); };
MQ.packet = function (head, body) {
  var len = body.length, rl = [];
  do { var d = len % 128; len = Math.floor(len / 128); if (len > 0) d |= 128; rl.push(d); } while (len > 0);
  var out = new Uint8Array(1 + rl.length + body.length);
  out[0] = head; out.set(rl, 1); out.set(body, 1 + rl.length);
  return out;
};
MQ.prototype._open = function () {
  var self = this, ws;
  clearTimeout(this.retryTimer); this.retryTimer = null;
  try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.ws = null; this._down(); return; }
  ws.binaryType = 'arraybuffer'; this.ws = ws; this.buf = new Uint8Array(0);
  this.openTimer = setTimeout(function () { if (!self.connected && self.ws === ws) self._drop(); }, 7000);
  ws.onopen = function () {
    var body = MQ.str('MQTT').concat([4, 0x02, 0, 45]).concat(MQ.str(self.id));
    ws.send(MQ.packet(0x10, body));
  };
  ws.onmessage = function (ev) {
    if (self.ws !== ws) return;
    self.lastRx = Date.now();
    var chunk = new Uint8Array(ev.data), b = new Uint8Array(self.buf.length + chunk.length);
    b.set(self.buf); b.set(chunk, self.buf.length); self.buf = b; self._parse();
  };
  ws.onclose = function () { if (self.ws === ws) { self.ws = null; self._down(); } };
  ws.onerror = function () {};
};
// Chiude subito una connessione sospetta (anche se il browser la crede ancora aperta) e riparte.
MQ.prototype._drop = function () {
  var ws = this.ws; this.ws = null;
  if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; try { ws.close(); } catch (e) {} }
  this._down();
};
MQ.prototype._down = function () {
  var self = this, was = this.connected;
  this.connected = false; clearInterval(this.pinger); clearTimeout(this.openTimer); clearTimeout(this.probeTimer); this.probeTimer = null;
  if (was) this.statusHandlers.forEach(function (f) { f(false); });
  if (this.closed) return;
  if (!this.everUp) { this._rej(new Error('broker non raggiungibile')); this.closed = true; return; }
  if (this.retryTimer) return;
  this.retryTimer = setTimeout(function () { self.retryTimer = null; if (!self.closed && !self.ws) self._open(); }, this.backoff);
  this.backoff = Math.min(this.backoff * 1.7, 8000);
};
// Verifica attiva: manda un ping e, se entro pochi secondi non arriva nulla, considera la connessione morta.
MQ.prototype.probe = function () {
  var self = this;
  if (!this.connected || this.probeTimer) return;
  var since = Date.now();
  this._raw(MQ.packet(0xC0, []));
  this.probeTimer = setTimeout(function () { self.probeTimer = null; if (self.connected && self.lastRx < since) self._drop(); }, NET_PROBE_MS);
};
// Da chiamare quando la pagina torna visibile o la rete torna disponibile.
MQ.prototype.wake = function () {
  if (this.closed) return;
  if (this.connected) { this.probe(); return; }
  if (!this.ws) { this.backoff = 800; this._open(); }
};
MQ.prototype._parse = function () {
  var b = this.buf;
  while (b.length >= 2) {
    var mult = 1, len = 0, i = 1, d;
    do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
    if (b.length < i + len) break;
    this._handle(b[0], b.subarray(i, i + len));
    b = b.subarray(i + len);
  }
  this.buf = b.slice();
};
MQ.prototype._handle = function (h, body) {
  var type = h >> 4, self = this;
  if (type === 2) { // CONNACK
    if (body[1] !== 0) { this._drop(); return; }
    clearTimeout(this.openTimer);
    this.connected = true; this.everUp = true; this.backoff = 800;
    this.pinger = setInterval(function () {
      if (Date.now() - self.lastRx > NET_DEAD_MS) self.probe();
      else self._raw(MQ.packet(0xC0, []));
    }, NET_PING_MS);
    var topics = Object.keys(this.subs); if (topics.length) this._sub(topics);
    this._res(this);
    this.statusHandlers.forEach(function (f) { f(true); });
  } else if (type === 3) { // PUBLISH
    var qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1], topic = MQ.dec.decode(body.subarray(2, 2 + tl)), p = 2 + tl;
    if (qos > 0) { var id = [body[p], body[p + 1]]; p += 2; if (qos === 1) this._raw(MQ.packet(0x40, id)); }
    var payload = MQ.dec.decode(body.subarray(p)), retained = !!(h & 1);
    this.handlers.forEach(function (f) { f(topic, payload, retained); });
  }
};
MQ.prototype._raw = function (pkt) { if (this.ws && this.ws.readyState === 1) { try { this.ws.send(pkt); return true; } catch (e) {} } return false; };
MQ.prototype._nextId = function () { this.pid = this.pid % 65000 + 1; return [this.pid >> 8, this.pid & 255]; };
MQ.prototype._sub = function (topics) {
  var body = this._nextId();
  topics.forEach(function (t) { body = body.concat(MQ.str(t), [0]); });
  this._raw(MQ.packet(0x82, body));
};
MQ.prototype.subscribe = function (topic) { this.subs[topic] = true; if (this.connected) this._sub([topic]); };
MQ.prototype.unsubscribe = function (topic) {
  if (!this.subs[topic]) return; delete this.subs[topic];
  if (this.connected) this._raw(MQ.packet(0xA2, this._nextId().concat(MQ.str(topic))));
};
// Niente coda: un messaggio inviato mentre si è scollegati va perso (chi invia riprova da sé),
// così una mossa vecchia non può arrivare in ritardo dopo che l'app ha detto che non è passata.
MQ.prototype.publish = function (topic, payload, retain) {
  if (!this.connected) return false;
  var body = MQ.str(topic).concat(Array.from(MQ.enc.encode(payload)));
  return this._raw(MQ.packet(0x30 | (retain ? 1 : 0), body));
};
MQ.prototype.onMessage = function (f) { this.handlers.push(f); };
MQ.prototype.onStatus = function (f) { this.statusHandlers.push(f); };

/* ---------- tavolo condiviso ---------- */
var Net = (function () {
  var qs = NETQ;
  var BROKERS = qs.get('broker') ? qs.get('broker').split(',') : [
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://test.mosquitto.org:8081/mqtt'
  ];
  var HOST_TIMEOUT = +(qs.get('hostTimeout') || 20000);          // dopo quanto mostrare l'avviso
  var AUTO_TAKEOVER = +(qs.get('autoTakeover') || HOST_TIMEOUT * 1.5); // dopo quanto subentrare da soli
  var STAGGER = +(qs.get('stagger') || 6000);                     // attesa extra per ogni giocatore prima di me
  var PREFIX = window.GAME_PREFIX || 'polvere-piombo/v1/';
  var uid = lsGet('pp-uid');
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6); lsSet('pp-uid', uid); }
  var clients = {}, reducer = null, beforePublish = null, onTakeover = null, lobbyInfo = null;
  var LOBBY_BEAT = +(qs.get('lobbyBeat') || 20000);   // ogni quanto l'host conferma che il tavolo è vivo
  var LOBBY_TTL = +(qs.get('lobbyTtl') || 150000);    // oltre questo silenzio il tavolo sparisce dalla lista
  var FIND_MS = +(qs.get('findMs') || 4500);          // attesa massima della risposta quando si cerca un tavolo
  function lobbyTopic(id) { return PREFIX + 'lobby/' + id; }
  function rid() { return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6); }
  var T = null; // sessione del tavolo aperto

  function client(i) {
    if (!clients[i]) {
      clients[i] = new MQ(BROKERS[i]);
      clients[i].ready.catch(function () { delete clients[i]; });
    }
    return clients[i].ready;
  }
  function topic(code, t) { return PREFIX + code + '/' + t; }

  // Ritorno in primo piano o rete di nuovo disponibile: verifica subito la connessione.
  function wakeAll() {
    Object.keys(clients).forEach(function (k) { clients[k].wake(); });
    if (T) { T.lastPing = Math.max(T.lastPing, Date.now() - 2000); T.graceUntil = Date.now() + 8000; }
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wakeAll(); });
  window.addEventListener('online', wakeAll);
  window.addEventListener('pageshow', function (e) { if (e.persisted) wakeAll(); });
  window.addEventListener('focus', wakeAll);

  function probeState(c, code, ms) {
    return new Promise(function (res) {
      var st = topic(code, 'state'), done = false;
      function fin(v) { if (done) return; done = true; c.handlers = c.handlers.filter(function (x) { return x !== h; }); res(v); }
      function h(t, p) { if (t === st) fin(p ? safeParse(p) : null); }
      c.onMessage(h);
      c.subscribe(st);
      setTimeout(function () { fin(null); }, ms);
    });
  }
  function safeParse(p) { try { return JSON.parse(p); } catch (e) { return null; } }
  async function firstBroker() {
    for (var i = 0; i < BROKERS.length; i++) { try { return { i: i, c: await client(i) }; } catch (e) {} }
    throw 'Nessun server di gioco raggiungibile. Controlla la connessione e riprova.';
  }
  // Cerca un tavolo su tutti i server in parallelo, con un'attesa generosa (reti lente, pagina appena riaperta).
  // Risponde: {i, c, doc} se c'è; {closed:true} se è stato chiuso; {offline:true} se nessun server risponde; null se non c'è.
  function find(code, ms) {
    ms = ms || FIND_MS;
    return new Promise(function (resolve) {
      var pending = BROKERS.length, reached = false, closed = false, done = false;
      function finish(v) { if (!done) { done = true; resolve(v); } }
      BROKERS.forEach(function (_, i) {
        client(i).then(function (c) {
          reached = true;
          if (done) return;
          return probeState(c, code, ms).then(function (doc) {
            if (doc && doc.code === code && !doc.closed) { finish({ i: i, c: c, doc: doc }); return; }
            if (!(T && T.code === code)) c.unsubscribe(topic(code, 'state'));
            if (doc && doc.closed) closed = true;
          });
        }).catch(function () {}).then(function () { if (--pending === 0) finish(!reached ? { offline: true } : closed ? { closed: true } : null); });
      });
    });
  }

  function newCode() { var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ', s = ''; for (var i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

  async function create(nick, opts) {
    var b = await firstBroker();
    for (var k = 0; k < 6; k++) {
      var code = newCode();
      var ex = await probeState(b.c, code, 1200);
      b.c.unsubscribe(topic(code, 'state'));

/* ===== Presagio: interfaccia ===== */
var D = PRData, E = PREngine, BOT = PRBot, CARDS = PRData.CARDS;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
var $ = function (s) { return document.querySelector(s); };
var App = { screen: 'lobby', code: null, doc: null, sheet: null, sel: null, busy: false, botKey: null, botTimer: null, lastFlash: 0, flashInit: false, sheetKey: null };
var BOTNAMES = ['Selene', 'Orfeo', 'Vega', 'Altair', 'Lyra', 'Castore', 'Mira', 'Sirio'];
var KEY_TABLE = 'pr-table', KEY_RECENT = 'pr-recent';

function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2800); }
function myNick() { return (lsGet('pp-nick') || '').trim().slice(0, 18); }
function myIdx() { var g = App.doc && App.doc.game; if (!g) return -1; for (var i = 0; i < g.players.length; i++) if (g.players[i].uid === Net.uid) return i; return -1; }
function suitName(s) { return D.SUITS[s].n; }

/* ---------- regole del tavolo (girano sull'host) ---------- */
function uniqueNick(seats, n) { var base = n, k = 2; while (seats.some(function (s) { return s.nick.toLowerCase() === n.toLowerCase(); })) n = base + ' ' + k++; return n; }
function tableReducer(doc, from, op) {
  var isHost = doc.host === from, seat = doc.seats.filter(function (s) { return s.uid === from; })[0];
  var hostOnly = { err: 'Solo chi ha aperto il tavolo può farlo.' };
  switch (op.t) {
    case 'join': {
      var nick = String(op.nick || '').trim().slice(0, 18) || 'Veggente';
      if (seat) { if (doc.phase === 'lobby' && seat.nick !== nick) { seat.nick = uniqueNick(doc.seats.filter(function (s) { return s !== seat; }), nick); return {}; } return { changed: false, out: 'seated' }; }
      if (doc.phase !== 'lobby') return { changed: false, out: 'spect' };
      if (doc.seats.length >= 6) return { err: 'Il tavolo è pieno (6 giocatori).' };
      doc.seats.push({ uid: from, nick: uniqueNick(doc.seats, nick) }); return {};
    }
    case 'leave': case 'kick': {
      var who = op.t === 'leave' ? from : op.uid;
      if (op.t === 'kick' && who !== from && !isHost) return hostOnly;
      if (doc.phase !== 'lobby') return { changed: false };
      doc.seats = doc.seats.filter(function (s) { return s.uid !== who; });
      if (doc.host === who) { var h = doc.seats.filter(function (s) { return !s.bot; })[0]; doc.host = h ? h.uid : null; }
      return {};
    }
    case 'addbot': {
      if (!isHost) return hostOnly;
      if (doc.phase !== 'lobby') return { changed: false };
      if (doc.seats.length >= 6) return { err: 'Il tavolo è pieno.' };
      var used = doc.seats.map(function (s) { return s.nick; }), nm = BOTNAMES.filter(function (b) { return used.indexOf(b) < 0; })[0] || 'Astro';
      doc.seats.push({ uid: 'bot-' + Math.random().toString(36).slice(2, 8), nick: nm, bot: true }); return {};
    }
    case 'vis': if (!isHost) return hostOnly; doc.vis = op.vis === 'invite' ? 'invite' : 'public'; return {};
    case 'opt': {
      if (!isHost) return hostOnly;
      if (doc.phase !== 'lobby') return { changed: false };
      doc.opts = doc.opts || {};
      if (op.noEven != null) { doc.opts.noEven = !!op.noEven; if (doc.opts.noEven) doc.opts.hidden = false; }
      if (op.hidden != null) { doc.opts.hidden = !!op.hidden; if (doc.opts.hidden) doc.opts.noEven = false; }
      if (op.timer != null) doc.opts.timer = Math.max(0, Math.min(600, +op.timer || 0));
      return {};
    }
    case 'back': {
      var gb = doc.game; if (!gb) return { changed: false };
      var pb = -1; gb.players.forEach(function (P, k) { if (P.uid === from) pb = k; });
      if (pb < 0 || !gb.players[pb].bot) return { changed: false };
      gb.players[pb].bot = false; gb.players[pb].away = false;
      gb.log.push({ n: ++gb.logN, t: gb.players[pb].nick + ' è tornato al tavolo.', k: 'sys' });
      return {};
    }
    case 'start': {
      if (!isHost) return hostOnly;
      if (doc.phase !== 'lobby') return { changed: false };
      if (doc.seats.length < 3) return { err: 'Servono almeno 3 giocatori: aggiungi dei giocatori automatici.' };
      var seats = doc.seats.slice();
      for (var i = seats.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = seats[i]; seats[i] = seats[j]; seats[j] = t; }
      doc.game = E.newGame(seats, doc.opts); doc.phase = 'play'; return {};
    }
    case 'rematch': if (!isHost) return hostOnly; doc.phase = 'lobby'; doc.game = null; return {};
    case 'auto': if (!isHost) return hostOnly; if (!doc.game || !doc.game.players[op.p]) return { changed: false }; doc.game.players[op.p].bot = !!op.on; return {};
    case 'act': {
      var g = doc.game; if (!g) return { err: 'La partita non è più disponibile.' };
      var p = -1; g.players.forEach(function (P, k) { if (P.uid === from) p = k; });
      if (op.a && op.a.a === 'next' && g.phase === 'roundEnd' && (isHost || p === g.turn)) p = g.turn;
      if (p < 0) return { err: 'Stai solo guardando questa partita.' };
      if (g.players[p].bot && g.players[p].uid === from) { g.players[p].bot = false; g.players[p].away = false; }
      var err = E.act(g, p, op.a); if (err) return { err: err };
      if (g.phase === 'over') doc.phase = 'over';
      return {};
    }
  }
  return { err: 'Azione sconosciuta.' };
}
Net.setReducer(tableReducer);
Turns.setup({
  decider: function (g) { return E.decider(g); },
  onTimeout: function (cur, d) {
    var g = cur.game;
    // a fine mano non si penalizza nessuno: si passa semplicemente alla mano successiva
    if (g.phase === 'roundEnd') { if (E.act(g, d, { a: 'next' })) return false; return true; }
    g.players[d].bot = true; g.players[d].away = true; Turns.awayLog(g, d); return true;
  }
});
Net.setLobbyInfo(function (d) { var o = d.opts || {}, notes = []; if (o.noEven) notes.push('somma diversa'); if (o.hidden) notes.push('previsioni coperte'); if (o.timer === 0) notes.push('senza timer'); return { max: 6, note: notes.join(', ') }; });
Net.setOnTakeover(function () { toast('L’host non rispondeva: ora reggi tu il tavolo e muovi i giocatori automatici.'); render(); });

/* ---------- azioni ---------- */
async function run(p) { if (App.busy) return; App.busy = true; render(); try { await p(); } catch (e) { toast(typeof e === 'string' ? e : (e && e.message) || 'Qualcosa è andato storto. Riprova.'); } finally { App.busy = false; render(); } }
function requireNick() {
  var n = ($('#nick') && $('#nick').value.trim()) || myNick();
  if (!n) { toast('Scrivi il tuo nome.'); if ($('#nick')) { $('#nick').focus(); $('#nick').scrollIntoView({ block: 'center' }); } return null; }
  lsSet('pp-nick', n.slice(0, 18)); return n.slice(0, 18);
}
function remember(code) {
  var list = []; try { list = JSON.parse(lsGet(KEY_RECENT) || '[]'); } catch (e) {}
  list = list.filter(function (x) { return x.code !== code; }); list.unshift({ code: code, t: Date.now() });
  lsSet(KEY_RECENT, JSON.stringify(list.slice(0, 5)));
}
function createTable() { var nick = requireNick(); if (!nick) return; var vis = Lobby.pickedVis(); App.status = 'Apro un tavolo…'; run(async function () { var code = await Net.create(nick, { vis: vis }); await enterTable(code, nick); }); }
function joinTable(code) {
  code = (code || '').trim().toUpperCase();
  if (App.code === code && App.doc) { toTable(); return; }
  if (!/^[A-Z]{4}$/.test(code)) { toast('Il codice del tavolo ha 4 lettere.'); return; }
  var nick = requireNick(); if (!nick) return;
  App.status = 'Cerco il tavolo ' + code + '…'; run(function () { return enterTable(code, nick); });
}
async function enterTable(code, nick) {
  if (App.code && App.code !== code && App.doc) {
    var d0 = App.doc;
    if (d0.phase === 'lobby' && d0.seats.some(function (s) { return s.uid === Net.uid; })) {
      if (Net.isHost && !d0.seats.some(function (s) { return !s.bot && s.uid !== Net.uid; })) Net.clearTable(); else Net.send({ t: 'leave' }).catch(function () {});
    }
  }
  App.code = code; App.doc = null; App.flashInit = false; App.sheet = null; App.sel = null; App.botKey = null; App.sheetKey = null;
  App.screen = 'table'; render();
  var ok = await Net.open(code, function (doc) {
    if (!doc) { Lobby.forget(code); if (App.code === code) { toast(App.closing ? 'Hai chiuso il tavolo ' + code + '.' : 'Il tavolo ' + code + ' è stato chiuso dall’host.'); App.closing = false; leaveTable(true); } return; }
    App.doc = doc; onDoc();
  }, function () { var sig = Net.connected + ':' + Net.hostAlive() + ':' + Net.isHost; if (sig !== App.netSig) { App.netSig = sig; render(); } });
  if (ok !== true) {
    App.screen = 'lobby'; App.code = null; lsSet('pr-table', null); if (ok === 'closed') Lobby.forget(code); render();
    throw ok === 'closed' ? 'Il tavolo ' + code + ' è stato chiuso. L’ho tolto dai tuoi tavoli recenti.' : 'Non riesco a raggiungere il tavolo ' + code + '. Se la connessione è lenta, riprova tra poco da «I tuoi tavoli recenti».';
  }
  lsSet(KEY_TABLE, code); remember(code);
  if (nick) { var out = await Net.send({ t: 'join', nick: nick }); if (out === 'spect' && myIdx() < 0) toast('La partita è già iniziata: la guardi da spettatore.'); }
  Nav.guard(code);
  Chat.reset();
}
function send(op) { return run(function () { return Net.send(op); }); }
function act(a) { App.sel = null; return send({ t: 'act', a: a }); }

/* ---------- tavolo in corso e gesto indietro ---------- */
function curTableHTML() {
  if (!App.code || !App.doc) return '<div id="curtable"></div>';
  var d = App.doc, seated = d.seats.some(function (s) { return s.uid === Net.uid; }), host = d.seats.filter(function (s) { return s.uid === d.host; })[0];
  var st = d.phase === 'play' ? 'partita in corso' : d.phase === 'over' ? 'partita finita' : 'in attesa · ' + d.seats.length + ' giocatori';
  return '<div id="curtable" class="notice" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:180px">' + (seated ? 'Sei seduto al tavolo' : 'Stai guardando il tavolo') + ' <b>' + esc(d.code) + '</b>' + (host ? ' di ' + esc(host.nick) : '') + ' · ' + st + '</span><button class="btn small" data-act="totable">Torna al tavolo</button></div>';
}
function paintCur() { var el = document.getElementById('curtable'); if (el) el.outerHTML = curTableHTML(); }
function toTable() { if (!App.code) return; App.screen = 'table'; Nav.guard(App.code); if (App.doc) onDoc(); else render(); window.scrollTo(0, 0); }
function toHome() { if (history.state && history.state.ppTable) history.back(); else { App.screen = 'lobby'; render(); window.scrollTo(0, 0); } }
Nav.setup(function (state) {
  if (App.screen === 'table' && App.code) {
    if (App.sheet || App.sel != null) { App.sheet = null; App.sel = null; render(); Nav.guard(App.code); return; }
    App.screen = 'lobby'; render(); window.scrollTo(0, 0); return;
  }
  
  if (state && state.ppTable && state.ppTable === App.code && App.doc) { App.screen = 'table'; onDoc(); }
});
function leaveTable(silent) {
  Chat.reset();
  var d = App.doc;
  if (!silent && d && d.phase === 'lobby' && d.seats.some(function (s) { return s.uid === Net.uid; })) {
    var humans = d.seats.filter(function (s) { return !s.bot && s.uid !== Net.uid; });
    if (Net.isHost && !humans.length) Net.clearTable(); else Net.send({ t: 'leave' }).catch(function () {});
  }
  setTimeout(function () { Net.close(); }, 400);
  App.code = null; App.doc = null; lsSet(KEY_TABLE, null); history.replaceState(null, '', location.pathname);
  App.screen = 'lobby'; App.sheet = null; render();
}
function inviteLink() { return location.origin + location.pathname + '?t=' + App.code; }
function copyText(t, ok) { try { navigator.clipboard.writeText(t).then(function () { toast(ok || 'Copiato'); }, function () { toast(t); }); } catch (e) { toast(t); } }
function invite() {
  var url = inviteLink(), text = 'Siediti al mio tavolo di Presagio: codice ' + App.code;
  if (navigator.share) { navigator.share({ title: 'Presagio', text: text, url: url }).catch(function () {}); return; }
  copyText(url, 'Link d’invito copiato');
}

/* ---------- giocatori automatici (li muove l'host) ---------- */
function driveBots() {
  var doc = App.doc;
  if (!doc || !Net.isHost || doc.phase !== 'play' || !doc.game) return;
  var g = doc.game, d = E.decider(g);
  if (d == null || !g.players[d].bot) return;
  var key = App.code + ':' + g.seq;
  if (App.botKey === key) return;
  App.botKey = key; clearTimeout(App.botTimer);
  var wait = g.phase === 'roundEnd' ? 4200 : g.phase === 'bid' ? 800 : g.phase === 'trump' ? 1000 : (!g.trick.length && g.lastTrick ? 2300 : 1000);
  App.botTimer = setTimeout(function () {
    Net.hostApply(function (cur) {
      if (!cur || !cur.game || cur.phase !== 'play') return false;
      var gg = cur.game, dd = E.decider(gg);
      if (gg.seq !== g.seq || dd !== d || !gg.players[dd].bot) return false;
      var a = BOT.decide(gg, dd); if (!a || E.act(gg, dd, a)) return false;
      if (gg.phase === 'over') cur.phase = 'over';
      return true;
    });
  }, wait + Math.random() * 300);
}

/* ---------- stato in arrivo ---------- */
function onDoc() {
  var g = App.doc.game;
  if (g && !App.flashInit) { App.lastFlash = g.flash ? g.flash.n : 0; App.flashInit = true; }
  if (!g) App.flashInit = false;
  if (App.screen !== 'table') { if (g && g.flash) App.lastFlash = Math.max(App.lastFlash, g.flash.n); driveBots(); Turns.watch(App.doc); paintCur(); return; }
  if (g) {
    // fogli automatici: riepilogo di fine mano e fine partita
    var key = g.phase === 'roundEnd' ? 'r' + g.round : g.phase === 'over' ? 'over' : null;
    if (key && key !== App.sheetKey) {
      // il riepilogo arriva dopo che l'ultima presa (e, se coperte, le previsioni) si sono viste sul tavolo
      var fresh = TV.mounted(), kind = g.phase === 'over' ? 'over' : 'round';
      App.sheetKey = key;
      setTimeout(function () {
        var gg = App.doc && App.doc.game, k2 = gg && (gg.phase === 'roundEnd' ? 'r' + gg.round : gg.phase === 'over' ? 'over' : null);
        if (k2 === key && App.screen === 'table' && !App.sheet) { App.sheet = { kind: kind }; renderSheet(); }
      }, fresh ? (g.opts.hidden ? 5000 : 2900) : 0);
    }
    if (!key && App.sheet && (App.sheet.kind === 'round' || App.sheet.kind === 'over')) App.sheet = null;
    if (App.sel != null && myIdx() >= 0 && g.players[myIdx()].hand.indexOf(App.sel) < 0) App.sel = null;
  } else if (App.sheet && (App.sheet.kind === 'round' || App.sheet.kind === 'over')) App.sheet = null;
  render(); driveBots(); Turns.watch(App.doc);
}
function playFlash() {
  var g = App.doc && App.doc.game; if (!g || !g.flash || g.flash.n <= App.lastFlash) return;
  App.lastFlash = g.flash.n;
  if (g.flash.kind === 'trick') {
    var el = document.querySelector('[data-pl="' + g.flash.p + '"]'); if (el) el.classList.add('flash');
    if (g.flash.p === myIdx()) { var s = document.createElement('div'); s.className = 'stamp'; s.textContent = 'Presa!'; document.body.appendChild(s); setTimeout(function () { s.remove(); }, 1400); }
  }
}

/* ---------- render ---------- */
function cardHTML(id, cls, attrs) { return PRCards.html(id, cls, attrs); }
function backHTML(style) { return PRCards.back('', style); }
function connInfo(txt) { return Net.connected ? txt : '<span style="color:var(--bad)">Riconnessione…</span> ' + txt; }
function hostBanner() {
  var d = App.doc; if (!d || Net.isHost || Net.hostAlive()) return '';
  var h = d.seats.filter(function (s) { return s.uid === d.host; })[0];
  return '<div class="notice red">' + esc(h ? h.nick : 'L’host') + ' non risponde: forse ha chiuso il gioco o ha il telefono in standby. Tra pochi secondi il comando passa da solo a un altro giocatore, oppure prendilo tu adesso.<div class="row" style="margin-top:8px"><button class="btn small" data-act="takehost">Prendi il comando</button></div></div>';
}
function render() {
  var root = $('#app');
  if (App.screen === 'table' && App.doc && App.doc.game && App.doc.phase !== 'lobby') { Lobby.end(); TV.update(App.doc); renderSheet(); return; }
  TV.unmount();
  if (App.screen === 'lobby') root.innerHTML = lobbyHTML();
  else if (!App.doc) root.innerHTML = '<div class="wrap lobby"><p class="muted">' + esc(App.status || 'Mi siedo al tavolo…') + '</p></div>';
  else if (App.doc.phase === 'lobby' || !App.doc.game) root.innerHTML = roomHTML();
  if (App.screen === 'lobby') Lobby.start(); else Lobby.end();
  renderSheet();
}
window.addEventListener('resize', function () { if (TV.mounted()) TV.update(App.doc); });

function lobbyHTML() {
  var fan = [cardHTML(52), cardHTML(12), cardHTML(56)].map(function (h, i) { return h.replace('class="card', 'style="transform:translateX(-50%) rotate(' + ((i - 1) * 12) + 'deg) translateX(' + ((i - 1) * 20) + 'px)" class="card'); }).join('');
  var inv = App.inviteCode ? '<div class="notice">Sei stato invitato al tavolo <b>' + esc(App.inviteCode) + '</b>. Scrivi il tuo nome e tocca Siediti.</div>' : '';
  return '<div class="wrap lobby"><a class="back-link" href="../">← Tutti i giochi</a>' + curTableHTML() +
    '<section class="hero"><div style="display:grid;gap:10px"><h1>Presagio</h1><p class="tag">Prevedi quante prese farai, poi fanne esattamente quelle. Da 3 a 6 giocatori, ognuno dal proprio telefono.</p><p class="credit">Illustrazioni: incisioni di Gustave Doré e di antichi atlanti celesti, di pubblico dominio</p></div><div class="fan" aria-hidden="true">' + fan + '</div></section>' + inv +
    '<div class="grid2"><section class="panel"><h2>Il tuo nome</h2><label class="lead" for="nick">Come ti vedranno gli altri al tavolo</label><input id="nick" class="field" maxlength="18" autocomplete="nickname" placeholder="Es. Ale" value="' + esc(myNick()) + '">' +
    (App.inviteCode ? '' : Lobby.pickHTML() + '<button class="btn block" data-act="create"' + (App.busy ? ' disabled' : '') + '>Apri un tavolo</button>') +
    '<div class="row" style="flex-wrap:nowrap"><input id="joincode" class="field code" maxlength="4" placeholder="CODICE" aria-label="Codice del tavolo" autocapitalize="characters" value="' + esc(App.inviteCode || '') + '"><button class="btn' + (App.inviteCode ? '' : ' ghost') + '" data-act="join" style="flex:none"' + (App.busy ? ' disabled' : '') + '>Siediti</button></div>' +
    (App.inviteCode ? '<button class="btn ghost small" data-act="noinvite">Apri invece un tavolo tuo</button>' : '') + '</section>' +
    '<section class="panel" style="order:-1"><h2>Tavoli aperti</h2>' + Lobby.panelHTML() + '<h3 class="muted" style="font-size:15px;font-family:var(--f-body);margin-top:6px">I tuoi tavoli recenti</h3><div id="tlist" class="tables" style="display:grid;gap:8px">' + recentHTML() + '</div><div class="row"><button class="btn ghost small" data-act="rules">Regole</button>' + PWA.buttonHTML('btn ghost small') + '</div></section></div></div>';
}
function recentHTML() { return Lobby.recentRows(); }
Lobby.setRecentKey(KEY_RECENT);
function roomHTML() {
  var d = App.doc, isHost = d.host === Net.uid, seated = d.seats.some(function (s) { return s.uid === Net.uid; }), n = d.seats.length, seats = '';
  for (var i = 0; i < 6; i++) {
    var s = d.seats[i];
    if (s) seats += '<div class="seat full"><div class="ava">' + esc(s.nick.charAt(0).toUpperCase()) + '</div><div><div class="nm">' + esc(s.nick) + '</div><div class="sub">' + (s.bot ? 'giocatore automatico' : s.uid === d.host ? 'host' : 'giocatore') + (s.uid === Net.uid ? ' · tu' : '') + '</div></div>' +
      ((isHost && s.uid !== Net.uid) || (s.uid === Net.uid && !isHost) ? '<button class="x" data-act="kick" data-uid="' + esc(s.uid) + '" aria-label="Togli ' + esc(s.nick) + '">×</button>' : '') + '</div>';
    else seats += '<div class="seat"><div class="ava">·</div><div class="sub">Posto libero</div></div>';
  }
  var noEven = !!(d.opts && d.opts.noEven), hidden = !!(d.opts && d.opts.hidden);
  var rounds = n >= 3 ? 60 / Math.max(3, Math.min(6, n)) : 20;
  return '<div class="topbar"><div class="wrap"><span class="brand">Presagio</span><span class="info">' + connInfo('Tavolo ' + esc(d.code)) + '</span>' + Chat.badgeHTML() + '<button class="iconbtn" data-act="rules">Regole</button><button class="iconbtn" data-act="leave">Esci</button></div></div>' +
    '<div class="wrap lobby">' + hostBanner() +
    '<section class="panel"><span class="lead">Codice del tavolo</span><span class="codebig">' + esc(d.code) + '</span><div class="row"><button class="btn" data-act="invite">Invita amici</button><button class="btn ghost small" data-act="copylink">Copia link</button></div>' +
    '<p class="lead">Chi apre il link si siede dal suo telefono, senza registrarsi. Servono da 3 a 6 giocatori; i posti mancanti si riempiono con giocatori automatici.</p></section>' +
    '<section class="panel"><h2>Al tavolo (' + n + '/6)</h2><div class="seats">' + seats + '</div>' +
    '<label class="switch' + (isHost ? '' : ' ro') + '"><input type="checkbox" id="opt-noeven"' + (noEven ? ' checked' : '') + (isHost ? '' : ' disabled') + '><span><b>Somma delle previsioni diversa dalle prese</b><br><span class="muted" style="font-size:15px">Il mazziere, che dichiara per ultimo, non può dire il numero che renderebbe la somma uguale alle prese della mano.</span></span></label>' +
    '<label class="switch' + (isHost ? '' : ' ro') + '"><input type="checkbox" id="opt-hidden"' + (hidden ? ' checked' : '') + (isHost ? '' : ' disabled') + '><span><b>Previsioni coperte</b><br><span class="muted" style="font-size:15px">Ognuno dichiara senza far vedere il numero: le previsioni di tutti si scoprono solo a fine mano. Non si combina con la somma diversa.</span></span></label>' +
    Lobby.roomHTML(d, isHost) + Turns.optionHTML(d, isHost) +
    (isHost ? '<div class="row"><button class="btn ghost" data-act="addbot"' + (n >= 6 ? ' disabled' : '') + '>Aggiungi giocatore automatico</button><button class="btn" data-act="start"' + (n < 3 ? ' disabled' : '') + '>Inizia la partita</button></div>' + (n < 3 ? '<p class="lead">Mancano ' + (3 - n) + ' giocatori per iniziare.</p>' : '<p class="lead">In ' + n + ' si giocano ' + rounds + ' mani.</p>')
      : seated ? '<p class="lead">In attesa che l’host inizi la partita.</p>' : '<button class="btn" data-act="jointable" data-code="' + esc(d.code) + '">Siediti</button>') +
    (isHost ? '<button class="btn ghost small" data-act="closetable" style="justify-self:start">Chiudi il tavolo</button>' : '') +
    '</section></div>';
}

// Con le previsioni coperte, quella degli altri resta nascosta finché la mano non è finita.
function bidHidden(g, i, me) { return !!(g.opts && g.opts.hidden) && i !== me && (g.phase === 'bid' || g.phase === 'play' || g.phase === 'trump'); }
function statusLine(g, me, sum, allBid, short) {
  var who = function (i) { return i === me ? 'tu' : esc(g.players[i].nick); };
  var pr = 'Previsioni: <b>' + sum + '</b> su ' + g.round + (g.round === 1 ? ' presa' : ' prese') + (allBid ? (sum > g.round ? ' · ne mancano per tutti' : sum < g.round ? ' · ne avanzano' : ' · somma pari') : '');
  if (short && g.phase !== 'roundEnd') pr = '';
  if (g.phase === 'over') return 'Partita finita.';
  if (g.phase === 'roundEnd') return 'Fine della mano ' + g.round + '. ' + pr;
  if (g.phase === 'trump') return 'Il mazziere (' + who(g.dealer) + ') sceglie la briscola.';
  if (g.phase === 'bid') return (g.turn === me ? '<b>Tocca a te prevedere.</b> ' : 'Prevede <b>' + who(g.turn) + '</b>. ') + pr + (g.opts.noEven ? ' · regola somma diversa' : '') + (g.opts.hidden ? (g.turn === me ? ' Gli altri non vedranno il tuo numero fino a fine mano.' : ' Previsioni coperte.') : '');
  return (g.turn === me ? '<b>Tocca a te.</b>' : 'Gioca <b>' + who(g.turn) + '</b>.') + ' ' + followNote(g, me) + ' ' + pr;
}
// Spiega quale colore va seguito nella presa in corso (o perché la carta è libera).
function followNote(g, me) {
  if (!g.trick.length) return g.turn === me ? 'Apri tu: gioca la carta che vuoi.' : '';
  var ls = E.leadSuit(g), opener = g.trick[0].p, by = opener === me ? 'hai aperto' : esc(g.players[opener].nick) + ' ha aperto';
  if (ls != null) return 'Si risponde a <b>' + suitName(ls) + '</b> (se non ne hai, carta libera; Arcimago e Giullare sempre).';
  var firstNonJ = g.trick.filter(function (t) { return CARDS[t.c].k !== 'j'; })[0];
  if (firstNonJ && CARDS[firstNonJ.c].k === 'w') return (firstNonJ === g.trick[0] ? by + ' con un Arcimago' : 'È uscito un Arcimago prima di qualsiasi colore') + ': <b>carta libera</b>, nessun colore da seguire.';
  return 'Finora solo Giullari: il colore lo decide la prima carta numerata.';
}
/* ---------- fogli ---------- */
function renderSheet() {
  var root = $('#sheet'), s = App.sheet;
  if (!s) { root.innerHTML = ''; return; }
  var h = sheetBody(s); if (!h) { App.sheet = null; root.innerHTML = ''; return; }
  root.innerHTML = '<div class="sheet-back" data-act="sheetback"><div class="sheet" role="dialog" aria-modal="true">' + h + '</div></div>';
}
function scoreTable(g, onlyRound) {
  var head = '<tr><th>' + (onlyRound ? 'Giocatore' : 'Mano') + '</th>' + (onlyRound ? '<th>Previste</th><th>Prese</th><th>Mano</th><th>Tot.</th>' : g.players.map(function (P) { return '<th>' + esc(P.nick) + '</th>'; }).join('')) + '</tr>';
  var body = '';
  if (onlyRound) {
    var r = g.round - 1;
    body = g.players.map(function (P) { var h = P.hist[r]; return '<tr><td>' + esc(P.nick) + '</td><td>' + h.bid + '</td><td>' + h.tricks + '</td><td class="' + (h.delta >= 0 ? 'pos' : 'neg') + '">' + (h.delta > 0 ? '+' : '') + h.delta + '</td><td>' + h.score + '</td></tr>'; }).join('');
  } else {
    var n = g.players[0].hist.length;
    for (var i = 0; i < n; i++) body += '<tr><td>' + (i + 1) + '</td>' + g.players.map(function (P) { var h = P.hist[i]; return '<td><span class="' + (h.delta >= 0 ? 'pos' : 'neg') + '">' + (h.delta > 0 ? '+' : '') + h.delta + '</span><span class="small">' + h.tricks + '/' + h.bid + ' · ' + h.score + '</span></td>'; }).join('') + '</tr>';
    if (!n) body = '<tr><td colspan="' + (g.players.length + 1) + '" class="muted" style="text-align:left">Ancora nessuna mano conclusa.</td></tr>';
    body += '<tr class="tot"><td>Totale</td>' + g.players.map(function (P) { return '<td>' + P.score + '</td>'; }).join('') + '</tr>';
  }
  return '<div class="tbl-wrap"><table class="sc">' + head + body + '</table></div>';
}
function sheetBody(s) {
  var g = App.doc && App.doc.game, me = myIdx();
  if (s.kind === 'rules') return '<h2>Regole</h2><div class="rules">' + RULES + '</div><button class="btn block" data-act="close">Chiudi</button>';
  if (s.kind === 'scores' && g) return '<h2>Punteggi</h2><p class="lead">In ogni casella: punti della mano, poi prese/previsione e totale.</p>' + scoreTable(g) + '<button class="btn block" data-act="close">Chiudi</button>';
  if (s.kind === 'round' && g && g.phase === 'roundEnd') {
    var can = g.turn === me || App.doc.host === Net.uid;
    return '<h2>Fine della mano ' + g.round + ' di ' + g.rounds + '</h2>' + scoreTable(g, true) +
      (can ? '<button class="btn block" data-act="next">Prossima mano</button>' : '<p class="lead">Attendi che ' + esc(g.players[g.turn].nick) + ' avvii la prossima mano.</p>') + '<button class="btn block ghost" data-act="close">Guarda il tavolo</button>';
  }
  if (s.kind === 'over' && g && g.phase === 'over') {
    var rank = g.players.map(function (P, i) { return { P: P, i: i }; }).sort(function (a, b) { return b.P.score - a.P.score; });
    return '<div class="winner">' + (g.winner.length > 1 ? 'Pari merito' : 'Vince ' + esc(g.players[g.winner[0]].nick)) + '</div>' +
      '<div class="tbl-wrap"><table class="sc"><tr><th>#</th><th class="l">Giocatore</th><th>Indovinate</th><th>Punti</th></tr>' + rank.map(function (r, k) { var ok = r.P.hist.filter(function (h) { return h.bid === h.tricks; }).length; return '<tr><td>' + (k + 1) + '</td><td class="l">' + esc(r.P.nick) + (r.i === me ? ' (tu)' : '') + '</td><td>' + ok + '/' + r.P.hist.length + '</td><td>' + r.P.score + '</td></tr>'; }).join('') + '</table></div>' +
      (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') +
      '<button class="btn block ghost" data-act="scores">Tutti i punteggi</button><button class="btn block ghost" data-act="close">Guarda il tavolo</button>';
  }
  if (s.kind === 'menu' && App.doc) {
    var d = App.doc;
    return '<h2>Tavolo ' + esc(d.code) + '</h2><div style="display:grid;gap:8px">' +
      '<button class="btn ghost block" data-act="invite">Invita amici al tavolo</button><button class="btn ghost block" data-act="rules">Regole</button>' +
      (d.host !== Net.uid ? '<button class="btn ghost block" data-act="takehost">Prendi il comando del tavolo (se l’host se n’è andato)</button>' : '') +
      (d.host === Net.uid && d.phase !== 'lobby' ? '<button class="btn ghost block" data-act="rematch">Chiudi la partita e torna alla sala d’attesa</button>' : '') +
      (d.host === Net.uid ? '<button class="btn ghost block" data-act="closetable">Chiudi il tavolo per tutti</button>' : '') +
      '<button class="btn ghost block" data-act="tohome">Vai alla home del gioco (resti seduto)</button>' +
      '<button class="btn ghost block" data-act="leave">Esci dal tavolo</button></div><button class="btn block" data-act="close">Chiudi</button>';
  }
  if (s.kind === 'closeconfirm' && App.doc) return '<h2>Chiudere il tavolo ' + esc(App.doc.code) + '?</h2><p class="lead">Il tavolo sparisce dalla lista' + (App.doc.game && App.doc.phase === 'play' ? ', la partita in corso finisce' : '') + ' e tutti tornano alla schermata iniziale. Non si può annullare.</p>' +
    '<button class="btn block" style="background:linear-gradient(180deg,#e0705e,#a63a2a);color:#fff" data-act="closeyes">Chiudi per tutti</button><button class="btn block ghost" data-act="close">Annulla</button>';
  if (s.kind === 'player' && g) {
    var P = g.players[s.p];
    return '<h2>' + esc(P.nick) + '</h2><p class="lead">' + P.score + ' punti · ' + (P.bid == null ? 'non ha ancora previsto' : bidHidden(g, s.p, me) ? 'previsione coperta, ' + P.tricks + (P.tricks === 1 ? ' presa fatta' : ' prese fatte') : 'ha previsto ' + P.bid + ', ne ha fatte ' + P.tricks) + ' · ' + P.hand.length + ' carte in mano</p>' +
      (App.doc.host === Net.uid && s.p !== me && g.phase !== 'over' ? '<button class="btn ghost block" data-act="auto" data-p="' + s.p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') +
      '<button class="btn block" data-act="close">Chiudi</button>';
  }
  return '';
}

var RULES = '<p>Si gioca con 60 carte: quattro casate (Fiamme, Maree, Foreste, Sabbie) con valori da 1 a 13, più 4 <b>Arcimaghi</b> e 4 <b>Giullari</b>.</p>' +
  '<h3>Le mani</h3><p>Nella prima mano ognuno riceve 1 carta, nella seconda 2 e così via, finché il mazzo basta: 20 mani in 3, 15 in 4, 12 in 5, 10 in 6. Il mazziere cambia ogni mano.</p>' +
  '<h3>La briscola</h3><ul><li>Dopo la distribuzione si scopre la prima carta del mazzo: il suo colore è la briscola.</li><li>Se è un Giullare non c’è briscola.</li><li>Se è un Arcimago, il mazziere sceglie il colore.</li><li>Nell’ultima mano non resta niente da scoprire: si gioca senza briscola.</li></ul>' +
  '<h3>La previsione</h3><p>A turno, partendo da chi siede dopo il mazziere, ognuno dichiara quante prese farà. Con la regola <b>somma diversa</b>, il mazziere non può dichiarare il numero che renderebbe la somma uguale alle prese della mano.</p>' +
  '<h3>Previsioni coperte (opzione del tavolo)</h3><p>Ognuno dichiara a turno ma il numero resta nascosto agli altri: si vede solo chi ha già previsto e quante prese ha fatto. A fine mano si scoprono tutte le previsioni e si contano i punti.</p>' +
  '<h3>Le prese</h3><ul><li>Apre chi siede dopo il mazziere; poi apre chi ha vinto l’ultima presa.</li><li>Bisogna rispondere al colore di chi apre, se lo si ha. Arcimaghi e Giullari si possono giocare sempre.</li><li>Se si apre con un Arcimago, gli altri giocano quello che vogliono. Se si apre con un Giullare, il colore lo decide la prima carta numerata.</li><li>Vince il primo Arcimago; altrimenti la briscola più alta; altrimenti la carta più alta del colore di uscita. Se tutti giocano Giullari, vince il primo.</li></ul>' +
  '<h3>Punti</h3><ul><li>Previsione esatta: 20 punti più 10 per ogni presa.</li><li>Previsione sbagliata: −10 per ogni presa di differenza.</li></ul>' +
  '<h3>Illustrazioni</h3><p>Incisioni di Gustave Doré (Inferno, La ballata del vecchio marinaio, la Bibbia, gli Idilli del re), il giullare Will Sommers, l’atlante celeste di Andreas Cellarius (1660) e l’incisione di Flammarion (1888): tutte di pubblico dominio, da Wikimedia Commons, rielaborate a luce.</p>' +
  '<h3>Giocare online</h3><p>Chi apre il tavolo è l’host: il suo telefono tiene la partita e muove i giocatori automatici. Se si disconnette, gli altri possono prendere il comando dopo qualche secondo. Le partite passano da un server pubblico gratuito: usa un soprannome.</p>';

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-pl],.tv-hand .card');
  if (!el) return;
  var a = el.getAttribute('data-act'), g = App.doc && App.doc.game, me = myIdx();
  if (a === 'sheetback') { if (ev.target === el) { App.sheet = null; renderSheet(); } return; }
  if (!a && el.hasAttribute('data-pl')) { App.sheet = { kind: 'player', p: +el.getAttribute('data-pl') }; renderSheet(); return; }
  if (!a && el.classList.contains('card')) {
    var c = +el.getAttribute('data-c');
    if (!g || g.phase !== 'play' || g.turn !== me) { return; }
    if (el.classList.contains('no')) { var ls = E.leadSuit(g); toast('Devi rispondere a ' + suitName(ls) + ': puoi giocare solo quel colore, un Arcimago o un Giullare.'); return; }
    if (App.sel === c) { act({ a: 'play', c: c }); return; }
    App.sel = c; render(); return;
  }
  switch (a) {
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'scores': App.sheet = { kind: 'scores' }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + (el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'bid': act({ a: 'bid', b: +el.getAttribute('data-b') }); break;
    case 'trump': act({ a: 'trump', s: +el.getAttribute('data-s') }); break;
    case 'playsel': if (App.sel != null) act({ a: 'play', c: App.sel }); break;
    case 'next': App.sheet = null; act({ a: 'next' }); break;
    case 'resume': send({ t: 'back' }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-noeven') send({ t: 'opt', noEven: ev.target.checked });
  if (ev.target.id === 'opt-hidden') send({ t: 'opt', hidden: ev.target.checked });
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet) { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  PRCards.preload();
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if (t === last || myNick()) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
