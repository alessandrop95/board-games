<style>
/* ===== Unlock!: le carte ===== */
.uc { container-type: inline-size; position: relative; --k: #7d8691; --k2: #4c545d; --kt: #fff; }
.uc-in { position: relative; display: flex; flex-direction: column; border-radius: 5cqw; padding: 2.4cqw; background: linear-gradient(160deg, #20282e, #0b0f12); box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 6px 18px rgba(0,0,0,.5); color: #1d2125; isolation: isolate; box-sizing: border-box; }
.uc-in::after { content: ""; position: absolute; inset: 1.2cqw; border-radius: 4cqw; border: .8cqw solid var(--k); opacity: .55; pointer-events: none; }
.uc.k-red { --k: #d43a2e; --k2: #8e1f17; }
.uc.k-blue { --k: #2f6fd6; --k2: #173f8a; }
.uc.k-green { --k: #31a654; --k2: #19602f; }
.uc.k-yellow { --k: #f0c232; --k2: #b0820c; --kt: #2a1f00; }
.uc.k-grey { --k: #8a939d; --k2: #4c545d; }
.uc.k-room { --k: #5f7180; --k2: #2f3b45; }
.uc.k-story { --k: #7b59b8; --k2: #3e2a66; }
.uc.k-pen { --k: #e0392b; --k2: #3a0c08; }
.uc.k-end { --k: #f2c94c; --k2: #a5741c; --kt: #2a1f00; }
.uc-band { position: relative; z-index: 1; display: flex; align-items: center; gap: 2.2cqw; padding: 2cqw 2.6cqw; border-radius: 3.4cqw 3.4cqw 0 0; background: linear-gradient(180deg, var(--k), var(--k2)); color: var(--kt); box-shadow: 0 -1px 0 rgba(255,255,255,.35) inset; min-height: 12cqw; }
.uc.k-pen .uc-band { background: repeating-linear-gradient(-45deg, #ffd23d 0 3cqw, #111 3cqw 6cqw); }
.uc.k-pen .uc-band .uc-tt { background: #111; color: #ffd23d; padding: .4cqw 2cqw; border-radius: 2cqw; }
.uc-num { flex: none; display: grid; place-items: center; width: 11.5cqw; height: 11.5cqw; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fffdf6, #efe4c9); color: #14181c; font: 6.2cqw/1 Bungee, sans-serif; box-shadow: 0 0 0 .7cqw rgba(0,0,0,.35), 0 .8cqw 1.6cqw rgba(0,0,0,.35); }
.uc-num.uc-let { border-radius: 0; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); width: 13cqw; background: linear-gradient(#f2f5f8, #c9d1d8); }
.uc-num.uc-go { font-size: 5cqw; background: radial-gradient(circle at 35% 30%, #fff, #e5dcf5); color: #3e2a66; }
.uc-tt { flex: 1; min-width: 0; font: 900 5.6cqw/1.08 Nunito, system-ui, sans-serif; text-shadow: 0 .3cqw 0 rgba(0,0,0,.25); overflow-wrap: anywhere; }
.uc.k-yellow .uc-tt, .uc.k-end .uc-tt { text-shadow: 0 .3cqw 0 rgba(255,255,255,.35); }
.uc-kind { flex: none; font: 800 3cqw/1 Nunito, sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 1cqw 1.8cqw; border-radius: 99px; background: rgba(0,0,0,.22); }
.uc-art { position: relative; z-index: 1; aspect-ratio: 300 / 220; overflow: hidden; background: #000; box-shadow: 0 0 0 .5cqw rgba(0,0,0,.6) inset; }
.uc-svg { display: block; width: 100%; height: 100%; }
.uc-txt { position: relative; z-index: 1; flex: 1; padding: 3cqw 3.8cqw 3.4cqw; border-radius: 0 0 3.4cqw 3.4cqw; background: linear-gradient(180deg, #f8f2e2, #e9dcc0); font: 600 4.35cqw/1.4 Nunito, system-ui, sans-serif; color: #2a2620; }
.uc.t-sub .uc-txt { background: linear-gradient(180deg, #eef3f6, #d6e0e6); color: #1c2830; }
.uc-txt b { font-weight: 900; }
.uc-disc { display: flex; flex-wrap: wrap; gap: 1.6cqw; margin-top: 2.4cqw; }
.uc-disc span { position: relative; display: grid; place-items: center; width: 8.5cqw; height: 8.5cqw; border-radius: 50%; background: #fff; border: .6cqw solid #333; font: 4cqw/1 Bungee, sans-serif; color: #333; }
.uc-disc span::after { content: ""; position: absolute; left: -12%; right: -12%; top: 50%; height: .9cqw; background: #d62b1f; transform: rotate(-35deg); border-radius: 1cqw; }
.uc-mod { margin-top: 2.4cqw; display: inline-grid; place-items: center; min-width: 14cqw; padding: 1.4cqw 2.4cqw; border-radius: 2cqw; background: linear-gradient(#3f86ee, #1b4ea6); color: #fff; font: 5.6cqw/1 Bungee, sans-serif; box-shadow: 0 .6cqw 0 #0f2e66; }
.uc-modart { position: absolute; right: 3cqw; top: 3cqw; padding: 1.6cqw 2.6cqw; border-radius: 2.4cqw; background: linear-gradient(#3f86ee, #1b4ea6); color: #fff; font: 7cqw/1 Bungee, sans-serif; box-shadow: 0 0 0 .8cqw rgba(255,255,255,.85), 0 1cqw 3cqw rgba(0,0,0,.6); animation: ua-glowbox 2.4s ease-in-out infinite; }
.uc-spot { position: absolute; z-index: 2; width: 13%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.uc-spot.uc-hid { width: 9%; }
.uc-spot.done::after { content: "✓"; position: absolute; inset: 14%; display: grid; place-items: center; border-radius: 50%; background: rgba(32,160,80,.88); color: #fff; font: 900 3.6cqw/1 Nunito, sans-serif; box-shadow: 0 0 0 .5cqw #fff; }
.uc-spot.uc-hid.done::after { inset: -10%; }
.uc-spot:focus-visible { outline: 3px solid #ffe9a6; }
/* dorso */
.uc-back .uc-in { background: radial-gradient(circle at 50% 40%, #1d3a4f, #08121a 70%); }
.uc-back.t-attic .uc-in { background: radial-gradient(circle at 50% 40%, #5a3a1e, #1a0f07 70%); }
.uc-back .ub-in { flex: 1; border-radius: 3.6cqw; border: .8cqw solid rgba(255,233,166,.35); display: grid; place-items: center; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2cqw, transparent 2cqw 4cqw); }
.uc-back svg { width: 86%; }
/* animazioni dei disegni */
.uc-svg .ua-ring { animation: ua-ring 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.uc-svg .ua-flick { animation: ua-flick 3.2s steps(1) infinite; }
.uc-svg .ua-blink { animation: ua-blink 1.6s ease-in-out infinite; }
.uc-svg .ua-glow { animation: ua-glow 2.2s ease-in-out infinite; }
.uc-svg .ua-bub { animation: ua-bub 5s linear infinite; }
.uc-svg .ua-swim { animation: ua-swim 3.4s ease-in-out infinite alternate; }
.uc-svg .ua-ray { animation: ua-ray 6s ease-in-out infinite alternate; }
.uc-svg .ua-dust { animation: ua-dust 9s ease-in-out infinite alternate; }
.uc-svg .ua-spin { animation: ua-spin 3s linear infinite; }
.uc-svg .ua-wave { animation: ua-wave 3s ease-in-out infinite alternate; }
.uc-svg .ua-float { animation: ua-float 4s ease-in-out infinite alternate; }
.uc-svg .ua-note { animation: ua-note 2.4s ease-out infinite; }
.uc-svg .ua-wob { animation: ua-wob 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
.uc-svg .ua-fall { animation: ua-fall 4s linear infinite; }
.uc-svg .ua-rise { animation: ua-rise 7s ease-in-out infinite alternate; }
.uc-svg .ua-glint { animation: ua-glow 1.6s ease-in-out infinite; }
.uc-svg .ua-needle { animation: ua-needle 2.8s ease-in-out infinite alternate; }
@keyframes ua-ring { 0% { opacity: .9; transform: scale(.75); } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes ua-flick { 0%, 100% { opacity: 1; } 7% { opacity: .35; } 9% { opacity: .95; } 52% { opacity: .6; } 54% { opacity: 1; } 80% { opacity: .85; } }
@keyframes ua-blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
@keyframes ua-glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes ua-bub { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-170px) translateX(6px); opacity: 0; } }
@keyframes ua-swim { 0% { translate: -4px 1px; } 100% { translate: 5px -2px; } }
@keyframes ua-ray { 0% { opacity: .03; } 100% { opacity: .11; } }
@keyframes ua-dust { 0% { translate: 0 0; } 100% { translate: 14px -18px; } }
@keyframes ua-spin { to { rotate: 360deg; } }
@keyframes ua-wave { 0% { translate: -6px 0; } 100% { translate: 6px 0; } }
@keyframes ua-float { 0% { translate: 0 4px; } 100% { translate: 0 -6px; } }
@keyframes ua-note { 0% { translate: 0 10px; opacity: 0; } 30% { opacity: 1; } 100% { translate: 8px -26px; opacity: 0; } }
@keyframes ua-wob { to { rotate: 360deg; } }
@keyframes ua-fall { 0% { translate: 0 -30px; opacity: 0; } 15% { opacity: 1; } 100% { translate: -20px 150px; opacity: 0; } }
@keyframes ua-rise { 0% { translate: 0 18px; } 100% { translate: 0 -22px; } }
@keyframes ua-needle { 0% { rotate: -3deg; } 100% { rotate: 4deg; } }
@keyframes ua-glowbox { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
.uc.still .uc-svg *, .uc.thumb .uc-svg * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .uc-svg * { animation: none !important; } }

/* ===== Unlock! — notte, acciaio, ottone e luci d'emergenza ===== */
:root {
  --bg: #070d14; --bg-2: #0d1822; --panel: #111d28; --panel-2: #172634;
  --ink: #eef4f8; --muted: #a9bac6; --dim: #6f8494; --gold: #ffcf5a; --gold-2: #d99a1c; --red: #e0392b; --good: #6ff0a0; --bad: #ff8a7a; --cyan: #55d6ff;
  --paper: #f4ecd8; --line: rgba(255, 207, 90, .3); --line-2: rgba(238, 244, 248, .12);
  --f-disp: "Bungee", "Impact", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Share Tech Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(120% 70% at 50% -10%, #17384f, var(--bg) 60%) fixed, var(--bg); }
body[data-th="attic"] { background: radial-gradient(120% 70% at 50% -10%, #4a3018, #120b06 62%) fixed, #120b06; }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 22px; display: flex; align-items: center; gap: 8px; }
h2 .ic { color: var(--gold); }
h3 { font-size: 17px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 900 12px var(--f-body); text-transform: uppercase; letter-spacing: .18em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line-2); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .05); min-width: 0; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(255, 207, 90, .1); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(224, 57, 43, .18); border-color: rgba(255, 138, 122, .5); }
.btn { appearance: none; border: 0; border-radius: 11px; min-height: 44px; padding: 10px 16px; font: 900 15.5px/1.15 var(--f-body); color: #2a1a00; cursor: pointer;
  background: linear-gradient(180deg, #ffe08f, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 3px 0 #7a4f06, 0 8px 18px rgba(0, 0, 0, .4); display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 1px 0 #7a4f06; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(238, 244, 248, .06); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #f0645a, var(--red)); color: #fff; box-shadow: 0 3px 0 #6a120b; }
.btn.green { background: linear-gradient(180deg, #6fe08f, #2f9b4e); color: #052a12; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 3px 0 #145a2a; }
.btn.blue { background: linear-gradient(180deg, #7fb0ff, #2f6fd6); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 3px 0 #173f8a; }
.btn.yellow { background: linear-gradient(180deg, #ffe38a, #f0c232); color: #2a1f00; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 3px 0 #8a6408; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 17px; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .ab:focus-visible, .tc:focus-visible, .scn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: none; border: 1px solid var(--line-2); color: var(--ink); border-radius: 9px; min-height: 36px; padding: 5px 9px; font: 800 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.iconbtn:disabled { opacity: .35; }
.chip { appearance: none; background: rgba(238, 244, 248, .06); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 800 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.field { width: 100%; font: 16px var(--f-body); color: #10161c; background: var(--paper); border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 900; text-align: center; max-width: 170px; }
select.field { color: #10161c; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }
.codebig { font-family: var(--f-disp); font-size: 52px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 0 24px rgba(255, 207, 90, .35); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(7, 13, 20, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { font-family: var(--f-disp); font-size: 21px; color: var(--gold); }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(238, 244, 248, .04); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 18px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 900; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; position: relative;
  background: radial-gradient(90% 120% at 85% 20%, #1e4f6e 0%, #0f2a3d 45%, #070f17 90%); }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 4px); pointer-events: none; }
.hero::after { content: ""; position: absolute; width: 320px; height: 320px; right: -60px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 166, 50, .28), transparent 65%); animation: alarm 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes alarm { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (min-width: 820px) { .hero { grid-template-columns: 1.05fr .95fr; } }
.hero-txt { position: relative; z-index: 1; }
.hero h1 { font-size: clamp(52px, 14vw, 92px); line-height: .9; color: var(--gold); text-shadow: 0 4px 0 #6a4206, 0 0 40px rgba(255, 207, 90, .4); margin-top: 6px; }
.hero .tag { color: #dbe6ee; margin-top: 12px; max-width: 54ch; }
.hero-cards { position: relative; height: 210px; max-width: 380px; width: 100%; justify-self: center; z-index: 1; }
.hero-cards .hc { position: absolute; width: 112px; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .55)); animation: hcf 6s ease-in-out infinite alternate; }
.hc1 { left: 2%; top: 30px; transform: rotate(-14deg); } .hc2 { left: 24%; top: 6px; transform: rotate(-5deg); animation-delay: -1.5s !important; }
.hc3 { left: 47%; top: 14px; transform: rotate(6deg); animation-delay: -3s !important; } .hc4 { left: 68%; top: 40px; transform: rotate(15deg); animation-delay: -4.5s !important; }
@keyframes hcf { to { translate: 0 -8px; } }
.hero-key { position: absolute; left: 50%; bottom: -6px; width: 58px; height: 58px; translate: -50% 0; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #0c0f12 0 9px, transparent 10px), conic-gradient(from 0deg, #ffe08f, #b07812, #ffe08f, #b07812, #ffe08f); box-shadow: 0 0 0 4px rgba(0, 0, 0, .4), 0 0 30px rgba(255, 207, 90, .6); }
.hero-key::after { content: ""; position: absolute; left: 50%; top: 52%; width: 10px; height: 18px; translate: -50% 0; background: #0c0f12; clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
.scns { display: grid; gap: 10px; }
.scn { appearance: none; text-align: left; color: inherit; font: inherit; position: relative; display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(238, 244, 248, .04); cursor: default; }
button.scn { cursor: pointer; }
.scn.on { border-color: var(--gold); background: rgba(255, 207, 90, .1); box-shadow: 0 0 0 1px var(--gold), 0 0 22px rgba(255, 207, 90, .2); }
.scn-art { display: block; }
.scn-txt { display: grid; gap: 3px; min-width: 0; }
.scn-txt b { font: 20px var(--f-disp); }
.scn-meta { color: var(--muted); font-size: 13.5px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.lv { display: inline-flex; gap: 3px; } .lv em { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .18); } .lv em.on { background: var(--gold); }
.scn-bl { font-size: 14px; color: #c9d6df; }
.scn-ok { position: absolute; right: 10px; top: 10px; color: var(--gold); }

/* ---------- carte in miniatura ---------- */
.uc.thumb { aspect-ratio: 5 / 5.2; }
.uc.thumb .uc-in { height: 100%; }
.uc.thumb .uc-art { flex: 1; aspect-ratio: auto; border-radius: 0 0 3.4cqw 3.4cqw; }
.uc.thumb .uc-tt { font-size: 7.2cqw; } .uc.thumb .uc-kind { display: none; }

/* ===== Serie di partite e risultati (condivisi da tutti i giochi) =====
   Serie: con «Nuova partita con lo stesso tavolo» le vittorie si sommano; l'host può scegliere «al meglio di 3 / di 5».
   La tiene l'host nello stato del tavolo (doc.series), aggiornata quando una partita finisce.
   Risultati: a fine partita chi ha l'account registra il proprio sul server (statistiche e classifica tra amici).
   Ogni gioco dice chi ha vinto con Score.setup({ game, result(g) -> [{ won, place, score }] per giocatore }). */

  function setup(c) { cfg = c; }
  function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

    if (s.last === doc.gid) return;

    if (s.champ) { s.n = 0; s.wins = {}; s.champ = null; }   // la serie di prima era già vinta: ne comincia una nuova

    '.sc-champ{font-weight:800;font-size:17px}.sc-rows{display:flex;flex-wrap:wrap;gap:6px}.sc-p{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap}.sc-p.on{background:rgba(230,197,111,.35)}.sc-p.me{box-shadow:inset 0 0 0 1px currentColor}' +
    '.sc-note,.sc-head{font-size:13.5px;opacity:.85}';

  // Sala d'attesa: scelta della serie (host) e classifica della serie in corso.

      '<select id="opt-series" class="field"' + (isHost ? '' : ' disabled') + ' style="font-size:16px;min-height:44px">' +
      [[0, 'Partite singole (conto le vittorie)'], [3, 'Al meglio di 3'], [5, 'Al meglio di 5']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' + standings(doc);
  }
  function endHTML(doc) { css(); return standings(doc); }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'opt-series' && window.Net) Net.send({ t: 'series', target: +e.target.value }).catch(function (er) { console.warn(er); });
  });

  // Risultato personale sul server (una volta per partita, solo con l'account; le partite di prova non contano).
  var RKEY = 'pp-reported', trying = {};
  function reported() { try { return JSON.parse(localStorage.getItem(RKEY) || '[]'); } catch (e) { return []; } }
  function report() {

      .then(function () { var l = reported(); l.push(key); try { localStorage.setItem(RKEY, JSON.stringify(l.slice(-60))); } catch (e) {} }, function () {});
  }

})();

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,

    '.cx-bar .cx-t{flex:1;min-width:0}.cx-bar b{color:#9fd3ff}.cx-bar .cx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +

    '.cx-bar .cx-x{border:0;padding:2px 6px;font-size:20px;line-height:1;opacity:.7}.cx-pill{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:9980;appearance:none;border:1px solid rgba(140,200,255,.6);background:rgba(18,30,44,.94);color:#eef4fb;border-radius:999px;padding:7px 12px;font:600 13.5px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}';
  function css() { if (!document.getElementById('cx-css')) { var s = document.createElement('style'); s.id = 'cx-css'; s.textContent = CSS; document.head.appendChild(s); } }

function introBody(s) {
  var pages = [
    ['Benvenuto in Unlock!', '<div class="intro-art">' + ART.card('soffitta', 'A', { text: false, cls: 'thumb' }) + '</div><p>È una <b>escape room in carte</b>: giocate tutti insieme, ognuno dal suo telefono, contro lo stesso timer. Non ci sono turni: chiunque può fare qualsiasi cosa.</p>'],
    ['Scopri le carte', '<ul class="intro-list"><li>Tocca una carta per vederla in grande.</li><li>Tocca i <b>numeri nei cerchi</b> per far uscire nuove carte.</li><li>Alcuni numeri sono <b>nascosti nei disegni</b>: piccoli e mimetizzati. Guarda bene!</li></ul>'],
    ['Unisci, apri, accendi', '<ul class="intro-list"><li><b>Rossa + blu</b>: tocca <b>Unisci</b>, scegli le due carte; la somma dei numeri è la carta che esce.</li><li>Le carte <b>gialle</b> vogliono un codice di 4 cifre; le <b>verdi</b> sono macchine da regolare.</li><li>Gli errori costano minuti. Bloccati? Apri una carta e chiedi un <b>indizio</b>.</li></ul>']
  ];
  var p = Math.max(0, Math.min(pages.length - 1, s.page || 0)), pg = pages[p];
  return '<div class="kicker">' + (p + 1) + ' di ' + pages.length + '</div><h2>' + pg[0] + '</h2>' + pg[1] +
    '<div class="row intro-nav">' + (p > 0 ? '<button class="btn ghost" data-act="introprev">Indietro</button>' : '') + (p < pages.length - 1 ? '<button class="btn" data-act="intronext">Avanti</button>' : '<button class="btn" data-act="introdone">Si comincia!</button>') + '<button class="btn ghost small" data-act="introdone">Salta</button></div>';
}

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet, id = el.getAttribute('data-id');
  switch (a) {
    case 'sheetback': if (ev.target === el && s && s.kind !== 'intro' && Date.now() - (App.sheetAt || 0) > 450) { App.sheet = null; renderSheet(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r') }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'gone': App.sheet = { kind: 'gone' }; renderSheet(); break;
    case 'hints': App.sheet = { kind: 'hints' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('ul-intro-done', '1'); App.sheet = null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': App.sheet = null; renderSheet(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'scen': send({ t: 'opt', scen: el.getAttribute('data-s') }); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; App.view = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e il tempo.'); break;
    // tavolo
    case 'open':
      if (!g) return;
      if (s && s.kind === 'gone') { App.sheet = null; renderSheet(); }
      if (el.classList.contains('mini')) el.remove();
      if (App.sel && E.onTable(g, id)) { var cc = E.card(g, id); if (cc.mod && cc.k !== 'red' && cc.k !== 'blue') { App.sel.b = '+' + cc.mod; render(); } else Game.pick(id); }
      else Game.openView(id);
      break;
    case 'vwback': if (ev.target === el) Game.closeView(); break;
    case 'vwclose': Game.closeView(); break;
    case 'vwprev': Game.step(-1); break;
    case 'vwnext': Game.step(1); break;
    case 'spot': case 'ref': {
      if (!g) return;
      if (E.seen(g, id)) { if (E.onTable(g, id)) Game.openView(id); else toast('La carta ' + esc(id) + ' è già stata scartata.'); }
      else if (me < 0) toast('Stai solo guardando.');
      else { if (el.classList.contains('uc-hid')) toast('Numero nascosto trovato: <b>' + esc(id) + '</b>!'); act({ a: 'reveal', id: id }); }
      break;
    }
    case 'comb': if (me < 0 || !g || g.phase !== 'play') return; Game.startComb(id, el.getAttribute('data-mod')); break;
    case 'modsel': App.sel.b = App.sel.b === el.getAttribute('data-v') ? null : el.getAttribute('data-v'); Game.render(); break;
    case 'slotx': App.sel[el.getAttribute('data-w')] = null; Game.render(); break;
    case 'combx': App.sel = null; Game.render(); break;
    case 'combgo': Game.combGo(); break;
    case 'ping': act({ a: 'ping', id: id }); break;
    case 'pause': if (g && g.phase === 'play' && me >= 0) { App.sheet = null; renderSheet(); act({ a: 'pause', on: !g.paused }); } break;
    case 'hintask': App.hintAsk = id + ':' + el.getAttribute('data-l'); Game.renderView(); break;
    case 'hint': App.hintAsk = null; act({ a: 'hint', id: id, lvl: +el.getAttribute('data-l') }); break;
    // lucchetti
    case 'code': App.codeIn = ''; App.sheet = { kind: 'code', id: id }; renderSheet(); break;
    case 'kp': if (App.codeIn.length < 4) { App.codeIn += el.getAttribute('data-k'); Sound.play('key'); if (s.err) { s.err = 0; renderSheet(); } else paintLcd(); } break;
    case 'kpdel': App.codeIn = App.codeIn.slice(0, -1); Sound.play('key'); paintLcd(); break;
    case 'kpok': if (App.codeIn.length !== 4) { toast('Servono 4 cifre.'); Sound.play('error'); break; } act({ a: 'code', id: s.id, v: App.codeIn }); break;
    // macchine
    case 'mac': App.mac = null; App.sheet = { kind: 'mac', id: id }; renderSheet(); break;
    case 'dial': {
      var i = +el.getAttribute('data-i'), dd = +el.getAttribute('data-d'), mc = E.card(g, s.id).mac, V = App.mac.v;
      V[i] = (V[i] + dd + mc.max + 1) % (mc.max + 1); Sound.play('dial');
      var n = document.getElementById('ndl' + i), w = document.getElementById('whl' + i), b = document.getElementById('dv' + i);
      if (n) n.style.transform = 'rotate(' + (-135 + V[i] * 30) + 'deg)';
      if (w) { w._r = (w._r == null ? V[i] - dd : w._r) + dd; w.style.transform = 'rotate(' + (w._r * 40) + 'deg)'; }
      if (b) b.textContent = V[i];
      break;
    }
    case 'mz': mzAdd(el.getAttribute('data-k')); break;
    case 'mzdel': App.mac.v = App.mac.v.slice(0, -1); paintTape(); break;
    case 'mopt': App.mac.v = el.getAttribute('data-v'); Sound.play('dial'); renderSheet(); break;
    case 'mgo': { var v = macValue(g, s.id); if (!v) { toast('Prima regola la macchina.'); break; } s.err = 0; act({ a: 'machine', id: s.id, v: v }); break; }
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape') { if (App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; renderSheet(); } else if (App.view) Game.closeView(); else if (App.sel) { App.sel = null; Game.render(); } }
  var s = App.sheet;
  if (s && s.kind === 'code' && !/INPUT|TEXTAREA/.test((e.target && e.target.tagName) || '')) {
    if (/^\d$/.test(e.key) && App.codeIn.length < 4) { App.codeIn += e.key; Sound.play('key'); paintLcd(); }
    else if (e.key === 'Backspace') { App.codeIn = App.codeIn.slice(0, -1); paintLcd(); }
    else if (e.key === 'Enter' && App.codeIn.length === 4) act({ a: 'code', id: s.id, v: App.codeIn });
  }
  if (App.view && !App.sheet && G()) { if (e.key === 'ArrowLeft') Game.step(-1); if (e.key === 'ArrowRight') Game.step(1); }
});

/* ---------- avvio ---------- */
(function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.defs());
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
