<meta name="description" content="Il gioco dei personaggi segreti: ogni round scegli chi essere (Assassino, Ladro, Re, Mercante…), raccogli oro e costruisci la città più ricca. Da 4 a 7 giocatori, ognuno dal proprio telefono.">
<meta name="theme-color" content="#1a1232">

<style>
/* ===== Citadels — una città medievale di notte: torri controluce, luna, stendardi, pergamena e oro ===== */
:root {
  --bg: #17112c; --deep: #0d0a1c; --panel: rgba(28, 20, 52, .86); --panel-2: rgba(46, 32, 80, .78);
  --ink: #fbf3e2; --muted: #d8cbb0; --dim: #a4977c; --gold: #f2c23c; --gold-2: #c98a12; --wine: #9a2a3a; --good: #6fd68f; --bad: #ff7a6b;
  --parch: #f6e8c6; --parch-2: #e7d1a2; --brown: #4a3010;
  --line: rgba(242, 194, 60, .42); --line-2: rgba(255, 240, 210, .16);
  --f-disp: "Cinzel", Georgia, serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); overflow-x: clip; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(90% 60% at 50% 0%, #3a2860, #17112c 60%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.12; }
h2 { font-size: 23px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 17px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .14em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 12px 30px rgba(6, 4, 18, .45); min-width: 0; }
.panel h2 { font-size: 22px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(242, 194, 60, .14); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(160, 40, 40, .35); border-color: rgba(255, 143, 128, .55); }
.btn { appearance: none; border: 0; border-radius: 12px; min-height: 44px; padding: 10px 16px; font: 800 15.5px/1.15 var(--f-body); color: #3b2500; cursor: pointer;
  background: linear-gradient(180deg, #fff0b0, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #8a5a00, 0 8px 18px rgba(0, 0, 0, .4); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 0 #8a5a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .09); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #ff8a70, #c8402c); color: #fff; box-shadow: 0 3px 0 #6c1a10; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn.glow { animation: btnglow 1.6s ease-in-out infinite; }
@keyframes btnglow { 50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #8a5a00, 0 0 22px rgba(242, 194, 60, .9); } }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opp:focus-visible, .ctk:focus-visible, .hc:focus-visible, .cs:focus-visible, .pk:focus-visible, .tg-c:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 5px 10px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--wine); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #2a1a08; background: var(--parch); border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #2a1a08; }
.back-link { color: #f6ecd6; text-decoration: none; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.codebig { font-family: var(--f-disp); font-weight: 900; font-size: 54px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 0 18px rgba(242, 194, 60, .5), 0 3px 0 rgba(0, 0, 0, .45); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(16, 10, 32, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; flex-wrap: wrap; row-gap: 6px; justify-content: flex-end; }
.brand { font-family: var(--f-disp); font-weight: 900; font-size: 22px; color: var(--gold); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
@media (max-width: 640px) {
  .topbar .wrap { row-gap: 0; padding-block: 6px 8px; }
  .topbar .wrap > * { order: 2; }
  .topbar .wrap > .brand, .topbar .wrap > .info { order: 0; }
  .topbar .wrap::after { content: ""; order: 1; flex-basis: 100%; height: 6px; }
  .topbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 20px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 0 0 2px rgba(255, 255, 255, .5); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(24, 14, 48, .97); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 14px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }

/* ---------- carte ---------- */
.ctc { display: block; position: relative; width: var(--cw, 64px); aspect-ratio: 100 / 140; flex: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .5)); }
.ctc-svg { display: block; width: 100%; height: 100%; }
.ctc-x { font: 700 7.4px/1.22 var(--f-body); color: #3a2410; text-align: center; padding: 2px 3px; display: grid; place-items: center; height: 100%; }
.ctk-svg { display: block; width: 100%; height: 100%; }
.flyhide { visibility: hidden !important; }
.rrow { display: inline-flex; gap: 4px; vertical-align: middle; margin: 4px 0; flex-wrap: wrap; }
.rrow .ctc { --cw: 46px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 26px 22px 22px; border-radius: 24px; border: 1px solid rgba(242, 194, 60, .35); overflow: hidden; position: relative;
  background: radial-gradient(40% 50% at 82% 18%, rgba(255, 236, 180, .35), transparent 60%), radial-gradient(60% 60% at 10% 100%, rgba(154, 42, 58, .45), transparent 60%), linear-gradient(180deg, #2c1f52 0%, #160f2c 100%); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
@media (min-width: 820px) { .hero { grid-template-columns: 1.05fr .95fr; } }
.hero-txt { position: relative; z-index: 1; }
.hero h1 { font-size: clamp(54px, 14vw, 100px); font-weight: 900; line-height: .9; color: var(--gold); margin-top: 6px; letter-spacing: .02em;
  background: linear-gradient(180deg, #fff6cf 10%, #f2c23c 55%, #b77d0a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 0 #4a2a00) drop-shadow(0 0 22px rgba(242, 194, 60, .4)); }
.hero .tagline { color: #f4e9d2; margin-top: 12px; max-width: 56ch; font-weight: 700; }
.hero .tagline b { color: var(--gold); }
.hero-art { position: relative; height: 220px; max-width: 420px; width: 100%; justify-self: center; }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; }
.skyline i { position: absolute; bottom: 0; left: calc(var(--i) * 12.5%); width: 11%; height: calc(var(--h) * 14px); background: linear-gradient(180deg, #2a1d48, #120c24); border-radius: 2px 2px 0 0; }
.skyline i::before { content: ""; position: absolute; left: -3px; right: -3px; top: -16px; height: 18px; background: #2a1d48; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.skyline i::after { content: ""; position: absolute; left: 35%; top: 26%; width: 30%; height: 12px; background: #ffd77a; border-radius: 6px 6px 0 0; box-shadow: 0 0 10px #ffb84a; animation: flick 3s ease-in-out infinite; animation-delay: calc(var(--i) * -.4s); }
@keyframes flick { 50% { opacity: .55; } }
.hcrown { position: absolute; left: 50%; top: -4px; width: 70px; margin-left: -35px; filter: drop-shadow(0 0 16px rgba(242, 194, 60, .8)); animation: bob 3.2s ease-in-out infinite; }
.hcrown svg { width: 100%; display: block; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.hero-art .hc { position: absolute; bottom: 8px; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .6)); animation: hcbob 4s ease-in-out infinite; transform: translateY(var(--y)) rotate(var(--r)); }
.hero-art .ctc { --cw: 76px; }
.hc1 { left: 2%; --r: -16deg; --y: -6px; } .hc2 { left: 21%; --r: -8deg; --y: -22px; animation-delay: -.8s; } .hc3 { left: 40%; --r: 0deg; --y: -30px; animation-delay: -1.6s; } .hc4 { left: 59%; --r: 8deg; --y: -22px; animation-delay: -2.4s; } .hc5 { left: 78%; --r: 16deg; --y: -6px; animation-delay: -3.2s; }
@keyframes hcbob { 50% { transform: translateY(calc(var(--y) - 8px)) rotate(var(--r)); } }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto auto auto minmax(0, 1fr);
  grid-template-areas: 'top' 'court' 'opp' 'dock' 'mid' 'now' 'me'; overflow: hidden; -webkit-user-select: none; user-select: none; }
.gv-top { grid-area: top; } .gv-court { grid-area: court; } .gv-opp { grid-area: opp; } .gv > .chat-dock { grid-area: dock; } .gv-mid { grid-area: mid; } .gv-now { grid-area: now; } .gv-me { grid-area: me; }
.gv > *:not(.scenery) { position: relative; z-index: 1; }
/* la città sullo sfondo */
.scenery { position: absolute; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(70% 45% at 78% 6%, #4a3878 0%, #261a48 45%, #120c24 100%); }
.scenery .st { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #fff; animation: twinkle 3s ease-in-out infinite; opacity: .2; }
@keyframes twinkle { 50% { opacity: .9; } }
.moon { position: absolute; right: 8%; top: 70px; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 38% 35%, #fffbe8, #f3e2a8 60%, #d8bf78); box-shadow: 0 0 40px rgba(255, 240, 190, .5), 0 0 120px rgba(255, 240, 190, .25); }
.sky-city { position: absolute; left: 0; right: 0; bottom: 34%; height: 30%; opacity: .75; }
.sky-city i { position: absolute; bottom: 0; background: linear-gradient(180deg, #2a1e4a, #150f2a); border-radius: 2px 2px 0 0; }
.sky-city i::before { content: ""; position: absolute; left: -12%; right: -12%; top: -22px; height: 24px; background: #2a1e4a; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.sky-city i::after { content: ""; position: absolute; left: 38%; top: 22%; width: 24%; height: 10%; max-height: 14px; background: #ffcf6a; border-radius: 6px 6px 0 0; box-shadow: 0 0 10px #ffa83a; opacity: .85; animation: flick 4s ease-in-out infinite; animation-delay: calc(var(--d) * -1.3s); }
.banners { position: absolute; left: 0; right: 0; top: 44px; height: 40px; pointer-events: none; }
.banners i { position: absolute; top: 0; width: 16px; height: 38px; background: linear-gradient(180deg, #9a2a3a, #6a1424); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); transform-origin: 50% 0; animation: flag 4s ease-in-out infinite; opacity: .55; }
.banners i:nth-child(1) { left: 4%; } .banners i:nth-child(2) { left: 50%; background: linear-gradient(180deg, #2a5a9a, #142f6a); animation-delay: -1.3s; } .banners i:nth-child(3) { right: 4%; background: linear-gradient(180deg, #c99a2a, #7a5a10); animation-delay: -2.6s; }
@keyframes flag { 50% { transform: skewX(-6deg) scaleY(.96); } }
.ground { position: absolute; left: -10%; right: -10%; bottom: -30%; height: 66%; border-radius: 50% 50% 0 0 / 18% 18% 0 0; background: radial-gradient(70% 60% at 50% 30%, #3a2a1c, #1c140e 70%); border-top: 3px solid rgba(242, 194, 60, .35);
  box-shadow: inset 0 20px 50px rgba(0, 0, 0, .45); }
.ground::before { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: .18; background: repeating-linear-gradient(90deg, transparent 0 38px, rgba(255, 230, 180, .5) 38px 40px), repeating-linear-gradient(0deg, transparent 0 22px, rgba(255, 230, 180, .5) 22px 24px); }

.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); background: rgba(16, 10, 32, .82); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 18px; font-weight: 900; color: var(--gold); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.pv { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 14px var(--f-disp); color: #1a1008; background: var(--pc); flex: none; box-shadow: 0 0 0 2px rgba(255, 245, 220, .7), 0 0 10px color-mix(in srgb, var(--pc) 60%, transparent); }
.pv.big { width: 54px; height: 54px; font-size: 28px; }

/* la corte: 8 personaggi */
.gv-court { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) 2px max(8px, env(safe-area-inset-left, 0px)); max-width: 560px; width: 100%; justify-self: center; }
.ctk { appearance: none; background: none; border: 0; padding: 0; color: var(--ink); font: inherit; cursor: pointer; display: grid; justify-items: center; position: relative; min-width: 0; transition: opacity .3s, filter .3s, transform .2s; }
.ctk-t { width: min(44px, 100%); aspect-ratio: 1; display: block; border-radius: 50%; transition: box-shadow .3s, transform .3s; }
.ctk-n { position: absolute; top: -2px; left: calc(50% - 24px); min-width: 16px; height: 16px; border-radius: 8px; font: 800 10.5px/16px var(--f-body); background: var(--parch); color: var(--brown); box-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.ctk-l { font: 700 9.5px/1.1 var(--f-body); color: var(--muted); margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctk-o { position: absolute; top: 24px; right: calc(50% - 24px); min-width: 18px; height: 18px; padding: 0 3px; border-radius: 9px; font: 800 10px/18px var(--f-body); color: #1a1008; background: var(--pc, #ddd); box-shadow: 0 0 0 1.5px #fff8e6; }
.ctk-o.me { background: var(--gold); } .ctk-o.no { background: #6a6078; color: #fff; }
.ctk .mk { position: absolute; top: 18px; left: calc(50% - 26px); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px #fff8e6; }
.ctk .mk .ic { width: 13px; height: 13px; }
.mk.kill { background: #c8302c; color: #fff; } .mk.rob { background: #f2c23c; color: #4a2a00; }
.ctk .mk.rob { left: auto; right: calc(50% - 26px); top: 0; }
.ctk.s-up { opacity: .35; filter: grayscale(1); }
.ctk.s-up .ctk-t::after { content: ""; position: absolute; inset: 0; }
.ctk.s-up .ctk-l { text-decoration: line-through; }
.ctk.s-none, .ctk.s-dead { opacity: .5; filter: grayscale(.7); }
.ctk.s-done { opacity: .78; }
.ctk.s-wait .ctk-t { filter: brightness(.82) saturate(.8); }
.ctk.s-mine .ctk-t { box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(242, 194, 60, .7); }
.ctk.s-mine .ctk-l { color: var(--gold); }
.ctk.s-now { z-index: 2; }
.ctk.s-now .ctk-t { transform: scale(1.14); box-shadow: 0 0 0 3px #fff3c0, 0 0 22px rgba(255, 220, 140, .95); animation: nowglow 1.6s ease-in-out infinite; }
.ctk.s-now .ctk-l { color: #fff3c0; font-weight: 800; }
@keyframes nowglow { 50% { box-shadow: 0 0 0 3px var(--gold), 0 0 30px rgba(255, 200, 90, 1); } }
.ctk.ring .ctk-t { animation: ring .7s ease-in-out 2; }
@keyframes ring { 25% { transform: scale(1.25) rotate(-10deg); } 75% { transform: scale(1.25) rotate(10deg); } }
.ctk.nope { animation: nope .5s ease-in-out; } @keyframes nope { 30% { transform: translateY(4px); opacity: .3; } }
.ctk.drop { animation: drop .6s ease-in; } @keyframes drop { 40% { transform: translateY(-8px) rotate(-12deg); } }
.ctk.hit .ctk-t { animation: hit .5s ease-in-out 2; } @keyframes hit { 30% { transform: scale(.85) rotate(-8deg); } 60% { transform: scale(1.15) rotate(6deg); } }

/* avversari */
.gv-opp { display: flex; gap: 7px; overflow-x: auto; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.gv-opp:empty { display: none; }
.gv-opp::-webkit-scrollbar { display: none; }
.opp { appearance: none; flex: none; display: grid; gap: 4px; padding: 6px 8px 7px; border-radius: 14px; border: 1px solid rgba(255, 240, 210, .22); background: rgba(24, 16, 44, .8); backdrop-filter: blur(6px); color: var(--ink); font: 12.5px var(--f-body); cursor: pointer; text-align: left; position: relative; min-width: 118px; transition: transform .2s, box-shadow .2s; }
.opp.on { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc), 0 0 22px color-mix(in srgb, var(--pc) 60%, transparent); transform: translateY(-1px); }

.bank .coins { position: absolute; left: 0; right: 0; bottom: 18px; height: calc(var(--pw) * 1.2); }
.bank .coins i { position: absolute; left: calc(50% - 15px + (var(--i) - 2.5) * 5px); bottom: calc(var(--i) * 7px); width: 30px; height: 30px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }

.spot { width: calc(var(--pw) * 2.6); min-height: calc(var(--pw) * 1.4 + 18px); border-radius: 50% 50% 14px 14px / 26% 26% 14px 14px; display: grid; align-content: end; justify-items: center; gap: 3px; padding: 6px 4px 4px; position: relative;
  background: radial-gradient(60% 55% at 50% 45%, rgba(255, 236, 190, .22), transparent 70%), linear-gradient(180deg, transparent, rgba(154, 42, 58, .2)); border: 1px solid rgba(242, 194, 60, .3); }

@keyframes spotbob { 50% { transform: translateY(-4px) rotate(-2deg); } }
.overspot .sp-tro .ic { width: 50px; height: 50px; color: var(--gold); filter: drop-shadow(0 0 14px rgba(242, 194, 60, .9)); }

/* «Adesso» */
.gv-now { margin: 2px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); display: grid; gap: 4px; }
.now { padding: 8px 10px 9px 12px; border-radius: 14px; background: linear-gradient(180deg, rgba(246, 232, 198, .97), rgba(231, 209, 162, .97)); color: #2a1a08; border: 1px solid #b8933f; box-shadow: 0 6px 18px rgba(0, 0, 0, .4), inset 0 0 18px rgba(160, 110, 30, .25); display: grid; gap: 4px; }

.steps { display: flex; gap: 4px; flex-wrap: wrap; }

.tk:last-child { color: var(--ink); }
.tk.k-kill, .tk.k-destroy { color: #ffb0a6; } .tk.k-win, .tk.k-complete, .tk.k-crown { color: var(--gold); }

/* la mia città */
.gv-me { min-height: 0; display: grid; align-items: end; justify-items: center; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); overflow-y: auto; container-type: inline-size; }
.mine { display: grid; gap: 4px; padding: 8px 10px 10px; border-radius: 18px; background: rgba(24, 16, 44, .72); backdrop-filter: blur(4px); border: 1px solid rgba(255, 240, 210, .22); width: min(100%, 720px); position: relative;
  --sw: min(calc((100cqw - 40px) / 7), 62px); --hw: clamp(54px, 17cqw, 86px); }
.mine.on { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc), 0 0 30px color-mix(in srgb, var(--pc) 50%, transparent); }

.mine-h { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; flex-wrap: wrap; }

.mg.bump, .og.bump { animation: bump .5s var(--ease); } @keyframes bump { 40% { transform: scale(1.3); } }
.mpt { font: 800 12px var(--f-body); color: var(--muted); padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, .08); }
.mych { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: 999px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); cursor: pointer; }

.mych span { display: grid; line-height: 1.05; } .mych small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; } .mych b { font: 800 14px var(--f-disp); color: var(--gold); }

.lbl { font: 800 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.lbl .hint { text-transform: none; letter-spacing: 0; color: var(--gold); font-weight: 700; font-size: 12px; animation: pulse 1.6s ease-in-out infinite; }
.cty { display: flex; gap: 4px; justify-content: flex-start; }
.cs { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; flex: none; transition: transform .2s; }
.cs .ctc { --cw: var(--sw, 44px); }
.cs.empty { width: var(--sw, 44px); aspect-ratio: 100 / 140; border-radius: 8px; border: 2px dashed rgba(255, 240, 210, .18); display: grid; place-items: center; cursor: default; }
.cs.empty i { font: 800 15px var(--f-disp); font-style: normal; color: rgba(255, 240, 210, .2); }

.cs.built { animation: built .7s var(--ease); } @keyframes built { 0% { transform: translateY(-14px) scale(1.25); } 60% { transform: translateY(2px) scale(.95); } }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 4px; scrollbar-width: thin; min-height: calc(var(--hw) * 1.4 + 12px); align-items: flex-end; }
.hand .hc { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; flex: none; position: relative; transition: transform .2s, filter .2s; }
.hand .hc .ctc { --cw: var(--hw); }

.hand .hc.can { transform: translateY(-6px); }
.hand .hc.can .ctc { filter: drop-shadow(0 0 8px rgba(255, 220, 120, .95)); animation: cang 1.6s ease-in-out infinite; }
@keyframes cang { 50% { filter: drop-shadow(0 0 14px rgba(255, 220, 120, 1)); } }
.hc-b { position: absolute; right: -4px; top: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #4a2a00; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
.hc-b .ic { width: 15px; height: 15px; }
.hand .hc.dup::after { content: "doppione"; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%) rotate(-8deg); font: 800 10px var(--f-body); background: var(--bad); color: #fff; padding: 1px 5px; border-radius: 5px; text-transform: uppercase; }
.hand.hidden .hc .ctc { --cw: 40px; }
.hand-empty { color: var(--muted); font-size: 13.5px; align-self: center; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; margin-top: 2px; }
.acts .btn { min-height: 44px; padding: 8px 8px; font-size: 14px; animation: btnin .35s var(--ease) both; flex: 1 1 0; min-width: 104px; white-space: nowrap; }
.acts .btn .ic { width: 20px; height: 20px; }
.btn.res { background: linear-gradient(180deg, #fff0b0, var(--gold) 50%, var(--gold-2)); }
.btn.pw { background: linear-gradient(180deg, #8a7ae8, #5a48c8); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 3px 0 #2a1e7a; }
.btn.pw.kill { background: linear-gradient(180deg, #5a5a6a, #2a2a36); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 3px 0 #0a0a10; }
.btn.pw.rob { background: linear-gradient(180deg, #7a8a4a, #4a5a26); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 3px 0 #1f2a10; }
.btn.pw.inc { background: linear-gradient(180deg, #5ad08a, #2a9a5a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 3px 0 #0d5a2e; }

.btn.end { background: linear-gradient(180deg, #f6e8c6, #d8b874); color: #3a2208; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #7a5a20; }
@keyframes btnin { from { transform: translateY(12px) scale(.92); opacity: 0; } }
@media (min-width: 1000px) and (min-height: 700px) {
  .gv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto auto auto auto minmax(0, 1fr); grid-template-areas: 'top top' 'court me' 'opp me' 'dock me' 'mid me' 'now me'; }
  .gv-court { margin-top: 10px; }
  .gv-now { align-self: start; margin-bottom: 14px; }
  .gv-mid { --pw: 84px; padding-top: 10px; }
  .gv-me { align-items: center; }
  .mine { --sw: min(calc((100cqw - 40px) / 7), 74px); --hw: 96px; }
}
@media (max-height: 700px) and (max-width: 999px) {
  .ticker .tk:first-child { display: none; }
  .gv-mid { --pw: clamp(38px, 10vw, 50px); }

}

/* animazioni */
.flyer { position: fixed; z-index: 70; pointer-events: none; transform-origin: 0 0; will-change: transform; }
.flyer .ctc { --cw: 100% !important; width: 100%; }
.fcoin, .fcoin .ic { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .6)); }
.fcrown, .fcrown svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 12px rgba(242, 194, 60, .9)); }
.fdag { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #2a2a36; color: #fff; box-shadow: 0 0 14px rgba(255, 60, 40, .8); }
.fdag.bag { background: #c99a2a; color: #3a2208; box-shadow: 0 0 14px rgba(242, 194, 60, .8); }
.fdag .ic { width: 70%; height: 70%; }
.burst { position: fixed; z-index: 72; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; animation: burst .8s var(--ease) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
.floatxt { position: fixed; z-index: 73; pointer-events: none; transform: translate(-50%, -50%); font: 800 19px var(--f-disp); color: #fff; text-shadow: 0 2px 0 #2a1a08, 0 0 12px rgba(0, 0, 0, .8); animation: floatup 1.6s var(--ease) forwards; white-space: nowrap; }

.floatxt.bad { color: #ffb0a6; text-shadow: 0 2px 0 #5a0a00, 0 0 14px #c8302c; }
.floatxt.magic { color: #d6c8ff; text-shadow: 0 2px 0 #2a1a6a, 0 0 14px #8a6ae8; }
.floatxt.build { font-size: 15px; color: #fff3c0; }
.floatxt.small { font: 800 14px var(--f-body); color: #fff3c0; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -170%) scale(1); } }
.stampfx { position: fixed; z-index: 74; pointer-events: none; display: grid; place-items: center; }
.stampfx span { font: 900 clamp(18px, 5vw, 30px)/1 var(--f-disp); padding: 4px 12px; border-radius: 10px; border: 4px solid currentColor; transform: rotate(-12deg); animation: stampin 1.5s var(--ease) forwards; background: rgba(0, 0, 0, .3); white-space: nowrap; }
.stampfx.rob span { color: var(--gold); text-shadow: 0 0 12px #c98a12; }
.stampfx.boom span { color: #ff8a5a; text-shadow: 0 0 12px #c8402c; }
@keyframes stampin { 0% { transform: scale(3) rotate(-30deg); opacity: 0; } 18% { transform: scale(.95) rotate(-12deg); opacity: 1; } 26% { transform: scale(1.05) rotate(-12deg); } 80% { opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 0; } }
.shake { animation: shake .55s ease-in-out; }
@keyframes shake { 15%, 55% { transform: translateX(-8px) rotate(-1.5deg); } 35%, 75% { transform: translateX(8px) rotate(1.5deg); } }
.boomcard { position: fixed; z-index: 71; pointer-events: none; animation: boom 1.2s ease-in forwards; }
.boomcard .ctc { --cw: 100%; }
@keyframes boom { 0% { transform: scale(1); } 20% { transform: scale(1.15) rotate(-4deg); filter: brightness(1.8) sepia(1); } 100% { transform: translateY(40px) scale(.4) rotate(40deg); opacity: 0; filter: brightness(.3); } }
/* la grande rivelazione */
.reveal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(20, 10, 40, .55), rgba(10, 6, 20, .25) 70%); animation: fade .25s; }
.reveal.out { animation: fadeout .4s forwards; } @keyframes fadeout { to { opacity: 0; } }
.rv-in { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 0 16px; }
.rv-k { font: 800 14px var(--f-body); text-transform: uppercase; letter-spacing: .18em; color: var(--gold); text-shadow: 0 2px 4px rgba(0, 0, 0, .8); animation: up .3s var(--ease); }
.rv-card { position: relative; width: min(150px, 38vw); aspect-ratio: 100 / 140; perspective: 900px; }
.rv-flip { position: absolute; inset: 0; transform-style: preserve-3d; animation: rvflip 1s var(--ease) .25s both; }
.rv-back, .rv-front { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.rv-front { transform: rotateY(180deg); }

@keyframes rvflip { 0% { transform: rotateY(0) scale(.6); } 40% { transform: rotateY(0) scale(1.05); } 100% { transform: rotateY(180deg) scale(1); } }

<script>
window.GAME_PREFIX = 'citadels/v1/';
/* ===== Citadels: motore delle regole (gira sull'host; lo stato è JSON) =====
   Regole ufficiali (edizione 2016, «prima partita»), da 4 a 7 giocatori: 8 personaggi, 54 quartieri base e 14 unici.
   Ogni round: scelta dei personaggi a giro (chi ha la corona sceglie per primo), poi si chiamano i personaggi dall'1 all'8
   e chi lo ha scelto lo rivela e gioca: prende 2 oro o pesca 2 carte (ne tiene 1), costruisce un quartiere e usa il potere.
   Quando una città arriva a 7 quartieri la partita finisce alla fine del round. Vince chi ha più punti. */
var CTEngine = (function () {
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var TARGET = 7;

  /* ---------- personaggi ---------- */
  var CH = {
    1: { n: 'Assassino', p: 'Scegli un personaggio da uccidere: quando verrà chiamato salterà il turno.' },
    2: { n: 'Ladro', p: 'Scegli un personaggio da derubare: quando si rivela, gli prendi tutto l’oro. Non puoi derubare l’Assassino né il personaggio ucciso.' },
    3: { n: 'Mago', p: 'Scambia tutta la tua mano con quella di un altro giocatore, oppure scarta quante carte vuoi e pescane altrettante.' },
    4: { n: 'Re', p: 'Prendi la corona: nel prossimo round sceglierai per primo. Guadagni 1 oro per ogni quartiere nobile.', t: 'n' },
    5: { n: 'Vescovo', p: 'Il Condottiero non può distruggere i tuoi quartieri in questo round. Guadagni 1 oro per ogni quartiere religioso.', t: 'r' },
    6: { n: 'Mercante', p: 'Guadagni 1 oro in più. Guadagni 1 oro per ogni quartiere commerciale.', t: 'c' },
    7: { n: 'Architetto', p: 'Peschi 2 carte in più. Puoi costruire fino a 3 quartieri in questo turno.' },
    8: { n: 'Condottiero', p: 'Puoi distruggere un quartiere pagando 1 oro in meno del suo costo (non nelle città complete). Guadagni 1 oro per ogni quartiere militare.', t: 'm' }
  };
  var TYPES = { n: 'nobile', r: 'religioso', c: 'commerciale', m: 'militare', u: 'unico' };
  var PL = { n: 'nobili', r: 'religiosi', c: 'commerciali', m: 'militari', u: 'unici' };

  /* ---------- quartieri ---------- */
  var DIST = [];
  function add(n, t, c, k, x, u) { for (var i = 0; i < k; i++) DIST.push({ id: DIST.length, n: n, t: t, c: c, u: u || null, x: x || '' }); }
  add('Maniero', 'n', 3, 5); add('Castello', 'n', 4, 4); add('Palazzo', 'n', 5, 3);
  add('Tempio', 'r', 1, 3); add('Chiesa', 'r', 2, 3); add('Monastero', 'r', 3, 3); add('Cattedrale', 'r', 5, 2);
  add('Taverna', 'c', 1, 5); add('Mercato', 'c', 2, 4); add('Emporio', 'c', 2, 3); add('Molo', 'c', 3, 3); add('Porto', 'c', 4, 3); add('Municipio', 'c', 5, 2);
  add('Torre di guardia', 'm', 1, 3); add('Prigione', 'm', 2, 3); add('Caserma', 'm', 3, 3); add('Fortezza', 'm', 5, 2);
  add('Porta del Drago', 'u', 6, 1, 'A fine partita vale 2 punti in più.', 'dragon');
  add('Fabbrica', 'u', 5, 1, 'Paghi 1 oro in meno per costruire gli altri quartieri unici.', 'factory');
  add('Quartiere Infestato', 'u', 2, 1, 'A fine partita conta come un tipo di quartiere a tua scelta.', 'haunted');
  add('Tesoro Imperiale', 'u', 5, 1, 'A fine partita, 1 punto in più per ogni oro che hai.', 'treasury');
  add('Mastio', 'u', 3, 1, 'Il Condottiero non può distruggere il Mastio.', 'keep');
  add('Laboratorio', 'u', 5, 1, 'Una volta per turno puoi scartare 1 carta e prendere 2 oro.', 'lab');
  add('Biblioteca', 'u', 6, 1, 'Quando peschi le carte per le risorse, le tieni tutte e due.', 'library');
  add('Sala delle Mappe', 'u', 5, 1, 'A fine partita, 1 punto in più per ogni carta che hai in mano.', 'maproom');
  add('Cava', 'u', 5, 1, 'Puoi costruire quartieri uguali a quelli che hai già.', 'quarry');
  add('Scuola di Magia', 'u', 6, 1, 'Quando incassi l’oro dei quartieri, conta come il tipo che vuoi.', 'school');
  add('Fucina', 'u', 5, 1, 'Una volta per turno puoi pagare 2 oro e pescare 3 carte.', 'smithy');
  add('Statua', 'u', 3, 1, 'Se a fine partita hai la corona, vale 5 punti in più.', 'statue');
  add('Covo dei Ladri', 'u', 6, 1, 'Puoi pagarlo anche con carte della mano: ogni carta vale 1 oro.', 'den');
  add('Pozzo dei Desideri', 'u', 5, 1, 'A fine partita, 1 punto in più per ogni quartiere unico della tua città.', 'well');

  function D(id) { return DIST[id]; }
  function nick(g, p) { return g.players[p].nick; }
  function cn(r) { return CH[r].n; }
  function il(r) { return (r === 1 || r === 7 ? 'l’' : 'il ') + CH[r].n; }
  function Il(r) { var x = il(r); return x.charAt(0).toUpperCase() + x.slice(1); }
  function log(g, t, k, p) { g.log.push({ n: ++g.logN, t: t, k: k || '', p: p == null ? null : p }); if (g.log.length > 160) g.log.splice(0, g.log.length - 160); }
  function fx(g, e) { e.n = ++g.fxN; g.fx.push(e); if (g.fx.length > 40) g.fx.splice(0, g.fx.length - 40); }
  function has(P, u) { return P.city.some(function (id) { return D(id).u === u; }); }
  function owner(g, r) { for (var i = 0; i < g.players.length; i++) if (g.players[i].char === r) return i; return -1; }
  function drawN(g, k) { var o = []; while (k-- > 0 && g.deck.length) o.push(g.deck.pop()); return o; }
  function bottom(g, id) { g.deck.unshift(id); }
  function complete(P) { return P.city.length >= TARGET; }

  /* ---------- nuova partita ---------- */
  function newGame(seats, opts) {
    var g = {
      v: 1, phase: 'pick', seq: 0, turnN: 0, round: 0,
      players: seats.map(function (s, i) { return { uid: s.uid, nick: s.nick, bot: !!s.bot, away: false, col: i, gold: 2, hand: [], city: [], char: null, lastChar: null }; }),

/* ===== Serie di partite e risultati (condivisi da tutti i giochi) =====
   Serie: con «Nuova partita con lo stesso tavolo» le vittorie si sommano; l'host può scegliere «al meglio di 3 / di 5».
   La tiene l'host nello stato del tavolo (doc.series), aggiornata quando una partita finisce.
   Risultati: a fine partita chi ha l'account registra il proprio sul server (statistiche e classifica tra amici).
   Ogni gioco dice chi ha vinto con Score.setup({ game, result(g) -> [{ won, place, score }] per giocatore }). */

  function setup(c) { cfg = c; }
  function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

    if (!doc) return;

    if (s.last === doc.gid) return;
    var res = result(doc.game); if (!res) return;
    if (s.champ) { s.n = 0; s.wins = {}; s.champ = null; }   // la serie di prima era già vinta: ne comincia una nuova

  function op(work, from, o) {

      (champ ? '<div class="sc-champ">🏆 ' + esc(champ) + ' vince la serie!</div>' : '') +

    '.sc-champ{font-weight:800;font-size:17px}.sc-rows{display:flex;flex-wrap:wrap;gap:6px}.sc-p{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap}.sc-p.on{background:rgba(230,197,111,.35)}.sc-p.me{box-shadow:inset 0 0 0 1px currentColor}' +
    '.sc-note,.sc-head{font-size:13.5px;opacity:.85}';

  // Sala d'attesa: scelta della serie (host) e classifica della serie in corso.

    var t = doc.series ? doc.series.target || 0 : 0;

      '<select id="opt-series" class="field"' + (isHost ? '' : ' disabled') + ' style="font-size:16px;min-height:44px">' +
      [[0, 'Partite singole (conto le vittorie)'], [3, 'Al meglio di 3'], [5, 'Al meglio di 5']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' + standings(doc);
  }
  function endHTML(doc) { css(); return standings(doc); }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'opt-series' && window.Net) Net.send({ t: 'series', target: +e.target.value }).catch(function (er) { console.warn(er); });
  });

  // Risultato personale sul server (una volta per partita, solo con l'account; le partite di prova non contano).
  var RKEY = 'pp-reported', trying = {};
  function reported() { try { return JSON.parse(localStorage.getItem(RKEY) || '[]'); } catch (e) { return []; } }
  function report() {

    var g = d.game, me = -1; g.players.forEach(function (P, i) { if (P.uid === Net.uid) me = i; });

      .then(function () { var l = reported(); l.push(key); try { localStorage.setItem(RKEY, JSON.stringify(l.slice(-60))); } catch (e) {} }, function () {});
  }

})();

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,

    '.cx-bar .cx-t{flex:1;min-width:0}.cx-bar b{color:#9fd3ff}.cx-bar .cx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +

    '.cx-bar .cx-x{border:0;padding:2px 6px;font-size:20px;line-height:1;opacity:.7}.cx-pill{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:9980;appearance:none;border:1px solid rgba(140,200,255,.6);background:rgba(18,30,44,.94);color:#eef4fb;border-radius:999px;padding:7px 12px;font:600 13.5px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}';
  function css() { if (!document.getElementById('cx-css')) { var s = document.createElement('style'); s.id = 'cx-css'; s.textContent = CSS; document.head.appendChild(s); } }

/* ===== Citadels: schermata di gioco (corte, avversari, piazza, «Adesso», la tua città) e animazioni =====
   La riga «Adesso» spiega sempre cosa sta succedendo e cosa deve fare chi guarda; la corte in alto mostra gli 8 personaggi
   con chi è stato chiamato, chi è stato ucciso o derubato. Ogni evento ha la sua animazione: rivelazione del personaggio,

var Game = (function () {

  function anim(n, frames, o) { if (reduce || !n || !n.animate) return Promise.resolve(); try { return n.animate(frames, o).finished.catch(function () {}); } catch (e) { return Promise.resolve(); } }
  var CH = E.CH, D = E.D;
  function il(r) { return (r === 1 || r === 7 ? 'l’' : 'il ') + CH[r].n; }   // «il Re», «l’Assassino»
  function Il(r) { var s = il(r); return s.charAt(0).toUpperCase() + s.slice(1); }

  function scenery() {

    var towers = [[2, 34, 9], [9, 52, 7], [15, 40, 10], [24, 62, 8], [31, 46, 11], [40, 70, 9], [48, 50, 12], [57, 64, 8], [64, 44, 10], [72, 58, 9], [80, 38, 11], [88, 54, 8], [95, 42, 10]];
    var sky = towers.map(function (t, i) { return '<i style="left:' + t[0] + '%;height:' + t[1] + '%;width:' + t[2] + '%;--d:' + (i % 3) + '"></i>'; }).join('');
    return '<div class="scenery" aria-hidden="true">' + o + '<div class="moon"></div><div class="banners"><i></i><i></i><i></i></div><div class="sky-city">' + sky + '</div><div class="ground"></div></div>';
  }
  function mount() {
    $('#app').innerHTML = '<div class="gv" id="gv">' + scenery() +
      '<header class="gv-top"><button class="iconbtn brandbtn" data-act="menu" aria-label="Menu">☰</button><span class="gv-info" id="gv-info"></span>' + Sound.buttonHTML() + '<span id="gv-chat">' + Chat.badgeHTML() + '</span><button class="iconbtn" data-act="rules" aria-label="Regole">' + IC('help') + '<span class="hide-s"> Regole</span></button></header>' +
      '<nav class="gv-court" id="gv-court" aria-label="La corte: i personaggi dall’1 all’8"></nav>' +
      '<div class="gv-opp" id="gv-opp"></div>' + Chat.dockHTML() +
      '<div class="gv-mid" id="gv-mid"></div>' +

  function unmount() { mountedFor = null; }

    var g = G(), me = myIdx(), mi = mainIdx(g);
    setHTML('gv-info', '<b>Citadels</b> <span class="muted">· ' + connInfo((g.phase === 'over' ? 'Partita finita' : 'Round ' + g.round) + ' · tavolo ' + esc(App.code)) + '</span><span id="tt" class="tt"></span>');
    setHTML('gv-court', court(g, me));
    setHTML('gv-opp', opponents(g, mi, me));
    setHTML('gv-mid', middle(g, me));
    setHTML('gv-now', nowBox(g, me));
    setHTML('gv-me', mainBoard(g, mi, me));
    var chat = el('gv-chat'); if (chat) { var ch = Chat.badgeHTML(); if (chat._h !== ch) { chat.innerHTML = ch; chat._h = ch; } }
    applyHide();
  }

  /* ---------- chi vede cosa ---------- */
  // il personaggio di p che può vedere chi guarda (il proprio sempre, gli altri solo quando sono stati chiamati)
  function visChar(g, p, me) {
    var P = g.players[p]; if (!P.char && g.phase !== 'over') return null;
    if (g.phase === 'over') return P.char || P.lastChar;
    if (p === me) return P.char;

  function court(g, me) {
    var o = '';

  /* ---------- la mia città e la mia mano ---------- */

  }
  function handRow(g, p, me) {

  function cardBox(r, w) { if (!r) return null; w = w || Math.min(64, r.width); var h = w * 1.4; return { left: r.left + (r.width - w) / 2, top: r.top + (r.height - h) / 2, width: w, height: h }; }
  function fly(html, from, to, o) {

    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'char': App.sheet = { kind: 'char', r: +el.getAttribute('data-r') }; renderSheet(); break;
    case 'card': App.sheet = { kind: 'card', id: id, p: +el.getAttribute('data-p') }; renderSheet(); break;
    // scelta del personaggio
    case 'pickopen': if (g && g.phase === 'pick' && E.decider(g) === me) { App.sheet = { kind: 'pick' }; renderSheet(); } break;
    case 'pick': App.sheet = null; renderSheet(); act({ a: 'pick', r: +el.getAttribute('data-r') }); break;
    // il turno
    case 'gold': if (needTurn(g, me)) act({ a: 'gold' }); break;
    case 'draw': if (needTurn(g, me)) act({ a: 'draw' }); break;
    case 'keepopen': if (myTurnNow(g, me) && g.turn.drawn) { App.sheet = { kind: 'keep' }; renderSheet(); } break;
    case 'keep': App.sheet = null; renderSheet(); act({ a: 'keep', id: id }); break;
    case 'build': App.sheet = null; renderSheet(); act({ a: 'build', id: id }); break;
    case 'denopen': App.sheet = { kind: 'den', id: id, sel: [] }; renderSheet(); break;
    case 'densel': toggle(s.sel, id); renderSheet(); break;
    case 'denbuild': { var did = s.id, cs = s.sel.slice(); App.sheet = null; renderSheet(); act({ a: 'build', id: did, cards: cs }); break; }
    case 'income': if (needTurn(g, me)) act({ a: 'income' }); break;
    case 'smithy': if (needTurn(g, me)) act({ a: 'smithy' }); break;
    case 'pw': if (needTurn(g, me)) { App.sheet = { kind: el.getAttribute('data-k'), sel: el.getAttribute('data-k') === 'magic' ? [] : null }; renderSheet(); } break;
    case 'kill': App.sheet = null; renderSheet(); act({ a: 'kill', r: +el.getAttribute('data-r') }); break;
    case 'rob': App.sheet = null; renderSheet(); act({ a: 'rob', r: +el.getAttribute('data-r') }); break;
    case 'swap': App.sheet = null; renderSheet(); act({ a: 'swap', t: +el.getAttribute('data-t') }); break;
    case 'rdsel': toggle(s.sel, id); renderSheet(); break;
    case 'redraw': { var ids = s.sel.slice(); App.sheet = null; renderSheet(); act({ a: 'redraw', ids: ids }); break; }
    case 'dsel': s.sel = { t: +el.getAttribute('data-t'), id: id }; renderSheet(); break;
    case 'destroy': { var ds = s.sel; App.sheet = null; renderSheet(); act({ a: 'destroy', t: ds.t, id: ds.id }); break; }
    case 'lab': App.sheet = null; renderSheet(); act({ a: 'lab', id: id }); break;
    case 'endturn': {
      if (!needTurn(g, me)) break;
      var T = g.turn, warn = (T.r === 1 && !T.used.kill) || (T.r === 2 && !T.used.rob) || (T.built < T.max && Game.buildable(g, me).length);
      if (warn) { App.sheet = { kind: 'endconfirm' }; renderSheet(); } else act({ a: 'end' });
      break;
    }
    case 'endyes': App.sheet = null; renderSheet(); act({ a: 'end' }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; renderSheet(); }
});

/* ---------- avvio ---------- */
(function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.defs());
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
