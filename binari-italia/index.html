<style>
/* ===== Binari d'Italia — carta ferroviaria d'epoca: blu notte, crema, oro e rosso mattone ===== */
:root {
  --bg: #102027; --bg-2: #15292f; --panel: #19313a; --panel-2: #213d47; --panel-3: #2b4a55;
  --ink: #f4ead2; --muted: #b9c3bd; --dim: #8a9a98; --gold: #d9b45a; --gold-2: #a8842c; --red: #b23a2a; --good: #8fd18a; --bad: #ff8f7a;
  --paper: #f3e7c9; --paper-ink: #2a2420;
  --line: rgba(217, 180, 90, .3); --line-2: rgba(244, 234, 210, .12);
  --f-disp: "Bodoni Moda", "Didot", Georgia, serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #1d3a44, var(--bg) 60%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); text-wrap: balance; margin: 0; }
h2 { font-size: 26px; font-weight: 800; }
h3 { font-size: 20px; font-weight: 700; }
h4 { font: 700 13.5px var(--f-body); margin: 12px 0 4px; color: var(--gold); text-transform: uppercase; letter-spacing: .1em; }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); } .gold { color: var(--gold); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 70%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); min-width: 0; }
.panel h2 { font-size: 23px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(217, 180, 90, .12); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(178, 58, 42, .2); border-color: rgba(255, 143, 122, .5); }
.btn { appearance: none; border: 0; border-radius: 10px; min-height: 44px; padding: 10px 16px; font: 700 15.5px/1.15 var(--f-body); color: #2a1c06; cursor: pointer; letter-spacing: .01em;
  background: linear-gradient(180deg, #ecd08a, var(--gold) 55%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 3px 0 #6b5320, 0 6px 14px rgba(0, 0, 0, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 1px 0 #6b5320; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(244, 234, 210, .06); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.red { background: linear-gradient(180deg, #d4644f, var(--red)); color: #fff4ec; box-shadow: 0 3px 0 #5e1a10; }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .pchip:focus-visible, .zb:focus-visible, .mk-card:focus-visible, .mk-deck:focus-visible, .mk-tk:focus-visible, .hd-c:focus-visible, .hd-tk:focus-visible, .kt-t:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: none; border: 1px solid var(--line-2); color: var(--ink); border-radius: 9px; min-height: 36px; padding: 5px 9px; font: 600 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(244, 234, 210, .06); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 600 13.5px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip.on { background: rgba(217, 180, 90, .25); border-color: var(--gold); }
.chip .dot { background: var(--red); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #1d1710; background: var(--paper); border: 0; border-radius: 10px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; max-width: 170px; }
select.field { color: #1d1710; }
.back-link { color: var(--muted); text-decoration: none; font-size: 15px; }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 54px; letter-spacing: .14em; color: var(--gold); line-height: 1; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(16, 32, 39, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 21px; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line); background: rgba(244, 234, 210, .04); }
.seat .ava .pwic { display: block; }
.seat .ava.empty { width: 40px; height: 24px; display: grid; place-items: center; color: var(--dim); }
.seat .nm { font-weight: 700; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.trow { display: flex; gap: 10px; align-items: center; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(244, 234, 210, .03); }
.trow .grow { flex: 1; min-width: 0; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }

/* carte, biglietti, gettoni colore */
.bcard { display: block; width: 100%; height: auto; }
.bticket { display: block; width: 100%; height: auto; }
.sw { display: inline-flex; align-items: center; gap: 3px; vertical-align: middle; height: 22px; min-width: 22px; padding: 0 3px; border-radius: 6px; border: 1.5px solid var(--swd); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.sw svg { width: 14px; height: 14px; }
.sw b { font-size: 13px; padding-right: 3px; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
.sw-W b, .sw-Y b, .sw-L b { color: #2a2420; text-shadow: none; }
.sw-X { background: repeating-linear-gradient(135deg, #a9a59b 0 4px, #8b877e 4px 8px) !important; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; position: relative;
  background: linear-gradient(180deg, rgba(16, 32, 39, .2), rgba(16, 32, 39, .9)), radial-gradient(120% 120% at 85% 0%, #3c6a76 0%, #1f3c45 45%, #12242a 80%); }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-35deg, transparent 0 22px, rgba(217, 180, 90, .05) 22px 24px); pointer-events: none; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero h1 { font-size: clamp(46px, 10vw, 78px); font-weight: 800; line-height: .95; color: var(--paper); text-shadow: 0 3px 0 rgba(0, 0, 0, .45); margin-top: 4px; }
.hero .tag { color: #dfe6df; margin-top: 12px; max-width: 54ch; }
.hero-cards { position: relative; height: 210px; max-width: 380px; width: 100%; justify-self: center; }
.hero-cards > div { position: absolute; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .5)); }
.hc1 { width: 104px; left: 10%; top: 18px; transform: rotate(-12deg); } .hc2 { width: 112px; left: 36%; top: 0; transform: rotate(2deg); z-index: 2; } .hc3 { width: 104px; left: 63%; top: 20px; transform: rotate(13deg); }
.hc4 { width: 230px; left: 12%; top: 118px; transform: rotate(-3deg); z-index: 3; }

/* ---------- schermata di gioco ---------- */
.gv { position: fixed; inset: 0; top: env(safe-area-inset-top, 0px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: 'top' 'players' 'dock' 'map' 'side'; background: var(--bg); }
.gv-top { grid-area: top; } .gv-players { grid-area: players; } .gv > .chat-dock { grid-area: dock; } .gv-map { grid-area: map; } .gv-side { grid-area: side; }
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line-2); background: #0d1b21; min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 18px; }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.gv-players { display: flex; gap: 6px; overflow-x: auto; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 7px max(10px, env(safe-area-inset-left, 0px)); scrollbar-width: none; background: #112329; border-bottom: 1px solid var(--line-2); }
.gv-players::-webkit-scrollbar { display: none; }
.pchip { appearance: none; flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border-radius: 12px; border: 1px solid var(--line-2); border-left: 4px solid var(--pc); background: rgba(244, 234, 210, .04); color: var(--ink); font: 13px var(--f-body); cursor: pointer; position: relative; text-align: left; }
.pchip .pw .pwic { display: block; }
.pchip .pn b { display: block; font-size: 13.5px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pchip .ps { display: flex; gap: 7px; color: var(--muted); font-size: 12.5px; }
.pchip .ps i { font-style: normal; display: inline-flex; align-items: center; gap: 1px; }
.pchip .ps .sc { color: var(--gold); font-weight: 700; }
.pchip .ps .low { color: var(--bad); font-weight: 700; }
.pchip.on { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 16px color-mix(in srgb, var(--pc) 55%, transparent); background: rgba(244, 234, 210, .09); }
.pchip.me .pn b { color: var(--gold); }
.pchip .away { position: absolute; top: -7px; right: -4px; background: var(--red); color: #fff; font-size: 10px; border-radius: 6px; padding: 0 5px; }
.pchip .away.bot { background: #44606a; }
.pchip .away.last { background: var(--gold); color: #2a1c06; left: 8px; right: auto; }
.gv-map { position: relative; min-height: 0; overflow: hidden; background: radial-gradient(100% 80% at 50% 40%, #1f3b44, #0c181d); }
.gv-board { position: absolute; inset: 0; }
.bd-stage { position: absolute; inset: 0; touch-action: none; cursor: grab; overflow: hidden; }
.bd-stage.drag { cursor: grabbing; }
.bd-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.bd-world canvas, .bd-world svg { position: absolute; left: 0; top: 0; display: block; }
.bd-world canvas { box-shadow: 0 18px 40px rgba(0, 0, 0, .55); }
.bd-lane { fill: none; stroke: rgba(30, 60, 75, .55); stroke-width: 1.4; stroke-dasharray: 4 5; }
.bd-slots .dimmed, .bd-slots.dimmed > g:not(.focus), .bd-claims.dimmed > g:not(.focus) { opacity: .28; transition: opacity .25s; }
.bd-hl { fill: none; stroke-linecap: round; pointer-events: none; }
.bd-hl.can { stroke: rgba(255, 226, 140, .55); stroke-width: 15; stroke-dasharray: 2 6; animation: bdpulse 1.8s ease-in-out infinite; }
.bd-hl.sel { stroke: #fff3c4; stroke-width: 17; opacity: .85; filter: drop-shadow(0 0 6px #ffd98a); }
.bd-hl.plan { stroke: rgba(255, 245, 220, .7); stroke-width: 14; stroke-dasharray: 6 6; animation: bdmarch 1.1s linear infinite; }
.bd-hl.path { stroke: rgba(120, 220, 120, .85); stroke-width: 16; }
.bd-hl.long { stroke: rgba(255, 210, 90, .9); stroke-width: 17; animation: bdpulse 1.6s ease-in-out infinite; }
@keyframes bdpulse { 50% { opacity: .45; } }
@keyframes bdmarch { to { stroke-dashoffset: -24; } }
.bd-cring { fill: none; stroke: transparent; stroke-width: 3; }
.bd-city.tk .bd-cring { stroke: #c4301f; stroke-dasharray: 5 4; animation: ringspin 6s linear infinite; }
.bd-city.ok .bd-cring { stroke: #2f8a3a; stroke-width: 3.4; }
.bd-city.sel .bd-cring { stroke: #ffd24a; stroke-width: 4; filter: drop-shadow(0 0 5px #ffd24a); }
@keyframes ringspin { to { stroke-dashoffset: -54; } }
.bd-label { font: 700 12.5px var(--f-disp); fill: var(--paper-ink); stroke: rgba(246, 236, 210, .92); stroke-width: 3.6px; paint-order: stroke; stroke-linejoin: round; pointer-events: none; }
.bd-label.big { font-size: 15px; font-weight: 800; }
.bd-label.hot { fill: #8e1f12; }
.bd-drop { animation: drop .42s var(--ease) both; }
@keyframes drop { from { transform: translateY(-26px) scale(1.25); opacity: 0; } }
.bd-flash { fill: none; stroke-width: 22; stroke-linecap: round; opacity: 0; animation: flash 2s ease-out; pointer-events: none; }
@keyframes flash { 15% { opacity: .65; } 100% { opacity: 0; stroke-width: 34; } }
.bd-float { font: 800 22px var(--f-body); fill: #fff6dc; stroke: #2a1e10; stroke-width: 5px; paint-order: stroke; pointer-events: none; animation: floatup 2.2s var(--ease) forwards; }
@keyframes floatup { to { transform: translateY(-26px); opacity: 0; } }
.gv-feed { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); right: 56px; top: 8px; display: grid; gap: 3px; cursor: pointer; max-width: 560px; }
.gv-feed .fl { font-size: 12px; line-height: 1.3; color: #f1ead6; background: rgba(12, 24, 29, .78); border-left: 3px solid var(--line); padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(4px); opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gv-feed .fl:last-child { opacity: 1; white-space: normal; animation: flin .4s var(--ease); }
@keyframes flin { from { transform: translateY(-6px); opacity: 0; } }
.gv-zoom { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 8px; display: grid; gap: 6px; }
.zb { appearance: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(16, 32, 39, .88); color: var(--ink); font: 700 20px var(--f-body); cursor: pointer; display: inline-grid; place-items: center; }
.zb.s { width: 32px; height: 32px; font-size: 18px; }
.zb:disabled { opacity: .4; }
.gv-legend { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; justify-content: center; pointer-events: none; }
.gv-legend .lg { pointer-events: auto; display: inline-flex; gap: 8px; align-items: center; background: rgba(12, 24, 29, .9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13.5px; max-width: 100%; }
.gv-legend .x { appearance: none; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 6px; }
.lg-plan { display: inline-block; width: 22px; height: 0; border-top: 3px dashed #f4ead2; }

/* parte bassa: mercato, istruzioni, mano */
.gv-side { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; background: #12252c; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.gv-market { display: flex; gap: 6px; align-items: center; padding: 7px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); }
.mk-face { display: flex; gap: 5px; flex: 5 1 0; min-width: 0; }
.mk-decks { display: flex; gap: 6px; flex: 2.6 1 0; min-width: 0; align-items: center; }
.mk-card, .mk-deck, .mk-tk { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; position: relative; border-radius: 7px; flex: 1 1 0; min-width: 0; max-width: 64px; transition: transform .15s var(--ease), filter .2s; }
.mk-tk { flex: 2 1 0; max-width: 130px; }
.mk-card.empty { aspect-ratio: 100 / 140; border: 1px dashed var(--line-2); border-radius: 7px; flex: 1 1 0; max-width: 64px; }
.mk-card[aria-disabled], .mk-deck[aria-disabled] { filter: saturate(.75) brightness(.85); }
.mk-card.can, .mk-deck.can, .mk-tk.can { filter: drop-shadow(0 0 5px rgba(255, 217, 138, .55)); }
.mk-card.can:hover, .mk-deck.can:hover, .mk-tk.can:hover { transform: translateY(-3px); }
.mk-card.loco.can { filter: drop-shadow(0 0 7px rgba(255, 230, 150, .9)); }
.mk-deck .cnt, .mk-tk .cnt { position: absolute; right: -3px; bottom: -3px; background: #0d1b21; border: 1px solid var(--line); color: var(--ink); font: 700 11.5px var(--f-body); border-radius: 999px; padding: 0 5px; }
.gv-prompt { display: flex; align-items: center; gap: 8px; padding: 7px max(10px, env(safe-area-inset-right, 0px)) 7px max(12px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, #2e2716, #231e12); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 0; }
.pr-txt b { color: #ffe3a0; }
.gv-prompt .btn { flex: none; }
.gv-prompt .help { flex: none; color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }
.tag-last { display: inline-block; background: var(--gold); color: #2a1c06; font: 800 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 5px; margin-right: 2px; animation: bdpulse 1.4s infinite; }
.gv-hand { padding: 7px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
.hd-row { display: flex; gap: 8px; align-items: center; min-height: 58px; }
.hd-cards { display: flex; gap: 6px; flex: 1; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 2px; min-width: 0; }
.hd-cards::-webkit-scrollbar { display: none; }
.hd-c { appearance: none; border: 0; background: none; padding: 0; position: relative; width: 40px; flex: none; cursor: pointer; transition: transform .15s var(--ease); }
.hd-c .bcard { filter: drop-shadow(2px 0 0 rgba(0, 0, 0, .25)); }
.hd-c .n { position: absolute; right: -5px; top: -5px; background: #0d1b21; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; font: 800 13px var(--f-body); min-width: 22px; text-align: center; padding: 0 5px; }
.hd-c.on { transform: translateY(-4px); filter: drop-shadow(0 0 6px #ffd98a); }
.hd-tk { appearance: none; flex: none; display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: rgba(217, 180, 90, .1); color: var(--ink); border-radius: 12px; padding: 6px 10px; font: 14px var(--f-body); cursor: pointer; text-align: left; }
.hd-tk .ic { width: 22px; height: 22px; color: var(--gold); }
.hd-tk small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 430px) { .hd-tk { padding: 6px 8px; font-size: 13px; } .hd-tk .tkw { display: none; } }

/* largo: mappa a sinistra, colonna a destra */

  .gv { grid-template-columns: minmax(0, 1fr) 430px; grid-template-rows: auto auto auto minmax(0, 1fr); grid-template-areas: 'top top' 'players players' 'dock dock' 'map side'; }

  .pr-txt { font-size: 15.5px; }
  .hd-row { flex-wrap: wrap; } .hd-cards { flex-wrap: wrap; overflow: visible; } .hd-c { width: 54px; }
}

/* ---------- finestre ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(4, 10, 12, .58); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet-back.light { background: rgba(4, 10, 12, .25); }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 640px; max-height: calc(88vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: linear-gradient(180deg, #213d47, #172d35); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; box-shadow: 0 -12px 40px rgba(0, 0, 0, .55); animation: up .28s var(--ease); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 18px; border-bottom: 1px solid var(--line); } }
.sh-route, .sh-city { max-height: 70vh; }
.sheet .lead { font-size: 15.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.gc { display: inline-flex; align-items: center; gap: 4px; border-radius: 7px; padding: 3px 8px; font-size: 13.5px; background: rgba(244, 234, 210, .06); border: 1px solid var(--line-2); }
.rs { display: flex; gap: 3px; flex-wrap: wrap; }
.rs-slot { width: 40px; height: 17px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .4)); }
.why { background: rgba(178, 58, 42, .18); border: 1px solid rgba(255, 143, 122, .45); border-radius: 10px; padding: 9px 11px; font-size: 15px; }
.pay-c { display: flex; flex-wrap: wrap; gap: 6px; }
.pay-l { display: flex; align-items: center; gap: 10px; font-size: 15px; }

.use { display: flex; flex-wrap: wrap; gap: 4px; }
.uc { width: 46px; display: block; animation: up .3s var(--ease) both; }
.rlist { display: grid; gap: 6px; }
.trow.rt { appearance: none; width: 100%; color: var(--ink); font: 15px var(--f-body); text-align: left; cursor: pointer; }
.trow.rt small { display: block; color: var(--muted); font-size: 13px; }
.trow.rt .own { font-size: 13px; border-left: 4px solid var(--pc); padding-left: 6px; }
.trow.rt .free { font-size: 13px; color: var(--good); }
.toast { position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(13, 27, 33, .96); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 12px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .5); animation: up .25s var(--ease); }

.tgl { font-size: 14.5px; color: var(--muted); padding: 6px 2px; } .tgl input { width: 20px; height: 20px; accent-color: var(--gold); }

/* biglietti */

.kt { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.kt-t { max-width: 320px; appearance: none; border: 0; background: none; padding: 0; position: relative; cursor: pointer; border-radius: 6px; transition: transform .15s var(--ease), opacity .2s; opacity: .55; }
.kt.on .kt-t { opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 217, 138, .55)); }
.kt-chk { position: absolute; right: -6px; top: -6px; width: 30px; height: 30px; border-radius: 50%; background: #1b3640; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.kt.on .kt-chk { background: var(--gold); border-color: #fff3c4; color: #2a1c06; }
.kt-chk .ic { width: 18px; height: 18px; }

.loglist .fl { font-size: 14px; border-left: 3px solid var(--line-2); padding: 3px 8px; }

/* ===== Binari d'Italia: schermata di gioco =====
   In alto i giocatori, al centro la mappa, poi le carte scoperte con i mazzi, la riga che dice cosa fare

var Game = (function () {
  var mountedFor = null;
  function el(id) { return document.getElementById(id); }
  function setHTML(id, h) { var e = el(id); if (e && e._h !== h) { e.innerHTML = h; e._h = h; } }

  function mount() {
    $('#app').innerHTML = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' + ART.DEFS + '</svg><div class="gv" id="gv">' +
      '<header class="gv-top"><button class="iconbtn brandbtn" data-act="menu" aria-label="Menu">☰</button><span class="gv-info" id="gv-info"></span>' + Sound.buttonHTML() + '<span id="gv-chat">' + Chat.badgeHTML() + '</span><button class="iconbtn" data-act="rules" aria-label="Regole">' + IC('help') + '<span class="hide-s"> Regole</span></button></header>' +
      '<div class="gv-players" id="gv-players"></div>' + Chat.dockHTML() +
      '<div class="gv-map"><div id="gv-board" class="gv-board"></div><div class="gv-feed" id="gv-feed" data-act="log"></div>' +
      '<div class="gv-zoom"><button class="zb" data-act="zin" aria-label="Avvicina">+</button><button class="zb" data-act="zout" aria-label="Allontana">−</button><button class="zb" data-act="zfit" aria-label="Mostra tutta la mappa">⤢</button></div><div class="gv-legend" id="gv-legend"></div></div>' +
      '<div class="gv-side"><div class="gv-market" id="gv-market"></div><div class="gv-prompt" id="gv-prompt" aria-live="polite"></div><div class="gv-hand" id="gv-hand"></div></div></div>';
    Board.mount(el('gv-board'), { onRoute: onRoute, onCity: onCity, onEmpty: function () { if (App.sel != null || App.focus) { App.sel = null; App.focus = null; render(); } } });
    mountedFor = App.code;
    setTimeout(function () {
      var g = G(), me = myIdx();
      if (me >= 0 && window.innerWidth < 700 && g.players[me].tickets.length) { var cs = []; g.players[me].tickets.forEach(function (id) { cs.push(D.tickets[id].a, D.tickets[id].b); }); Board.centerOnRoutes(cs, false); }
      else Board.fit();
    }, 120);
  }
  function unmount() { if (mountedFor) { Board.unmount(); mountedFor = null; } }
  function render() {
    if (mountedFor !== App.code || !el('gv') || !Board.mounted()) mount();

    Board.update(g, view(g, me));

    setHTML('gv-players', players(g, me));
    setHTML('gv-market', market(g, me));
    setHTML('gv-prompt', prompt(g, me));

  function info(g) {

    return '<b>Binari d’Italia</b> <span class="muted">· ' + connInfo(t + ' · tavolo ' + esc(App.code)) + '</span><span id="tt" class="tt"></span>';
  }

  /* ---------- cosa mostrare sulla mappa ---------- */
  function view(g, me) {
    var o = { hl: {}, cities: {}, focus: null, follow: false }, P = me >= 0 ? g.players[me] : null;
    if (P) P.tickets.forEach(function (id) { var t = D.tickets[id], ok = E.connected(g, me, t.a, t.b); [t.a, t.b].forEach(function (c) { if (o.cities[c] !== 'tk') o.cities[c] = ok ? 'ok' : 'tk'; }); });
    var mine = me >= 0 && g.phase === 'play' && g.stage === 'act' && g.turn === me;
    if (mine && App.showCan !== false) D.routes.forEach(function (r) { if (E.canClaim(g, me, r).ok) o.hl[r.id] = 'can'; });
    if (App.focus) {
      var f = App.focus;
      if (f.k === 'color') { o.hl = {}; D.routes.forEach(function (r) { if (g.claims[r.id] == null && (r.col === f.c || (f.c !== 'L' && r.col === 'X'))) o.hl[r.id] = E.canClaim(g, me, r).ok ? 'can' : 'plan'; }); }
      if (f.k === 'ticket') {

        if (path) path.forEach(function (id) { o.hl[id] = 'path'; });
        else if (me >= 0) { var sp = BOT.shortest(g, me, t.a, t.b); if (sp) sp.routes.forEach(function (r) { o.hl[r.id] = g.claims[r.id] === me ? 'path' : 'plan'; }); }
        o.cities[t.a] = 'sel'; o.cities[t.b] = 'sel';

    if (f && f.k === 'color') return '<div class="lg">' + ART.swatch(f.c) + ' tratte ' + (f.c === 'L' ? 'di tutti i colori' : D.COLORS[f.c].n + ' e grigie') + ' ancora libere<button class="x" data-act="unfocus" aria-label="Chiudi">×</button></div>';
    if (f && f.k === 'player') return '<div class="lg">Tratte di ' + pname(g, f.p) + '<button class="x" data-act="unfocus" aria-label="Chiudi">×</button></div>';

  }

  /* ---------- tocchi sulla mappa ---------- */
  function onRoute(rid) { App.sel = rid; App.sheet = { kind: 'route', r: rid, seq: G().seq }; render(); renderSheet(); if (window.innerHeight < 900) Board.centerOnRoutes([rid], true, { maxK: 1.3, up: .5 }); }
  function onCity(cid) { App.sel = null; App.sheet = { kind: 'city', c: cid }; App.focus = { k: 'city', c: cid }; render(); renderSheet(); }

  /* ---------- giocatori ---------- */
  function players(g, me) {
    var dec = E.decider(g);

      var on = g.phase === 'play' && (g.stage === 'setup' ? !P.ready : g.turn === p), low = P.trains <= 6;

        '<i class="sc" title="Punti">' + IC('star') + P.score + '</i><i class="' + (low ? 'low' : '') + '" title="Vagoni rimasti">' + IC('train') + P.trains + '</i><i title="Carte in mano">' + IC('card') + E.handCount(P) + '</i><i title="Biglietti">' + IC('ticket') + P.tickets.length + '</i></span></span>' +

  /* ---------- carte scoperte e mazzi ---------- */
  function market(g, me) {

    }).join('');

      '<button class="mk-deck' + (can ? ' can' : '') + '" data-act="drawdeck"' + (can ? '' : ' aria-disabled="true"') + ' aria-label="Pesca dal mazzo coperto">' + ART.cardBack() + '<span class="cnt">' + deckN + '</span></button>' +

  /* ---------- cosa fare adesso ---------- */

  /* ---------- la tua mano ---------- */

    var P = g.players[me], cols = D.CARD_COLORS.concat(['L']).filter(function (c) { return P.hand[c] > 0; });
    var cards = cols.length ? cols.map(function (c) { var on = App.focus && App.focus.k === 'color' && App.focus.c === c; return '<button class="hd-c' + (on ? ' on' : '') + '" data-act="focuscolor" data-c="' + c + '" aria-label="' + P.hand[c] + ' carte ' + (c === 'L' ? 'locomotiva' : D.COLORS[c].n) + ': mostra le tratte">' + ART.card(c) + '<span class="n">' + P.hand[c] + '</span></button>'; }).join('')
      : '<span class="muted">Nessuna carta in mano: pescane qualcuna.</span>';
    var done = P.tickets.filter(function (id) { var t = D.tickets[id]; return E.connected(g, me, t.a, t.b); }).length;
    return '<div class="hd-row"><div class="hd-cards">' + cards + '</div>' +
      '<button class="hd-tk" data-act="mytickets" aria-label="I tuoi biglietti">' + IC('ticket') + '<span><b>' + P.tickets.length + '</b><span class="tkw"> bigliett' + (P.tickets.length === 1 ? 'o' : 'i') + '</span><small>' + done + ' arrivat' + (done === 1 ? 'o' : 'i') + '</small></span></button></div>';
  }
  function spectHand(g) { return '<div class="hd-row"><span class="muted">Stai guardando la partita.</span></div>'; }
  function feed(g) { return g.log.slice(-2).map(function (l) { var c = l.p != null && g.players[l.p] ? D.PCOL[g.players[l.p].col].c : 'rgba(217,180,90,.5)'; return '<div class="fl" style="border-left-color:' + c + '">' + esc(l.t) + '</div>'; }).join(''); }
  return { render: render, unmount: unmount };
})();

/* ===== Binari d'Italia: finestre (tratta, biglietti, città, giocatori, classifica, presentazione) ed eventi ===== */
function renderSheet() {
  var root = $('#sheet'), s = App.sheet;
  if (!s) { root.innerHTML = ''; return; }
  var h = sheetBody(s); if (!h) { App.sheet = null; root.innerHTML = ''; return; }
  if (root._s !== s) { root._s = s; App.sheetAt = Date.now(); } // il tocco che l'ha aperta non deve richiuderla
  root.innerHTML = '<div class="sheet-back' + (s.kind === 'route' || s.kind === 'city' ? ' light' : '') + '" data-act="sheetback"><div class="sheet sh-' + s.kind + '" role="dialog" aria-modal="true">' + h + '</div></div>';
  if (s.kind === 'rules' && s.focus) { var t = document.getElementById('r-' + s.focus); if (t) t.scrollIntoView({ block: 'start' }); }
}
function closeBtn(t) { return '<button class="btn block ghost" data-act="close">' + (t || 'Chiudi') + '</button>'; }
function routeStrip(r, owner, g) { // la tratta disegnata come fila di vagoni
  var k = D.COLORS[r.col], w = 30, out = '';
  for (var i = 0; i < r.len; i++) {
    var loco = r.ferry && i < r.ferry, pc = owner != null ? D.PCOL[g.players[owner].col] : null;
    out += '<svg class="rs-slot" viewBox="0 0 34 14" aria-hidden="true"><rect x="1" y="2" width="32" height="10" rx="2.4" fill="' + (pc ? pc.c : k.c) + '" stroke="' + (pc ? pc.d : k.d) + '" stroke-width="1.4"/>' +
      (loco ? '<g transform="translate(17 7) scale(.55)">' + ART.glyph('L', pc ? '#fff' : '#fff') + '</g>' : '') + '</svg>';
  }
  return '<div class="rs">' + out + '</div>';
}

function sheetBody(s) {
  var g = G(), me = myIdx(), P = g && me >= 0 ? g.players[me] : null;
  if (s.kind === 'rules') return '<h2>Come si gioca</h2>' + RU.toc() + RU.html() + closeBtn('Ho capito');
  if (s.kind === 'help') return RU.section(s.r) + '<button class="btn ghost small" data-act="rules">Tutte le regole</button>' + closeBtn('Ho capito');
  if (s.kind === 'menu' && App.doc) {
    var d = App.doc;
    return '<h2>Tavolo ' + esc(d.code) + '</h2><div style="display:grid;gap:8px">' +
      '<button class="btn ghost block" data-act="invite">Invita amici al tavolo</button><button class="btn ghost block" data-act="rules">Regole</button><button class="btn ghost block" data-act="intro">Rivedi la presentazione</button><button class="btn ghost block" data-act="log">Tutte le mosse della partita</button>' +
      '<label class="row tgl"><input type="checkbox" id="opt-can"' + (App.showCan !== false ? ' checked' : '') + '> Nel mio turno evidenzia le tratte che posso prendere</label>' +
      (d.host !== Net.uid ? '<button class="btn ghost block" data-act="takehost">Prendi il comando del tavolo (se l’host se n’è andato)</button>' : '') +
      (d.host === Net.uid && d.phase !== 'lobby' ? '<button class="btn ghost block" data-act="rematch">Chiudi la partita e torna alla sala d’attesa</button>' : '') +
      (d.host === Net.uid ? '<button class="btn ghost block" data-act="closetable">Chiudi il tavolo per tutti</button>' : '') +
      '<button class="btn ghost block" data-act="tohome">Vai alla home del gioco (resti seduto)</button><button class="btn ghost block" data-act="leave">Esci dal tavolo</button></div>' + closeBtn();
  }
  if (s.kind === 'closeconfirm' && App.doc) return '<h2>Chiudere il tavolo ' + esc(App.doc.code) + '?</h2><p class="lead">Il tavolo sparisce dalla lista' + (App.doc.game && App.doc.phase === 'play' ? ', la partita in corso finisce' : '') + ' e tutti tornano alla schermata iniziale. Non si può annullare.</p>' +
    '<button class="btn block red" data-act="closeyes">Chiudi per tutti</button>' + closeBtn('Annulla');
  if (s.kind === 'intro') return introBody(s);
  if (!g) return '';
  if (s.kind === 'log') return '<h2>Le mosse della partita</h2><div class="loglist">' + g.log.slice().reverse().map(function (l) { var c = l.p != null && g.players[l.p] ? D.PCOL[g.players[l.p].col].c : 'rgba(217,180,90,.5)'; return '<div class="fl" style="border-left-color:' + c + '">' + esc(l.t) + '</div>'; }).join('') + '</div>' + closeBtn();
  if (s.kind === 'route') return routeBody(g, me, s);
  if (s.kind === 'city') return cityBody(g, me, s.c);
  if (s.kind === 'player') return playerBody(g, s.p, me);
  if (s.kind === 'keep') return keepBody(g, me, s);
  if (s.kind === 'tkconfirm') return '<h2>' + IC('ticket') + ' Pescare 3 biglietti?</h2><p class="lead">Usi il turno per pescare 3 biglietti destinazione: ne tieni <b>almeno 1</b> e gli altri tornano in fondo al mazzo. Ogni biglietto tenuto vale punti se lo completi, li toglie se non ci riesci.</p>' +
    '<button class="btn block" data-act="tkyes">Pesca i biglietti</button>' + closeBtn('Annulla');
  if (s.kind === 'mytickets' && P) return myTicketsBody(g, me);
  if (s.kind === 'over' && g.phase === 'over') return overBody(g, me);
  return '';
}

/* ---------- tratta ---------- */
function routeBody(g, me, s) {
  var r = D.byId[s.r], own = g.claims[r.id], pts = D.SCORE[r.len], k = D.COLORS[r.col];
  var head = '<div class="kicker">Tratta</div><h2>' + esc(cn(r.a)) + ' – ' + esc(cn(r.b)) + '</h2>' + routeStrip(r, own, g) +
    '<div class="tags"><span class="gc">' + IC('train') + r.len + ' vagon' + (r.len > 1 ? 'i' : 'e') + '</span><span class="gc">' + IC('star') + '+' + pts + ' punt' + (pts > 1 ? 'i' : 'o') + '</span>' +
    '<span class="gc">' + (r.col === 'X' ? ART.swatch('X') + ' grigia: un colore a scelta' : ART.swatch(r.col) + ' carte ' + k.n) + '</span>' +
    (r.ferry ? '<span class="gc">' + IC('ferry') + ' traghetto: ' + r.ferry + ' locomotiv' + (r.ferry > 1 ? 'e' : 'a') + '</span>' : '') +
    (r.twin != null ? '<span class="gc">binario doppio</span>' : '') + '</div>';
  if (own != null) return head + '<p class="lead">Questa tratta è di ' + pname(g, own) + (own === me ? ' (tua)' : '') + '.</p>' + twinNote(g, r, me) + closeBtn();
  if (me < 0) return head + '<p class="lead">Libera.</p>' + closeBtn();
  var cc = E.canClaim(g, me, r), myTurn = g.phase === 'play' && g.turn === me && g.stage === 'act';
  var help = '<button class="btn ghost small" data-act="help" data-r="' + (r.ferry ? 'ferry' : r.twin != null ? 'double' : 'claim') + '">Come si conquista una tratta?</button>';
  if (!cc.ok) return head + '<div class="why">' + esc(cc.why) + '</div>' + needHint(g, me, r) + twinNote(g, r, me) + help + closeBtn();
  if (!myTurn) return head + '<p class="lead good">Hai le carte per prenderla. Potrai farlo quando sarà il tuo turno' + (g.stage === 'draw2' && g.turn === me ? ' (ora devi prendere la seconda carta)' : '') + '.</p>' + twinNote(g, r, me) + help + closeBtn();
  // scelta del pagamento
  var P = g.players[me], h = P.hand;
  var colors = cc.opts.map(function (o) { return o.n ? o.c : 'L'; }).filter(function (c, i, a) { return a.indexOf(c) === i; });
  if (h.L >= r.len && colors.indexOf('L') < 0) colors.push('L');
  if (s.c == null || colors.indexOf(s.c) < 0) { s.c = colors[0]; s.L = null; }
  var lmin = s.c === 'L' ? r.len : Math.max(r.ferry || 0, r.len - h[s.c]), lmax = s.c === 'L' ? r.len : Math.min(h.L, r.len - 1);
  if (s.L == null || s.L < lmin || s.L > lmax) s.L = lmin;
  var n = r.len - s.L;
  var pick = colors.length > 1 ? '<h4>Con quale colore paghi?</h4><div class="pay-c">' + colors.map(function (c) { return '<button class="chip' + (s.c === c ? ' on' : '') + '" data-act="claimc" data-c="' + c + '">' + ART.swatch(c) + (c === 'L' ? ' solo locomotive' : ' ' + D.COLORS[c].n + ' (' + h[c] + ')') + '</button>'; }).join('') + '</div>' : '';
  var lpick = s.c !== 'L' && lmax > lmin ? '<div class="pay-l"><span>Locomotive da usare</span><button class="zb s" data-act="claimL" data-d="-1"' + (s.L > lmin ? '' : ' disabled') + '>−</button><b>' + s.L + '</b><button class="zb s" data-act="claimL" data-d="1"' + (s.L < lmax ? '' : ' disabled') + '>+</button></div>' : '';
  var use = []; for (var i = 0; i < n; i++) use.push(ART.card(s.c)); for (var j = 0; j < s.L; j++) use.push(ART.card('L'));
  return head + pick + lpick + '<h4>Giocherai</h4><div class="use">' + use.map(function (c) { return '<span class="uc">' + c + '</span>'; }).join('') + '</div>' +
    '<p class="muted">Dopo ti resteranno ' + (P.trains - r.len) + ' vagoni' + (P.trains - r.len <= 2 ? ' — <b class="bad">e scatterà l’ultimo giro!</b>' : '') + '.</p>' +
    '<button class="btn block" data-act="claimok">Conquista ' + esc(cn(r.a)) + ' – ' + esc(cn(r.b)) + ' (+' + pts + ')</button>' + closeBtn('Annulla');
}
function twinNote(g, r, me) {
  if (r.twin == null) return '';
  var o = g.claims[r.twin];
  return '<p class="muted">Binario doppio: ' + (o != null ? 'l’altro binario è di ' + pname(g, o) + '. ' : '') + (g.nplayers <= 3 ? 'con 2 o 3 giocatori se ne usa uno solo.' : 'uno stesso giocatore non può prenderli entrambi.') + '</p>';
}
function needHint(g, me, r) {
  var P = g.players[me], h = P.hand;
  if (g.claims[r.id] != null || E.blocked(g, me, r)) return '';
  var best = r.col === 'X' ? D.CARD_COLORS.reduce(function (b, c) { return h[c] > h[b] ? c : b; }, 'R') : r.col;
  var have = h[best] + h.L, miss = Math.max(0, r.len - have), mf = Math.max(0, (r.ferry || 0) - h.L);
  return '<p class="muted">Hai ' + ART.swatch(best, h[best]) + ' e ' + ART.swatch('L', h.L) + '. ' + (mf ? 'Ti mancano ' + mf + ' locomotiv' + (mf > 1 ? 'e' : 'a') + ' per il traghetto. ' : '') + (miss ? 'Ti mancano ' + miss + ' carte.' : '') + '</p>';
}

/* ---------- città ---------- */
function cityBody(g, me, c) {
  var routes = E.ADJ[c].slice().sort(function (a, b) { return a.len - b.len; });
  var rows = routes.map(function (r) {
    var o = g.claims[r.id], other = r.a === c ? r.b : r.a;
    return '<button class="trow rt" data-act="route" data-r="' + r.id + '"><span class="grow"><b>' + esc(cn(other)) + '</b><small>' + r.len + ' vagoni · ' + (r.col === 'X' ? 'grigia' : D.COLORS[r.col].n) + (r.ferry ? ' · traghetto' : '') + (r.twin != null ? ' · doppia' : '') + '</small></span>' +
      (o != null ? '<span class="own" style="--pc:' + D.PCOL[g.players[o].col].c + '">' + esc(g.players[o].nick) + '</span>' : '<span class="free">libera</span>') + '</button>';
  }).join('');
  var mine = me >= 0 ? g.players[me].tickets.filter(function (id) { return D.tickets[id].a === c || D.tickets[id].b === c; }) : [];
  return '<div class="kicker">Stazione</div><h2>' + esc(cn(c)) + '</h2>' + (mine.length ? '<p class="lead">È su ' + mine.length + ' dei tuoi biglietti.</p>' : '') + '<h4>Tratte da qui</h4><div class="rlist">' + rows + '</div>' + closeBtn();
}

/* ---------- giocatore ---------- */
function playerBody(g, p, me) {
  var P = g.players[p], routes = E.myRoutes(g, p), lg = E.longest(g, p);
  var done = p === me || g.phase === 'over' ? P.tickets.filter(function (id) { var t = D.tickets[id]; return E.connected(g, p, t.a, t.b); }).length : null;
  return '<div class="phead">' + ART.pieceIcon(P.col, 64) + '<div><div class="kicker">' + (p === me ? 'Tu' : 'Giocatore') + ' · vagoni ' + D.PCOL[P.col].n.toLowerCase() + '</div><h2>' + Net.dot(P.uid) + esc(P.nick) + '</h2></div></div>' +
    '<div class="tags"><span class="gc">' + IC('star') + P.score + ' punti</span><span class="gc">' + IC('train') + P.trains + ' vagoni rimasti</span><span class="gc">' + IC('card') + E.handCount(P) + ' carte</span><span class="gc">' + IC('ticket') + P.tickets.length + ' biglietti' + (done != null ? ' (' + done + ' arrivati)' : '') + '</span>' +
    '<span class="gc">' + IC('route') + routes.length + ' tratte</span><span class="gc">' + IC('longest') + 'linea più lunga: ' + lg.len + '</span></div>' +
    (routes.length ? '<button class="btn ghost block" data-act="focusplayer" data-p="' + p + '">Mostra le sue tratte sulla mappa</button>' : '') +
    (App.doc.host === Net.uid && p !== me && g.phase === 'play' ? '<button class="btn ghost block" data-act="auto" data-p="' + p + '">' + (P.bot ? 'Ridai il controllo al giocatore' : 'Fallo giocare in automatico (se è assente)') + '</button>' : '') + closeBtn();
}

/* ---------- biglietti ---------- */
function keepBody(g, me, s) {
  var P = g.players[me]; if (!P || !P.offer.length) return '';
  var min = g.stage === 'setup' ? 2 : 1; s.sel = (s.sel || []).filter(function (id) { return P.offer.indexOf(id) >= 0; });
  var list = P.offer.map(function (id) {
    var t = D.tickets[id], on = s.sel.indexOf(id) >= 0, conn = E.connected(g, me, t.a, t.b), sp = BOT.shortest(g, me, t.a, t.b);
    var hint = conn ? '<span class="good">' + IC('check') + ' già collegate dalle tue tratte</span>' : sp ? 'Servono almeno <b>' + Math.round(sp.cost) + '</b> vagoni' : '<span class="bad">non più collegabili!</span>';
    return '<div class="kt' + (on ? ' on' : '') + '"><button class="kt-t" data-act="keeptoggle" data-id="' + id + '" aria-pressed="' + on + '">' + ART.ticket(t) + '<span class="kt-chk">' + IC('check') + '</span></button>' +
      '<div class="kt-i"><small>' + hint + '</small><button class="btn ghost small" data-act="keepmap" data-id="' + id + '">Vedi sulla mappa</button></div></div>';
  }).join('');
  return '<h2>' + IC('ticket') + (g.stage === 'setup' ? ' I tuoi biglietti di partenza' : ' Biglietti pescati') + '</h2><p class="lead">Tienine <b>almeno ' + min + '</b> (tocca per scegliere). A fine partita: <b>+punti</b> se colleghi le due città, <b>−punti</b> se non ci riesci. Quelli che lasci tornano in fondo al mazzo.</p>' +
    '<div class="ktl">' + list + '</div><button class="btn block" data-act="keepok"' + (s.sel.length >= min ? '' : ' disabled') + '>Tieni ' + s.sel.length + ' bigliett' + (s.sel.length === 1 ? 'o' : 'i') + '</button>' +
    '<button class="btn ghost small" data-act="help" data-r="tickets">Come funzionano i biglietti?</button>';
}
function myTicketsBody(g, me) {
  var P = g.players[me];
  var list = P.tickets.map(function (id) {
    var t = D.tickets[id], ok = E.connected(g, me, t.a, t.b), sp = ok ? null : BOT.shortest(g, me, t.a, t.b);
    return '<button class="mt" data-act="tkfocus" data-id="' + id + '">' + ART.ticket(t, { state: ok ? 'ok' : g.phase === 'over' ? 'ko' : null }) + '<small>' + (ok ? '<span class="good">' + IC('check') + ' Arrivato: +' + t.v + '</span>' : sp ? 'Mancano almeno ' + Math.round(sp.cost - 0) + ' vagoni · tocca per vedere il percorso' : '<span class="bad">Non più collegabile: −' + t.v + '</span>') + '</small></button>';
  }).join('');
  return '<h2>' + IC('ticket') + ' I tuoi biglietti</h2><p class="lead">Sono segreti: li vedi solo tu. Tocca un biglietto per vedere sulla mappa le due città e il percorso.</p><div class="mtl">' + (list || '<p class="muted">Nessun biglietto.</p>') + '</div>' + closeBtn();
}

/* ---------- presentazione ---------- */
function introBody(s) {
  var pages = [
    ['Benvenuto a Binari d’Italia', '<div class="intro-art">' + ART.card('R') + ART.card('L') + ART.card('G') + '</div>' + RU.S.goal[1]],
    ['Ogni turno: una sola azione', '<div class="intro3"><div>' + ART.cardBack() + '<b>Pesca 2 carte</b><small>dalle 5 scoperte o dal mazzo</small></div><div><svg viewBox="0 0 90 40" class="intro-r"><rect x="4" y="14" width="24" height="10" rx="2" fill="#c9352b" stroke="#7e1d17"/><rect x="33" y="14" width="24" height="10" rx="2" fill="#c9352b" stroke="#7e1d17"/><rect x="62" y="14" width="24" height="10" rx="2" fill="#c9352b" stroke="#7e1d17"/></svg><b>Conquista una tratta</b><small>con carte dello stesso colore</small></div><div>' + ART.ticketBack() + '<b>Pesca biglietti</b><small>3, tienine almeno 1</small></div></div>' +
      '<p>Quando un giocatore resta con <b>2 vagoni o meno</b> parte l’ultimo giro.</p>'],
    ['Come si usa lo schermo', '<ul class="intro-list"><li><b>In alto</b> i giocatori: punti ' + IC('star') + ', vagoni ' + IC('train') + ', carte ' + IC('card') + ', biglietti ' + IC('ticket') + '.</li><li><b>La mappa</b> si trascina e si ingrandisce con due dita. <b>Tocca una tratta</b> per vedere cosa serve e conquistarla; tocca una città per le sue tratte.</li>' +
      '<li><b>Le carte scoperte</b> e i mazzi stanno sotto la mappa: toccale per pescare.</li><li><b>La riga dorata</b> ti dice sempre cosa puoi fare; il ' + IC('help') + ' spiega la regola di quel momento.</li><li><b>In fondo</b> la tua mano: tocca un colore per vedere dove puoi usarlo. Le città dei tuoi biglietti sono cerchiate in rosso, e diventano verdi quando le colleghi.</li></ul>']
  ];
  var p = Math.max(0, Math.min(pages.length - 1, s.page || 0)), pg = pages[p];
  return '<div class="kicker">' + (p + 1) + ' di ' + pages.length + '</div><h2>' + pg[0] + '</h2>' + pg[1] +
    '<div class="row intro-nav">' + (p > 0 ? '<button class="btn ghost" data-act="introprev">Indietro</button>' : '') + (p < pages.length - 1 ? '<button class="btn" data-act="intronext">Avanti</button>' : '<button class="btn" data-act="introdone">Iniziamo!</button>') + '<button class="btn ghost small" data-act="introdone">Salta</button></div>';
}

/* ---------- fine partita ---------- */
function overBody(g, me) {
  var F = g.final, W = F.order[0];
  var rows = F.order.map(function (p, i) {
    var x = F.rows[p], P = g.players[p];
    var tk = x.tickets.map(function (t) { var T = D.tickets[t.id]; return '<span class="ftk ' + (t.ok ? 'ok' : 'ko') + '">' + esc(cn(T.a)) + '–' + esc(cn(T.b)) + ' <b>' + (t.ok ? '+' : '−') + T.v + '</b></span>'; }).join('');
    return '<div class="fr' + (i === 0 ? ' win' : '') + '" style="--pc:' + D.PCOL[P.col].c + ';animation-delay:' + (i * 0.25) + 's"><div class="fr-h"><span class="rk">' + (i + 1) + '</span>' + ART.pieceIcon(P.col, 30) + '<b>' + esc(P.nick) + (p === me ? ' (tu)' : '') + '</b><span class="tot">' + x.total + '</span></div>' +
      '<div class="fr-d"><span>' + IC('route') + 'Tratte <b>' + x.routePts + '</b></span><span>' + IC('ticket') + 'Biglietti <b>' + (x.tpts >= 0 ? '+' : '') + x.tpts + '</b> (' + x.done + '/' + x.tickets.length + ')</span><span>' + IC('longest') + 'Linea ' + x.longest + (x.bonus ? ' <b class="gold">+10</b>' : '') + '</span></div>' +
      '<div class="fr-t">' + tk + '</div><button class="btn ghost small" data-act="focusplayer" data-p="' + p + '">Vedi sulla mappa</button></div>';
  }).join('');
  return '<div class="over"><div class="crown">' + ART.pieceIcon(g.players[W].col, 90) + '</div><h2>' + (W === me ? 'Hai vinto!' : 'Vince ' + esc(g.players[W].nick)) + '</h2>' +
    '<p class="lead">' + F.rows[W].total + ' punti. La linea continua più lunga misura ' + F.maxL + ' vagoni: +10 a ' + F.order.filter(function (p) { return F.rows[p].bonus; }).map(function (p) { return esc(g.players[p].nick); }).join(' e ') + '.</p>' +
    '<div class="frs">' + rows + '</div>' +
    (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda la mappa') + '</div>';
}

/* ---------- eventi ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && s.kind !== 'intro' && Date.now() - (App.sheetAt || 0) > 450) { if (s.kind === 'keep') { App.keepSel = s.sel; } App.sheet = null; App.sel = null; if (s.kind === 'city') App.focus = null; renderSheet(); if (g) Game.render(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('bi-intro-done', '1'); App.sheet = s.after || null; renderSheet(); break;
    case 'showover': App.sheet = { kind: 'over' }; App.focus = null; renderSheet(); Game.render(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else { if (s && s.kind === 'keep') App.keepSel = s.sel; App.sheet = null; App.sel = null; if (s && s.kind === 'city') App.focus = null; } renderSheet(); if (g) Game.render(); break;
    case 'leave': App.sheet = null; leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; App.focus = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'player': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'focusplayer': { var fp = +el.getAttribute('data-p'); App.focus = { k: 'player', p: fp }; App.sheet = null; renderSheet(); Game.render(); var ids = E.myRoutes(g, fp).map(function (r) { return r.id; }); if (ids.length) Board.centerOnRoutes(ids); break; }
    case 'unfocus': App.focus = null; App.sel = null; Game.render(); break;
    case 'zin': Board.zoomAt(1.35); break;
    case 'zout': Board.zoomAt(1 / 1.35); break;
    case 'zfit': Board.fit(); break;
    // pescare
    case 'drawface': case 'drawdeck': {
      if (!g || me < 0) return;
      if (g.phase !== 'play' || g.turn !== me || (g.stage !== 'act' && g.stage !== 'draw2')) { toast(g.stage === 'setup' ? 'Prima scegli i biglietti di partenza.' : g.turn === me && g.stage === 'tickets' ? 'Prima scegli quali biglietti tenere.' : 'Potrai pescare quando sarà il tuo turno.'); return; }
      if (a === 'drawface') { var i = +el.getAttribute('data-i'); if (g.stage === 'draw2' && g.face[i] === 'L') { toast('Come seconda carta non puoi prendere una locomotiva scoperta: scegline un’altra o pesca dal mazzo.'); return; } act({ a: 'draw', i: i }); }
      else { if (!g.deck.length && !g.disc.length) { toast('Il mazzo è vuoto: prendi una carta scoperta.'); return; } act({ a: 'draw', i: 'deck' }); }
      break;
    }
    case 'drawtickets': {
      if (!g || me < 0) return;
      if (g.phase !== 'play' || g.turn !== me || g.stage !== 'act') { toast(g.turn === me && g.stage === 'draw2' ? 'Prima prendi la seconda carta.' : 'Potrai pescare biglietti quando sarà il tuo turno.'); return; }
      if (!g.tdeck.length) { toast('Il mazzo dei biglietti è finito.'); return; }
      App.sheet = { kind: 'tkconfirm' }; renderSheet(); break;
    }
    case 'tkyes': App.sheet = null; renderSheet(); act({ a: 'tickets' }); break;
    case 'openkeep': { var P = g.players[me]; App.sheet = { kind: 'keep', sel: App.keepSel || P.offer.slice() }; App.focus = null; renderSheet(); Game.render(); break; }
    case 'keeptoggle': { var id = +el.getAttribute('data-id'), k = s.sel.indexOf(id); if (k >= 0) s.sel.splice(k, 1); else s.sel.push(id); renderSheet(); break; }
    case 'keepmap': { var id2 = +el.getAttribute('data-id'); App.keepSel = s.sel; App.sheet = null; renderSheet(); App.focus = { k: 'ticket', id: id2 }; Game.render(); Board.centerOnRoutes([D.tickets[id2].a, D.tickets[id2].b]); break; }
    case 'keepok': { var sel = s.sel.slice(); App.keepSel = null; App.sheet = null; renderSheet(); act({ a: 'keep', ids: sel }); break; }
    case 'mytickets': App.sheet = { kind: 'mytickets' }; renderSheet(); break;
    case 'tkfocus': { var id3 = +el.getAttribute('data-id'); App.sheet = null; renderSheet(); App.focus = { k: 'ticket', id: id3 }; Game.render(); Board.centerOnRoutes([D.tickets[id3].a, D.tickets[id3].b]); break; }
    case 'focuscolor': { var c = el.getAttribute('data-c'); App.focus = App.focus && App.focus.k === 'color' && App.focus.c === c ? null : { k: 'color', c: c }; Game.render(); break; }
    // tratte
    case 'route': { var rid = +el.getAttribute('data-r'); App.sel = rid; App.sheet = { kind: 'route', r: rid, seq: g.seq }; renderSheet(); Game.render(); Board.centerOnRoutes([rid], true, { maxK: 1.4, up: .45 }); break; }
    case 'claimc': s.c = el.getAttribute('data-c'); s.L = null; renderSheet(); break;
    case 'claimL': s.L += +el.getAttribute('data-d'); renderSheet(); break;
    case 'claimok': { var r = s.r, cc = s.c, L = s.L; App.sheet = null; App.sel = null; renderSheet(); act({ a: 'claim', r: r, c: cc, L: cc === 'L' ? D.byId[r].len : L }); break; }
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
  if (ev.target.id === 'opt-can') { App.showCan = ev.target.checked; lsSet('bi-can', App.showCan ? '1' : '0'); if (G()) Game.render(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape' && App.sheet && App.sheet.kind !== 'intro') { App.sheet = null; App.sel = null; renderSheet(); if (G()) Game.render(); }
});

/* ---------- avvio ---------- */
(function boot() {
  App.showCan = lsGet('bi-can') !== '0';
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if (t === last || myNick()) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
