    return { ok: false, why: 'Carta non giocabile.' };
  }
  // carte verdi in gioco: si usano nei turni successivi a quello in cui sono state messe
  function greenInfo(s, p, id) {
    var P = s.players[p];
    if (!myTurnFree(s, p)) return { ok: false, why: 'Le carte verdi si usano nel tuo turno.' };
    if (P.eq.indexOf(id) < 0 || kind(id) !== 'g') return { ok: false, why: 'Non è una tua carta verde in gioco.' };
    var t = ty(id);
    if (GREEN_MISS.indexOf(t) >= 0) return { ok: false, why: 'La userai quando ti sparano.' };
    if (!greenReady(s, id)) return { ok: false, why: 'L’hai messa in gioco in questo turno: potrai usarla dal prossimo.' };
    if (!eqOn(s, p)) return { ok: false, why: 'Lazo: le carte in gioco non hanno effetto.' };
    var others = othersAlive(s, p);
    switch (t) {
      case 'pugnale': case 'derringer': { var d = others.filter(function (i) { return distance(s, p, i) <= 1; }); return d.length ? { ok: true, targets: d } : { ok: false, why: 'Nessuno è a distanza 1.' }; }
      case 'pepperbox': { var pr = others.filter(function (i) { return distance(s, p, i) <= rangeOf(s, p); }); return pr.length ? { ok: true, targets: pr } : { ok: false, why: 'Nessuno a portata della tua arma.' }; }
      case 'fucile': return { ok: true, targets: others };
      case 'borraccia': return P.ghost || P.hp >= P.max ? { ok: false, why: 'Hai già tutti i punti vita.' } : { ok: true };
      case 'cancan': case 'conestoga': { var cc = others.filter(function (i) { return hasCards(s, i); }); return cc.length ? { ok: true, targets: cc, pick: true } : { ok: false, why: 'Nessuno ha carte.' }; }
      case 'ponyexpress': case 'howitzer': return { ok: true };
    }
    return { ok: false, why: 'Carta non utilizzabile.' };
  }

  function aggro(s, p, tg) { if (tg == null || tg === p) return; if (s.players[tg].role === 'sceriffo') s.aggro[p] += 2; else if (s.aggro[tg] > 0) s.aggro[p] -= 1; }
  // Apache Kid: le carte di Quadri giocate dagli altri non hanno effetto su di lui (fuori dai duelli)
  function apacheStops(s, p, tg, id) { return tg != null && tg !== p && has(s, tg, 'apache') && suit(s, id) === 'D'; }
  function attack(s, p, tg, kindName, need, label) {
    var Tg = s.players[tg];
    s.flash = { kind: 'bang', p: p, t: tg, n: s.logN };
    s.stack.push({ type: 'react', kind: kindName, from: p, who: tg, need: need || 1, got: 0, barrels: barrels(s, tg), label: label });
  }
  function stealOrDiscard(s, p, tg, pick, steal, label) {
    var Q = s.players[tg], take = null, fromHand = false;
    if (pick != null && Q.eq.indexOf(pick) >= 0) { take = pick; removeFrom(Q.eq, take); }
    else if (Q.hand.length) { take = Q.hand[Math.floor(Math.random() * Q.hand.length)]; removeFrom(Q.hand, take); fromHand = true; }
    else if (Q.eq.length) { take = Q.eq[0]; removeFrom(Q.eq, take); }
    if (take == null) return;
    if (s.green && s.green[take] != null) { if (steal) s.green[take] = s.turnN; else delete s.green[take]; }
    if (steal) { s.players[p].hand.push(take); if (s.green) delete s.green[take]; log(s, nm(s, p) + ' (' + label + ') ruba a ' + nm(s, tg) + (fromHand ? ' una carta dalla mano.' : ' ' + cardName(take) + '.'), 'play'); }
    else { s.disc.push(take); log(s, nm(s, p) + ' (' + label + ') fa scartare a ' + nm(s, tg) + ' ' + (fromHand ? 'una carta dalla mano' : cardName(take)) + '.', 'play'); }
  }
  function multiFrom(s, p, kindName, id) {
    var qq = [], r = nextAlive(s, p); while (r !== p) { qq.push(r); r = nextAlive(s, r); }
    s.stack.push({ type: 'multi', kind: kindName, from: p, queue: qq, diamond: suit(s, id) === 'D' });
  }

  function play(s, p, a) {
    var id = a.card, info = playInfo(s, p, id);
    if (!info.ok) return info.why;
    if (info.targets && info.targets.indexOf(a.target) < 0) return 'Bersaglio non valido.';
    var P = s.players[p], t = ty(id), tg = a.target, K = T[t];
    if (info.extra) {
      if (a.extra == null || a.extra === id || P.hand.indexOf(a.extra) < 0) return 'Scegli anche la carta da scartare insieme.';
    }
    if (tg != null && ['sparo','schivata','sfida','gattabuia','borseggio','sabotaggio','pugno','springfield','ragtime'].indexOf(t) >= 0) aggro(s, p, tg);
    if (info.as === 'sparo') {
      discardFromHand(s, p, id); s.bangs++;
      log(s, nm(s, p) + ' spara a ' + nm(s, tg) + (t === 'schivata' ? ' (con una Schivata!)' : '') + '.', 'bang');
      if (apacheStops(s, p, tg, id)) { log(s, 'La carta è di Quadri: ' + nm(s, tg) + ' non viene toccato.', 'miss'); return null; }
      attack(s, p, tg, 'sparo', has(s, p, 'abner') ? 2 : 1);
      return null;
    }
    if (K.kind === 'e' || K.kind === 'g') {
      removeFrom(P.hand, id);
      if (t === 'gattabuia') { s.players[tg].eq.push(id); log(s, nm(s, p) + ' mette in Prigione ' + nm(s, tg) + '.', 'play'); return null; }
      if (WEAPONS.indexOf(t) >= 0) { var w = weapon(P); if (w != null) discardEq(s, p, w); }
      P.eq.push(id);
      if (K.kind === 'g') s.green[id] = s.turnN;
      log(s, nm(s, p) + ' mette in gioco ' + K.n + (K.kind === 'g' ? ' (potrà usarla dal prossimo turno)' : '') + '.', 'play');
      return null;
    }
    if (info.extra) { discardFromHand(s, p, a.extra); }
    discardFromHand(s, p, id);
    s.flash = { kind: 'card', card: id, p: p, n: s.logN + 1 };
    var stop = apacheStops(s, p, tg, id);
    switch (t) {
      case 'whisky': { var hb = heal(s, p, has(s, p, 'tequilajoe') ? 2 : 1); log(s, nm(s, p) + ' beve una Birra: +' + hb + ' punti vita.', 'heal'); break; }
      case 'liquore': { var hl = heal(s, p, 2); log(s, nm(s, p) + ' beve un Whisky: +' + hl + ' punti vita.', 'heal'); break; }
      case 'tequila': if (stop) { log(s, nm(s, tg) + ' rifiuta la Tequila di Quadri.', 'miss'); break; } heal(s, tg, 1); log(s, nm(s, p) + ' offre una Tequila a ' + (tg === p ? 'se stesso' : nm(s, tg)) + ': +1 punto vita.', 'heal'); break;
      case 'giro': s.players.forEach(function (Q, i) { if (Q.alive && !Q.ghost) heal(s, i, 1); }); log(s, nm(s, p) + ' offre un giro al Saloon: tutti recuperano 1 punto vita.', 'heal'); break;
      case 'posta': give(s, p, 2); log(s, nm(s, p) + ' riceve la Diligenza: pesca 2 carte.', 'play'); break;
      case 'cassaforte': give(s, p, 3); log(s, nm(s, p) + ' svaligia la Wells Fargo: pesca 3 carte.', 'play'); break;
      case 'bottega': {
        var al = aliveIdx(s), cards = [];
        for (var i = 0; i < al.length; i++) { var c = drawCard(s); if (c != null) cards.push(c); }
        var order = []; var q = p; for (var j = 0; j < al.length; j++) { order.push(q); q = nextAlive(s, q); }
        log(s, nm(s, p) + ' apre l’Emporio: ' + cards.length + ' carte sul banco.', 'play');
        s.stack.push({ type: 'store', who: p, cards: cards, order: order, i: 0 });
        break;
      }
      case 'borseggio': case 'sabotaggio': case 'ragtime':
        if (stop) { log(s, nm(s, tg) + ' non viene toccato: la carta è di Quadri.', 'miss'); break; }
        stealOrDiscard(s, p, tg, a.pick, t !== 'sabotaggio', K.n); break;
      case 'rissa': {
        log(s, nm(s, p) + ' scatena una Rissa!', 'bang');
        info.rissa.forEach(function (i2) {
          if (apacheStops(s, p, i2, id)) { log(s, nm(s, i2) + ' resta fuori dalla Rissa (carta di Quadri).', 'miss'); return; }
          var pk = a.picks && a.picks[i2] != null ? a.picks[i2] : null;
          stealOrDiscard(s, p, i2, pk, false, 'Rissa');
        });
        break;
      }
      case 'sfida': log(s, nm(s, p) + ' sfida a Duello ' + nm(s, tg) + '.', 'bang'); s.stack.push({ type: 'duel', a: p, b: tg, who: tg }); break;
      case 'stampede': case 'mitraglia':
        log(s, t === 'stampede' ? nm(s, p) + ' scatena gli Indiani!' : nm(s, p) + ' apre il fuoco con la Catling!', 'bang');
        multiFrom(s, p, t, id); break;
      case 'pugno': case 'springfield':
        log(s, nm(s, p) + (t === 'pugno' ? ' tira un Pugno a ' : ' imbraccia lo Springfield contro ') + nm(s, tg) + '.', 'bang');
        if (stop) { log(s, 'La carta è di Quadri: ' + nm(s, tg) + ' non viene toccato.', 'miss'); break; }
        attack(s, p, tg, 'colpo', 1); break;
    }
    return null;
  }

  function useGreen(s, p, a) {
    var id = a.card, info = greenInfo(s, p, id);
    if (!info.ok) return info.why;
    if (info.targets && info.targets.indexOf(a.target) < 0) return 'Bersaglio non valido.';
    var t = ty(id), tg = a.target, K = T[t];
    discardEq(s, p, id);
    aggro(s, p, tg);
    s.flash = { kind: 'card', card: id, p: p, n: s.logN + 1 };
    var stop = apacheStops(s, p, tg, id);
    switch (t) {
      case 'pugnale': case 'derringer': case 'pepperbox': case 'fucile':
        log(s, nm(s, p) + ' usa ' + K.n + ' contro ' + nm(s, tg) + '.', 'bang');
        if (t === 'derringer') give(s, p, 1);
        if (stop) { log(s, 'La carta è di Quadri: ' + nm(s, tg) + ' non viene toccato.', 'miss'); break; }
        attack(s, p, tg, 'colpo', 1); break;
      case 'borraccia': heal(s, p, 1); log(s, nm(s, p) + ' beve dalla Borraccia: +1 punto vita.', 'heal'); break;
      case 'ponyexpress': give(s, p, 3); log(s, nm(s, p) + ' riceve il Pony Express: pesca 3 carte.', 'play'); break;
      case 'howitzer': log(s, nm(s, p) + ' fa fuoco con l’Obice!', 'bang'); multiFrom(s, p, 'mitraglia', id); break;
      case 'cancan': case 'conestoga':
        if (stop) { log(s, nm(s, tg) + ' non viene toccato: la carta è di Quadri.', 'miss'); break; }
        stealOrDiscard(s, p, tg, a.pick, t === 'conestoga', K.n); break;
    }
    return null;
  }

  // abilità attive dei personaggi di Dodge City
  function abilityInfo(s, p, k) {
    var P = s.players[p];
    if (!myTurnFree(s, p)) return { ok: false, why: 'Si usa nel tuo turno.' };
    if (k === 'chuck') { if (!has(s, p, 'chuck')) return { ok: false, why: 'Abilità non disponibile.' }; return P.hp > 1 ? { ok: true } : { ok: false, why: 'Non puoi perdere l’ultimo punto vita.' }; }
    if (k === 'docholy') {
      if (!has(s, p, 'docholy')) return { ok: false, why: 'Abilità non disponibile.' };
      if (s.used.docholy) return { ok: false, why: 'Già usata in questo turno.' };
      if (P.hand.length < 2) return { ok: false, why: 'Servono 2 carte da scartare.' };
      var tg = othersAlive(s, p).filter(function (i) { return distance(s, p, i) <= rangeOf(s, p); });
      return tg.length ? { ok: true, targets: tg } : { ok: false, why: 'Nessuno a portata.' };
    }
    if (k === 'jose') {
      if (!has(s, p, 'jose')) return { ok: false, why: 'Abilità non disponibile.' };
      if ((s.used.jose || 0) >= 2) return { ok: false, why: 'Già usata due volte in questo turno.' };
      return P.hand.some(function (c) { return kind(c) === 'e'; }) ? { ok: true } : { ok: false, why: 'Non hai carte blu in mano.' };
    }
    return { ok: false, why: 'Abilità sconosciuta.' };
  }
  function ability(s, p, a) {
    var info = abilityInfo(s, p, a.k), P = s.players[p];
    if (!info.ok) return info.why;
    if (a.k === 'chuck') { log(s, nm(s, p) + ' si sacrifica: perde 1 punto vita e pesca 2 carte.', 'ab'); P.hp--; s.flash = { kind: 'hit', p: p, n: s.logN }; give(s, p, 2); return null; }
    if (a.k === 'jose') {
      if (P.hand.indexOf(a.card) < 0 || kind(a.card) !== 'e') return 'Scegli una carta blu dalla mano.';
      discardFromHand(s, p, a.card); give(s, p, 2); s.used.jose = (s.used.jose || 0) + 1;
      log(s, nm(s, p) + ' scarta ' + cardName(a.card) + ' e pesca 2 carte.', 'ab'); return null;
    }
    if (a.k === 'docholy') {
      var cs = a.cards || [];
      if (cs.length !== 2 || cs[0] === cs[1] || P.hand.indexOf(cs[0]) < 0 || P.hand.indexOf(cs[1]) < 0) return 'Scegli 2 carte da scartare.';
      if (info.targets.indexOf(a.target) < 0) return 'Bersaglio non valido.';
      discardFromHand(s, p, cs[0]); discardFromHand(s, p, cs[1]); s.used.docholy = true; aggro(s, p, a.target);
      log(s, nm(s, p) + ' scarta 2 carte e spara a ' + nm(s, a.target) + '.', 'bang');
      if (has(s, a.target, 'apache') && suit(s, cs[0]) === 'D' && suit(s, cs[1]) === 'D') { log(s, 'Tutte di Quadri: ' + nm(s, a.target) + ' non viene toccato.', 'miss'); return null; }
      attack(s, p, a.target, 'colpo', 1); return null;
    }
    return 'Abilità sconosciuta.';
  }
  // Cecchino: due Bang! insieme, servono due Schivata!
  function sniperInfo(s, p) {
    if (!evIs(s, 'cecchino')) return { ok: false, why: 'Serve l’evento Cecchino.' };
    if (!myTurnFree(s, p)) return { ok: false, why: 'Non è il momento.' };
    if (!canPlayBang(s, p)) return { ok: false, why: 'Hai già sparato in questo turno.' };
    var bangs = s.players[p].hand.filter(function (c) { return isBangLike(s, p, c); });
    if (bangs.length < 2) return { ok: false, why: 'Servono 2 Bang!.' };
    var tg = othersAlive(s, p).filter(function (i) { return distance(s, p, i) <= rangeOf(s, p); });
    return tg.length ? { ok: true, targets: tg, bangs: bangs } : { ok: false, why: 'Nessuno a portata.' };
  }
  function sniper(s, p, a) {
    var info = sniperInfo(s, p); if (!info.ok) return info.why;
    var cs = a.cards || [];
    if (cs.length !== 2 || cs[0] === cs[1] || info.bangs.indexOf(cs[0]) < 0 || info.bangs.indexOf(cs[1]) < 0) return 'Scegli 2 Bang!.';
    if (info.targets.indexOf(a.target) < 0) return 'Bersaglio non valido.';
    discardFromHand(s, p, cs[0]); discardFromHand(s, p, cs[1]); s.bangs++; aggro(s, p, a.target);
    log(s, nm(s, p) + ' prende la mira da cecchino contro ' + nm(s, a.target) + ': servono 2 Schivata!.', 'bang');
    attack(s, p, a.target, 'sparo', 2); return null;
  }
  // Rimbalzo: Bang! contro una carta in gioco
  function ricochetInfo(s, p) {
    if (!evIs(s, 'rimbalzo')) return { ok: false, why: 'Serve l’evento Rimbalzo.' };
    if (!myTurnFree(s, p)) return { ok: false, why: 'Non è il momento.' };
    var bangs = s.players[p].hand.filter(function (c) { return isBangLike(s, p, c); });
    if (!bangs.length) return { ok: false, why: 'Serve un Bang!.' };
    var tg = othersAlive(s, p).filter(function (i) { return s.players[i].eq.length; });
    return tg.length ? { ok: true, targets: tg, bangs: bangs } : { ok: false, why: 'Nessuno ha carte in gioco.' };
  }
  function ricochet(s, p, a) {
    var info = ricochetInfo(s, p); if (!info.ok) return info.why;
    if (info.bangs.indexOf(a.card) < 0) return 'Serve un Bang!.';
    if (info.targets.indexOf(a.target) < 0 || s.players[a.target].eq.indexOf(a.pick) < 0) return 'Scegli una carta in gioco.';
    discardFromHand(s, p, a.card);
    log(s, nm(s, p) + ' spara di rimbalzo a ' + cardName(a.pick) + ' di ' + nm(s, a.target) + '.', 'bang');
    s.flash = { kind: 'bang', p: p, t: a.target, n: s.logN };
    s.stack.push({ type: 'react', kind: 'rimbalzo', from: p, who: a.target, need: 1, got: 0, barrels: 0, target: a.pick });
    return null;
  }

  /* ---------- risposte ---------- */
  function respond(s, p, a) {
    var f = s.stack[s.stack.length - 1];
    if (!f || f.who !== p) return 'Non tocca a te rispondere.';
    var P = s.players[p];
    if (f.type === 'react') {
      if (a.r === 'take') { resolveTake(s, f); return null; }
      if (a.r === 'barrel') {
        if (f.kind === 'stampede' || f.kind === 'rimbalzo') return 'Il Barile qui non serve.';
        if (f.barrels <= 0) return 'Nessun Barile disponibile.';
        f.barrels--;
        var C = check(s, p, function (su) { return su === 'H'; }, 'il Barile');
        if (C && C.s === 'H') { f.got++; log(s, nm(s, p) + ' si ripara dietro al Barile: colpo deviato.', 'miss'); }
        if (f.got >= f.need) s.stack.pop();
        return null;
      }
      if (a.r === 'green') {
        if (f.kind === 'stampede' || greenMiss(s, p).indexOf(a.card) < 0) return 'Carta non valida.';
        discardEq(s, p, a.card); f.got++;
        log(s, nm(s, p) + ' usa ' + cardName(a.card) + ' per schivare.', 'miss');
        if (ty(a.card) === 'bibbia') give(s, p, 1);
        if (f.got >= f.need) s.stack.pop();
        return null;
      }
      if (a.r === 'card') {
        var ok = f.kind === 'stampede' ? isBangLike(s, p, a.card) : isMissLike(s, p, a.card);
        if (P.hand.indexOf(a.card) < 0 || !ok) return 'Carta non valida.';
        discardFromHand(s, p, a.card);
        molly(s, p);
        if (f.kind === 'stampede') { log(s, nm(s, p) + ' risponde agli Indiani con un Bang!.', 'miss'); s.stack.pop(); return null; }
        f.got++; log(s, nm(s, p) + ' gioca ' + cardName(a.card) + ' per schivare.', 'miss');
        if (ty(a.card) === 'tuffo') give(s, p, 1);
        if (f.got >= f.need) s.stack.pop();
        return null;
      }
    }
    if (f.type === 'roulette') {
      if (a.r === 'take') { s.stack.pop(); log(s, nm(s, p) + ' non schiva: la roulette spara.', 'hit'); damage(s, p, 2, null); return null; }
      var okc = a.r === 'card' ? P.hand.indexOf(a.card) >= 0 && isMissLike(s, p, a.card) : a.r === 'green' ? greenMiss(s, p).indexOf(a.card) >= 0 : false;
      if (!okc) return 'Carta non valida.';
      if (a.r === 'card') { discardFromHand(s, p, a.card); molly(s, p); if (ty(a.card) === 'tuffo') give(s, p, 1); } else { discardEq(s, p, a.card); if (ty(a.card) === 'bibbia') give(s, p, 1); }
      log(s, nm(s, p) + ' scarta ' + cardName(a.card) + ': il tamburo gira.', 'miss');
      f.i = (f.i + 1) % f.order.length; f.who = f.order[f.i];
      return null;
    }
    if (f.type === 'duel') {
      if (a.r === 'take') { resolveTake(s, f); return null; }
      if (a.r === 'card') {
        if (P.hand.indexOf(a.card) < 0 || !isBangLike(s, p, a.card)) return 'Carta non valida.';
        discardFromHand(s, p, a.card); molly(s, p);
        log(s, nm(s, p) + ' risponde al Duello con ' + cardName(a.card) + '.', 'bang');
        f.who = f.who === f.a ? f.b : f.a;
        return null;
      }
    }
    if (f.type === 'dying') {
      if (a.r === 'die') { s.stack.pop(); die(s, p, f.killer); return null; }
      if (a.r === 'card') {
        if (P.hand.indexOf(a.card) < 0 || !canBeer(s, p, a.card)) return 'Carta non valida.';
        discardFromHand(s, p, a.card); heal(s, p, has(s, p, 'tequilajoe') ? 2 : 1); log(s, nm(s, p) + ' si salva con una Birra!', 'heal');
        molly(s, p);
        return null;
      }
      if (a.r === 'doc') return docHeal(s, p, a.cards);
    }
    if (f.type === 'store' && a.r === 'pick') {
      if (f.cards.indexOf(a.card) < 0) return 'Carta non disponibile.';
      removeFrom(f.cards, a.card); P.hand.push(a.card); f.i++;
      log(s, nm(s, p) + ' sceglie ' + cardName(a.card) + ' dall’Emporio.', 'sys');
      return null;
    }
    if (f.type === 'kit' && a.r === 'keep') {
      var k = a.cards || [], need = f.keep || 2;
      if (k.length !== need || k.some(function (c, i) { return f.cards.indexOf(c) < 0 || k.indexOf(c) !== i; })) return 'Scegli ' + need + ' carte.';
      var back = f.cards.filter(function (c) { return k.indexOf(c) < 0; });
      k.forEach(function (c) { P.hand.push(c); }); back.forEach(function (c) { s.deck.push(c); }); s.stack.pop();
      log(s, nm(s, p) + ' tiene ' + need + ' carte e rimette l’altra sul mazzo.', 'ab');
      afterDraw(s, p, k);
      return null;
    }
    if (f.type === 'discard' && a.r === 'discard') {
      var cs = a.cards || [];
      if (cs.length !== f.n) return 'Devi scartare ' + f.n + (f.n > 1 ? ' carte.' : ' carta.');
      for (var i = 0; i < cs.length; i++) if (P.hand.indexOf(cs[i]) < 0 || cs.indexOf(cs[i]) !== i) return 'Carta non valida.';
      cs.forEach(function (c) { removeFrom(P.hand, c); if (evIs(s, 'miniera')) s.deck.push(c); else s.disc.push(c); });
      log(s, nm(s, p) + ' scarta ' + cs.length + (cs.length > 1 ? ' carte' : ' carta') + (evIs(s, 'miniera') ? ' in cima al mazzo.' : ' a fine turno.'), 'sys');
      return null;
    }
    if (f.type === 'vera' && a.r === 'vera') {
      if (f.opts.indexOf(a.char) < 0) return 'Personaggio non valido.';
      P.copy = a.char; s.stack.pop();
      log(s, nm(s, p) + ' copia l’abilità di ' + D.CHAR[a.char].n + ' fino al suo prossimo turno.', 'ab');
      return null;
    }
    if (f.type === 'blood') {
      if (a.r === 'skip') { s.stack.pop(); return null; }
      if (a.r === 'blood') {

/* ===== Serie di partite e risultati (condivisi da tutti i giochi) =====
   Serie: con «Nuova partita con lo stesso tavolo» le vittorie si sommano; l'host può scegliere «al meglio di 3 / di 5».
   La tiene l'host nello stato del tavolo (doc.series), aggiornata quando una partita finisce.
   Risultati: a fine partita chi ha l'account registra il proprio sul server (statistiche e classifica tra amici).

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  }

      '<select id="opt-series" class="field"' + (isHost ? '' : ' disabled') + ' style="font-size:16px;min-height:44px">' +
      [[0, 'Partite singole (conto le vittorie)'], [3, 'Al meglio di 3'], [5, 'Al meglio di 5']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === t ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label>' + standings(doc);
  }
  function endHTML(doc) { css(); return standings(doc); }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'opt-series' && window.Net) Net.send({ t: 'series', target: +e.target.value }).catch(function (er) { console.warn(er); });
  });

function connInfo(txt) { return Net.connected ? txt : '<span style="color:#f08070">Riconnessione…</span> ' + txt; }
function hostBanner() {

var WIN_TXT = { legge: 'Vince la legge', banditi: 'Vincono i Fuorilegge', traditore: 'Vince il Rinnegato' };
var REACT_TXT = { sparo: 'Bang!', mitraglia: 'Catling', colpo: 'colpo', rimbalzo: 'Rimbalzo', pugnocarte: 'Bang!' };
function statusText(g, me) {
  if (g.phase === 'over') return { big: WIN_TXT[g.winner], small: 'Partita finita.' };
  var top = g.stack[g.stack.length - 1], T = g.players[g.turn], n = function (i) { return i === me ? 'tu' : esc(g.players[i].nick); };
  var big = (g.turn === me ? 'Il tuo turno' : 'Turno di ' + esc(T.nick)), small = '';
  if (!top) small = g.step === 'draw' ? (g.turn === me ? 'Pesca le tue carte.' : 'Sta pescando.') : (g.turn === me ? 'Gioca le tue carte, poi passa il turno.' : 'Sta giocando le sue carte.');
  else if (top.type === 'react') small = top.kind === 'stampede' ? 'Indiani: ' + n(top.who) + ' deve scartare un Bang!.' : top.kind === 'rimbalzo' ? 'Rimbalzo: ' + n(top.who) + ' può salvare la sua carta.' : (top.kind === 'mitraglia' ? 'Catling: ' : 'Colpo: ') + n(top.who) + ' deve schivare' + (top.need - top.got > 1 ? ' (servono ' + (top.need - top.got) + ' Schivata!)' : '') + '.';
  else if (top.type === 'duel') small = 'Duello: tocca a ' + n(top.who) + ' rispondere con un Bang!.';
  else if (top.type === 'dying') small = n(top.who) + ' è a terra: può salvarsi?';
  else if (top.type === 'store') small = 'Emporio: sceglie ' + n(top.who) + '.';
  else if (top.type === 'kit') small = n(top.who) + ' sceglie quali carte tenere.';
  else if (top.type === 'discard') small = n(top.who) + ' scarta le carte in eccesso.';
  else if (top.type === 'roulette') small = 'Roulette russa: tocca a ' + n(top.who) + '.';
  else if (top.type === 'dalton') small = 'I Dalton: ' + n(top.who) + ' scarta una carta blu.';
  else if (top.type === 'vera') small = n(top.who) + ' sceglie chi copiare.';
  else if (top.type === 'blood') small = n(top.who) + ' può donare un punto vita.';
  else if (top.type === 'peyote') small = n(top.who) + ' indovina i colori (' + top.got + ' prese).';
  else if (top.type === 'ranch') small = n(top.who) + ' può cambiare carte al Ranch.';
  return { big: big, small: small };
}

// suggerimento chiaro su cosa si può fare adesso
function nowHint(g, me) {
  var P = g.players[me], names = function (l) { l = l.map(function (i) { return '<b>' + esc(g.players[i].nick) + '</b>'; }); return l.length > 1 ? l.slice(0, -1).join(', ') + ' o ' + l[l.length - 1] : l[0]; };
  var must = E.mustPlay(g, me);
  if (must != null) return 'Legge del West: prima di passare devi giocare <b>' + D.TYPES[E.ty(must)].n + '</b>.';
  var bang = P.hand.filter(function (c) { return E.isBangLike(g, me, c); })[0], h = 'Hai pescato. ';
  if (bang != null) {
    var info = E.playInfo(g, me, bang);
    if (info.ok) { var w = E.weapon(P); h += 'Puoi sparare a ' + names(info.targets) + (info.targets.length > 1 ? ': sono a tiro' : ': è a tiro') + ' della tua ' + (w == null ? 'Pistola' : D.TYPES[E.ty(w)].n) + '.'; }
    else h += info.why;
  } else h += 'Tocca una carta per leggerla e giocarla, poi passa il turno.';
  return h;
}
function abilityButtons(g, me) {
  var b = '', P = g.players[me];
  if (E.abilityInfo(g, me, 'chuck').ok) b += '<button class="btn ghost" data-act="chuck">−1 vita, +2 carte</button>';
  if (E.abilityInfo(g, me, 'jose').ok) b += '<button class="btn ghost" data-act="jose">Scarta una blu: +2 carte</button>';
  if (E.abilityInfo(g, me, 'docholy').ok) b += '<button class="btn ghost" data-act="docholy">Scarta 2: spara</button>';
  if (E.sniperInfo(g, me).ok) b += '<button class="btn ghost" data-act="sniper">Cecchino (2 Bang!)</button>';
  if (E.ricochetInfo(g, me).ok) b += '<button class="btn ghost" data-act="ricochet">Rimbalzo</button>';
  return b;
}
function dockHTML(g, me) {
  var hint = '', actions = '', hand = '', lbl = 'adesso';
  var P = me >= 0 ? g.players[me] : null;
  var top = g.stack[g.stack.length - 1];
  if (!P) hint = 'Stai guardando la partita.';
  else {
    var pickable = App.mode === 'pick', canPlayNow = g.phase === 'play' && g.turn === me && !top && g.step === 'play' && App.mode === 'idle';
    hand = P.hand.length ? P.hand.map(function (c) {
      var x = '';
      if (pickable) x = App.picks.indexOf(c) >= 0 ? 'pick' : App.pickFilter && !App.pickFilter(c) ? 'nopick' : '';
      else if (App.sel && App.sel.card === c) x = 'sel';
      else if (canPlayNow && E.playInfo(g, me, c).ok) x = 'can';
      return cardHTML(c, x);
    }).join('') : '<span class="emptyhand">' + (P.alive ? 'Nessuna carta in mano.' : 'Sei fuori dalla partita. Puoi continuare a guardare.') + '</span>';
    var myTurnFree = g.phase === 'play' && g.turn === me && !top;
    if (g.turn === me && g.phase === 'play') lbl = 'adesso · tocca a te';
    if (g.phase === 'over') { hint = 'Partita finita.'; actions = '<button class="btn" data-act="showover">Risultati</button>'; }
    else if (App.mode === 'target') { hint = App.sel.why || ('Scegli il bersaglio tra i giocatori evidenziati.'); actions = '<button class="btn ghost" data-act="cancel">Annulla</button>'; lbl = 'scegli'; }
    else if (App.mode === 'pick') {
      var need = App.pickNeed;
      hint = App.pickWhy + ' <b>' + App.picks.length + '/' + need + '</b>'; lbl = 'scegli';
      actions = '<button class="btn ghost" data-act="cancel">Annulla</button><button class="btn" data-act="pickok"' + (App.picks.length === need ? '' : ' disabled') + '>Conferma</button>';
    }
    else if (top && top.who === me) { hint = '<b>Devi decidere.</b> ' + statusText(g, me).small; actions = '<button class="btn" data-act="decide">Rispondi</button>'; lbl = 'adesso · tocca a te'; }
    else if (myTurnFree && g.step === 'draw') {
      var n = E.drawCount(g, me), modes = E.drawModes(g, me);
      hint = '<b>Il tuo turno.</b> Pesca ' + n + (n === 1 ? ' carta' : ' carte') + (E.evIs(g, 'miniera') ? ' dagli scarti (Miniera Abbandonata)' : '') + '.';
      actions = '<button class="btn" data-act="draw">Pesca' + (E.evIs(g, 'miniera') ? '' : ' dal mazzo') + '</button>';
      if (modes.indexOf('player') >= 0) actions += '<button class="btn ghost" data-act="natedraw">Sfila a un giocatore</button>';
      if (modes.indexOf('discard') >= 0) actions += '<button class="btn ghost" data-act="gazzadraw">Prendi ' + D.TYPES[E.ty(g.disc[g.disc.length - 1])].n + ' dagli scarti</button>';
      if (modes.indexOf('pat') >= 0) actions += '<button class="btn ghost" data-act="patdraw">Prendi una carta in gioco</button>';
      if (modes.indexOf('liquor') >= 0) actions += '<button class="btn ghost" data-act="liquor">Non pescare: +1 vita</button>';
    }
    else if (myTurnFree && g.step === 'play') { hint = nowHint(g, me); actions = abilityButtons(g, me) + '<button class="btn red" data-act="end">Fine turno</button>'; }
    else { var st = statusText(g, me); hint = st.big + (st.small ? ' — ' + st.small : ''); lbl = 'al tavolo'; }
    if (P.alive && E.has(g, me, 'doc') && P.hp < P.max && P.hand.length >= 2 && g.phase === 'play' && App.mode === 'idle' && !(top && top.who === me))
      actions = '<button class="btn ghost" data-act="doc">Ricuciti (2 carte)</button>' + actions;
    if (g.phase === 'play' && E.decider(g) === me) hint += '<span id="tt"></span>';
    if (P.bot && P.alive && g.phase === 'play') { hint = '<b>Stai giocando in automatico</b> perché sei stato fermo troppo a lungo.'; actions = '<button class="btn" data-act="resume">Riprendo io</button>'; }
  }
  return '<div class="dock"><div class="wrap"><div class="now"><div class="hint"><span class="lbl">' + lbl + '</span>' + hint + '</div>' + (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div>' +
    (P ? '<div class="handlbl">la tua mano · ' + P.hand.length + (P.hand.length === 1 ? ' carta' : ' carte') + '</div><div class="hand" aria-label="La tua mano">' + hand + '</div>' : '') + '</div></div>';
}

    case 'docholy': startPend({ a: 'ability', k: 'docholy' }, E.abilityInfo(g, me, 'docholy'), { cardsNeed: 2, cardsWhy: 'Scegli 2 carte da scartare per sparare.', verb: 'spara', dist: true, why: 'Scegli a chi sparare.' }); break;
    case 'sniper': startPend({ a: 'sniper' }, E.sniperInfo(g, me), { cardsNeed: 2, cardsWhy: 'Scegli i 2 Bang! da giocare insieme.', cardsFilter: function (c) { return E.isBangLike(g, me, c); }, verb: 'spara', dist: true, why: 'Scegli il bersaglio del Cecchino: servono 2 Schivata! per evitarlo.' }); break;
    case 'ricochet': startPend({ a: 'ricochet' }, E.ricochetInfo(g, me), { cardsNeed: 1, cardsKey: 'card', cardsWhy: 'Scegli il Bang! da usare.', cardsFilter: function (c) { return E.isBangLike(g, me, c); }, verb: 'mira', why: 'Scegli di chi colpire una carta in gioco.', eqOnly: true, stealTitle: 'Quale carta colpisci?' }); break;
    case 'barrel': act({ a: 'respond', r: 'barrel' }); break;
    case 'take': act({ a: 'respond', r: 'take' }); break;
    case 'die': act({ a: 'respond', r: 'die' }); break;
    case 'resp': act({ a: 'respond', r: 'card', card: +el.getAttribute('data-card') }); break;
    case 'respgreen': act({ a: 'respond', r: 'green', card: +el.getAttribute('data-card') }); break;
    case 'storepick': act({ a: 'respond', r: 'pick', card: +el.getAttribute('data-card') }); break;
    case 'kitpick': { var fk = g.stack[g.stack.length - 1]; togglePick(+el.getAttribute('data-card'), fk ? fk.keep : 2); renderSheet(); break; }
    case 'kitok': act({ a: 'respond', r: 'keep', cards: App.picks.slice() }); break;
    case 'discpick': { var f = g.stack[g.stack.length - 1]; togglePick(+el.getAttribute('data-card'), f ? f.n : 1); renderSheet(); break; }
    case 'discok': act({ a: 'respond', r: 'discard', cards: App.picks.slice() }); break;
    case 'ranchpick': togglePick(+el.getAttribute('data-card'), 99); renderSheet(); break;
    case 'ranchok': act({ a: 'respond', r: 'ranch', cards: App.picks.slice() }); break;
    case 'vera': act({ a: 'respond', r: 'vera', char: el.getAttribute('data-char') }); break;
    case 'blood': act({ a: 'respond', r: 'blood', target: +el.getAttribute('data-p') }); break;
    case 'bloodskip': act({ a: 'respond', r: 'skip' }); break;
    case 'peyote': act({ a: 'respond', r: 'guess', c: el.getAttribute('data-c') }); break;
    case 'dalton': act({ a: 'respond', r: 'dalton', card: +el.getAttribute('data-card') }); break;
    case 'doc': closeSheet(); App.mode = 'pick'; App.picks = []; App.pickNeed = 2; App.pickFilter = null; App.pickWhy = 'Scegli 2 carte da scartare per ricucirti.'; App.pickDo = function (cs) { act({ a: 'doc', cards: cs }); }; render(); break;
    case 'pickok': if (App.pickDo) App.pickDo(App.picks.slice()); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') run(function () { return Net.send({ t: 'opt', timer: +ev.target.value }); });
  if (ev.target.id === 'opt-vis') run(function () { return Net.send({ t: 'vis', vis: ev.target.value }); });
  var m = /^opt-(dc|hn|fc)$/.exec(ev.target.id || '');
  if (m) { var o = { t: 'opt' }; o[m[1]] = ev.target.checked; run(function () { return Net.send(o); }); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Enter' && e.target && e.target.hasAttribute && e.target.hasAttribute('data-plate')) e.target.click();
  if (e.key === 'Escape' && App.sheet && App.sheet.kind !== 'decide') { closeSheet(); render(); }
});
function togglePick(id, max) { var i = App.picks.indexOf(id); if (i >= 0) App.picks.splice(i, 1); else if (App.picks.length < max) App.picks.push(id); else { App.picks.shift(); App.picks.push(id); } }
function copyText(t, ok) {
  try { navigator.clipboard.writeText(t).then(function () { toast(ok || 'Copiato'); }, function () { toast(t); }); } catch (e) { toast(t); }
}

var RULES = '<p>Ognuno riceve in segreto un <b>ruolo</b> e un <b>pistolero</b>. Solo lo Sceriffo si rivela e comincia. I punti vita sono i proiettili sulla carta del personaggio, e sono anche il numero massimo di carte che puoi tenere in mano a fine turno.</p>' +

  '<h3>Il turno</h3><ul><li><b>Pesca</b> 2 carte.</li><li><b>Gioca</b> quante carte vuoi, ma un solo Bang! a turno.</li><li><b>Scarta</b> le carte che superano i tuoi punti vita, poi passa.</li></ul>' +
  '<h3>Leggere il tavolo</h3><p>Sei sempre seduto in basso; gli altri sono intorno al tavolo nell’ordine vero dei turni (le frecce indicano il verso, quella dorata va dal tuo posto al prossimo). Il numero nel mirino accanto a ogni giocatore è la sua <b>distanza da te</b>, già contando Mustang, Mirino e gli eliminati: verde se è a tiro della tua arma, grigio se no. Quando scegli un bersaglio, sotto chi è fuori tiro trovi il motivo.</p>' +
  '<h3>Distanza e armi</h3><p>La distanza è il numero di posti tra due giocatori vivi, nel verso più breve. Puoi sparare solo a chi è entro la portata della tua arma: senza armi hai la Pistola, portata 1. Il Mustang ti allontana di 1 per gli altri, il Mirino avvicina tutti di 1 per te. Si tiene una sola arma alla volta.</p>' +
  '<h3>Estrarre</h3><p>Barile, Prigione e Dinamite chiedono di girare la prima carta del mazzo e guardarne il seme e il valore, nell’angolo in alto a sinistra.</p>' +
  '<h3>Taglie e penalità</h3><ul><li>Chi elimina un Fuorilegge pesca 3 carte.</li><li>Se lo Sceriffo elimina un suo Vice, scarta tutte le carte.</li><li>Quando arrivi a zero puoi bere una Birra per salvarti, ma non quando restate in due.</li></ul>' +

  '<h3>Eventi (Mezzogiorno di Fuoco, Per un Pugno di Carte)</h3><p>Dal secondo giro, ogni volta che tocca allo Sceriffo si scopre un evento che cambia le regole per tutto il giro: lo vedi al centro del tavolo (toccalo per leggerlo). L’ultima carta del mazzo eventi resta fino alla fine.</p>' +
  '<h3>Giocare online</h3><ul><li>Chi apre il tavolo è l’host: il suo telefono tiene la partita e muove i pistoleri automatici. Se chiude il gioco o mette il telefono in standby, dopo qualche secondo gli altri possono prendere il comando e continuare.</li><li>Se un amico si assenta, l’host può farlo giocare in automatico toccando il suo posto. Appena torna e gioca una carta, riprende il controllo.</li><li>Le partite passano da un server pubblico gratuito: usa un soprannome e non scrivere dati personali.</li></ul>';
