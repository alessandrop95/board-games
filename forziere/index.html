<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Forziere Maledetto</title>
<meta name="description" content="Pirati a ruoli segreti: Levante contro Ponente, con un Pirata o due Corsari nascosti. Prendi una nave, spara bordate e porta il Forziere alla tua bandiera. Da 4 a 8 giocatori.">
<meta name="theme-color" content="#0f2a38">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forziere">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="pwa-sw" content="../sw.js" data-scope="../">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root {
  --bg: #0f1d26; --deep: #081218; --panel: rgba(16, 32, 42, .9); --panel-2: rgba(58, 36, 18, .8);
  --ink: #f4f8ff; --muted: #c5d4ef; --dim: #8ea6cf; --gold: #ffd75e; --gold-2: #f0a91c; --coral: #ff7a59; --good: #8ff0a4; --bad: #ff8f80;
  --line: rgba(255, 215, 94, .38); --line-2: rgba(255, 255, 255, .16);
  --f-disp: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); overflow-x: clip; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: linear-gradient(180deg, #081218 0%, #123040 55%, #1b4258 100%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 25px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 19px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 12px 30px rgba(4, 10, 16, .35); min-width: 0; }
.panel h2 { font-size: 24px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(255, 215, 94, .14); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(200, 50, 40, .3); border-color: rgba(255, 143, 128, .55); }
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 44px; padding: 10px 18px; font: 800 15.5px/1.15 var(--f-body); color: #3b2500; cursor: pointer;
  background: linear-gradient(180deg, #fff1a0, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #a86a00, 0 8px 18px rgba(8, 24, 64, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 0 #a86a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #ff8a70, #d8402c); color: #fff; box-shadow: 0 3px 0 #7c1e12; }
.btn.small { min-height: 36px; padding: 7px 13px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opp:focus-visible, .slot:focus-visible, .pile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 5px 10px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--coral); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #13284f; background: #f4f8ff; border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #13284f; }
.back-link { color: #eaf3ff; text-decoration: none; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 56px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 3px 0 rgba(8, 24, 64, .45); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(13, 36, 84, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; flex-wrap: wrap; row-gap: 6px; justify-content: flex-end; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 24px; color: var(--gold); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
@media (max-width: 640px) {
  .topbar .wrap { row-gap: 0; padding-block: 6px 8px; }
  .topbar .wrap > * { order: 2; }
  .topbar .wrap > .brand, .topbar .wrap > .info { order: 0; }
  .topbar .wrap::after { content: ""; order: 1; flex-basis: 100%; height: 6px; }
  .topbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 21px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 0 0 2px rgba(255, 255, 255, .5); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(10, 20, 28, .96); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 14px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }

/* ---------- carte (3D) ---------- */
.skc { display: block; position: relative; width: var(--cw, 60px); aspect-ratio: 100 / 140; perspective: 700px; flex: none; }
.skc-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s var(--ease); }
.skc-f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9%/6.5%; filter: drop-shadow(0 2px 2.5px rgba(4, 10, 16, .45)); }
.skc-back { transform: rotateY(180deg); }
.skc:not(.up) .skc-in, .predown .skc-in { transform: rotateY(180deg); }
.predown .skc-in { transition: none; }
.skc-svg { display: block; width: 100%; height: 100%; }
.skc.flipin .skc-in { animation: flipin .6s var(--ease); }
@keyframes flipin { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.12); } 100% { transform: rotateY(0) scale(1); } }
.skc.flat { --cw: 40px; }
.flyhide { visibility: hidden !important; }
.rrow { display: inline-flex; gap: 3px; vertical-align: middle; margin: 4px 0; }
.rrow .skc { --cw: 34px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, .35); overflow: hidden; position: relative;
  background: radial-gradient(60% 70% at 85% 15%, rgba(255, 207, 63, .35), transparent 60%), linear-gradient(180deg, #d6a800 0%, #7a4a22 55%, #24160c 100%); box-shadow: 0 16px 40px rgba(8, 24, 64, .35); }
.hero::before { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30px; height: 90px; background: radial-gradient(closest-side, rgba(255, 255, 255, .85), transparent) 0 0 / 120px 90px repeat-x; opacity: .7; pointer-events: none; animation: drift 40s linear infinite; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero .kicker { color: #7a2c10; }
.hero h1 { font-size: clamp(56px, 15vw, 104px); line-height: .9; color: #fff; text-shadow: 0 4px 0 #7a4a22, 0 10px 26px rgba(10, 20, 28, .45); margin-top: 6px; letter-spacing: .01em; }
.hero .tag { color: #12305f; margin-top: 12px; max-width: 54ch; font-weight: 700; }
.hero-art { position: relative; height: 200px; max-width: 380px; width: 100%; justify-self: center; }
.hero-balloon { position: absolute; width: 120px; left: 50%; top: -14px; margin-left: -60px; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(10, 20, 28, .35)); }
@keyframes bob { 50% { transform: translateY(-10px) rotate(3deg); } }
.hero-art .hc { position: absolute; bottom: 0; filter: drop-shadow(0 8px 12px rgba(10, 20, 28, .4)); }
.hero-art .skc { --cw: 70px; }
.hc1 { left: 2%; transform: rotate(-18deg) translateY(-6px); } .hc2 { left: 17%; transform: rotate(-9deg) translateY(-18px); } .hc3 { left: 33%; transform: rotate(-1deg) translateY(-24px); }
.hc4 { left: 49%; transform: rotate(7deg) translateY(-18px); } .hc5 { left: 64%; transform: rotate(15deg) translateY(-6px); } .hc6 { left: 79%; transform: rotate(23deg) translateY(8px); }
@keyframes drift { to { background-position: 1200px 0; } }


/* ---------- schermata di gioco: barra in alto, cartellini, istruzioni ---------- */
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); background: rgba(10, 20, 28, .72); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 19px; font-weight: 800; color: var(--gold); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.pv { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--f-disp); color: #fff; background: var(--pc); flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
.pv.big { width: 54px; height: 54px; font-size: 30px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font: 800 10px var(--f-body); text-transform: uppercase; letter-spacing: .04em; border-radius: 6px; padding: 1px 5px; background: rgba(255, 255, 255, .14); }
.tag.end { background: var(--gold); color: #4a2a00; } .tag.away { background: #c8402c; } .tag.bot { background: #3a5a8a; } .tag.wait { background: rgba(255, 255, 255, .18); animation: pulse 1.4s ease-in-out infinite; } .tag.ok { background: #2f9a58; }
@keyframes pulse { 50% { opacity: .5; } }
/* barra delle istruzioni */
.gv-prompt { display: flex; align-items: center; gap: 8px; margin: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); padding: 7px 8px 7px 12px; border-radius: 14px; background: rgba(10, 20, 28, .78); backdrop-filter: blur(8px); border: 1px solid var(--line); flex-wrap: wrap; box-shadow: 0 6px 18px rgba(4, 10, 16, .3); }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 160px; }
.pr-txt b { color: #ffe7a0; }
.pr-b { display: flex; gap: 6px; align-items: center; margin-left: auto; flex: none; }
.gv-prompt .help { color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }

/* animazioni: carte in volo, scintille, testi */
.flyer { position: fixed; z-index: 70; pointer-events: none; transform-origin: 0 0; will-change: transform; }
.flyer .skc { --cw: 100% !important; width: 100%; }
.flyer.still.glow .skc { animation: colglow .65s ease-in-out; }
@keyframes colglow { 0%, 100% { transform: none; } 20% { transform: translateY(-4px) rotate(-3deg); filter: drop-shadow(0 0 10px #fff6c8); } 50% { transform: translateY(-6px) rotate(3deg) scale(1.08); filter: drop-shadow(0 0 16px #ffd75e); } 80% { transform: translateY(-3px) rotate(-2deg); } }
.burst { position: fixed; z-index: 72; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; animation: burst .8s var(--ease) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
.floatxt { position: fixed; z-index: 73; pointer-events: none; transform: translate(-50%, -50%); font: 800 20px var(--f-disp); color: #fff; text-shadow: 0 2px 0 #24160c, 0 0 14px rgba(143, 227, 255, .9); animation: floatup 1.5s var(--ease) forwards; white-space: nowrap; }
.floatxt.col { font-size: 24px; color: var(--gold); text-shadow: 0 2px 0 #6b3a00, 0 0 20px rgba(255, 215, 94, .9); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
.banner { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; }
.banner span { display: grid; justify-items: center; font: 800 clamp(36px, 10vw, 74px)/1 var(--f-disp); color: #fff; text-shadow: 0 4px 0 #7a4a22, 0 0 40px rgba(255, 215, 94, .8); animation: ban 2.2s var(--ease) forwards; text-align: center; padding: 0 12px; }
.banner small { font: 800 16px var(--f-body); color: var(--gold); text-shadow: 0 2px 4px rgba(0, 0, 0, .6); margin-top: 8px; letter-spacing: .04em; }
@keyframes ban { 0% { transform: scale(.6); opacity: 0; } 18% { transform: scale(1.05); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 95; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: conf linear forwards; }
@keyframes conf { to { transform: translateY(110vh) rotate(var(--r)); } }

/* ---------- finestre ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(4, 10, 16, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet-back.still, .sheet-back.still .sheet, .sheet-back.still .rr-row, .sheet-back.still .stamp, .sheet-back.still .tbar i { animation: none; }
.sheet { width: 100%; max-width: 640px; max-height: calc(90vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: linear-gradient(180deg, #7a4a22, #24160c); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; box-shadow: 0 -12px 40px rgba(0, 0, 0, .5); animation: up .28s var(--ease); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line-2); } }
.sheet .lead { font-size: 15.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.gc { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 3px 8px; font-size: 13.5px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); }
.phead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.pboard { display: grid; justify-items: center; padding: 10px; border-radius: 14px; background: rgba(0, 0, 0, .15); }
.pboard .board { gap: 6px; } .pboard .board .skc { --cw: min(60px, 18vw); } .pboard .board .slot.gone { --cw: min(60px, 18vw); }
.loglist { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.loglist .fl { font-size: 14px; border-left: 3px solid var(--line-2); padding: 3px 8px; }
.loglist .fl.k-col, .loglist .fl.k-end { color: var(--gold); } .loglist .fl.k-double { color: var(--bad); }
.intro-art { display: grid; justify-items: center; gap: 4px; }
.intro-nav { justify-content: flex-end; margin-top: 6px; }
.rules { display: grid; gap: 14px; }
.rsec { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 7px; scroll-margin-top: 10px; }
.rsec ul, .rsec ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.rbox { background: rgba(255, 215, 94, .12); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.rtoc { display: flex; flex-wrap: wrap; gap: 6px; }
.rgrid { display: inline-grid; grid-template-columns: repeat(4, auto); gap: 3px; padding: 6px; border-radius: 10px; background: rgba(0, 0, 0, .18); vertical-align: middle; justify-self: start; }
.rgrid .skc { --cw: 30px; }
.rgrid .rg.hi .skc { box-shadow: 0 0 0 2px var(--gold), 0 0 10px var(--gold); border-radius: 4px; }
.rgap { display: block; width: 30px; aspect-ratio: 100 / 140; border: 1px dashed rgba(255, 255, 255, .3); border-radius: 4px; }
.rarrow { display: inline-block; margin: 0 8px; font: 800 26px var(--f-disp); color: var(--gold); vertical-align: middle; }
.rbands { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.rband { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.rband .skc { --cw: 34px; }
.rband small b { display: block; color: var(--ink); text-transform: capitalize; font-size: 14px; }
/* punti della manche */
.rr { display: grid; gap: 6px; }
.rr-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 14px; background: rgba(255, 255, 255, .07); border-left: 5px solid var(--pc); animation: up .45s var(--ease) both; }
.rr-row.me { background: rgba(255, 215, 94, .14); }
.rr-n { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.rr-n b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.rr-p { display: grid; justify-items: end; position: relative; min-width: 56px; }
.rr-p b { font: 800 28px/1 var(--f-disp); color: #fff; }
.rr-p b.neg { color: var(--good); }
.rr-p small { color: var(--gold); font-weight: 800; font-size: 12px; }
.rr-p s { color: var(--dim); font-size: 13px; }
.stamp { position: absolute; right: -6px; top: -12px; font: 800 18px var(--f-disp); color: #fff; background: #d8402c; border-radius: 8px; padding: 0 6px; transform: rotate(12deg); box-shadow: 0 2px 8px rgba(0, 0, 0, .4); animation: stamp .5s var(--ease) both; }
@keyframes stamp { from { transform: scale(3) rotate(-20deg); opacity: 0; } }
.target { display: grid; gap: 4px; margin-top: 4px; }
.target small { color: var(--dim); font-size: 12px; }
.tbar { position: relative; display: block; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }

<script>
window.GAME_PREFIX = 'forziere/v1/';
/* ===== Il Forziere Maledetto: motore delle regole (gira sull'host; lo stato è JSON) =====
   Da 4 a 8 giocatori, ruoli segreti. Due flotte rivali, Levante e Ponente, vogliono portare il Forziere
   fino alla propria bandiera sul tracciato; il Pirata (in 5 e 7) o i due Corsari (in 4, 6 e 8) giocano da soli:
   vogliono dobloni e il Forziere vicino al centro.
   - Tracciato: il Forziere parte da 0; la bandiera di Levante sta a −F, quella di Ponente a +F (F = 5 in 4–5
     giocatori, 6 con più giocatori). Quando una nave affonda il Forziere si sposta del valore della nave verso la
     bandiera avversaria della flotta del capitano affondato (+1 se era un Ammiraglio); se affonda il Pirata, verso
     la bandiera di chi l'ha affondato.
   - Ogni nave ha valore (passi del Forziere), gittata, munizioni (carte Attacco per turno) e barili (scafo).
   - Turno: senza nave se ne prende una (dalla fila di 3 o dal mazzo delle navi), si pescano 2 carte, si giocano
     le carte, a fine turno si tengono al massimo 5 carte.
   - Chi affonda una nave prende un doblone dalla Clessidra. Un ruolo ancora coperto vale 1 doblone.
   - Il mazzo che finisce toglie un doblone dalla Clessidra e avvicina le bandiere al centro.
   - Fine: il Pirata o un Corsaro con 4 dobloni vince subito; dopo un affondamento il Forziere su una bandiera fa
     vincere quella flotta; con la Clessidra vuota arriva il Gorgo e, al primo giocatore che non sa rispondere,
     si guarda dove sta il Forziere. */
var FZEngine = (function () {
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- dati ---------- */
  // k: atk = Attacco (rosso), def = Difesa (blu), act = Azione (nero), eq = Equipaggiamento (verde), multi = Attacco o Difesa
  var T = {
    bordata: { n: 'Bordata', k: 'atk', c: 18, d: 'Colpo contro una nave entro la tua gittata.' },

    cassa: { n: 'Cassa di munizioni', k: 'eq', c: 1, d: 'Puoi giocare 1 carta Attacco in più per turno.' }
  };
  var ORDER = ['bordata', 'arrembaggio', 'incatenate', 'moschetto', 'virata', 'bianca', 'rum', 'vedetta', 'saccheggio', 'sabotaggio', 'burrasca', 'mostro', 'sfida', 'spettro', 'porto', 'rifornimento', 'lettera', 'cannoniera', 'coffa', 'nebbia', 'polena', 'fasciame', 'cassa'];
  // simbolo nell'angolo: A Ancora (1 carta su 2), T Timone (1 su 4), X Teschio (1 su 8), P Perla (1 su 8)
  var SYM = { A: 'Ancora', T: 'Timone', X: 'Teschio', P: 'Perla' };

  })();
  // navi: f = passi del Forziere quando affonda, g = gittata, m = munizioni, b = barili
  var SHIPS = [
    { n: 'Rondine', f: 1, g: 2, m: 1, b: 4 },

    { n: 'Gabbiano', f: 1, g: 2, m: 1, b: 3, a: 'fog', d: 'Gli altri ti vedono a distanza +1.' },
    { n: 'Squalo', f: 2, g: 1, m: 2, b: 5, a: 'gun', d: '+1 cannone: i colpi delle tue carte Attacco tolgono 1 barile in più.' },

    { n: 'Lucciola', f: 1, g: 1, m: 1, b: 5, a: 'lamp', d: 'All’inizio del turno peschi 1 carta in più.' },
    { n: 'Uragano', f: 3, g: 3, m: 2, b: 5 },
    { n: 'Leone di mare', f: 3, g: 2, m: 2, b: 6 },
    { n: 'Tridente', f: 2, g: 2, m: 3, b: 4 },
    { n: 'Regina degli Abissi', f: 3, g: 3, m: 3, b: 5, a: 'gun', d: '+1 cannone: i colpi delle tue carte Attacco tolgono 1 barile in più.' }
  ];
  // capitani: s = nave di partenza
  var CAPS = [
    { n: 'Nina Scirocco', s: 0, a: 'nina', d: 'Ogni volta che perdi un barile peschi 1 carta.' },
    { n: 'Ugo Bonaccia', s: 1, a: 'ugo', d: 'Il Rum ti fa recuperare 2 barili invece di 1.' },
    { n: 'Lia Maretta', s: 2, a: 'lia', d: 'Puoi usare le Bordate come Virate e le Virate come Bordate.' },

    { n: 'Sveva Tramontana', s: 4, a: 'sveva', d: 'Vedi tutti gli altri a distanza −1.' },
    { n: 'Tito Corallo', s: 5, a: 'tito', d: 'All’inizio del turno peschi 3 carte invece di 2.' },
    { n: 'Greta Fortunale', s: 6, a: 'greta', d: 'Quando un altro giocatore ti fa perdere barili, prendi 1 carta a caso dalla sua mano.' },

    { n: 'Mira Salsedine', s: 8, a: 'mira', d: 'Gli Equipaggiamenti degli altri giocatori non hanno effetto contro di te.' },
    { n: 'Dario Risacca', s: 9, a: 'dario', d: 'Quando affonda la nave di un altro giocatore peschi 2 carte.' },
    { n: 'Elsa Bufera', s: 10, a: 'elsa', d: 'Quando un tuo colpo va a segno peschi 1 carta.' },
    { n: 'Remo Abisso', s: 11, a: 'remo', d: 'Il Vascello spettrale non si ferma mai sulla tua nave: passa subito oltre.' }
  ];
  var ROLES = {
    AL: { n: 'Ammiraglio di Levante', s: 'Ammiraglio', nat: 'L', lead: true },
    UL: { n: 'Ufficiale di Levante', s: 'Ufficiale', nat: 'L' },
    AP: { n: 'Ammiraglio di Ponente', s: 'Ammiraglio', nat: 'P', lead: true },
    UP: { n: 'Ufficiale di Ponente', s: 'Ufficiale', nat: 'P' },
    PI: { n: 'Pirata', s: 'Pirata', nat: null, solo: true },
    CL: { n: 'Corsaro di Levante', s: 'Corsaro', nat: 'L', solo: true },
    CP: { n: 'Corsaro di Ponente', s: 'Corsaro', nat: 'P', solo: true }
  };
  var NAT = { L: 'Levante', P: 'Ponente' };
  var SETUP = {
    4: { r: ['AL', 'AP', 'CL', 'CP'], glass: 7, flag: 5 },
    5: { r: ['AL', 'AP', 'UP', 'UL', 'PI'], glass: 7, flag: 5 },
    6: { r: ['AL', 'AP', 'UP', 'UL', 'CL', 'CP'], glass: 8, flag: 6 },
    7: { r: ['AL', 'AP', 'UP', 'UP', 'UL', 'UL', 'PI'], glass: 9, flag: 6 },
    8: { r: ['AL', 'AP', 'UP', 'UP', 'UL', 'UL', 'CL', 'CP'], glass: 10, flag: 6 }
  };
  var KEEP = ['cannoniera', 'coffa', 'cassa', 'nebbia', 'polena', 'fasciame'];

  /* ---------- utilità ---------- */
  function ty(id) { return CARDS[id].t; }
  function kind(id) { return T[ty(id)].k; }
  function nick(g, p) { return g.players[p].nick; }
  function log(g, t, k, p) { g.log.push({ n: ++g.logN, t: t, k: k || '', p: p == null ? null : p }); if (g.log.length > 120) g.log.splice(0, g.log.length - 120); }
  function fx(g, e) { e.n = ++g.fxN; g.fx.push(e); if (g.fx.length > 24) g.fx.splice(0, g.fx.length - 24); }
  function cap(g, p) { return CAPS[g.players[p].cap]; }
  function isCap(g, p, a) { return g.players[p] && CAPS[g.players[p].cap].a === a; }
  function ship(g, p) { var s = g.players[p].ship; return s == null ? null : SHIPS[s]; }
  function shipIs(g, p, a) { var s = ship(g, p); return !!(s && s.a === a); }
  function hasEq(g, p, t) { var P = g.players[p]; for (var i = 0; i < P.eq.length; i++) if (ty(P.eq[i]) === t) return P.eq[i]; return null; }
  // equipaggiamento di p che ha effetto contro q (Mira ignora quelli degli altri)
  function eqVs(g, p, t, q) { if (q != null && q !== p && isCap(g, q, 'mira')) return null; return hasEq(g, p, t); }
  function maxBar(g, p) { var s = ship(g, p); return s ? s.b + (hasEq(g, p, 'fasciame') != null ? 1 : 0) : 0; }
  function nat(role) { return ROLES[role].nat; }
  function roleName(r) { return ROLES[r].n; }
  function nextIdx(g, p) { return (p + 1) % g.players.length; }
  function dbl(P) { return P.dbl + (P.up ? 0 : 1); }   // il ruolo coperto vale un doblone
  function solo(P) { return !!ROLES[P.role].solo; }
  function idxs(g) { return g.players.map(function (P, i) { return i; }); }

  /* ---------- mazzo ---------- */
  function deckEnd(g) {
    if (g.glass > 0) g.glass--;
    if (g.flag > 2) g.flag--;
    log(g, 'Il mazzo è finito: un doblone lascia la Clessidra (' + g.glass + ' rimasti) e le bandiere si avvicinano al centro (' + g.flag + ').', 'sys');
    fx(g, { k: 'deckend', glass: g.glass, flag: g.flag });
    g.deck = shuffle(g.disc.splice(0));
    if (g.glass === 0) startGorgo(g);
  }
  function drawCard(g) {
    if (!g.deck.length) { if (!g.disc.length) return null; deckEnd(g); if (!g.deck.length) return null; }
    return g.deck.pop();
  }
  function give(g, p, n, why) {
    var P = g.players[p], got = 0;
    for (var i = 0; i < n; i++) { var c = drawCard(g); if (c == null) break; P.hand.push(c); got++; }
    if (got) fx(g, { k: 'draw', p: p, c: got, why: why || '' });
    return got;
  }
  function discardHand(g, p, id) { var P = g.players[p], i = P.hand.indexOf(id); if (i >= 0) { P.hand.splice(i, 1); g.disc.push(id); return true; } return false; }
  function discardEq(g, p, id) { var P = g.players[p], i = P.eq.indexOf(id); if (i >= 0) { P.eq.splice(i, 1); g.disc.push(id); return true; } return false; }
  function topCheck(g) { var c = drawCard(g); if (c == null) return null; g.disc.push(c); return c; }

  /* ---------- distanze ---------- */
  function withShip(g) { return idxs(g).filter(function (i) { return g.players[i].ship != null; }); }
  function distance(g, a, b) {
    if (a === b) return 0;
    var ring = withShip(g); if (ring.indexOf(a) < 0) ring.push(a); if (ring.indexOf(b) < 0) ring.push(b);
    ring.sort(function (x, y) { return x - y; });
    var ia = ring.indexOf(a), ib = ring.indexOf(b), k = Math.abs(ia - ib), d = Math.min(k, ring.length - k);
    if (eqVs(g, b, 'nebbia', a) != null) d++;
    if (shipIs(g, b, 'fog')) d++;

  function cannons(g, p, t) { return (eqVs(g, p, 'cannoniera', t) != null ? 1 : 0) + (shipIs(g, p, 'gun') ? 1 : 0); }

  /* ---------- nuova partita ---------- */
  function newGame(seats, opts) {
    var n = seats.length, S = SETUP[Math.max(4, Math.min(8, n))];

    var caps = shuffle(CAPS.map(function (c, i) { return i; })).slice(0, n);
    var g = {
      v: 1, phase: 'play', seq: 0, turnN: 0, fx: [], fxN: 0, log: [], logN: 0,

    return g;
  }

  /* ---------- turno ---------- */
  function startTurn(g, p) {
    g.turn = p; g.turnN++; g.shots = 0; g.step = 'start'; g.pend = null; g.spectreRev = null;
    fx(g, { k: 'turn', p: p });
    proceed(g);
  }
  // fa avanzare il turno finché serve una scelta di qualcuno
  function proceed(g) {
    for (var guard = 0; guard < 12 && g.phase === 'play' && !g.pend; guard++) {
      var p = g.turn, P = g.players[p];
      if (g.step === 'start') {
        if (g.gorgo && g.gorgo.at === p) { if (!gorgoCheck(g, p)) return; continue; }
        if (g.spectre && g.spectre.on === p && P.ship != null) { spectreReveal(g, p); if (g.step === 'spectre') return; continue; }
        g.step = 'ship'; continue;
      }
      if (g.step === 'ship') { if (P.ship == null) return; g.step = 'draw'; continue; }
      if (g.step === 'draw') {

  function finishTurn(g, p) {

    if (g.phase !== 'play') return;
    startTurn(g, nextIdx(g, p));
  }

    g.players.forEach(function (P, i) { if (i !== g.turn && !P.hand.length) { if (give(g, i, 1, 'adrift')) log(g, P.nick + ' è alla deriva: pesca 1 carta.', 'draw', i); } });
  }

  /* ---------- vascello spettrale e Gorgo ---------- */
  function spectreReveal(g, p) {
    var c = topCheck(g); if (c == null) { g.step = 'ship'; return; }
    g.spectreRev = c; g.step = 'spectre';
    log(g, 'Il Vascello spettrale è sulla nave di ' + nick(g, p) + ': esce ' + T[ty(c)].n + ' (' + SYM[CARDS[c].s] + ').', 'ghost', p);
    fx(g, { k: 'reveal', p: p, c: c, why: 'spectre' });

  }
  function matching(g, p, s) { return g.players[p].hand.filter(function (id) { return CARDS[id].s === s; }); }
  function nextShip(g, from, skipRemo) {
    var n = g.players.length;
    for (var k = 1; k <= n; k++) { var q = (from + k) % n; if (g.players[q].ship != null && !(skipRemo && isCap(g, q, 'remo'))) return q; }
    return null;
  }
  function moveSpectre(g, from) {
    var q = nextShip(g, from, true);
    if (q == null || q === from) { g.spectre = null; fx(g, { k: 'spectre', on: null }); return; }
    g.spectre = { on: q }; fx(g, { k: 'spectre', on: q, from: from });
    log(g, 'Il Vascello spettrale passa sulla nave di ' + nick(g, q) + '.', 'ghost', q);
  }
  function spectreAnswer(g, p, id) {
    var s = CARDS[g.spectreRev].s;
    if (id != null) {
      if (g.players[p].hand.indexOf(id) < 0 || CARDS[id].s !== s) return 'Serve una carta con il simbolo ' + SYM[s] + '.';
      log(g, nick(g, p) + ' risponde mostrando ' + T[ty(id)].n + ' (' + SYM[s] + ').', 'ghost', p);
      fx(g, { k: 'answer', p: p, c: id });
      g.spectreRev = null; moveSpectre(g, p); g.step = 'ship'; return null;
    }
    spectreFail(g, p); return null;
  }
  function spectreFail(g, p) {
    log(g, nick(g, p) + ' non risponde al Vascello spettrale: perde 2 barili e il vascello svanisce.', 'ghost', p);
    g.spectre = null; g.spectreRev = null; fx(g, { k: 'spectre', on: null, hit: p });
    g.step = 'ship';
    damage(g, p, 2, null, 'ghost');
  }
  function startGorgo(g) {
    if (g.gorgo || g.phase !== 'play') return;
    var at = nextIdx(g, g.turn);
    g.gorgo = { at: at }; g.spectre = null;
    log(g, 'La Clessidra è vuota: si apre il Gorgo! Da ' + nick(g, at) + ', all’inizio di ogni turno si scopre una carta: chi non sa rispondere fa finire la partita.', 'end');
    fx(g, { k: 'gorgo', at: at });
  }
  // true se si può continuare il turno
  function gorgoCheck(g, p) {
    var c = topCheck(g); if (c == null) { g.step = 'ship'; return true; }
    var s = CARDS[c].s, m = matching(g, p, s);
    fx(g, { k: 'reveal', p: p, c: c, why: 'gorgo' });
    if (m.length) {
      log(g, 'Il Gorgo scopre ' + T[ty(c)].n + ' (' + SYM[s] + '): ' + nick(g, p) + ' risponde con ' + T[ty(m[0])].n + '.', 'ghost', p);
      fx(g, { k: 'answer', p: p, c: m[0] });
      g.gorgo.at = nextIdx(g, p); g.step = 'ship'; return true;
    }
    log(g, 'Il Gorgo scopre ' + T[ty(c)].n + ' (' + SYM[s] + ') e ' + nick(g, p) + ' non sa rispondere: la partita finisce!', 'end', p);

  /* ---------- danni e affondamenti ---------- */
  function heal(g, p, n, over) { var P = g.players[p]; if (P.ship == null) return 0; var to = over ? P.bar + n : Math.min(maxBar(g, p), P.bar + n), h = Math.max(0, to - P.bar); P.bar += h; if (h) fx(g, { k: 'heal', p: p, n: h }); return h; }
  function damage(g, t, n, by, why) {
    var P = g.players[t]; if (P.ship == null || n <= 0 || g.phase !== 'play') return;
    var lost = Math.min(n, P.bar); P.bar -= lost;
    fx(g, { k: 'hit', p: t, n: lost, by: by, why: why || '' });
    if (isCap(g, t, 'nina') && lost) give(g, t, lost, 'nina');
    if (why === 'shot' && shipIs(g, t, 'sting')) give(g, t, 1, 'sting');
    if (by != null && by !== t && isCap(g, t, 'greta') && g.players[by].hand.length) {
      var h = g.players[by].hand, c = h.splice(Math.floor(rand() * h.length), 1)[0]; P.hand.push(c);
      fx(g, { k: 'steal', p: t, from: by }); log(g, P.nick + ' prende una carta a ' + nick(g, by) + '.', 'act', t);
    }
    if (P.bar <= 0) sink(g, t, by);

/* ===== Rete senza account: MQTT su WebSocket verso broker pubblici gratuiti =====
   (Le pagine dei giochi si rigenerano da sole su GitHub a ogni modifica in src/: azione «Ricostruisci i giochi».)
   Modello: il dispositivo "host" del tavolo tiene la verità. Pubblica lo stato completo
   come messaggio "retained" (chi arriva lo riceve subito); gli altri inviano solo azioni.
   Robustezza: controllo continuo che il server risponda, riconnessione immediata quando
   la pagina torna in primo piano, subentro automatico se l'host sparisce.
   App in secondo piano: finché il telefono lascia girare la pagina, la connessione resta viva (battito da un
   Web Worker, che il browser non rallenta) e gli altri vedono «in pausa» invece di «offline»; se chi regge il
   tavolo smette di guardare, il comando passa subito a chi è presente e torna al titolare quando rientra. */

var NETQ = new URLSearchParams(location.search);

var NET_DEAD_MS = +(NETQ.get('dead') || 15000);     // silenzio oltre il quale si verifica la connessione
var NET_PROBE_MS = 5000;                            // attesa della risposta alla verifica
var NET_WAKE_PROBE_MS = 2500;                       // la stessa attesa, più corta, quando la pagina torna in primo piano
var NET_KEEP_S = +(NETQ.get('keep') || 120);        // silenzio che il server tollera (×1,5) prima di scollegarci: largo, così regge anche i timer rallentati
var NET_STALE_MS = +(NETQ.get('stale') || 30000);   // dopo un sonno così lungo non si verifica nemmeno: ci si ricollega subito

/* ---------- battito che non si ferma in secondo piano ----------
   I timer di una pagina nascosta vengono rallentati dal browser (fino a uno al minuto). I controlli periodici
   (ping, presenza, tavolo) passano da qui: mentre si è a un tavolo il battito arriva da un Web Worker, che non
   viene rallentato. Se il telefono sospende del tutto la pagina, al risveglio ce ne accorgiamo dal salto d'orario. */

  var jobs = [], worker = null, last = Date.now(), gapFn = null;

    jobs.slice().forEach(function (j) {
      if (j.dead || now - j.last < j.ms - 60) return;
      j.last = now; try { j.fn(); } catch (e) { console.warn('battito', e); }
    });

  setInterval(pump, 1000);

  function every(ms, fn) { var j = { ms: ms, fn: fn, last: Date.now(), dead: false }; jobs.push(j); return function () { j.dead = true; jobs = jobs.filter(function (x) { return x !== j; }); }; }

    if (on && !worker) {
      try {
        worker = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},1000)'], { type: 'text/javascript' })));
        worker.onmessage = pump; worker.onerror = function () { worker = null; };

    } else if (!on && worker) { try { worker.terminate(); } catch (e) {} worker = null; }

})();

/* ===== Schermo acceso al tavolo e richiamo «tocca a te» (condivisi da tutti i giochi) =====

/* ===== Partita guidata contro i bot (condivisa) =====
   Dalla lista dei tavoli: «Partita di prova guidata». Si apre un tavolo che non compare nella lista, con dei bot,
   senza limite di tempo. Durante la partita una barra in alto spiega cosa fare adesso e propone la mossa consigliata

    '.cx-bar .cx-t{flex:1;min-width:0}.cx-bar b{color:#9fd3ff}.cx-bar .cx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}' +

/* ---------- regole del tavolo (girano sull'host) ---------- */
function uniqueNick(seats, n) { var base = n, k = 2; while (seats.some(function (s) { return s.nick.toLowerCase() === n.toLowerCase(); })) n = base + ' ' + k++; return n; }

      if (seat) { if (doc.phase === 'lobby' && seat.nick !== nick) { seat.nick = uniqueNick(doc.seats.filter(function (s) { return s !== seat; }), nick); return {}; } return { changed: false, out: 'seated' }; }
      if (doc.phase !== 'lobby') return { changed: false, out: 'spect' };

    }

    }

    case 'opt': {

      if (p < 0) return { err: 'Stai solo guardando questa partita.' };
      if (g.players[p].bot && g.players[p].uid === from) { g.players[p].bot = false; g.players[p].away = false; }

    (App.doc.host === Net.uid ? '<button class="btn block" data-act="rematch">Nuova partita con lo stesso tavolo</button>' : '<p class="lead">L’host può avviare una nuova partita.</p>') + closeBtn('Guarda il tavolo') + '</div>';
}
function introBody(s) {
  var g = G(), me = myIdx(), P = g && me >= 0 ? g.players[me] : null;
  var pages = [
    ['Benvenuto a bordo', (P ? '<div class="cinfo"><span class="cbig">' + ART.roleCard(P.role) + '</span><p class="lead">In questa partita sei <b>' + esc(E.ROLES[P.role].n) + '</b>. È un segreto: lo vedi solo tu (tocca la tua plancia per rileggerlo).</p></div>' : '') + RU.S.goal[1]],
    ['Il turno', RU.S.turn[1]],
    ['Navi, colpi e affondamenti', '<p>Con una <b>Bordata</b> colpisci una nave entro la tua <b>gittata</b>: perde un barile. Chi viene colpito può evitarlo con una <b>Virata</b>. Quando una nave finisce i barili <b>affonda</b>: si scopre il ruolo del capitano, il Forziere si sposta e chi l’ha affondata prende un <b>doblone</b>.</p><p>Chi affonda non è eliminato: al turno dopo prende una nave nuova e torna in mare.</p>']
  ];
  var p = Math.max(0, Math.min(pages.length - 1, s.page || 0)), pg = pages[p];
  return '<div class="kicker">' + (p + 1) + ' di ' + pages.length + '</div><h2>' + pg[0] + '</h2>' + pg[1] +
    '<div class="row intro-nav">' + (p > 0 ? '<button class="btn ghost" data-act="introprev">Indietro</button>' : '') + (p < pages.length - 1 ? '<button class="btn" data-act="intronext">Avanti</button>' : '<button class="btn" data-act="introdone">Si salpa!</button>') + '<button class="btn ghost small" data-act="introdone">Salta</button></div>';
}

/* ---------- eventi ---------- */
function handClick(id) {
  var g = G(), me = myIdx(); if (!g || me < 0) return;
  if (App.mode === 'drop') { var k = App.drop.indexOf(id); if (k >= 0) App.drop.splice(k, 1); else if (App.drop.length < g.players[me].hand.length - 5) App.drop.push(id); Sound.play('pick'); Game.render(); return; }
  App.card = id; App.sheet = { kind: 'card' }; Sound.play('pick'); Game.render(); renderSheet();
}
function playOn(q, as) {
  var g = G(), me = myIdx(), id = App.card; if (!g || id == null) return;
  var t = E.ty(id), Q = g.players[q];
  if ((t === 'saccheggio' || t === 'sabotaggio') && Q.eq.length) { App.sheet = { kind: 'pick', id: id, t: q, as: as }; renderSheet(); return; }
  if (t === 'incatenate' && Q.eq.length > 1) { App.sheet = { kind: 'pick', id: id, t: q, as: as }; renderSheet(); return; }
  var a = { a: 'play', id: id, t: q }; if (as) a.as = as;
  if (t === 'incatenate' && Q.eq.length === 1) a.pick = Q.eq[0];
  if (t === 'saccheggio' || t === 'sabotaggio') a.pick = 'hand';
  App.sheet = null; App.card = null; renderSheet(); act(a);
}
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-act'), g = G(), me = myIdx(), s = App.sheet;
  switch (a) {
    case 'sheetback': if (ev.target === el && s && ['intro', 'resp', 'ships', 'spectre'].indexOf(s.kind) < 0 && Date.now() - (App.sheetAt || 0) > 450) { App.sheet = null; if (s.kind === 'card') App.card = null; renderSheet(); if (G()) Game.render(); } return;
    case 'create': createTable(); break;
    case 'join': joinTable($('#joincode').value); break;
    case 'jointable': case 'lobbyjoin': joinTable(el.getAttribute('data-code')); break;
    case 'noinvite': App.inviteCode = null; history.replaceState(null, '', location.pathname); render(); break;
    case 'rules': App.sheet = { kind: 'rules' }; renderSheet(); break;
    case 'rulego': { var t = document.getElementById('r-' + el.getAttribute('data-r')); if (t) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); break; }
    case 'help': App.sheet = { kind: 'help', r: el.getAttribute('data-r'), back: s && s.kind !== 'help' ? s : null }; renderSheet(); break;
    case 'menu': App.sheet = { kind: 'menu' }; renderSheet(); break;
    case 'log': App.sheet = { kind: 'log' }; renderSheet(); break;
    case 'port': App.sheet = { kind: 'port' }; renderSheet(); break;
    case 'intro': App.sheet = { kind: 'intro', page: 0 }; renderSheet(); break;
    case 'intronext': s.page++; renderSheet(); break;
    case 'introprev': s.page--; renderSheet(); break;
    case 'introdone': lsSet('fz-intro-done', '1'); App.sheet = null; renderSheet(); if (App.doc) onDoc(); break;
    case 'showover': App.sheet = { kind: 'over' }; renderSheet(); break;
    case 'close': if (s && s.kind === 'help' && s.back) App.sheet = s.back; else { App.sheet = null; if (s && (s.kind === 'card' || s.kind === 'pick')) App.card = null; } renderSheet(); if (G()) Game.render(); break;
    case 'leave': App.sheet = null; if (Exit.ask()) renderSheet(); else leaveTable(); break;
    case 'invite': App.sheet = null; renderSheet(); invite(); break;
    case 'copylink': copyText(inviteLink(), 'Link d’invito copiato'); break;
    case 'addbot': send({ t: 'addbot' }); break;
    case 'kick': send({ t: 'kick', uid: el.getAttribute('data-uid') }); if (el.getAttribute('data-uid') === Net.uid) leaveTable(true); break;
    case 'start': send({ t: 'start' }); break;
    case 'rematch': App.sheet = null; App.sheetKey = null; send({ t: 'rematch' }); break;
    case 'totable': toTable(); break;
    case 'tohome': App.sheet = null; renderSheet(); toHome(); break;
    case 'lobbycode': { var jc = $('#joincode'); if (jc) { jc.focus(); jc.scrollIntoView({ block: 'center' }); } toast('Tavolo solo su invito: chiedi il codice a ' + esc(el.getAttribute('data-host') || 'chi l’ha aperto') + ' e scrivilo qui.'); break; }
    case 'closetable': App.sheet = { kind: 'closeconfirm' }; renderSheet(); break;
    case 'closeyes': App.sheet = null; renderSheet(); App.closing = true; if (!Net.closeTable()) { App.closing = false; toast('Sei offline: il tavolo non è stato chiuso. Riprova.'); } break;
    case 'takehost': App.sheet = null; renderSheet(); Net.takeHost(); toast('Ora sei tu a reggere il tavolo e a muovere i giocatori automatici.'); break;
    case 'auto': App.sheet = null; renderSheet(); send({ t: 'auto', p: +el.getAttribute('data-p'), on: !g.players[+el.getAttribute('data-p')].bot }); break;
    case 'resume': send({ t: 'back' }); break;
    case 'opp': App.sheet = { kind: 'player', p: +el.getAttribute('data-p') }; renderSheet(); break;
    case 'myrole': App.sheet = { kind: 'myrole' }; renderSheet(); break;
    case 'mycap': App.sheet = { kind: 'mycap' }; renderSheet(); break;
    case 'myship': App.sheet = { kind: 'myship' }; renderSheet(); break;
    case 'seecard': App.sheet = { kind: 'seecard', id: +el.getAttribute('data-id') }; renderSheet(); break;
    // il turno
    case 'hand': handClick(+el.getAttribute('data-id')); break;
    case 'cplay': { var id = App.card, as = el.getAttribute('data-as'); if (id == null) return; var op = { a: 'play', id: id }; if (as) op.as = as; App.sheet = null; App.card = null; renderSheet(); act(op); break; }
    case 'target': playOn(+el.getAttribute('data-p'), el.getAttribute('data-as')); break;
    case 'pick': { var pk = el.getAttribute('data-v'), op2 = { a: 'play', id: s.id, t: s.t, pick: pk === 'hand' ? 'hand' : +pk }; if (s.as) op2.as = s.as; App.sheet = null; App.card = null; renderSheet(); act(op2); break; }
    case 'end': {
      if (!g || g.turn !== me) return;
      if (g.players[me].hand.length > 5) { App.mode = 'drop'; App.drop = []; Game.render(); toast('Tocca le carte da scartare: alla fine del turno se ne tengono 5.'); return; }
      act({ a: 'end' }); break;
    }
    case 'dodrop': { var dr = App.drop.slice(); App.mode = null; App.drop = []; act({ a: 'end', drop: dr }); break; }
    case 'cancel': App.mode = null; App.drop = []; App.card = null; Game.render(); break;
    case 'openresp': App.sheet = { kind: 'resp' }; renderSheet(); break;
    case 'openships': App.sheet = { kind: 'ships' }; renderSheet(); break;
    case 'openspectre': App.sheet = { kind: 'spectre' }; renderSheet(); break;
    case 'resp': App.sheet = null; renderSheet(); act({ a: 'resp', id: +el.getAttribute('data-id') }); break;
    case 'take': App.sheet = null; renderSheet(); act({ a: 'take' }); break;
    case 'ship': { var i = el.getAttribute('data-i'); App.sheet = null; renderSheet(); act({ a: 'ship', i: i === 'deck' ? 'deck' : +i }); break; }
    case 'answer': App.sheet = null; renderSheet(); act({ a: 'answer', id: +el.getAttribute('data-id') }); break;
    case 'noanswer': App.sheet = null; renderSheet(); act({ a: 'answer' }); break;
  }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'opt-timer') send({ t: 'opt', timer: +ev.target.value });
  if (ev.target.id === 'opt-vis') send({ t: 'vis', vis: ev.target.value });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'joincode') joinTable(e.target.value);
  if (e.key === 'Escape') { if (App.sheet && ['intro', 'resp', 'ships', 'spectre'].indexOf(App.sheet.kind) < 0) { App.sheet = null; App.card = null; renderSheet(); if (G()) Game.render(); } else if (App.mode) { App.mode = null; App.drop = []; Game.render(); } }
});

/* ---------- avvio ---------- */
(function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.defs());
  var q = new URLSearchParams(location.search), t = (q.get('t') || '').toUpperCase(), last = lsGet(KEY_TABLE);
  if (/^[A-Z]{4}$/.test(t)) {
    if ((t === last || myNick()) && (!window.Account || Account.allowQuiet())) { App.status = 'Mi siedo al tavolo ' + t + '…'; run(function () { return enterTable(t, myNick() || null); }); }
    else App.inviteCode = t;
  } else if (last && /^[A-Z]{4}$/.test(last)) { App.status = 'Rientro al tavolo ' + last + '…'; run(function () { return enterTable(last, null); }); }
  render();
})();

</script>
</body>
</html>
