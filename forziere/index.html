<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root {
  --bg: #0f1d26; --deep: #081218; --panel: rgba(16, 32, 42, .9); --panel-2: rgba(58, 36, 18, .8);
  --ink: #f4f8ff; --muted: #c5d4ef; --dim: #8ea6cf; --gold: #ffd75e; --gold-2: #f0a91c; --coral: #ff7a59; --good: #8ff0a4; --bad: #ff8f80;
  --line: rgba(255, 215, 94, .38); --line-2: rgba(255, 255, 255, .16);
  --f-disp: "Baloo 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); overflow-x: clip; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.42; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background: linear-gradient(180deg, #081218 0%, #123040 55%, #1b4258 100%) fixed, var(--bg); }
body.busy { cursor: progress; }
h1, h2, h3, h4 { font-family: var(--f-disp); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 25px; display: flex; align-items: center; gap: 8px; }
h3 { font-size: 19px; color: var(--gold); }
p { margin: 0; }
a { color: var(--gold); }
.muted { color: var(--muted); }
.bad { color: var(--bad); } .good { color: var(--good); }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; display: inline-block; flex: none; }
.hide-s { display: none; }
@media (min-width: 560px) { .hide-s { display: inline; } }
.kicker { color: var(--gold); font: 800 12px var(--f-body); text-transform: uppercase; letter-spacing: .16em; }
.pn-c { color: color-mix(in srgb, var(--pc) 55%, #fff); }

/* ---------- elementi comuni ---------- */
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lobby { display: grid; gap: 16px; padding-block: 16px 40px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; box-shadow: 0 12px 30px rgba(4, 10, 16, .35); min-width: 0; }
.panel h2 { font-size: 24px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.lead { color: var(--muted); }
.notice { background: rgba(255, 215, 94, .14); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.notice.red { background: rgba(200, 50, 40, .3); border-color: rgba(255, 143, 128, .55); }
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 44px; padding: 10px 18px; font: 800 15.5px/1.15 var(--f-body); color: #3b2500; cursor: pointer;
  background: linear-gradient(180deg, #fff1a0, var(--gold) 50%, var(--gold-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 0 #a86a00, 0 8px 18px rgba(8, 24, 64, .35); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 0 #a86a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ghost { background: rgba(255, 255, 255, .1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.red { background: linear-gradient(180deg, #ff8a70, #d8402c); color: #fff; box-shadow: 0 3px 0 #7c1e12; }
.btn.small { min-height: 36px; padding: 7px 13px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .iconbtn:focus-visible, .chip:focus-visible, .opp:focus-visible, .slot:focus-visible, .pile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.iconbtn { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; min-height: 36px; padding: 5px 10px; font: 700 14px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.chip { appearance: none; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: 700 13px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip .dot { background: var(--coral); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; }
.field { width: 100%; font: 16px var(--f-body); color: #13284f; background: #f4f8ff; border: 0; border-radius: 12px; padding: 11px 14px; min-height: 44px; }
.field.code { text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; max-width: 170px; }
select.field { color: #13284f; }
.back-link { color: #eaf3ff; text-decoration: none; font-size: 15px; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.codebig { font-family: var(--f-disp); font-weight: 800; font-size: 56px; letter-spacing: .14em; color: var(--gold); line-height: 1; text-shadow: 0 3px 0 rgba(8, 24, 64, .45); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(13, 36, 84, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; flex-wrap: wrap; row-gap: 6px; justify-content: flex-end; }
.brand { font-family: var(--f-disp); font-weight: 800; font-size: 24px; color: var(--gold); min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { flex: 1; color: var(--muted); font-size: 14px; min-width: 0; }
@media (max-width: 640px) {
  .topbar .wrap { row-gap: 0; padding-block: 6px 8px; }
  .topbar .wrap > * { order: 2; }
  .topbar .wrap > .brand, .topbar .wrap > .info { order: 0; }
  .topbar .wrap::after { content: ""; order: 1; flex-basis: 100%; height: 6px; }
  .topbar .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
.seats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: 1px dashed var(--line-2); min-width: 0; }
.seat.full { border-style: solid; border-color: var(--line-2); background: rgba(255, 255, 255, .07); }
.seat .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 21px var(--f-disp); color: #fff; background: var(--pc); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2), 0 0 0 2px rgba(255, 255, 255, .5); flex: none; }
.seat .ava.empty { background: none; color: var(--dim); box-shadow: none; }
.seat .nm { font-weight: 800; overflow-wrap: anywhere; }
.seat .sub { color: var(--muted); font-size: 13px; }
.seat .x { margin-left: auto; appearance: none; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
.tt-opt { padding: 10px 0; border-top: 1px solid var(--line-2); }
.toast { pointer-events: none; position: fixed; left: 50%; top: calc(108px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; background: rgba(10, 20, 28, .96); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 14px; max-width: min(92vw, 480px); font-size: 15px; box-shadow: 0 10px 26px rgba(0, 0, 0, .45); animation: up .25s var(--ease); }
.toast.bad { border-color: var(--bad); }

/* ---------- carte (3D) ---------- */
.skc { display: block; position: relative; width: var(--cw, 60px); aspect-ratio: 100 / 140; perspective: 700px; flex: none; }
.skc-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s var(--ease); }
.skc-f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 9%/6.5%; filter: drop-shadow(0 2px 2.5px rgba(4, 10, 16, .45)); }
.skc-back { transform: rotateY(180deg); }
.skc:not(.up) .skc-in, .predown .skc-in { transform: rotateY(180deg); }
.predown .skc-in { transition: none; }
.skc-svg { display: block; width: 100%; height: 100%; }
.skc.flipin .skc-in { animation: flipin .6s var(--ease); }
@keyframes flipin { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(90deg) scale(1.12); } 100% { transform: rotateY(0) scale(1); } }
.skc.flat { --cw: 40px; }
.flyhide { visibility: hidden !important; }
.rrow { display: inline-flex; gap: 3px; vertical-align: middle; margin: 4px 0; }
.rrow .skc { --cw: 34px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; align-items: center; grid-template-columns: 1fr; padding: 22px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, .35); overflow: hidden; position: relative;
  background: radial-gradient(60% 70% at 85% 15%, rgba(255, 207, 63, .35), transparent 60%), linear-gradient(180deg, #d6a800 0%, #7a4a22 55%, #24160c 100%); box-shadow: 0 16px 40px rgba(8, 24, 64, .35); }
.hero::before { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30px; height: 90px; background: radial-gradient(closest-side, rgba(255, 255, 255, .85), transparent) 0 0 / 120px 90px repeat-x; opacity: .7; pointer-events: none; animation: drift 40s linear infinite; }
@media (min-width: 820px) { .hero { grid-template-columns: 1.1fr .9fr; } }
.hero-txt { position: relative; }
.hero .kicker { color: #7a2c10; }
.hero h1 { font-size: clamp(56px, 15vw, 104px); line-height: .9; color: #fff; text-shadow: 0 4px 0 #7a4a22, 0 10px 26px rgba(10, 20, 28, .45); margin-top: 6px; letter-spacing: .01em; }
.hero .tag { color: #12305f; margin-top: 12px; max-width: 54ch; font-weight: 700; }
.hero-art { position: relative; height: 200px; max-width: 380px; width: 100%; justify-self: center; }
.hero-balloon { position: absolute; width: 120px; left: 50%; top: -14px; margin-left: -60px; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(10, 20, 28, .35)); }
@keyframes bob { 50% { transform: translateY(-10px) rotate(3deg); } }
.hero-art .hc { position: absolute; bottom: 0; filter: drop-shadow(0 8px 12px rgba(10, 20, 28, .4)); }
.hero-art .skc { --cw: 70px; }
.hc1 { left: 2%; transform: rotate(-18deg) translateY(-6px); } .hc2 { left: 17%; transform: rotate(-9deg) translateY(-18px); } .hc3 { left: 33%; transform: rotate(-1deg) translateY(-24px); }
.hc4 { left: 49%; transform: rotate(7deg) translateY(-18px); } .hc5 { left: 64%; transform: rotate(15deg) translateY(-6px); } .hc6 { left: 79%; transform: rotate(23deg) translateY(8px); }
@keyframes drift { to { background-position: 1200px 0; } }


/* ---------- schermata di gioco: barra in alto, cartellini, istruzioni ---------- */
.gv-top { display: flex; align-items: center; gap: 6px; padding: 5px max(10px, env(safe-area-inset-right, 0px)) 5px max(10px, env(safe-area-inset-left, 0px)); background: rgba(10, 20, 28, .72); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); min-width: 0; }
.gv-info { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gv-info b { font-family: var(--f-disp); font-size: 19px; font-weight: 800; color: var(--gold); }
.brandbtn { font-size: 18px; padding: 4px 10px; }
.tt { color: var(--bad); margin-left: 6px; }
.pv { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--f-disp); color: #fff; background: var(--pc); flex: none; box-shadow: 0 0 0 2px rgba(255, 255, 255, .55); }
.pv.big { width: 54px; height: 54px; font-size: 30px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font: 800 10px var(--f-body); text-transform: uppercase; letter-spacing: .04em; border-radius: 6px; padding: 1px 5px; background: rgba(255, 255, 255, .14); }
.tag.end { background: var(--gold); color: #4a2a00; } .tag.away { background: #c8402c; } .tag.bot { background: #3a5a8a; } .tag.wait { background: rgba(255, 255, 255, .18); animation: pulse 1.4s ease-in-out infinite; } .tag.ok { background: #2f9a58; }
@keyframes pulse { 50% { opacity: .5; } }
/* barra delle istruzioni */
.gv-prompt { display: flex; align-items: center; gap: 8px; margin: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); padding: 7px 8px 7px 12px; border-radius: 14px; background: rgba(10, 20, 28, .78); backdrop-filter: blur(8px); border: 1px solid var(--line); flex-wrap: wrap; box-shadow: 0 6px 18px rgba(4, 10, 16, .3); }
.pr-txt { flex: 1; font-size: 14.5px; line-height: 1.3; min-width: 160px; }
.pr-txt b { color: #ffe7a0; }
.pr-b { display: flex; gap: 6px; align-items: center; margin-left: auto; flex: none; }
.gv-prompt .help { color: var(--gold); border-color: var(--line); border-radius: 50%; width: 36px; height: 36px; padding: 0; justify-content: center; }
.gv-prompt .help .ic { width: 22px; height: 22px; }

/* animazioni: carte in volo, scintille, testi */
.flyer { position: fixed; z-index: 70; pointer-events: none; transform-origin: 0 0; will-change: transform; }
.flyer .skc { --cw: 100% !important; width: 100%; }
.flyer.still.glow .skc { animation: colglow .65s ease-in-out; }
@keyframes colglow { 0%, 100% { transform: none; } 20% { transform: translateY(-4px) rotate(-3deg); filter: drop-shadow(0 0 10px #fff6c8); } 50% { transform: translateY(-6px) rotate(3deg) scale(1.08); filter: drop-shadow(0 0 16px #ffd75e); } 80% { transform: translateY(-3px) rotate(-2deg); } }
.burst { position: fixed; z-index: 72; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; animation: burst .8s var(--ease) forwards; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
.floatxt { position: fixed; z-index: 73; pointer-events: none; transform: translate(-50%, -50%); font: 800 20px var(--f-disp); color: #fff; text-shadow: 0 2px 0 #24160c, 0 0 14px rgba(143, 227, 255, .9); animation: floatup 1.5s var(--ease) forwards; white-space: nowrap; }
.floatxt.col { font-size: 24px; color: var(--gold); text-shadow: 0 2px 0 #6b3a00, 0 0 20px rgba(255, 215, 94, .9); }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
.banner { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; pointer-events: none; }
.banner span { display: grid; justify-items: center; font: 800 clamp(36px, 10vw, 74px)/1 var(--f-disp); color: #fff; text-shadow: 0 4px 0 #7a4a22, 0 0 40px rgba(255, 215, 94, .8); animation: ban 2.2s var(--ease) forwards; text-align: center; padding: 0 12px; }
.banner small { font: 800 16px var(--f-body); color: var(--gold); text-shadow: 0 2px 4px rgba(0, 0, 0, .6); margin-top: 8px; letter-spacing: .04em; }
@keyframes ban { 0% { transform: scale(.6); opacity: 0; } 18% { transform: scale(1.05); opacity: 1; } 75% { opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
.confetti { position: fixed; inset: 0; z-index: 95; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: conf linear forwards; }
@keyframes conf { to { transform: translateY(110vh) rotate(var(--r)); } }

/* ---------- finestre ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 60; background: rgba(4, 10, 16, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet-back.still, .sheet-back.still .sheet, .sheet-back.still .rr-row, .sheet-back.still .stamp, .sheet-back.still .tbar i { animation: none; }
.sheet { width: 100%; max-width: 640px; max-height: calc(90vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: linear-gradient(180deg, #7a4a22, #24160c); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; box-shadow: 0 -12px 40px rgba(0, 0, 0, .5); animation: up .28s var(--ease); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line-2); } }
.sheet .lead { font-size: 15.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.gc { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 3px 8px; font-size: 13.5px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-2); }
.phead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.pboard { display: grid; justify-items: center; padding: 10px; border-radius: 14px; background: rgba(0, 0, 0, .15); }
.pboard .board { gap: 6px; } .pboard .board .skc { --cw: min(60px, 18vw); } .pboard .board .slot.gone { --cw: min(60px, 18vw); }
.loglist { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.loglist .fl { font-size: 14px; border-left: 3px solid var(--line-2); padding: 3px 8px; }
.loglist .fl.k-col, .loglist .fl.k-end { color: var(--gold); } .loglist .fl.k-double { color: var(--bad); }
.intro-art { display: grid; justify-items: center; gap: 4px; }
.intro-nav { justify-content: flex-end; margin-top: 6px; }
.rules { display: grid; gap: 14px; }
.rsec { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 7px; scroll-margin-top: 10px; }
.rsec ul, .rsec ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.rbox { background: rgba(255, 215, 94, .12); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.rtoc { display: flex; flex-wrap: wrap; gap: 6px; }
.rgrid { display: inline-grid; grid-template-columns: repeat(4, auto); gap: 3px; padding: 6px; border-radius: 10px; background: rgba(0, 0, 0, .18); vertical-align: middle; justify-self: start; }
.rgrid .skc { --cw: 30px; }
.rgrid .rg.hi .skc { box-shadow: 0 0 0 2px var(--gold), 0 0 10px var(--gold); border-radius: 4px; }
.rgap { display: block; width: 30px; aspect-ratio: 100 / 140; border: 1px dashed rgba(255, 255, 255, .3); border-radius: 4px; }
.rarrow { display: inline-block; margin: 0 8px; font: 800 26px var(--f-disp); color: var(--gold); vertical-align: middle; }
.rbands { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.rband { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.rband .skc { --cw: 34px; }
.rband small b { display: block; color: var(--ink); text-transform: capitalize; font-size: 14px; }
/* punti della manche */
.rr { display: grid; gap: 6px; }
.rr-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 14px; background: rgba(255, 255, 255, .07); border-left: 5px solid var(--pc); animation: up .45s var(--ease) both; }
.rr-row.me { background: rgba(255, 215, 94, .14); }
.rr-n { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.rr-n b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.rr-p { display: grid; justify-items: end; position: relative; min-width: 56px; }
.rr-p b { font: 800 28px/1 var(--f-disp); color: #fff; }
.rr-p b.neg { color: var(--good); }
.rr-p small { color: var(--gold); font-weight: 800; font-size: 12px; }
.rr-p s { color: var(--dim); font-size: 13px; }
.stamp { position: absolute; right: -6px; top: -12px; font: 800 18px var(--f-disp); color: #fff; background: #d8402c; border-radius: 8px; padding: 0 6px; transform: rotate(12deg); box-shadow: 0 2px 8px rgba(0, 0, 0, .4); animation: stamp .5s var(--ease) both; }
@keyframes stamp { from { transform: scale(3) rotate(-20deg); opacity: 0; } }
.target { display: grid; gap: 4px; margin-top: 4px; }
.target small { color: var(--dim); font-size: 12px; }
.tbar { position: relative; display: block; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.tbar i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 70%, #fff), var(--pc)); border-radius: 999px; animation: grow 1s var(--ease) both .3s; }
@keyframes grow { from { width: 0; } }
.tbar b { position: relative; font-size: 12.5px; padding-left: 10px; line-height: 22px; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
/* segnapunti */
.card-note { background: #fffdf3 repeating-linear-gradient(180deg, transparent 0 25px, #cfe0f5 25px 26px); border-radius: 12px; padding: 10px; overflow-x: auto; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
.scard { border-collapse: collapse; width: 100%; color: #1c2c4c; font: 700 14px var(--f-body); }

.scard tr.tot td { border-top: 2px solid #1c2c4c; font: 800 18px var(--f-disp); }
.scard tr.tot td.best { color: #c22a22; }
/* fine partita */
.over { display: grid; gap: 10px; text-align: center; justify-items: center; }
.over-balloon { width: 110px; animation: bob 4s ease-in-out infinite; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: 100%; margin-top: 6px; }
.pod { display: grid; justify-items: center; gap: 4px; width: 30%; max-width: 140px; }
.pod b { font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod-s { font: 800 22px var(--f-disp); color: var(--gold); }
.pod-b { width: 100%; display: grid; place-items: center; font: 800 26px var(--f-disp); color: #13284f; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, #fff, #c9dcf5); }
.pod.p1 { order: 2; } .pod.p1 .pod-b { height: 86px; background: linear-gradient(180deg, #fff1a0, var(--gold-2)); }
.pod.p2 { order: 1; } .pod.p2 .pod-b { height: 62px; }
.pod.p3 { order: 3; } .pod.p3 .pod-b { height: 44px; background: linear-gradient(180deg, #ffd6b8, #d88a52); }
.lastround { width: 100%; text-align: left; }
.lastround summary { cursor: pointer; color: var(--gold); font-weight: 800; padding: 4px 0; }



/* ===== Il Forziere Maledetto ===== */
:root { --f-disp: "Pirata One", Georgia, serif; --gold: #f2c14e; --gold-2: #d99a1f; --paper: #fbf1d9; --sea: #164c66; --wood: #6b4022; --lev: #c0392b; --pon: #2d6fb8; }
h1, h2, h3, h4 { font-weight: 400; letter-spacing: .01em; }
h3 { font-family: var(--f-disp); font-size: 21px; }
body { background: radial-gradient(90% 60% at 50% -10%, rgba(242, 193, 78, .12), transparent 60%), linear-gradient(180deg, #081218 0%, #0f2a38 50%, #133a4e 100%) fixed, #0f1d26; }
.hero { background: radial-gradient(60% 70% at 85% 10%, rgba(242, 193, 78, .35), transparent 60%), linear-gradient(180deg, #2c6f8f 0%, #164c66 50%, #0b2a3d 100%); border-color: rgba(242, 193, 78, .45); }
.hero h1 { font-size: clamp(48px, 12vw, 92px); text-shadow: 0 4px 0 #5a3517, 0 10px 26px rgba(0, 0, 0, .5); }
.hero .kicker { color: var(--gold); }
.hero .tag { color: #f3e8d2; font-weight: 600; }
.hero-art { height: 210px; }
.hero-art .hship { position: absolute; left: 50%; top: -6px; width: 170px; margin-left: -85px; animation: bob 6s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .4)); }
.hero-art .hc { width: 74px; bottom: 0; }
.hero-art .hc1 { left: 6%; } .hero-art .hc2 { left: 28%; } .hero-art .hc3 { left: 50%; } .hero-art .hc4 { left: 72%; transform: rotate(16deg) translateY(-2px); }
.hero-art .fzc { width: 74px; display: block; }
.banner span { text-shadow: 0 4px 0 #5a3517, 0 0 40px rgba(242, 193, 78, .7); font-weight: 400; }
.sheet { background: linear-gradient(180deg, #1d3a4a, #0f2230); border-color: rgba(242, 193, 78, .3); }
.sheet-back { background: rgba(4, 10, 16, .62); }

/* carte */
.fzc { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .35)); }
.sym { width: 1.1em; height: 1.1em; vertical-align: -.2em; }
.kc { padding: 1px 7px; border-radius: 6px; color: #fff; font-weight: 800; }
.kc.atk { background: #b8322a; } .kc.def { background: #2d6fb8; } .kc.act { background: #3a3027; } .kc.eq { background: #2f8f55; } .kc.multi { background: linear-gradient(90deg, #b8322a 50%, #2d6fb8 50%); }

/* ruoli e capitani */
.rb { display: inline-flex; align-items: center; gap: 4px; font: 800 11px var(--f-body); text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px 2px 5px; border-radius: 999px; background: var(--rc); color: #fff; white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }

.rb .ic { width: 13px; height: 13px; }
.capf { width: 38px; height: 38px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font: 400 17px var(--f-disp); color: #2a1a0e; background: radial-gradient(circle at 35% 30%, #fff6dc, #e2c48a); box-shadow: 0 0 0 3px var(--pc), 0 3px 8px rgba(0, 0, 0, .4); }
.rolecard { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .4)); }

/* tracciato del Forziere */
.gv-board { margin: 6px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); padding: 8px 10px; border-radius: 16px; background: linear-gradient(180deg, rgba(251, 241, 217, .1), rgba(251, 241, 217, .04)); border: 1px solid rgba(242, 193, 78, .3); display: grid; gap: 7px; position: relative; z-index: 1; }
.track { display: grid; grid-template-columns: auto repeat(var(--n), minmax(0, 1fr)) auto; align-items: center; gap: 2px; }
.track .tl, .track .tr { font: 400 15px var(--f-disp); padding: 0 6px; }
.track .tl { color: #ff9c8f; } .track .tr { color: #8fc1ff; text-align: right; }
.tk { position: relative; height: 26px; border-radius: 5px; background: rgba(255, 255, 255, .07); display: grid; place-items: center; }

.tk.zl { background: rgba(192, 57, 43, .35); } .tk.zp { background: rgba(45, 111, 184, .38); }

.bchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bchip { display: inline-flex; align-items: center; gap: 5px; font: 700 13px var(--f-body); padding: 3px 9px; border-radius: 999px; background: rgba(0, 0, 0, .25); border: 1px solid rgba(255, 255, 255, .12); color: var(--ink); }

.bchip.ghost { background: rgba(95, 185, 168, .25); border-color: #5fb9a8; color: #c9fff2; }
.bchip.gorgo { background: rgba(123, 63, 143, .35); border-color: #b77ad0; animation: pulse 1.6s ease-in-out infinite; }

/* mare */
.gv { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 6px; position: relative; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sea { position: fixed; inset: auto 0 0 0; height: 40vh; pointer-events: none; z-index: 0; overflow: hidden; }
.sea .wv { position: absolute; left: -20%; right: -20%; height: 120px; border-radius: 50%; background: rgba(44, 111, 143, .12); animation: swell 9s ease-in-out infinite; }
.sea .w1 { bottom: -40px; } .sea .w2 { bottom: -70px; animation-delay: -3s; background: rgba(44, 111, 143, .16); } .sea .w3 { bottom: -100px; animation-delay: -6s; background: rgba(11, 42, 61, .5); }
@keyframes swell { 50% { transform: translateX(6%) translateY(-10px); } }
.gv-top, .gv-prompt, .gv-opp, .gv-me { position: relative; z-index: 1; }

/* avversari */
.gv-opp { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
.opp { appearance: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: grid; gap: 4px; padding: 8px 9px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .14); background: linear-gradient(180deg, rgba(20, 44, 58, .92), rgba(12, 28, 38, .92)); box-shadow: inset 3px 0 0 var(--pc); min-width: 0; transition: transform .15s, box-shadow .2s; }
.opp.on { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--pc), 0 0 0 2px rgba(242, 193, 78, .45), 0 0 18px rgba(242, 193, 78, .25); }
.opp.noship { opacity: .72; }
.opp.shake, .gv-me.shake { animation: shake .5s; }
@keyframes shake { 20% { transform: translateX(-5px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.opp-h { display: flex; align-items: center; gap: 6px; min-width: 0; }
.opp-h b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.opp-s { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 18px; }
.opp-s .sn { font: 400 15px var(--f-disp); color: #ffe7a0; }
.opp-x { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.opp-x > span { display: inline-flex; align-items: center; gap: 3px; }
.opp-x .cap { margin-left: auto; font-style: italic; }
.opp-eq, .meq { display: flex; gap: 4px; flex-wrap: wrap; }
.opp-t { display: flex; gap: 4px; flex-wrap: wrap; }
.opp-t:empty, .opp-eq:empty { display: none; }
.tag.turn { background: var(--gold); color: #3a2207; } .tag.ghost { background: #2f7f72; } .tag.gorgo { background: #7b3f8f; }
.eqc { font: 700 11px var(--f-body); padding: 2px 7px; border-radius: 6px; background: rgba(47, 143, 85, .35); border: 1px solid rgba(110, 220, 150, .45); color: #d8ffe6; white-space: nowrap; }
.eqc.big { font-size: 13px; padding: 5px 10px; cursor: pointer; appearance: none; }
.coins { display: inline-flex; align-items: center; gap: 3px; color: #ffd75e; font-weight: 800; }
.dist { color: #bfe3ff; }
.bars { display: inline-flex; gap: 2px; flex-wrap: wrap; }
.bars i { width: 9px; height: 12px; border-radius: 3px; background: linear-gradient(180deg, #c8884a, #7a4b22); box-shadow: inset 0 3px 0 -1px #4a2a12, inset 0 -3px 0 -1px #4a2a12; }
.bars i.off { background: rgba(255, 255, 255, .12); box-shadow: none; }
.bars i.xtra { outline: 1px solid #8ff0a4; }

/* la mia plancia */
.gv-me { margin-top: auto; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(58, 36, 18, .94), rgba(36, 22, 12, .97)); border-top: 2px solid rgba(242, 193, 78, .45); border-radius: 20px 20px 0 0; display: grid; gap: 8px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .4); }
.me-h { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.mrole, .mcap, .mship { appearance: none; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; text-align: left; border-radius: 12px; padding: 6px 10px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(0, 0, 0, .22); min-width: 0; }
.mrole { border-color: var(--rc); box-shadow: inset 4px 0 0 var(--rc); }
.mrole .ic { font-size: 20px; color: #fff; }
.mrole small, .mcap small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.mrole b, .mcap b { font: 400 17px var(--f-disp); }
.me-h .coins { margin-left: auto; font-size: 18px; }
.me-b { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mship { flex: 1 1 260px; }
.mship .shipart { width: 74px; flex: none; }
.ms-t { display: grid; gap: 3px; min-width: 0; }
.ms-t b { font: 400 18px var(--f-disp); color: #ffe7a0; }
.ms-s { display: flex; gap: 10px; font-size: 13px; color: var(--muted); }
.ms-s span { display: inline-flex; gap: 3px; align-items: center; }
.mship.none { cursor: default; color: var(--muted); font-size: 14px; }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; scroll-snap-type: x proximity; }
.hand .empty { padding: 10px; font-size: 14px; }
.hc { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; flex: none; width: clamp(64px, calc((100vw - 60px) / 5.4), 104px); scroll-snap-align: start; transition: transform .15s; position: relative; color: inherit; font: inherit; }
.hc.can { transform: translateY(-3px); }
.hc.can .fzc { filter: drop-shadow(0 0 6px rgba(242, 193, 78, .75)); }
.hc.sel { transform: translateY(-8px); }
.hc.sel .fzc { filter: drop-shadow(0 0 0 3px #fff) drop-shadow(0 0 10px #ffe08a); outline: 3px solid #ffe08a; border-radius: 9px; }
.hand.dropping .hc.sel .fzc { outline-color: #ff8f80; opacity: .75; }
.hc small { display: block; text-align: center; font-size: 12px; margin-top: 3px; }
.gv-prompt { margin-top: 2px; background: rgba(10, 20, 28, .85); border-color: rgba(242, 193, 78, .4); }

/* finestre di gioco */
.cinfo { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: start; }
.cbig { display: block; width: 110px; }
.cinfo h2 { margin: 3px 0 6px; }
.tgts { display: grid; gap: 6px; }
.tgtb { appearance: none; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 9px; text-align: left; padding: 9px 11px; border-radius: 13px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(0, 0, 0, .25); box-shadow: inset 3px 0 0 var(--pc); }
.tgtb:hover, .tgtb:focus-visible { border-color: var(--gold); outline: none; }
.tb-t { flex: 1; min-width: 0; display: grid; }
.tb-t small { color: var(--muted); font-size: 12.5px; }
.resp { display: flex; gap: 8px; flex-wrap: wrap; }
.resp .hc { width: 92px; }
.ships { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.shipb { appearance: none; border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-align: left; }
.shipcard { display: grid; gap: 4px; padding: 10px; border-radius: 14px; background: linear-gradient(180deg, rgba(251, 241, 217, .12), rgba(251, 241, 217, .05)); border: 1px solid rgba(242, 193, 78, .35); }
.shipb:hover .shipcard, .shipb:focus-visible .shipcard { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242, 193, 78, .4); }
.shipcard b { font: 400 20px var(--f-disp); color: #ffe7a0; }
.shipcard small { color: var(--muted); font-size: 13px; }
.shipart { width: 100%; height: auto; display: block; }
.sst { display: flex; gap: 10px; font-size: 14px; font-weight: 800; }
.sst span { display: inline-flex; gap: 3px; align-items: center; }
.pcap { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(0, 0, 0, .2); }
.pcap.big .capf { width: 64px; height: 64px; font-size: 28px; }
.eqlist { display: grid; gap: 4px; }
.eqrow { font-size: 14px; }
.pickl { display: grid; gap: 6px; }
.rtab { width: 100%; border-collapse: collapse; font-size: 14px; }
.rtab th, .rtab td { text-align: left; padding: 5px 6px; border-bottom: 1px solid rgba(255, 255, 255, .1); vertical-align: top; }
.rcards, .rlist { display: grid; gap: 8px; }
.rc { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; font-size: 14px; }
.rc-c .fzc { width: 56px; }
.rl { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.rships { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.rships .shipcard { padding: 8px; } .rships .shipcard b { font-size: 17px; }
.olist { display: grid; gap: 5px; width: 100%; text-align: left; }
.orow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; background: rgba(0, 0, 0, .22); box-shadow: inset 3px 0 0 var(--pc); }
.orow b { flex: 1; min-width: 0; }
.orow.win { background: rgba(242, 193, 78, .16); }
.ochest { font-size: 64px; color: var(--gold); filter: drop-shadow(0 0 18px rgba(242, 193, 78, .7)); animation: bob 4s ease-in-out infinite; }
.over .track { width: 100%; }
.ball { position: fixed; z-index: 74; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #777, #111); box-shadow: 0 0 10px rgba(255, 160, 60, .8); pointer-events: none; }
.ball.card { width: 26px; height: 36px; margin: -18px -13px; border-radius: 4px; background: linear-gradient(180deg, #3a1f12, #120805); box-shadow: 0 0 0 1px #c9a24b; }
.popcard { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; pointer-events: none; }
.popcard > div { width: 150px; display: grid; gap: 6px; justify-items: center; animation: pop .35s var(--ease); }
.popcard small { font: 400 20px var(--f-disp); color: #c9fff2; text-shadow: 0 2px 6px #000; }
.popcard.out > div { transition: opacity .3s, transform .3s; opacity: 0; transform: scale(.8); }
@keyframes pop { from { transform: scale(.5) rotate(-8deg); opacity: 0; } }
.floatxt.good { color: #c9ffd6; } .floatxt.bad { color: #ffb3a8; text-shadow: 0 2px 0 #5a1208, 0 0 14px rgba(255, 90, 60, .8); }
.floatxt.gold { color: #ffd75e; text-shadow: 0 2px 0 #6b3a00, 0 0 20px rgba(255, 215, 94, .9); }

@media (max-width: 420px) {
  .gv-opp { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opp { padding: 7px; }
  .opp-x .cap { display: none; }
  .track .tl, .track .tr { font-size: 12px; padding: 0 3px; }
  .cinfo { grid-template-columns: 84px 1fr; } .cbig { width: 84px; }
  .mrole b, .mcap b { font-size: 15px; }
}
.hero p.tag { display: block; font: 600 16px/1.45 var(--f-body); text-transform: none; letter-spacing: 0; background: none; padding: 0; border-radius: 0; color: #f3e8d2; }

/* ===== tavolo rotondo ===== */
.gv-table { position: relative; z-index: 1; padding: 0 max(4px, env(safe-area-inset-right, 0px)) 0 max(4px, env(safe-area-inset-left, 0px)); }
.felt { position: relative; width: 100%; max-width: 760px; margin: 22px auto 14px; aspect-ratio: 1 / .9; max-height: 64vh; min-height: 340px;
  border-radius: 50%; background: radial-gradient(ellipse at 50% 45%, #2c6f8f 0%, #164c66 48%, #0b2a3d 70%, transparent 71%),
  radial-gradient(ellipse at 50% 50%, #8a5a2e 0 70%, #4a2a12 72%, transparent 73.5%); }
.felt::before { content: ""; position: absolute; inset: 16%; border-radius: 50%; border: 1px dashed rgba(251, 241, 217, .22); pointer-events: none; }
.seat { position: absolute; width: 86px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; z-index: 3; cursor: pointer; padding: 4px 3px 7px; border-radius: 14px; background: rgba(8, 18, 26, .82); border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 4px 12px rgba(0, 0, 0, .45); transition: box-shadow .25s, border-color .25s; -webkit-tap-highlight-color: transparent; }

.seat.ask { border-color: #ff8f80; box-shadow: 0 0 0 2px rgba(255, 143, 128, .55), 0 0 22px rgba(255, 110, 90, .45); animation: askp 1.3s ease-in-out infinite; }
@keyframes askp { 50% { box-shadow: 0 0 0 4px rgba(255, 143, 128, .3), 0 0 26px rgba(255, 110, 90, .6); } }
.seat.noship { opacity: .8; }

<script>
window.GAME_PREFIX = 'forziere/v1/';
/* ===== Il Forziere Maledetto: motore delle regole (gira sull'host; lo stato è JSON) =====
   Da 4 a 8 giocatori, ruoli segreti. Due flotte rivali, Levante e Ponente, vogliono portare il Forziere
   fino alla propria bandiera sul tracciato; il Pirata (in 5 e 7) o i due Corsari (in 4, 6 e 8) giocano da soli:
   vogliono dobloni e il Forziere vicino al centro.
   - Tracciato: il Forziere parte da 0; la bandiera di Levante sta a −F, quella di Ponente a +F (F = 5 in 4–5
     giocatori, 6 con più giocatori). Quando una nave affonda il Forziere si sposta del valore della nave verso la
     bandiera avversaria della flotta del capitano affondato (+1 se era un Ammiraglio); se affonda il Pirata, verso
     la bandiera di chi l'ha affondato.
   - Ogni nave ha valore (passi del Forziere), gittata, munizioni (carte Attacco per turno) e barili (scafo).
   - Turno: senza nave se ne prende una (dalla fila di 3 o dal mazzo delle navi), si pescano 2 carte, si giocano
     le carte, a fine turno si tengono al massimo 5 carte.
   - Chi affonda una nave prende un doblone dalla Clessidra. Un ruolo ancora coperto vale 1 doblone.
   - Il mazzo che finisce toglie un doblone dalla Clessidra e avvicina le bandiere al centro.
   - Fine: il Pirata o un Corsaro con 4 dobloni vince subito; dopo un affondamento il Forziere su una bandiera fa
     vincere quella flotta; con la Clessidra vuota arriva il Gorgo e, al primo giocatore che non sa rispondere,
     si guarda dove sta il Forziere. */
var FZEngine = (function () {
  var rand = Math.random;
  function setRandom(f) { rand = f || Math.random; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---------- dati ---------- */
  // k: atk = Attacco (rosso), def = Difesa (blu), act = Azione (nero), eq = Equipaggiamento (verde), multi = Attacco o Difesa
  var T = {
    bordata: { n: 'Bordata', k: 'atk', c: 18, d: 'Colpo contro una nave entro la tua gittata.' },
    arrembaggio: { n: 'Arrembaggio', k: 'atk', c: 2, d: 'Colpo contro una nave a distanza 1. Se va a segno prendi anche 1 carta a caso dalla sua mano.' },
    incatenate: { n: 'Palle incatenate', k: 'atk', c: 2, d: 'Colpo contro una nave entro la tua gittata. Se va a segno, il bersaglio perde anche un suo Equipaggiamento.' },
    moschetto: { n: 'Moschetto', k: 'multi', c: 4, d: 'Attacco: colpo contro una nave a distanza 1. Oppure Difesa: annulla un colpo, come una Virata.' },
    virata: { n: 'Virata', k: 'def', c: 10, d: 'Fuori dal tuo turno: annulla un colpo diretto a te.' },
    bianca: { n: 'Bandiera bianca', k: 'def', c: 2, d: 'Fuori dal tuo turno: annulla qualsiasi carta giocata contro di te, anche se non è un colpo.' },
    rum: { n: 'Rum', k: 'act', c: 5, d: 'Recuperi 1 barile, fino al massimo della tua nave.' },
    vedetta: { n: 'Vedetta', k: 'act', c: 3, d: 'Peschi 2 carte.' },
    saccheggio: { n: 'Saccheggio', k: 'act', c: 3, d: 'Prendi 1 carta a una nave a distanza 1: a caso dalla mano, oppure un suo Equipaggiamento.' },
    sabotaggio: { n: 'Sabotaggio', k: 'act', c: 3, d: 'Un giocatore con una nave, a qualsiasi distanza, scarta 1 carta: a caso dalla mano, oppure un Equipaggiamento.' },
    burrasca: { n: 'Burrasca', k: 'act', c: 1, d: 'Colpo contro tutte le altre navi: ognuna perde 1 barile, se non lo evita.' },
    mostro: { n: 'Mostro degli abissi', k: 'act', c: 1, d: 'Ogni altra nave deve scartare una Bordata, altrimenti perde 1 barile.' },
    sfida: { n: 'Sfida a sciabole', k: 'act', c: 2, d: 'Sfidi un giocatore con una nave, a qualsiasi distanza: a turno, cominciando da lui, scartate una Bordata. Il primo che non lo fa perde 1 barile.' },
    spettro: { n: 'Vascello spettrale', k: 'act', c: 2, d: 'Metti il Vascello spettrale sulla nave di un altro giocatore (o spostalo, se è già in mare). Se è già arrivato il Gorgo, peschi solo 1 carta.' },
    porto: { n: 'Porto franco', k: 'act', c: 1, d: 'Tutte le navi recuperano 1 barile, poi peschi 1 carta.' },
    rifornimento: { n: 'Rifornimento', k: 'act', c: 2, d: 'Una nave a tua scelta (anche la tua) recupera 1 barile, anche oltre il massimo.' },
    lettera: { n: 'Lettera intercettata', k: 'act', c: 1, d: 'Guardi di nascosto il ruolo di un altro giocatore.' },
    cannoniera: { n: 'Cannoniera', k: 'eq', c: 2, d: 'I colpi delle tue carte Attacco tolgono 1 barile in più.' },
    coffa: { n: 'Coffa di vedetta', k: 'eq', c: 2, d: 'La gittata della tua nave aumenta di 1.' },
    nebbia: { n: 'Banco di nebbia', k: 'eq', c: 2, d: 'Gli altri ti vedono a distanza +1.' },
    polena: { n: 'Polena portafortuna', k: 'eq', c: 2, d: 'Quando ti arriva un colpo si scopre la prima carta del mazzo: se ha l’Ancora, il colpo va a vuoto.' },
    fasciame: { n: 'Fasciame di quercia', k: 'eq', c: 1, d: 'La tua nave tiene 1 barile in più. Quando lo giochi recuperi 1 barile.' },
    cassa: { n: 'Cassa di munizioni', k: 'eq', c: 1, d: 'Puoi giocare 1 carta Attacco in più per turno.' }
  };
  var ORDER = ['bordata', 'arrembaggio', 'incatenate', 'moschetto', 'virata', 'bianca', 'rum', 'vedetta', 'saccheggio', 'sabotaggio', 'burrasca', 'mostro', 'sfida', 'spettro', 'porto', 'rifornimento', 'lettera', 'cannoniera', 'coffa', 'nebbia', 'polena', 'fasciame', 'cassa'];
  // simbolo nell'angolo: A Ancora (1 carta su 2), T Timone (1 su 4), X Teschio (1 su 8), P Perla (1 su 8)
  var SYM = { A: 'Ancora', T: 'Timone', X: 'Teschio', P: 'Perla' };
  var CARDS = (function () {
    var out = [], pat = ['A', 'T', 'A', 'X', 'A', 'T', 'A', 'P'];
    ORDER.forEach(function (t) { for (var i = 0; i < T[t].c; i++) out.push({ t: t, s: pat[out.length % 8] }); });
    return out;
  })();
  // navi: f = passi del Forziere quando affonda, g = gittata, m = munizioni, b = barili
  var SHIPS = [
    { n: 'Rondine', f: 1, g: 2, m: 1, b: 4 },
    { n: 'Tartaruga', f: 2, g: 1, m: 1, b: 6 },
    { n: 'Gabbiano', f: 1, g: 2, m: 1, b: 3, a: 'fog', d: 'Gli altri ti vedono a distanza +1.' },
    { n: 'Squalo', f: 2, g: 1, m: 2, b: 5, a: 'gun', d: '+1 cannone: i colpi delle tue carte Attacco tolgono 1 barile in più.' },
    { n: 'Albatros', f: 2, g: 3, m: 1, b: 4 },
    { n: 'Delfino', f: 1, g: 1, m: 2, b: 4, a: 'gift', d: 'Quando la prendi peschi 2 carte.' },
    { n: 'Medusa', f: 2, g: 2, m: 2, b: 4, a: 'sting', d: 'Quando perdi barili per un colpo peschi 1 carta.' },
    { n: 'Fortezza', f: 3, g: 1, m: 3, b: 6, a: 'gun', d: '+1 cannone: i colpi delle tue carte Attacco tolgono 1 barile in più.' },
    { n: 'Sirena', f: 2, g: 2, m: 2, b: 5 },
    { n: 'Lucciola', f: 1, g: 1, m: 1, b: 5, a: 'lamp', d: 'All’inizio del turno peschi 1 carta in più.' },
    { n: 'Uragano', f: 3, g: 3, m: 2, b: 5 },
    { n: 'Leone di mare', f: 3, g: 2, m: 2, b: 6 },
    { n: 'Tridente', f: 2, g: 2, m: 3, b: 4 },
    { n: 'Regina degli Abissi', f: 3, g: 3, m: 3, b: 5, a: 'gun', d: '+1 cannone: i colpi delle tue carte Attacco tolgono 1 barile in più.' }
  ];
  // capitani: s = nave di partenza
  var CAPS = [
    { n: 'Nina Scirocco', s: 0, a: 'nina', d: 'Ogni volta che perdi un barile peschi 1 carta.' },
    { n: 'Ugo Bonaccia', s: 1, a: 'ugo', d: 'Il Rum ti fa recuperare 2 barili invece di 1.' },
    { n: 'Lia Maretta', s: 2, a: 'lia', d: 'Puoi usare le Bordate come Virate e le Virate come Bordate.' },
    { n: 'Bruno Spada', s: 3, a: 'bruno', d: 'Puoi giocare 1 carta Attacco in più per turno.' },
    { n: 'Sveva Tramontana', s: 4, a: 'sveva', d: 'Vedi tutti gli altri a distanza −1.' },
    { n: 'Tito Corallo', s: 5, a: 'tito', d: 'All’inizio del turno peschi 3 carte invece di 2.' },
    { n: 'Greta Fortunale', s: 6, a: 'greta', d: 'Quando un altro giocatore ti fa perdere barili, prendi 1 carta a caso dalla sua mano.' },
    { n: 'Oscar Libeccio', s: 7, a: 'oscar', d: 'Per evitare i tuoi colpi servono 2 Virate.' },
    { n: 'Mira Salsedine', s: 8, a: 'mira', d: 'Gli Equipaggiamenti degli altri giocatori non hanno effetto contro di te.' },
    { n: 'Dario Risacca', s: 9, a: 'dario', d: 'Quando affonda la nave di un altro giocatore peschi 2 carte.' },
    { n: 'Elsa Bufera', s: 10, a: 'elsa', d: 'Quando un tuo colpo va a segno peschi 1 carta.' },
    { n: 'Remo Abisso', s: 11, a: 'remo', d: 'Il Vascello spettrale non si ferma mai sulla tua nave: passa subito oltre.' }
  ];
  var ROLES = {
    AL: { n: 'Ammiraglio di Levante', s: 'Ammiraglio', nat: 'L', lead: true },
    UL: { n: 'Ufficiale di Levante', s: 'Ufficiale', nat: 'L' },
    AP: { n: 'Ammiraglio di Ponente', s: 'Ammiraglio', nat: 'P', lead: true },
    UP: { n: 'Ufficiale di Ponente', s: 'Ufficiale', nat: 'P' },
    PI: { n: 'Pirata', s: 'Pirata', nat: null, solo: true },
    CL: { n: 'Corsaro di Levante', s: 'Corsaro', nat: 'L', solo: true },
    CP: { n: 'Corsaro di Ponente', s: 'Corsaro', nat: 'P', solo: true }
  };
  var NAT = { L: 'Levante', P: 'Ponente' };
  var SETUP = {
    4: { r: ['AL', 'AP', 'CL', 'CP'], glass: 7, flag: 5 },
    5: { r: ['AL', 'AP', 'UP', 'UL', 'PI'], glass: 7, flag: 5 },
    6: { r: ['AL', 'AP', 'UP', 'UL', 'CL', 'CP'], glass: 8, flag: 6 },
    7: { r: ['AL', 'AP', 'UP', 'UP', 'UL', 'UL', 'PI'], glass: 9, flag: 6 },
    8: { r: ['AL', 'AP', 'UP', 'UP', 'UL', 'UL', 'CL', 'CP'], glass: 10, flag: 6 }
  };
  var KEEP = ['cannoniera', 'coffa', 'cassa', 'nebbia', 'polena', 'fasciame'];

  /* ---------- utilità ---------- */
  function ty(id) { return CARDS[id].t; }
  function kind(id) { return T[ty(id)].k; }
  function nick(g, p) { return g.players[p].nick; }
  var CUR = null;   // la carta di cui si sta parlando: finisce nel diario, così chiunque può aprirla
  function log(g, t, k, p) { var e = { n: ++g.logN, t: t, k: k || '', p: p == null ? null : p }; if (CUR != null) e.c = CUR; g.log.push(e); if (g.log.length > 120) g.log.splice(0, g.log.length - 120); }
  function fx(g, e) { e.n = ++g.fxN; g.fx.push(e); if (g.fx.length > 24) g.fx.splice(0, g.fx.length - 24); }
  function cap(g, p) { return CAPS[g.players[p].cap]; }
  function isCap(g, p, a) { return g.players[p] && CAPS[g.players[p].cap].a === a; }
  function ship(g, p) { var s = g.players[p].ship; return s == null ? null : SHIPS[s]; }
  function shipIs(g, p, a) { var s = ship(g, p); return !!(s && s.a === a); }
  function hasEq(g, p, t) { var P = g.players[p]; for (var i = 0; i < P.eq.length; i++) if (ty(P.eq[i]) === t) return P.eq[i]; return null; }
  // equipaggiamento di p che ha effetto contro q (Mira ignora quelli degli altri)
  function eqVs(g, p, t, q) { if (q != null && q !== p && isCap(g, q, 'mira')) return null; return hasEq(g, p, t); }
  function maxBar(g, p) { var s = ship(g, p); return s ? s.b + (hasEq(g, p, 'fasciame') != null ? 1 : 0) : 0; }
  function nat(role) { return ROLES[role].nat; }
  function roleName(r) { return ROLES[r].n; }
  function nextIdx(g, p) { return (p + 1) % g.players.length; }
  function dbl(P) { return P.dbl + (P.up ? 0 : 1); }   // il ruolo coperto vale un doblone
  function solo(P) { return !!ROLES[P.role].solo; }
  function idxs(g) { return g.players.map(function (P, i) { return i; }); }

  /* ---------- mazzo ---------- */
  function deckEnd(g) {
    if (g.glass > 0) g.glass--;
    if (g.flag > 2) g.flag--;
    log(g, 'Il mazzo è finito: un doblone lascia la Clessidra (' + g.glass + ' rimasti) e le bandiere si avvicinano al centro (' + g.flag + ').', 'sys');
    fx(g, { k: 'deckend', glass: g.glass, flag: g.flag });
    g.deck = shuffle(g.disc.splice(0));
    if (g.glass === 0) startGorgo(g);
  }
  function drawCard(g) {
    if (!g.deck.length) { if (!g.disc.length) return null; deckEnd(g); if (!g.deck.length) return null; }
    return g.deck.pop();
  }
  function give(g, p, n, why) {
    var P = g.players[p], got = 0;
    for (var i = 0; i < n; i++) { var c = drawCard(g); if (c == null) break; P.hand.push(c); got++; }
    if (got) fx(g, { k: 'draw', p: p, c: got, why: why || '' });
    return got;
  }
  function discardHand(g, p, id) { var P = g.players[p], i = P.hand.indexOf(id); if (i >= 0) { P.hand.splice(i, 1); g.disc.push(id); return true; } return false; }
  function discardEq(g, p, id) { var P = g.players[p], i = P.eq.indexOf(id); if (i >= 0) { P.eq.splice(i, 1); g.disc.push(id); return true; } return false; }
  function topCheck(g) { var c = drawCard(g); if (c == null) return null; g.disc.push(c); return c; }

  /* ---------- distanze ---------- */
  function withShip(g) { return idxs(g).filter(function (i) { return g.players[i].ship != null; }); }
  function distance(g, a, b) {
    if (a === b) return 0;
    var ring = withShip(g); if (ring.indexOf(a) < 0) ring.push(a); if (ring.indexOf(b) < 0) ring.push(b);
    ring.sort(function (x, y) { return x - y; });
    var ia = ring.indexOf(a), ib = ring.indexOf(b), k = Math.abs(ia - ib), d = Math.min(k, ring.length - k);
    if (eqVs(g, b, 'nebbia', a) != null) d++;
    if (shipIs(g, b, 'fog')) d++;
    if (isCap(g, a, 'sveva')) d--;
    return Math.max(1, d);
  }
  function range(g, a, b) { var s = ship(g, a); if (!s) return 0; return s.g + (eqVs(g, a, 'coffa', b) != null ? 1 : 0); }
  function ammo(g, p) { var s = ship(g, p); if (!s) return 0; return s.m + (hasEq(g, p, 'cassa') != null ? 1 : 0) + (isCap(g, p, 'bruno') ? 1 : 0); }
  function cannons(g, p, t) { return (eqVs(g, p, 'cannoniera', t) != null ? 1 : 0) + (shipIs(g, p, 'gun') ? 1 : 0); }

  /* ---------- nuova partita ---------- */
  function newGame(seats, opts) {
    var n = seats.length, S = SETUP[Math.max(4, Math.min(8, n))];
    var roles = shuffle(S.r.slice(0, n));
    var caps = shuffle(CAPS.map(function (c, i) { return i; })).slice(0, n);
    var g = {
      v: 1, phase: 'play', seq: 0, turnN: 0, fx: [], fxN: 0, log: [], logN: 0,
      opts: {}, players: [], deck: shuffle(CARDS.map(function (c, i) { return i; })), disc: [],
      ships: [], row: [], chest: 0, flag: S.flag, glass: S.glass, spectre: null, gorgo: null,

    seats.forEach(function (s, i) {
      g.players.push({ uid: s.uid, nick: s.nick, bot: !!s.bot, col: i, role: roles[i], up: false, cap: caps[i], ship: CAPS[caps[i]].s, bar: 0, hand: [], eq: [], dbl: 0, seen: {}, away: false });
    });
    g.players.forEach(function (P, i) { P.bar = SHIPS[P.ship].b; });
    var used = g.players.map(function (P) { return P.ship; });
    g.ships = shuffle(SHIPS.map(function (s, i) { return i; }).filter(function (i) { return used.indexOf(i) < 0; }));
    g.row = g.ships.splice(0, 3);
    var al = 0; g.players.forEach(function (P, i) { if (P.role === 'AL') al = i; });

    log(g, 'Si salpa! ' + nick(g, al) + ' è l’' + roleName('AL') + ' e comincia. Bandiere a ' + g.flag + ' passi dal centro, ' + g.glass + ' dobloni nella Clessidra.', 'sys');
    startTurn(g, al);
    return g;
  }

  /* ---------- turno ---------- */
  function startTurn(g, p) {
    g.turn = p; g.turnN++; g.shots = 0; g.step = 'start'; g.pend = null; g.spectreRev = null;
    fx(g, { k: 'turn', p: p });
    proceed(g);
  }
  // fa avanzare il turno finché serve una scelta di qualcuno
  function proceed(g) {
    for (var guard = 0; guard < 12 && g.phase === 'play' && !g.pend; guard++) {
      var p = g.turn, P = g.players[p];
      if (g.step === 'start') {
        if (g.gorgo && g.gorgo.at === p) { if (!gorgoCheck(g, p)) return; continue; }
        if (g.spectre && g.spectre.on === p && P.ship != null) { spectreReveal(g, p); if (g.step === 'spectre') return; continue; }
        g.step = 'ship'; continue;
      }

      if (g.step === 'draw') {

      }

      return;
    }
  }
  function finishTurn(g, p) {
    var P = g.players[p];

  }
  // chi resta senza carte fuori dal suo turno pesca subito

  }

  /* ---------- vascello spettrale e Gorgo ---------- */
  function spectreReveal(g, p) {
    var c = topCheck(g); if (c == null) { g.step = 'ship'; return; }
    g.spectreRev = c; g.step = 'spectre'; CUR = c;
    log(g, 'Il Vascello spettrale è sulla nave di ' + nick(g, p) + ': esce ' + T[ty(c)].n + ' (' + SYM[CARDS[c].s] + ').', 'ghost', p);
    fx(g, { k: 'reveal', p: p, c: c, why: 'spectre' });

  }
  function matching(g, p, s) { return g.players[p].hand.filter(function (id) { return CARDS[id].s === s; }); }
  function nextShip(g, from, skipRemo) {

    return null;
  }
  function moveSpectre(g, from) {

  }
  function spectreAnswer(g, p, id) {

      log(g, nick(g, p) + ' risponde mostrando ' + T[ty(id)].n + ' (' + SYM[s] + ').', 'ghost', p);

  function spectreFail(g, p) {

  function startGorgo(g) {

  }
  // true se si può continuare il turno

  /* ---------- danni e affondamenti ---------- */
  function heal(g, p, n, over) { var P = g.players[p]; if (P.ship == null) return 0; var to = over ? P.bar + n : Math.min(maxBar(g, p), P.bar + n), h = Math.max(0, to - P.bar); P.bar += h; if (h) fx(g, { k: 'heal', p: p, n: h }); return h; }

  function sink(g, t, by) {
    var P = g.players[t], S = ship(g, t), role = P.role, wasHidden = !P.up;
    P.up = true;
    var steps = S.f + (ROLES[role].lead ? 1 : 0), dir = 0;
    if (role === 'PI') { if (by != null && by !== t) { var bn = nat(g.players[by].role); dir = bn === 'L' ? -1 : bn === 'P' ? 1 : 0; } }
    else dir = nat(role) === 'L' ? 1 : -1;

    g.chest = Math.max(-9, Math.min(9, g.chest + dir * steps));
    log(g, 'La ' + S.n + ' di ' + P.nick + ' affonda' + (by != null && by !== t ? ' sotto i colpi di ' + nick(g, by) : '') + '! ' + (wasHidden ? 'Era ' : 'È ') + (role === 'AL' || role === 'AP' ? 'l’' : role === 'PI' ? 'il ' : 'un ') + roleName(role) + '. ' +
      (dir ? 'Il Forziere si sposta di ' + steps + (steps > 1 ? ' passi' : ' passo') + ' verso ' + (dir < 0 ? 'Levante' : 'Ponente') + '.' : 'Il Forziere resta dov’è.'), 'sink', t);
    fx(g, { k: 'sink', p: t, by: by, role: role, from: from, to: g.chest, ship: P.ship });
    // promozione: l'Ammiraglio affondato scambia il ruolo con il primo Ufficiale scoperto della sua flotta
    if (role === 'AL' || role === 'AP') {
      var off = role === 'AL' ? 'UL' : 'UP', n = g.players.length;
      for (var k = 1; k < n; k++) { var q = (t + k) % n, Q = g.players[q]; if (Q.role === off && Q.up) { Q.role = role; P.role = off; log(g, Q.nick + ' è promosso ' + roleName(role) + ' al posto di ' + P.nick + '.', 'sys', q); fx(g, { k: 'promo', p: q, from: t }); break; } }
    }

    }

    g.players.forEach(function (Q, q) { if (q !== t && isCap(g, q, 'dario')) give(g, q, 2, 'dario'); });
    if (by != null && by !== t) { takeDoubloon(g, by); }
    else if (g.glass > 0) { g.glass--; fx(g, { k: 'glass', glass: g.glass }); log(g, 'Nessuno prende il doblone: uno lascia la Clessidra (' + g.glass + ' rimasti).', 'sys'); if (g.glass === 0) startGorgo(g); }

  }
  function takeDoubloon(g, p) {

    log(g, nick(g, p) + ' prende un doblone' + (from === 'glass' ? ' dalla Clessidra (' + g.glass + ' rimasti).' : '.'), 'gold', p);

  }
  function wealth(g) {

    return false;
  }

  /* ---------- fine della partita ---------- */
  function members(g, n) { return idxs(g).filter(function (i) { var r = g.players[i].role; return nat(r) === n && !ROLES[r].solo; }); }
  function endGame(g, how, who) {
    if (g.phase === 'over') return;
    var res = { how: how, chest: g.chest, flag: g.flag, team: null, solo: null, note: '' };
    if (how === 'rich') { res.solo = who; res.note = 'ricchezza'; }
    else if (how === 'flagL' || how === 'flagP') res.team = how === 'flagL' ? 'L' : 'P';
    else {
      g.players.forEach(function (P) { if (!P.up) { P.up = true; P.dbl++; } });
      var c = g.chest, pir = idxs(g).filter(function (i) { return g.players[i].role === 'PI'; })[0];
      var corsL = idxs(g).filter(function (i) { return g.players[i].role === 'CL'; })[0], corsP = idxs(g).filter(function (i) { return g.players[i].role === 'CP'; })[0];

    fx(g, { k: 'over' });
  }

  /* ---------- carte: chi si può colpire ---------- */
  function others(g, p) { return idxs(g).filter(function (i) { return i !== p && g.players[i].ship != null; }); }
  function isAtk(g, p, id, as) { var k = kind(id); return k === 'atk' || (k === 'multi' && as !== 'def') || (ty(id) === 'virata' && isCap(g, p, 'lia') && as === 'atk'); }
  // bersagli validi per la carta id giocata da p ([] se non serve un bersaglio, null se non si può giocare)
  function targets(g, p, id, as) {
    var t = ty(id), P = g.players[p];
    if (P.ship == null) return null;
    if (isAtk(g, p, id, as)) {
      if (g.shots >= ammo(g, p)) return null;
      var near = t === 'arrembaggio' || t === 'moschetto';
      return others(g, p).filter(function (q) { return distance(g, p, q) <= (near ? 1 : range(g, p, q)); });
    }
    switch (t) {
      case 'rum': return P.bar < maxBar(g, p) ? [] : null;
      case 'vedetta': case 'porto': case 'burrasca': case 'mostro': return [];
      case 'saccheggio': return others(g, p).filter(function (q) { return distance(g, p, q) <= 1 && (g.players[q].hand.length || g.players[q].eq.length); });
      case 'sabotaggio': return others(g, p).filter(function (q) { return g.players[q].hand.length || g.players[q].eq.length; });
      case 'sfida': return others(g, p);
      case 'spettro': return g.gorgo ? [] : others(g, p).filter(function (q) { return !isCap(g, q, 'remo') && !(g.spectre && g.spectre.on === q); });
      case 'rifornimento': return idxs(g).filter(function (q) { return g.players[q].ship != null; });

  }

  function playable(g, p, id, as) { var r = targets(g, p, id, as); if (r == null) return false; return !(r.length === 0 && (isAtk(g, p, id, as) || (needsTarget(ty(id)) && kind(id) !== 'eq' && !(ty(id) === 'spettro' && g.gorgo)))); }

  /* ---------- risposte fuori turno ---------- */

    });
  }
  function begin(g, pd) { if (CUR != null) pd.card = CUR; g.pend = pd; pump(g); }

  function pump(g) {
    var pd = g.pend;

        var t = pd.q.shift();

          var c = topCheck(g);
          if (c != null) { fx(g, { k: 'reveal', p: t, c: c, why: 'polena' }); if (CARDS[c].s === 'A') { log(g, 'La polena di ' + nick(g, t) + ' porta fortuna: ' + T[ty(c)].n + ' con l’Ancora, il colpo va a vuoto.', 'miss', t); fx(g, { k: 'miss', p: t }); pd.who = null; continue; } }
        }
      }
      if (answers(g, pd.who).length) return;   // tocca a lui scegliere

  }

  function resolveTake(g, t) {
    var pd = g.pend, by = pd.by;

    if (pd.k === 'duel') {
      var loser = pd.cur; log(g, nick(g, loser) + ' non risponde alla sfida e perde 1 barile.', 'hit', loser);

    if (x === 'bianca') {

      else log(g, nick(g, p) + ' gioca ' + T[x].n + ', ma contro ' + nick(g, pd.by) + ' ne serve un’altra.', 'miss', p);
    } else if (pd.k === 'need') { log(g, nick(g, p) + ' scarta ' + T[x].n + ' e respinge il mostro.', 'miss', p); pd.who = null; }
    else if (pd.k === 'duel') {

  }

  /* ---------- effetti delle carte ---------- */
  function takeFrom(g, by, t, pick, steal) {
    var Q = g.players[t], got = null;
    if (pick != null && pick !== 'hand' && Q.eq.indexOf(+pick) >= 0) { got = +pick; Q.eq.splice(Q.eq.indexOf(got), 1); }
    else if (Q.hand.length) got = Q.hand.splice(Math.floor(rand() * Q.hand.length), 1)[0];

  function auto() {

      '<p class="kit-opt-d">Con «Nuova partita con lo stesso tavolo» le vittorie si sommano' + (t ? ': vince chi arriva prima a ' + Math.ceil(t / 2) + '.' : '.') + '</p></div>' + standings(doc);

    // la carta scelta resta valida solo se ce l'ho ancora in mano
    if (App.card != null && (!P || P.hand.indexOf(App.card) < 0)) App.card = null;
    if (App.sheet && App.sheet.kind === 'card' && App.card == null) App.sheet = null;
    var intro = App.sheet && (App.sheet.kind === 'intro' || App.sheet.kind === 'seecard' || App.sheet.kind === 'catalog' || App.sheet.kind === 'rules' || App.sheet.kind === 'help');
    var ask = g.phase === 'play' && g.pend && g.pend.who === me;
    if (ask && !intro && (!App.sheet || App.sheet.kind !== 'resp')) App.sheet = { kind: 'resp' };
    if (!ask && App.sheet && App.sheet.kind === 'resp') App.sheet = null;
    var shipNow = g.phase === 'play' && !g.pend && g.turn === me && g.step === 'ship';
    if (shipNow && !intro && (!App.sheet || App.sheet.kind !== 'ships')) App.sheet = { kind: 'ships' };
    if (!shipNow && App.sheet && App.sheet.kind === 'ships') App.sheet = null;
    var spNow = g.phase === 'play' && !g.pend && g.turn === me && g.step === 'spectre';
    if (spNow && !intro && (!App.sheet || App.sheet.kind !== 'spectre')) App.sheet = { kind: 'spectre' };
    if (!spNow && App.sheet && App.sheet.kind === 'spectre') App.sheet = null;
  } else { App.mode = null; App.card = null; }
  render(); if (g) Game.fx(g, me); driveBots(); Turns.watch(App.doc);
  if (g) App.seenFirstDoc = true;
}

/* ===== Il Forziere Maledetto: schermata di gioco (tavolo rotondo, tracciato, mano) e animazioni =====
   In alto il tracciato con il Forziere e le due bandiere. Poi il tavolo visto dall'alto, come al tavolo vero:
   tu in basso e gli altri capitani intorno nell'ordine dei turni, con nave, barili, distanza da te (verde se
   a tiro) ed equipaggiamenti. Al centro la carta giocata adesso (chi, contro chi, chi deve rispondere), sotto
   il diario delle ultime mosse. Ogni carta che si vede (al centro, nel diario, davanti ai giocatori, in mano)
   si tocca per leggerne le regole; il pulsante Carte apre il catalogo completo. */
var Game = (function () {
  var mountedFor = null, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(id) { return document.getElementById(id); }
  function setHTML(id, h) { var e = el(id); if (e && e._h !== h) { e.innerHTML = h; e._h = h; } }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms); }); }

  function sea() { return '<div class="sea" aria-hidden="true"><div class="wv w1"></div><div class="wv w2"></div><div class="wv w3"></div></div>'; }
  function mount() {
    $('#app').innerHTML = '<div class="gv" id="gv">' + sea() +
      '<header class="gv-top"><button class="iconbtn brandbtn" data-act="menu" aria-label="Menu">☰</button><span class="gv-info" id="gv-info"></span>' + Sound.buttonHTML() + '<span id="gv-chat">' + Chat.badgeHTML() + '</span><button class="iconbtn" data-act="catalog" aria-label="Tutte le carte">' + IC('cards') + '<span class="hide-s"> Carte</span></button><button class="iconbtn" data-act="rules" aria-label="Regole">' + IC('help') + '<span class="hide-s"> Regole</span></button></header>' +
      '<div class="gv-board" id="gv-board"></div>' +
      '<div class="gv-table" id="gv-table"></div><div class="feed" id="gv-feed" aria-live="polite"></div>' + Chat.dockHTML() +
      '<div class="gv-prompt" id="gv-prompt" aria-live="polite"></div>' +
      '<div class="gv-me" id="gv-me"></div></div>';
    mountedFor = App.code;
  }
  function unmount() { mountedFor = null; }
  function render() {
    if (mountedFor !== App.code || !el('gv')) mount();
    var g = G(), me = myIdx();
    setHTML('gv-info', '<b>Il Forziere Maledetto</b> <span class="muted">· ' + connInfo((g.phase === 'over' ? 'Partita finita' : 'Turno ' + g.turnN) + ' · tavolo ' + esc(App.code)) + '</span><span id="tt" class="tt"></span>');
    setHTML('gv-board', board(g));
    setHTML('gv-table', table(g, me));
    setHTML('gv-feed', feed(g, me));
    setHTML('gv-prompt', prompt(g, me));
    setHTML('gv-me', me >= 0 ? mine(g, me) : spectator(g));
    var chat = el('gv-chat'); if (chat) { var ch = Chat.badgeHTML(); if (chat._h !== ch) { chat.innerHTML = ch; chat._h = ch; } }
    document.body.classList.toggle('aiming', App.mode === 'aim');
  }

  /* ---------- tracciato e mare ---------- */
  function board(g) {
    var sp = g.spectre && g.spectre.on != null ? '<span class="bchip ghost" title="Vascello spettrale">' + IC('ghost') + 'Spettro su ' + esc(g.players[g.spectre.on].nick) + '</span>' : '';
    var gg = g.gorgo ? '<span class="bchip gorgo" title="Il Gorgo">' + IC('gorgo') + 'Gorgo: ' + esc(g.players[g.gorgo.at].nick) + '</span>' : '';
    return ART.track(g) + '<div class="bchips"><span class="bchip" title="Bandiere">' + IC('flag') + 'a ' + g.flag + ' passi</span>' +
      '<button class="bchip port" data-act="port" title="Navi in porto">' + IC('ship') + 'Porto: ' + g.row.map(function (s) { return esc(E.SHIPS[s].n); }).join(', ') + '</button>' + sp + gg + '</div>';
  }

  /* ---------- il tavolo rotondo: tu in basso, gli altri intorno nell'ordine dei turni ---------- */
  function ini(n) { return esc(String(n).charAt(0).toUpperCase()); }
  function coins(n) { return n ? '<span class="coins" title="' + n + ' dobloni">' + IC('coin') + n + '</span>' : ''; }
  function pos(k, n) { var a = Math.PI / 2 + 2 * Math.PI * k / n; return { x: 50 + 42 * Math.cos(a), y: 50 + 41 * Math.sin(a) }; }
  var EQI = { cannoniera: 'cannon', coffa: 'range', nebbia: 'wave', polena: 'anchor', fasciame: 'barrel', cassa: 'ammo' };
  function seat(g, p, me, k, n) {
    var P = g.players[p], at = pos(k, n), r = roleOf(g, p), S = P.ship != null ? E.SHIPS[P.ship] : null;
    var turn = g.phase === 'play' && g.turn === p, ask = g.phase === 'play' && g.pend && g.pend.who === p, mine = p === me;
    var dist = '';
    if (me >= 0 && !mine && S && g.players[me].ship != null) {
      var d = E.distance(g, me, p), inR = d <= E.range(g, me, p);
      dist = '<i class="dd' + (inR ? ' in' : '') + '" title="Distanza ' + d + (inR ? ': a tiro della tua nave' : ': fuori tiro') + '">' + d + '</i>';
    }
    var eq = P.eq.map(function (id) { return '<span class="eqm" data-act="seecard" data-id="' + id + '" title="' + esc(E.T[E.ty(id)].n) + '">' + IC(EQI[E.ty(id)] || 'cards') + '</span>'; }).join('');
    var marks = (g.spectre && g.spectre.on === p ? '<span class="mk ghost" title="Vascello spettrale">' + IC('ghost') + '</span>' : '') + (g.gorgo && g.gorgo.at === p ? '<span class="mk gorgo" title="Il Gorgo">' + IC('gorgo') + '</span>' : '');
    return '<div class="seat' + (turn ? ' turn' : '') + (ask ? ' ask' : '') + (mine ? ' mine' : '') + (S ? '' : ' noship') + (at.y < 35 ? ' top' : '') + '" role="button" tabindex="0" data-act="opp" data-p="' + p + '" style="left:' + at.x.toFixed(1) + '%;top:' + at.y.toFixed(1) + '%;--pc:' + pcol(g, p) + '" aria-label="' + esc(P.nick) + '">' +
      '<span class="sav">' + ini(P.nick) + dist + marks + '</span>' +
      '<span class="snm">' + Net.dot(P.uid) + esc(mine ? 'Tu' : P.nick) + '</span>' + ART.roleBadge(r) +
      '<span class="ssh">' + (S ? esc(S.n) : 'senza nave') + '</span>' + (S ? ART.barrels(P.bar, E.maxBar(g, p)) : '') +
      '<span class="smt"><span title="Carte in mano">' + IC('cards') + P.hand.length + '</span>' + coins(P.dbl) + (P.bot && g.phase !== 'over' ? '<span class="sauto">' + (P.away ? 'assente' : 'auto') + '</span>' : '') + '</span>' +
      (eq ? '<span class="seq">' + eq + '</span>' : '') + (ask ? '<span class="sask">risponde…</span>' : turn ? '<span class="sturn">di turno</span>' : '') + '</div>';
  }
  // al centro: la carta di cui si parla adesso, chi l'ha giocata e contro chi
  function lastPlay(g) {
    for (var i = g.fx.length - 1; i >= 0; i--) { var e = g.fx[i]; if (e.k === 'turn') return null; if (e.k === 'play' && !e.resp) return e; }
    return null;
  }
  function center(g, me) {
    var c = null, txt = '', who = function (p) { return '<b class="pn-c" style="--pc:' + pcol(g, p) + '">' + esc(p === me ? 'Tu' : g.players[p].nick) + '</b>'; };
    if (g.phase === 'over') { txt = '<b>Partita finita</b><br>' + (g.final.solo != null ? 'vince ' + who(g.final.solo) : 'vince ' + E.NAT[g.final.team]); }
    else if (g.pend) {
      var pd = g.pend; c = pd.card;
      txt = who(pd.by) + (pd.by === me ? ' giochi' : ' gioca') + ' <b>' + esc(c != null ? E.T[E.ty(c)].n : pd.label) + '</b><br>' + (pd.who != null ? 'ora risponde ' + who(pd.who) : '');
    } else if (g.step === 'spectre' && g.spectreRev != null) { c = g.spectreRev; txt = 'Vascello spettrale su ' + who(g.turn) + ': serve il simbolo <b>' + E.SYM[E.CARDS[c].s] + '</b>'; }
    else {
      var e = lastPlay(g);
      if (e) { c = e.c; txt = who(e.p) + (e.p === me ? ' giochi' : ' gioca') + ' <b>' + esc(E.T[E.ty(c)].n) + '</b>' + (e.t != null && e.t !== e.p ? '<br>contro ' + who(e.t) : ''); }
      else txt = g.step === 'ship' ? who(g.turn) + (g.turn === me ? ' scegli' : ' sceglie') + ' una nave' : g.turn === me ? '<b>Tocca a te!</b>' : 'Tocca a ' + who(g.turn);
    }
    var card = c != null ? '<button class="midc" data-act="seecard" data-id="' + c + '" aria-label="Leggi la carta ' + esc(E.T[E.ty(c)].n) + '">' + ART.card(c) + '<i>' + IC('eye') + '</i></button>' : '<span class="midc empty">' + ART.back() + '</span>';
    return '<div class="tmid">' + card + '<div class="midt">' + txt + '</div><div class="midp"><span title="Carte nel mazzo">' + IC('cards') + g.deck.length + '</span><span title="Dobloni nella Clessidra">' + IC('hourglass') + g.glass + '</span></div></div>';
  }
  function table(g, me) {
    var n = g.players.length, base = me >= 0 ? me : 0, h = '';
    for (var k = 0; k < n; k++) h += seat(g, (base + k) % n, me, k, n);
    return '<div class="felt n' + n + '">' + center(g, me) + h + '</div>';
  }
  // il diario: le ultime mosse, sempre visibili; quelle con una carta si toccano per leggerla
  function feed(g, me) {
    var L = g.log.filter(function (l) { return l.k !== 'draw' || l.c != null; }).slice(-4).reverse();
    return '<button class="feed-all" data-act="log">' + IC('log') + ' Diario</button>' + L.map(function (l, i) {
      var col = l.p != null && g.players[l.p] ? pcol(g, l.p) : 'rgba(242,193,78,.6)';
      return '<div class="fl k-' + l.k + (i ? '' : ' new') + '" style="--pc:' + col + '">' + (l.c != null ? '<button class="flc" data-act="seecard" data-id="' + l.c + '" aria-label="Leggi la carta">' + ART.card(l.c) + '</button>' : '') + '<span>' + esc(l.t) + '</span></div>';
    }).join('');
  }

  /* ---------- la mia plancia ---------- */
  function mine(g, me) {
    var P = g.players[me], S = P.ship != null ? E.SHIPS[P.ship] : null, C = E.CAPS[P.cap], R = E.ROLES[P.role], myTurn = g.phase === 'play' && g.turn === me && !g.pend;
    var ammo = S ? E.ammo(g, me) : 0, left = Math.max(0, ammo - (myTurn ? g.shots : 0));
    var head = '<div class="me-h" style="--pc:' + pcol(g, me) + '"><button class="mrole" data-act="myrole" style="--rc:' + ART.roleColor(P.role) + '">' + IC(R.lead ? 'crown' : R.solo ? 'sword' : P.role === 'PI' ? 'skull' : 'anchor') + '<span><small>' + (P.up ? 'Il tuo ruolo (scoperto)' : 'Il tuo ruolo segreto') + '</small><b>' + esc(R.n) + '</b></span></button>' +
      '<button class="mcap" data-act="mycap">' + ART.capFace(P.cap, pcol(g, me)) + '<span><small>Capitano</small><b>' + esc(C.n) + '</b></span></button>' + coins(P.dbl) + '</div>';
    var ship = S ? '<button class="mship" data-act="myship">' + ART.shipArt(P.ship, { flag: pcol(g, me) }) + '<span class="ms-t"><b>' + esc(S.n) + '</b>' + ART.barrels(P.bar, E.maxBar(g, me)) +
      '<span class="ms-s"><span title="Gittata">' + IC('range') + E.range(g, me, null) + '</span><span title="Munizioni rimaste in questo turno">' + IC('ammo') + left + '/' + ammo + '</span><span title="Valore">' + IC('chest') + S.f + '</span></span></span></button>'
      : '<div class="mship none">' + IC('ship') + '<span>Senza nave: al tuo turno ne prenderai una nuova.</span></div>';
    var eq = P.eq.length ? '<div class="meq">' + P.eq.map(function (id) { return '<button class="eqc big" data-act="seecard" data-id="' + id + '">' + esc(E.T[E.ty(id)].n) + '</button>'; }).join('') + '</div>' : '';
    return head + '<div class="me-b">' + ship + eq + '</div>' + hand(g, me);
  }
  function hand(g, me) {
    var P = g.players[me], myTurn = g.phase === 'play' && g.turn === me && !g.pend && g.step === 'play', drop = App.mode === 'drop';
    var h = P.hand.map(function (id) {
      var can = myTurn && (E.playable(g, me, id) || (E.isCap(g, me, 'lia') && E.ty(id) === 'virata' && E.playable(g, me, id, 'atk')));
      var sel = drop ? App.drop.indexOf(id) >= 0 : App.card === id;
      return '<button class="hc' + (can && !drop ? ' can' : '') + (sel ? ' sel' : '') + '" data-act="hand" data-id="' + id + '" aria-label="' + esc(E.T[E.ty(id)].n) + '">' + ART.card(id) + '</button>';
    }).join('');
    return '<div class="hand' + (drop ? ' dropping' : '') + '" style="--n:' + Math.max(5, P.hand.length) + '">' + (h || '<span class="muted empty">Nessuna carta in mano</span>') + '</div>';
  }
  function spectator(g) { return '<p class="lead" style="padding:8px 4px">Stai guardando la partita.</p>'; }

  /* ---------- cosa fare adesso ---------- */
  function prompt(g, me) {
    var h = '', btn = '', help = 'turn', P = me >= 0 ? g.players[me] : null;
    if (g.phase === 'over') {
